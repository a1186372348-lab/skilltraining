<!doctype html>
<html lang="zh-CN">

  <title>训练台 · 30 分钟项目讲解地图</title>
  <style>
    :root {
      --ink: #12233f;
      --muted: #64748b;
      --faint: #94a3b8;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;

      font-size: 14px;

    a { color: inherit; }
    :focus-visible { outline: 3px solid rgba(232, 121, 46, .48); outline-offset: 3px; }
    .tour-app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }

    .brand-lockup { display: flex; align-items: center; gap: 12px; }

    .tour-nav-button {

    .tour-nav-button.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: #69a0ff; }
    .nav-index { color: #5f748b; font-family: Georgia, serif; font-size: 12px; }

    .side-progress { height: 4px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: #263548; }
    .side-progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3b82f6, #77a8ff); transition: width .3s; }
    .side-note { margin: 11px 0 0; color: #61758c; font-size: 10px; line-height: 1.6; }
    .tour-workspace { min-width: 0; }
    .tour-topbar {
      position: sticky; top: 0; z-index: 25; min-height: 66px; display: flex; align-items: center; gap: 16px;

    .topbar-title { min-width: 0; }
    .topbar-kicker { color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .15em; }

    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .tour-button {
      min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 8px 13px; border: 1px solid #d8dfea; border-radius: 10px; color: #334155; background: #fff;

    .tour-main { padding: 28px; }

    .state-switcher > span { margin-right: 3px; color: #718096; font-size: 11px; font-weight: 700; }
    .state-chip { padding: 6px 10px; border: 1px solid #dce3ec; border-radius: 999px; color: #64748b; background: #fff; font-size: 11px; }
    .state-chip:hover { border-color: #9db9ef; }
    .state-chip.active { border-color: var(--blue); color: #fff; background: var(--blue); }
    .replica-wrap { max-width: 1480px; margin: 0 auto; }
    .replica-browser { overflow: hidden; border: 1px solid #d7dfe9; border-radius: 18px; background: var(--paper); box-shadow: 0 24px 70px -38px rgba(15,23,42,.42); }
    .browser-bar { height: 35px; display: flex; align-items: center; gap: 6px; padding: 0 13px; border-bottom: 1px solid #dfe5ed; background: #f8fafc; }
    .browser-dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
    .browser-url { margin-left: 8px; padding: 3px 12px; border-radius: 6px; color: #8291a5; background: #edf1f6; font-family: ui-monospace, monospace; font-size: 9px; }
    .browser-demo { margin-left: auto; color: #9aa7b8; font-size: 9px; letter-spacing: .08em; }
    .product-app { min-height: 680px; display: grid; grid-template-columns: 178px minmax(0, 1fr); background: var(--paper); }
    .product-sidebar { display: flex; flex-direction: column; padding: 22px 14px 16px; color: #d9e3ef; background: #152235; }
    .product-brand { display: flex; align-items: center; gap: 9px; padding: 0 7px 24px; }
    .product-brand .brand-mark { width: 31px; height: 31px; border-radius: 10px; font-size: 15px; }
    .product-brand-name { color: #fff; font-size: 14px; font-weight: 750; }
    .product-brand-sub { color: #71869e; font-size: 8px; }
    .product-nav { display: flex; flex-direction: column; gap: 5px; }
    .product-nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border: 0; border-radius: 9px; color: #8fa2b8; background: transparent; text-align: left; font-size: 11px; }
    .product-nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
    .product-nav-item.active { color: #fff; background: #2563eb; }
    .nav-symbol { width: 15px; color: currentColor; text-align: center; font-size: 12px; }
    .product-side-bottom { margin-top: auto; padding: 13px 10px 3px; border-top: 1px solid rgba(255,255,255,.08); }
    .side-caption { color: #647b94; font-size: 8px; letter-spacing: .12em; }
    .side-value { margin-top: 4px; color: #d9e3ef; font-size: 11px; font-weight: 650; }
    .product-content { min-width: 0; padding: 26px; }
    .product-content.narrow { max-width: 1040px; margin: 0 auto; }
    .product-header { margin-bottom: 18px; }
    .product-header h2 { margin: 0; font-size: 22px; line-height: 1.35; }
    .product-header p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .card { position: relative; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: var(--card-shadow); }
    .card-pad { padding: 20px; }
    .card-title { margin: 0; font-size: 13px; font-weight: 750; }
    .card-subtitle { margin: 4px 0 0; color: var(--faint); font-size: 10px; }
    .section-label { color: #7c8aa5; font-size: 9px; font-weight: 800; letter-spacing: .14em; }
    .blue-label { color: var(--blue); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .small { font-size: 10px; }
    .tiny { font-size: 9px; }
    .strong { font-weight: 700; }
    .blue { color: var(--blue); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .grid { display: grid; gap: 18px; }
    .two-col { grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-wrap { flex-wrap: wrap; }
    .space-between { justify-content: space-between; }
    .btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 34px; padding: 8px 15px; border: 1px solid transparent; border-radius: 10px;
      font-size: 11px; font-weight: 700; text-decoration: none; transition: .17s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--blue); box-shadow: 0 8px 18px -10px rgba(37,99,235,.8); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-ghost { border-color: #d8dfea; color: #334155; background: #fff; }
    .btn-ghost:hover { border-color: #8fb0f3; color: var(--blue); }
    .btn-danger { color: #fff; background: var(--red); }
    .btn-text { min-height: 0; padding: 2px; color: var(--blue); background: transparent; }
    .btn:disabled { opacity: .48; transform: none; box-shadow: none; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 999px; color: #64748b; background: #f8fafc; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .badge.blue { border-color: #d9e7fd; color: #1d4ed8; background: #eff5ff; }
    .badge.green { border-color: #d1fae5; color: #047857; background: #ecfdf5; }
    .badge.amber { border-color: #fde68a; color: #b45309; background: #fffbeb; }
    .tag { display: inline-flex; padding: 4px 7px; border: 1px solid #d9e7fd; border-radius: 7px; color: #2563eb; background: #fff; font-size: 9px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 8px; background: #edf1f7; }
    .progress-track > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3b82f6, #2563eb); }
    .empty-card { border: 1.5px dashed #cbd5e3; border-radius: 15px; color: #94a3b8; background: #fbfcfe; text-align: center; }
    .input, .textarea, .select {
      width: 100%; border: 1px solid #dbe2ec; border-radius: 10px; color: #1e293b; background: #fff; outline: none;
      font-size: 11px; transition: border .17s, box-shadow .17s;
    }
    .input { height: 38px; padding: 0 11px; }
    .textarea { min-height: 112px; padding: 11px; resize: vertical; line-height: 1.75; }
    .input:focus, .textarea:focus, .select:focus { border-color: #77a5f6; box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-label { color: #334155; font-size: 11px; font-weight: 650; }
    .required { color: var(--red); }
    .chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice-chip { padding: 7px 10px; border: 1px solid #dfe5ed; border-radius: 9px; color: #64748b; background: #fff; font-size: 10px; }
    .choice-chip.selected { border-color: #9bbcff; color: #1d4ed8; background: #eff5ff; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; }
    .form-grid .span-2 { grid-column: 1 / -1; }
    .hotspot { position: relative; }
    body:not(.clean-mode) .hotspot { outline: 1px dashed transparent; outline-offset: 3px; transition: outline-color .15s, background-color .15s; }
    body:not(.clean-mode) .hotspot:hover, body:not(.clean-mode) .hotspot:focus-within { outline-color: rgba(232,121,46,.72); }
    .hotspot::after {
      content: "i"; position: absolute; z-index: 8; top: -6px; right: -6px; width: 16px; height: 16px;
      display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%;
      color: #fff; background: var(--orange); box-shadow: 0 3px 8px rgba(132,73,31,.25);
      font: 800 9px/1 Georgia, serif; pointer-events: none; opacity: 0; transform: scale(.7); transition: .15s;
    }
    body:not(.clean-mode) .hotspot::after { opacity: 1; transform: scale(1); }
    .hotspot.inline-hotspot::after { top: -8px; right: -9px; width: 13px; height: 13px; border-width: 1px; font-size: 8px; }
    .clean-mode .guide-strip, .clean-mode .state-switcher { display: none; }
    #note-tooltip {
      position: fixed; z-index: 100; display: none; width: min(380px, calc(100vw - 24px)); max-height: min(520px, calc(100vh - 24px)); overflow-y: auto;
      border: 1px solid #33465f; border-radius: 15px; color: #dce6f2; background: rgba(15,26,42,.98);
      box-shadow: 0 24px 70px -18px rgba(2,8,23,.62); backdrop-filter: blur(12px);
    }
    #note-tooltip.visible { display: block; animation: note-in .14s ease-out; }
    @keyframes note-in { from { opacity: 0; transform: translateY(4px) scale(.985); } to { opacity: 1; transform: none; } }
    .note-head { padding: 16px 17px 12px; border-bottom: 1px solid rgba(255,255,255,.09); }

    .note-body { padding: 12px 17px 15px; }
    .note-row + .note-row { margin-top: 11px; }

    .note-text { color: #bac8d8; font-size: 11px; line-height: 1.75; }
    .note-path { display: block; padding: 8px 9px; overflow-wrap: anywhere; border-radius: 8px; color: #9db5d2; background: rgba(255,255,255,.05); font: 9px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .note-pin-state { margin-top: 12px; color: #637b97; font-size: 9px; }
    .toast { position: fixed; z-index: 110; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; color: #fff; background: #17253a; box-shadow: 0 12px 32px rgba(15,23,42,.25); font-size: 11px; }
    .overview-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; }

    .hero-panel h2 { position: relative; z-index: 1; max-width: 650px; margin: 12px 0; font-size: clamp(25px, 3vw, 40px); line-height: 1.35; letter-spacing: -.03em; }

  <script>
    'use strict';

    const PAGES = [
      { id: 'overview', title: '产品全景', minutes: 2, route: '/', subtitle: '先讲清楚它为什么存在，再看页面。' },
      { id: 'login', title: '邮箱登录', minutes: 1, route: '/login', subtitle: '用一次性魔法链接降低进入门槛。' },
      { id: 'onboarding', title: '初始画像问卷', minutes: 2, route: '/onboarding', subtitle: '先收集方向与经验，让训练有上下文。' },
      { id: 'baseline', title: '能力基线测评', minutes: 3, route: '/baseline', subtitle: '先明确能力边界，再进入日常训练。' },
      { id: 'home', title: '首页仪表盘', minutes: 2, route: '/', subtitle: '每次回来，都知道现在该做什么。' },
      { id: 'training', title: '产品训练大厅', minutes: 2, route: '/training', subtitle: '当前训练与历史轨迹都收在一个入口。' },
      { id: 'session', title: '三栏训练工作台', minutes: 6, route: '/training/session/[id]', subtitle: '案例、问题、资料同屏，完成一次真实产品判断。' },
      { id: 'feedback', title: '评分与训练反馈', minutes: 4, route: '/training/feedback/[id]', subtitle: '不仅告诉你多少分，还告诉你下一步怎么练。' },
      { id: 'profile', title: '八维能力画像', minutes: 3, route: '/profile', subtitle: '把每次有效表现沉淀成持续更新的能力地图。' },
      { id: 'history', title: '训练历史回放', minutes: 2, route: '/training/history/[id]', subtitle: '答案、提示、追问与评分都有据可查。' },
      { id: 'settings', title: '我的', minutes: 1, route: '/settings', subtitle: '管理账号和会影响训练的初始画像。' },
      { id: 'architecture', title: '系统架构与边界', minutes: 2, route: 'SYSTEM', subtitle: '最后用一张图串起前端、业务、数据与 AI。' }
    ];

    const state = {
      page: 'overview', clean: false, loginSent: false, baseline: 'intro', current: 'in_progress', restartConfirm: false,
      session: 'followup', hintCount: 1, followupHintCount: 0, feedback: 'done', calculation: false,
      survey: { q1: 0, q2: 0, q3: 0 }, surveySubmitted: false, profileView: 'network', profileNode: false,
      history: 'done', settingsEdit: false, notification: true, calcRaw: 80, calcMain: 2, calcFollowup: 1
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const esc = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    const DIMENSION_DETAILS = [
      {
        id: 'dimension-problem', name: '问题定义',
        definition: '将模糊诉求界定为有明确对象、场景、目标差距与处理边界的问题。',
        question: '本次究竟要解决什么问题？',
        measures: ['说清当前状态、期望状态、两者差距与本次处理边界。', '区分“诉求的复述”与“待验证的问题定义”。', '定义要清楚、可验证，能够直接导出验证动作与方案方向。'],
        boundary: '用户理解产出对“人”的认识；问题定义产出对“要改变什么状态”的界定；根因分析进一步回答“为什么发生”。',
        strong: '说清当前状态、期望状态、差距与处理边界。',
        weak: '只复述题面诉求，或定义大而无当，无法导出任何行动。'
      },
      {
        id: 'dimension-user', name: '用户理解',
        definition: '理解相关用户在具体场景下的目标、行为动机、约束与差异。',
        question: '谁在什么处境下，希望完成什么，为什么这样行动？',
        measures: ['给出有依据的用户分层，而不是“所有年轻人”。', '还原何时何地、带着什么约束、一步步如何使用的场景链。', '解释行为背后的动机与心理机制，识别多方角色的目标与张力。'],
        boundary: '它提供有关“人”的素材与证据，不是问题结论；问题定义据此界定本次要改变的状态。',
        strong: '月底见底的学生与午休紧张的白领，同一笔消费解决的是不同问题。',
        weak: '画像只有人口属性，没有场景与动机，把用户当成“均值人”。'
      },
      {
        id: 'dimension-root', name: '根因分析',
        definition: '分析问题发生的关键原因，形成并比较有依据、可检验的因果解释。',
        question: '问题为什么发生，哪些解释更可能成立？',
        measures: ['让机制、激励、结构到现象的每一环都有事实支撑。', '形成并比较多个解释，说明现有证据支持什么、还不能排除什么。', '指出证据边界，并对材料中的官方解释保持检验意识。'],
        boundary: '根因分析负责提出和比较解释；指标与验证负责设计如何检验。证据不足时强行收敛到唯一根因，反而应扣分。',
        strong: '现有证据支持 A，但无法排除 B，需要某类数据进一步区分。',
        weak: '把第一个解释当根因，或靠想象补齐断裂的因果链。'
      },
      {
        id: 'dimension-value', name: '产品价值判断',
        definition: '判断解决某个问题或投入某个方向，能否创造足以支持投入的用户与业务价值，以及价值成立的条件。',
        question: '为什么值得做，价值对谁成立？',
        measures: ['判断价值来自哪里、对谁成立，以及价值成立的条件。', '立场明确，判据具体可检验，而非两头都说好话。', '能处理间接价值与战略价值，并给出可迁移的判断标准。'],
        boundary: '价值判断回答“价值是否成立、是否足以支持投入”；产品取舍回答“现实约束下采取哪种行动、分配多少资源”。',
        strong: '值得，但成立条件是 X；如果 X 消失，结论就会反转。',
        weak: '立场骑墙、判据无法检验，只看需求存在，不看解决成本。'
      },
      {
        id: 'dimension-solution', name: '方案设计',
        definition: '在现实约束下，设计能够作用于关键问题的机制、流程与交互，并处理关键异常。',

      return `<div class="stack"><section class="card card-pad hotspot" data-note="session-case"><div class="section-label blue-label">今日案例</div><h3 style="margin:10px 0;font-size:13px;line-height:1.7">飞书知识库是否应加入 AI 自动整理？</h3><dl class="case-fields">${[
        ['产品', '飞书知识库，面向企业协作与知识沉淀。'], ['服务谁', '需要跨团队查找资料的成员与管理员。'], ['场景', '文档持续增加，重复内容与过期信息让查找变慢。'], ['相关功能', '现有搜索、目录、权限与文档评论。'], ['当前状态', '团队考虑用 AI 自动归类、摘要与去重。']
      ].map(([k, v], i) => `<div class="case-field"><dt>${k}</dt><dd>${v} <a href="#" class="source-link hotspot inline-hotspot" data-action="source" data-note="session-citations">原文${i ? i + 1 : ''}</a></dd></div>`).join('')}</dl></section><section class="focus-card card-pad hotspot" data-note="session-focus"><div class="small strong blue">★ 训练重点</div><div class="row row-wrap" style="margin:10px 0"><span class="tag">方案设计</span><span class="tag">产品取舍</span><span class="tag">指标与验证</span></div><p class="tiny" style="color:#3d5a90;margin:0">今天主要训练以上 3 个维度，本次仅按它们评分。</p></section></div>`;
    }

    function materialsColumn() {
      return `<section class="card card-pad hotspot" data-note="session-materials"><div class="row space-between"><h3 class="card-title">参考资料</h3><span class="tiny faint">阅读不扣分</span></div><div>${[
        ['★核心', '飞书知识库官方帮助', '了解目录、搜索与权限的现有能力。'], ['★核心', '企业知识管理实践', '资料可查性比文档数量更影响协作效率。'], ['○扩展', 'AI 摘要的质量边界', '自动整理需要处理错误归因与权限继承。']
      ].map(([badge, title, desc]) => `<div class="material"><span class="badge ${badge.includes('核心') ? 'amber' : ''}">${badge}</span><div class="material-title">${title}</div><p>${desc}</p><a href="#" class="source-link hotspot inline-hotspot" data-action="source" data-note="session-material-link">原文链接 ↗</a></div>`).join('')}</div></section>`;
    }

    function answeringSection() {
      return `<section class="card card-pad"><div class="row space-between row-wrap"><h3 class="card-title">我的回答</h3><span class="tiny faint">作答后，AI 产品总监将追问并给出诊断</span></div><textarea class="textarea hotspot" style="margin-top:12px" data-note="session-first-answer">建议先做灰度：为成员提供“自动整理建议”，而不是直接移动文档。先用查找成功率和整理接受率验证价值，再决定是否自动化。</textarea><p class="tiny faint hotspot inline-hotspot" data-note="session-thinking" tabindex="0">思考方向（非必填）：用户任务 · 当前问题 · 新价值 · 成本 · 风险</p><div class="row space-between row-wrap" style="margin-top:15px;align-items:flex-end"><div>${state.hintCount < 5 ? `<button class="btn btn-ghost hotspot" data-action="hint" data-note="session-hint">◇ 给我一个提示</button>` : ''}<div class="tiny faint hotspot inline-hotspot" data-note="session-hint-count" tabindex="0" style="margin-top:5px">当前 ×${coefficient(state.hintCount, 0).toFixed(2).replace(/0$/, '')} · 已释放 ${state.hintCount}/5 层</div></div><button class="btn btn-primary hotspot" data-action="submit-first" data-note="session-submit-first">提交答案</button></div></section>`;
    }

    function followupSection() {
      const userBubble = `<div class="chat-line user hotspot" data-note="session-chat-first" tabindex="0"><div class="avatar">我</div><div class="bubble">建议先做灰度：为成员提供“自动整理建议”，而不是直接移动文档。先用查找成功率和整理接受率验证价值。</div></div>`;
      let body = '';
      let input = true;
      if (state.session === 'followup') {
        body = `${userBubble}<div class="chat-line hotspot" data-note="session-followup-chat" tabindex="0"><div class="avatar">总监</div><div><div class="tiny faint" style="margin-bottom:4px">产品总监 <span class="badge blue">追问</span></div><div class="bubble">你把“整理接受率”作为指标，但接受建议不等于找资料更快。你会如何证明新价值，而不是只证明用户点了按钮？</div></div></div><div class="hotspot" data-note="session-followup-hint" tabindex="0"><button class="btn btn-ghost hotspot" data-action="followup-hint" data-note="session-followup-hint">◇ 给我一个提示</button><span class="tiny faint" style="margin-left:7px">追问提示 · 系数 −0.05</span>${state.followupHintCount ? '<div class="hint-box" style="margin-top:8px">提示：把指标拆成“找到正确资料的时间”和“找到后是否能直接使用”。</div>' : ''}</div>`;
      } else if (state.session === 'gate') {
        body = `${userBubble}<div class="gate-box hotspot" data-note="session-followup-gate" tabindex="0"><b>首答足够扎实 ✓</b><br>你的首答已足够扎实，总监认为无需追问——可直接提交最终答案。</div>`;
      } else if (state.session === 'generating') {
        body = `${userBubble}<div class="empty-card hotspot" data-note="session-followup-generating" tabindex="0" style="padding:14px;text-align:left"><b>总监思考中…</b><br>正在针对你的回答设计追问，通常 20 秒内，高负载时约 1 分钟。页面会自动刷新，无需操作。</div>`;
        input = false;
      } else if (state.session === 'failure') {
        body = `${userBubble}<div class="empty-card" style="padding:14px;text-align:left"><b>总监暂时离开（追问生成失败）</b><br><span class="small">不影响本次训练——可重试生成追问，或跳过追问直接作答。</span><div class="row row-wrap" style="margin-top:10px"><button class="btn btn-primary hotspot" data-action="followup-retry" data-note="session-followup-retry">重试本次对话</button><button class="btn btn-text hotspot" data-action="followup-skip" data-note="session-followup-skip">跳过追问，直接作答</button></div></div>`;
        input = false;
      }
      return `<section class="card card-pad"><div class="row space-between"><h3 class="card-title">总监追问</h3><span class="tiny faint">追问不扣分，放心补充</span></div><div class="chat-list" style="margin-top:14px">${body}</div>${input ? `<div style="margin-top:15px;padding-top:14px;border-top:1px solid #e9edf4"><textarea class="textarea hotspot" style="min-height:80px" data-note="session-final-answer" placeholder="回应追问，修正或深化你的结论……">接受率只是过程指标。我会把主要指标改为“完成资料查找任务的中位时间”，并用人工抽查确认找到的内容是否可用。</textarea><div class="row space-between row-wrap" style="margin-top:12px"><span class="tiny faint hotspot inline-hotspot" data-note="session-coefficient" tabindex="0">本题提示 ${state.hintCount} 次 · 追问提示 ${state.followupHintCount} 次 · 独立完成系数 ×${coefficient(state.hintCount, state.followupHintCount).toFixed(2).replace(/0$/, '')}</span><button class="btn btn-primary hotspot" data-action="submit-final" data-note="session-submit-final">提交最终答案</button></div></div>` : ''}</section>`;
    }

    function doneSection() {
      return `<section class="card card-pad hotspot" data-note="session-done" style="padding:28px;text-align:center"><div style="font-size:25px;color:#047857">✓</div><h3 style="margin:8px 0">本次训练已完成</h3><p class="muted small">最终答案已提交，评分与诊断生成后将在训练反馈页展示。</p><div class="calculation" style="text-align:left;margin:15px auto;max-width:480px">接受率只是过程指标。我会把主要指标改为“完成资料查找任务的中位时间”，并用人工抽查确认找到的内容是否可用。</div><div class="row" style="justify-content:center"><button class="btn btn-text hotspot" data-go="feedback" data-note="current-result">查看训练反馈 →</button><button class="btn btn-primary hotspot" data-action="extra" data-note="current-extra">再练一题</button></div></section>`;
    }

    function releasedHints() {
      if (!state.hintCount) return '';
      return `<section class="card card-pad hotspot" data-note="session-released-hints"><div class="row space-between"><h3 class="card-title">已释放的提示</h3><span class="tiny faint">${state.hintCount}/5 层</span></div><div class="fact-item" style="margin-top:12px"><b><span class="badge blue">1</span> 界定问题</b><span>先确认用户真正的任务是“整理文档”，还是“更快找到可用资料”。</span></div></section>`;
    }

    function workbenchContent(isBaseline = false) {
      const center = state.session === 'answering' ? answeringSection() : state.session === 'done' ? doneSection() : followupSection();
      return `<div class="workbench">${caseColumn()}<div class="stack"><section class="card card-pad hotspot" data-note="session-question"><div class="section-label">今日问题</div><div class="question-box" style="margin-top:8px">如果要为知识库加入 AI 自动整理，你会如何定义价值、设计方案，并判断它值得投入？</div></section>${center}${releasedHints()}</div>${materialsColumn()}</div>${isBaseline ? '<p class="tiny faint" style="margin:14px 0 0;text-align:center">基线模式复用同一 TrainingFlow；终答后进入题间过渡，不展示单题反馈或加练。</p>' : ''}`;
    }

    function sessionPage() {
      const page = PAGES[6];
      const stageText = { answering: '作答中', followup: '追问中', gate: '追问中', generating: '追问生成中', failure: '追问失败', done: '评分中' }[state.session];
      return `${pageIntro(page)}${guideStrip('这是核心页。建议依次切换：首答 → 追问 → 零追问 → 失败兜底 → 完成。')}${switcher([['answering', '首次作答'], ['followup', '总监追问'], ['gate', '零追问闸门'], ['generating', '生成中'], ['failure', '失败兜底'], ['done', '已完成']], state.session, 'session')}${browser('/training/session/demo-session', productShell('training', workbenchContent(), stageText))}`;
    }

    function scoreRows() {
      const scores = [['方案设计', 80, 60], ['产品取舍', 78, 58.5], ['指标与验证', 84, 63]];
      return `<section class="card card-pad"><div class="row space-between row-wrap"><h3 class="card-title">本次有效得分</h3><span class="tiny faint">有效得分 = 原始分 × 独立完成系数</span></div>${scores.map(([d, raw, effective], i) => `<div class="score-row hotspot" data-note="feedback-effective-score" tabindex="0"><div class="score-line"><span class="small strong">${d}</span><span class="score-number">${effective}</span><span class="tiny muted hotspot inline-hotspot" data-note="feedback-raw-score" tabindex="0">原始 ${raw} × 系数 0.75<br>主提示 2 次 · 追问提示 1 次</span><button class="btn btn-text hotspot" data-action="calculation" data-note="feedback-calculation">${state.calculation && i === 0 ? '收起计算过程' : '查看计算过程'}</button></div>${state.calculation && i === 0 ? `<div class="calculation">有效得分 = 原始表现分 × 独立完成系数<br>80 × 0.75 = 60<br>系数 = max(0.6, 1 − 0.1 × 2 − 0.05 × 1) = 0.75<br>诊断：方案有灰度意识，但价值指标仍停留在使用行为，尚未直接证明任务收益。</div>` : ''}</div>`).join('')}</section>`;
    }

    function surveyCard() {
      if (state.surveySubmitted) return `<section class="card card-pad" style="text-align:center"><div class="green" style="font-size:22px">✓</div><b class="small">已收到你的反馈</b><p class="tiny faint">你的评价会让后续训练更贴近你的需要。</p></section>`;
      const questions = [['q1', '这次反馈说清了你的问题所在吗？'], ['q2', '你知道下一步该练什么、为什么吗？'], ['q3', '最近的训练是否越来越针对你自己？']];
      return `<section class="card card-pad hotspot" data-note="feedback-survey"><h3 class="card-title" style="margin-bottom:8px">这次训练对你有帮助吗？</h3>${questions.map(([key, text]) => `<div class="star-row"><span class="small">${text}</span><div class="stars" role="radiogroup" aria-label="${text}">${[1,2,3,4,5].map(v => `<button type="button" class="star hotspot inline-hotspot ${state.survey[key] >= v ? 'lit' : ''}" data-action="star" data-question="${key}" data-value="${v}" data-note="feedback-stars" role="radio" aria-checked="${state.survey[key] === v}" aria-label="${v} 星">${state.survey[key] >= v ? '★' : '☆'}</button>`).join('')}</div></div>`).join('')}<div style="text-align:right;margin-top:14px"><button class="btn btn-primary hotspot" data-action="survey-submit" data-note="feedback-survey-submit" ${Object.values(state.survey).some(v => !v) ? 'disabled' : ''}>提交反馈</button></div></section>`;
    }

    function calculator() {
      const c = coefficient(state.calcMain, state.calcFollowup);
      const result = Math.round(state.calcRaw * c * 100) / 100;
      return `<section class="calculator"><div class="row space-between row-wrap"><div><div class="section-label blue-label">讲解实验 · 不属于原产品页面</div><h3 class="card-title" style="margin-top:5px">拖动条件，亲手算一次有效分</h3></div><span class="badge blue">BR-2</span></div><div class="calc-grid" style="margin-top:18px"><div class="range-field"><label for="calc-raw"><span>原始表现分</span><b id="calc-raw-value">${state.calcRaw}</b></label><input id="calc-raw" type="range" min="0" max="100" value="${state.calcRaw}" data-calc="calcRaw"></div><div class="range-field"><label for="calc-main"><span>首答前提示</span><b id="calc-main-value">${state.calcMain} 次</b></label><input id="calc-main" type="range" min="0" max="8" value="${state.calcMain}" data-calc="calcMain"></div><div class="range-field"><label for="calc-followup"><span>追问提示</span><b id="calc-followup-value">${state.calcFollowup} 次</b></label><input id="calc-followup" type="range" min="0" max="4" value="${state.calcFollowup}" data-calc="calcFollowup"></div><div class="calc-result"><span class="tiny" style="color:#9fb5d1">有效得分</span><strong id="calc-result">${result}</strong><span class="tiny" id="calc-formula" style="color:#9fb5d1">${state.calcRaw} × ${c} = ${result}</span></div></div><p class="tiny muted" style="margin:13px 0 0">当前示例：原始 80，主提示 2 次，追问提示 1 次 → 80 × 0.75 = 60。系数最低 0.6，追问本身不扣分，只有使用提示才扣分。</p></section>`;
    }

    function feedbackContent() {
      if (state.feedback === 'scoring') return `<section class="card card-pad hotspot" data-note="feedback-scoring" style="padding:36px;text-align:center"><div style="font-size:26px" class="blue">◌</div><h3>总监评分中…</h3><p class="muted small" style="max-width:480px;margin:8px auto">产品总监正在按评分细则逐维度评阅你的作答，通常需要 30~60 秒。页面会自动刷新，无需操作。</p><div class="stack" style="max-width:460px;margin:25px auto 0">${[1,2,3].map(() => '<div class="progress-track"><span style="width:65%;opacity:.22"></span></div>').join('')}</div></section>`;
      return `<div class="stack">${scoreRows()}<section class="issue-card hotspot" data-note="feedback-top-issue" tabindex="0"><div class="section-label blue-label">最需要优化的一个问题</div><p style="margin:10px 0 0;font-size:13px;font-weight:700;line-height:1.8">你把“用户接受自动整理”误当成了“用户更快找到可用资料”。下一次先写清任务终点，再选择能直接证明任务收益的指标。</p></section><section class="card card-pad hotspot" data-note="feedback-next-step" tabindex="0"><div class="section-label">下一步</div><p style="margin:10px 0;font-size:13px;font-weight:700">练一题“从功能使用指标回到用户任务结果”的方案设计题。</p><p class="tiny faint">理由：总监依据本次作答诊断给出，与上面「最需要优化的问题」同源。</p></section>${surveyCard()}<div class="row row-wrap"><button class="btn btn-ghost hotspot" data-go="profile" data-note="feedback-view-profile">查看能力画像</button><button class="btn btn-primary hotspot" data-action="extra" data-note="current-extra">再练一题 ▸</button></div></div>`;
    }

    function feedbackPage() {
      const page = PAGES[7];
      return `${pageIntro(page)}${guideStrip('先讲原始分与有效分的区别，再用下方试算器验证 80 × 0.75 = 60。')}${switcher([['scoring', '评分中'], ['done', '评分完成']], state.feedback, 'feedback')}${browser('/training/feedback/demo-session', productShell('training', feedbackContent(), state.feedback === 'done' ? '已完成' : '评分中'))}${state.feedback === 'done' ? `<div class="replica-wrap">${calculator()}</div>` : ''}`;
    }

    function networkGraph() {
      const nodes = [
        [350, 58, '问题定义', '78', '#3b82f6'], [535, 140, '用户理解', '84', '#2563eb'], [580, 310, '根因分析', '66', '#93c5fd'],
        [455, 405, '产品价值判断', '71', '#60a5fa'], [245, 405, '方案设计', '72', '#60a5fa'], [120, 310, '产品取舍', '未观测', '#64748b'],
        [165, 140, '指标与验证', '未观测', '#64748b'], [350, 225, '产品表达', '未观测', '#64748b']
      ];
      const lines = nodes.map(([x,y], i) => nodes.slice(i + 1).map(([x2,y2]) => `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#547298" stroke-opacity=".18" stroke-width="1"/>`).join('')).join('');
      return `<div class="network-stage hotspot" data-note="profile-network"><svg viewBox="0 0 700 470" role="img" aria-label="八维能力网络图离线复刻"><defs><radialGradient id="nodeBlue"><stop stop-color="#8eb9ff"/><stop offset="1" stop-color="#2563eb"/></radialGradient></defs>${lines}${nodes.map(([x,y,d,s,c], i) => `<g class="network-node hotspot" data-action="profile-node" data-note="profile-network-node" tabindex="0" role="button" aria-label="查看${d}评估"><circle cx="${x}" cy="${y}" r="${s === '未观测' ? 18 : 23 + Number(s) / 10}" fill="${s === '未观测' ? '#64748b' : 'url(#nodeBlue)'}" fill-opacity="${s === '未观测' ? '.35' : '.9'}" stroke="${c}" stroke-opacity=".7"/><text x="${x}" y="${y + 4}" fill="#fff" text-anchor="middle" font-size="9" font-family="sans-serif">${i + 1}</text><text x="${x}" y="${y + 45}" fill="${s === '未观测' ? '#8294aa' : '#d9e9ff'}" text-anchor="middle" font-size="11" font-family="sans-serif">${d} · ${s}${s === '未观测' ? '' : '分'}</text></g>`).join('')}</svg><div class="network-legend"><span>● 较强</span><span>● 一般</span><span>● 较弱</span><span>○ 未观测</span></div><div class="network-help">真实页面：拖动旋转 · 滚轮缩放 · 点击节点查看评估记录（此处点击节点可演示）</div></div>`;
    }

    function profileList() {
      const rows = [['问题定义', '78.25', '观察 4 次', '↑ 上升中'], ['用户理解', '84.00', '观察 5 次', '稳定'], ['根因分析', '66.40', '观察 5 次', '↓ 下降中'], ['产品价值判断', '71.20', '观察 5 次', '稳定'], ['方案设计', '72.00', '观察 2 次', '样本较少']];
      return `<section class="card"><div class="row space-between" style="padding:15px 18px;border-bottom:1px solid #e9edf4"><h3 class="card-title">已观测维度</h3><span class="tiny faint">共 5 个维度 · 每次训练后更新</span></div>${rows.map(([d,s,c,t], i) => `<button class="ability-row hotspot" data-action="ability-row" data-note="profile-ability-row"><span class="small strong">${d}</span><span class="big-number" style="font-size:20px">${s}</span><span class="tiny muted">${c}</span><svg viewBox="0 0 100 25" height="25" aria-hidden="true"><polyline points="0,${18-i} 20,${12+i} 40,${15-i} 60,${8+i} 80,${11-i} 100,${5+i}" fill="none" stroke="${t.includes('下降') ? '#d97706' : '#2563eb'}" stroke-width="1.8"/></svg><span class="badge ${t.includes('上升') ? 'blue' : t.includes('下降') ? 'amber' : ''}">${t}</span></button>${i === 0 ? `<div class="calculation hotspot" data-note="profile-next-focus" style="margin:0 18px 12px"><b>特征：</b>基本独立作答，当前分数反映真实水平<br><b>诊断：</b>思考独立性良好，下一步继续加强问题边界的收敛。 <span class="badge blue">已列入下一题训练方向</span></div>` : ''}`).join('')}</section>`;
    }

      const gap = 12;
      let left = rect.right + gap;
      if (left + tipRect.width > window.innerWidth - 12) left = rect.left - tipRect.width - gap;
      if (left < 12) left = Math.min(Math.max(12, rect.left), window.innerWidth - tipRect.width - 12);
      let top = rect.top;
      if (top + tipRect.height > window.innerHeight - 12) top = window.innerHeight - tipRect.height - 12;
      tooltip.style.left = `${Math.max(12, left)}px`;
      tooltip.style.top = `${Math.max(12, top)}px`;
    }

      if (action === 'source') {
        event.preventDefault();
        showToast('真实产品会新窗口打开来源；讲解文件保持离线。');
      } else if (action === 'chip') {
        element.classList.toggle('selected');
        element.setAttribute('aria-pressed', String(element.classList.contains('selected')));
      } else if (action === 'add-product') {
        const input = $('#custom-product');
        const value = input.value.trim();
        if (!value) return showToast('先输入一个产品名。');
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'choice-chip selected hotspot inline-hotspot';
        chip.dataset.action = 'chip';
        chip.dataset.note = 'onboarding-products';
        chip.textContent = value;
        input.closest('.field').querySelector('.chip-group').append(chip);
        input.value = '';
        showToast(`已添加「${value}」（仅本地演示）`);
      } else if (action === 'login-reset') {
        state.loginSent = false; render();
      } else if (action === 'start-today' || action === 'extra') {
        state.session = 'answering'; go('session');
      } else if (action === 'restart') {
        state.restartConfirm = true; render();
      } else if (action === 'restart-cancel') {
        state.restartConfirm = false; render();
      } else if (action === 'restart-confirm') {
        state.current = 'not_started'; state.restartConfirm = false; render(); showToast('演示：会话已终止，当前训练回到未开始。');
      } else if (action === 'baseline-next') {
        state.session = 'answering'; state.baseline = 'workbench'; render();
      } else if (action === 'hint') {
        state.hintCount = Math.min(5, state.hintCount + 1); render();
      } else if (action === 'submit-first') {
        state.session = 'followup'; render();
      } else if (action === 'followup-hint') {
        state.followupHintCount = 1; render();
      } else if (action === 'followup-retry') {
        state.session = 'generating'; render();
        setTimeout(() => { if (state.session === 'generating') { state.session = 'followup'; render(); showToast('演示：追问已重新生成。'); } }, 1100);
      } else if (action === 'followup-skip') {
        state.session = 'gate'; render();
      } else if (action === 'submit-final') {
        state.feedback = 'scoring'; go('feedback');
        setTimeout(() => { if (state.page === 'feedback' && state.feedback === 'scoring') { state.feedback = 'done'; render(); showToast('演示：评分完成。'); } }, 1400);
      } else if (action === 'calculation') {
        state.calculation = !state.calculation; render();
      } else if (action === 'star') {
        state.survey[element.dataset.question] = Number(element.dataset.value); render();
      } else if (action === 'survey-submit') {
        if (Object.values(state.survey).every(Boolean)) { state.surveySubmitted = true; render(); }
      } else if (action === 'profile-node') {
        state.profileNode = true; render();
      } else if (action === 'profile-close') {
        if (element.classList.contains('modal-backdrop') && event.target.closest('[data-stop-propagation]')) return;
        state.profileNode = false; render();
      } else if (action === 'ability-row') {
        showToast('真实页面会在此展开该维度特征与诊断。');
      } else if (action === 'settings-edit' || action === 'settings-save' || action === 'settings-cancel') {
        state.settingsEdit = action === 'settings-edit' ? true : false;
        render();
        if (action === 'settings-save') showToast('演示：画像已保存（未发送真实请求）。');
      } else if (action === 'logout') {
        state.loginSent = false; go('login');
      } else if (action === 'close-notification') {
        state.notification = false; render();
      }
    }

    document.addEventListener('click', event => {
      const noteClose = event.target.closest('#note-close');
      if (noteClose) { event.stopPropagation(); hideNote(); return; }
      const noteElement = event.target.closest('[data-note]');
      if (noteElement && !state.clean) showNote(noteElement.dataset.note, noteElement, true);
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) { go(pageButton.dataset.page); return; }
      const stateButton = event.target.closest('[data-state-group]');
      if (stateButton) { setStateGroup(stateButton.dataset.stateGroup, stateButton.dataset.stateValue); return; }
      const goButton = event.target.closest('[data-go]');
      if (goButton) { event.preventDefault(); go(goButton.dataset.go); return; }
      const actionElement = event.target.closest('[data-action]');
      if (actionElement) handleAction(actionElement.dataset.action, actionElement, event);
    });

    document.addEventListener('submit', event => {
      if (event.target.matches('[data-action="login-form"]')) {
        event.preventDefault(); state.loginSent = true; render();
      }
    });

    document.addEventListener('mouseover', event => {
      const element = event.target.closest('[data-note]');
      if (element && !pinnedNote) showNote(element.dataset.note, element);
    });
    document.addEventListener('mouseout', event => {
      const element = event.target.closest('[data-note]');
      if (element && !pinnedNote && !element.contains(event.relatedTarget)) hideNote();
    });
    document.addEventListener('focusin', event => {
      const element = event.target.closest('[data-note]');
      if (element && !pinnedNote) showNote(element.dataset.note, element);
    });
    document.addEventListener('focusout', event => {
      const element = event.target.closest('[data-note]');
      if (element && !pinnedNote && !element.contains(event.relatedTarget)) hideNote();
    });
    document.addEventListener('input', event => {
      const key = event.target.dataset.calc;
      if (!key) return;
      state[key] = Number(event.target.value);
      const c = coefficient(state.calcMain, state.calcFollowup);
      const result = Math.round(state.calcRaw * c * 100) / 100;
      $('#calc-raw-value').textContent = state.calcRaw;
      $('#calc-main-value').textContent = `${state.calcMain} 次`;
      $('#calc-followup-value').textContent = `${state.calcFollowup} 次`;
      $('#calc-result').textContent = result;
      $('#calc-formula').textContent = `${state.calcRaw} × ${c} = ${result}`;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') hideNote();
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('g[data-action]')) {
        event.preventDefault(); event.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }
    });
    window.addEventListener('scroll', () => { if (!pinnedNote) hideNote(); }, { passive: true });
    window.addEventListener('resize', () => { if (activeNoteElement) positionNote(activeNoteElement); });
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (RENDERERS[id] && id !== state.page) { state.page = id; render(); }
    });

    $('#mode-toggle').addEventListener('click', () => { state.clean = !state.clean; hideNote(); render(); });
    $('#prev-page').addEventListener('click', () => {
      const index = PAGES.findIndex(item => item.id === state.page);
      if (index > 0) go(PAGES[index - 1].id);
    });
    $('#next-page').addEventListener('click', () => {
      const index = PAGES.findIndex(item => item.id === state.page);
      go(PAGES[(index + 1) % PAGES.length].id);
    });
    const select = $('#mobile-page-select');
    select.innerHTML = PAGES.map((page, index) => `<option value="${page.id}">${String(index).padStart(2, '0')} · ${page.title}（${page.minutes} 分钟）</option>`).join('');
    select.addEventListener('change', () => go(select.value));

    const initialPage = location.hash.slice(1);
    if (RENDERERS[initialPage]) state.page = initialPage;
    render();
  </script>
</body>
</html>
