    text: |
      暂停按钮旁可写：“需要暂时离开？点击屏幕后按住暂停。跑带会逐渐停止；暂停后本节课的排行榜名次会移除。”仅在确认该课程支持暂停时显示按钮和文案。

      进入暂停状态后显示：“课程进度最多暂停 60 分钟。准备继续时，请按设备提示解锁并恢复课程。”跑带尚未停稳时继续显示停止过程，不引导用户立刻离开。具体超时和恢复步骤仍应以对应机型及课程说明为准。

      让几位 Tread 用户模拟训练中断，观察他们是否知道怎样暂停、是否意识到跑带需要时间停止、是否能说明排名变化和如何恢复；再用不支持暂停的课程核查提示不会误出现。这个说明不承诺所有课程都能暂停，也不代替设备安全指引。
