  - id: Q36-reference-1
    text: |
      我会先把问题定义为：在选定试点门店，有退货意图且商品初步符合条件的顾客，是否能找到车边退货入口、完成发起与交接并理解退款进度。现在没有数据证明存在异常，因此先建立基线而不是指定责任方。

      假设一：顾客找不到入口；从近期有退货意图的人中招募观察对象，无论其是否已发起退货，都记录其中找到入口的人数并询问预期位置，避免只抽到成功发起者。假设二：资格或门店范围不清；将商品与订单是否满足退货资格及门店服务条件，对照顾客对资格的理解和实际选择，区分政策本身不支持与符合条件却误以为不支持。假设三：到店后通知或交接不清；按已发起退货的人数观察到店通知、员工接收及等待，并与员工核对流程。假设四：交接完成但退款进度难理解；对照交接、退款发起和到账等节点的实际时间、应用显示状态与顾客的理解，区分处理延迟和状态说明不清，并考虑支付渠道可能带来的延迟。四类障碍可以并存。

      先做少量真实任务观察并查看各环节人数与分母，再针对占比较高或影响严重的环节跨时段、跨门店复核；这只是调查次序，不是已确定的主因排名。仅凭退出率不能确定原因，要结合顾客和员工解释；不同商品资格、门店客流及退款处理时间都可能影响结果。确认具体障碍后再选择修文案、调整交接还是澄清政策。
