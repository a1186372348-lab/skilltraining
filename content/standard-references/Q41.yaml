    text: |
      问题可以定义为：观看某段教程并寻找指定步骤的观众，能否在合理时间内找到并确认相关片段。现有材料只说明章节功能，不证明观众普遍找不到内容，也不能由视频总完成率推断定位问题。

      至少有四种解释：观众不知道可打开章节列表；看到了但标题无法与任务对应；选对标题但章节起点或内容不准确；目标步骤根本不在视频中。分别观察是否打开列表、如何理解标题、跳转后是否找到内容，并由研究者预先核对教程是否包含目标。未打开入口和看过后反复选错需要不同的改进。

      招募少量不同经验的观众，在几段已核对的长教程和不同设备上寻找指定步骤，记录尝试人数、找到人数、耗时、跳转次数以及事后解释；也观察普通拖动进度条的行为。样本只能帮助发现原因，不能估计全平台比例，之后再扩大视频和用户范围复核。
