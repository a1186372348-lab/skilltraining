  - id: Q42-reference-1
    text: |
      我会在确认资格和商家协议后小范围提供分期作为可选方式，不默认勾选。消费者可能把一笔计划内购买分散到六周，但仍须偿还全部款项；2020 年公告脚注说明逾期可能收费，免息不能证明购买负担得起。商家可能提前收款并降低部分支付障碍；公告称该产品包含在商家现有 PayPal 定价内、不额外收取接入费，但新增订单、退款或运营成本和用户体验都尚未证实。

      在选择前清楚显示总金额、每期金额和日期、资格、逾期或其他适用费用及退款如何处理，并提供完整条款；不使用鼓励超额消费的倒计时或把分期当作折扣。具体 2020 年费用需核对原始协议，不能直接套用后来的行业规则。

      在类似商品和人群中做小范围对照，以进入结账的人数为分母观察完成率，也跟踪退款和争议；与支付方约定是否能合规提供汇总的逾期或还款困难信号，不要求商家持有消费者完整债务数据。若转化提高但投诉或可得的还款困难信号上升，应暂停并调整展示或资格，而非仅按销售判断成功。商家无法直接观察全部借款人债务，需和支付方明确责任与数据边界；若必要风险信息无法获得，应说明监测盲区并与支付方协商或调整试点，只能报告商家侧结果，不能宣称已证明消费者净受益。
