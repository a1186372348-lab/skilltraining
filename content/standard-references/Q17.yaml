    text: 我会先区分需要马上澄清、参与者都在线且问题较短的工作，以及需要跨时区思考或留下可审阅结论的工作。前者例如两名同事对一个设计细节有分歧，频道里的轻量语音可能减少来回等待；后者如需要多部门审阅的决策，异步文字或约定议程的会议可能更合适。同一个人并不固定属于某一类型。针对前一种情境，我会在相关频道讨论附近提供发起 Huddle 的入口，让参与者先看到谁可加入；结束后提供把决定写回线程的可选提示。有人不在线或不能听语音时，仍需文字承接，不能强制进入语音。验证时观察讨论能否完成、参与者是否找得到决定，以及被打断的情况，访谈不同工作时间和无障碍需求的同事。Huddle 发起次数增加只能说明使用，不能证明会议减少或效率提高；如果决定反而难以追溯，就需要调整记录方式。
