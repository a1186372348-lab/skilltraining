  - id: B14-reference-1
    text: "我暂不作确定排序：优选面向计划性低价采购、次日自提，已覆盖超过 2600 个市县但未达 GMV 目标，新业务整体亏损扩大且监管限制低价倾销；闪购面向即时需求，可复用骑手和商户网络，但面临京东到家等竞争。这些事实表明两线机会与履约压力不同，却不足以分离地区成本、各自留存与现金回收，也不能把公司总体新增用户或整体亏损直接归因到某一条业务。\r\n\r\n过渡期间，闪购维持既有服务和预算节奏，不据此承诺自然增长；优选冻结新增开城，在现有区域维持服务并将新增投入限定在已运营区域。此安排用于限制不可逆投入，不是认定其中一条必然更优；冻结优选开城可能错失下沉市场和规模密度，维持闪购亦占用有限现金，因此两者机会成本需一并复核。三个月内补三组数据：分区域件均履约及获客成本；新老用户的复购和客单价；各业务独立贡献毛利、现金消耗和需求密度。\r\n\r\n复核时，若闪购在可比地区复购稳定且增量订单贡献能覆盖新增履约成本，而优选成本改善仍不足以支持现金回收，则将闪购列为优先、优选继续收缩；若优选在高密度地区先达到可持续贡献而闪购增量成本居高，则调整排序。任一线超预算或服务质量恶化时暂停扩张。上述判断条件是预先设定的决策规则，具体阈值须在补齐基线与预算后确定。"
