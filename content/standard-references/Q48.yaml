  - id: Q48-reference-1
    text: |
      寄件券的主要直接受益对象是假设需要寄件的卖家，可能减少实际寄费；买家是否因此更容易完成交易需要观察。流量券可能让获券卖家的商品获得更多展示，买家也可能更容易找到合适商品，但展示增加不自动等于交易增量。券的真实使用门槛、补贴承担方及可以取得的数据，要先与平台核实。

      我会分别将有寄件券、有流量券的安排与常规不额外发券比较，记录试点前已符合资格的卖家及可合规观察的买家，观察 28 天。可行时随机分配；若只能选相近对象，要说明按试点前交易活跃度和商品类别等匹配，并保留未观测差异的解释。寄件券关注完成寄件订单的平均实付寄费，以及每名合资格卖家的完成订单数；流量券关注每名合资格卖家的展示与完成订单数。完成以平台确认收货为例；分别记录补贴总额、每笔完成订单的补贴成本和订单争议。买家侧可看事先确定的买家中完成至少一笔交易的比例，并询问买卖双方对选择、费用和体验的感受；未回答者可能不同于回答者。

      流量券应同时观察获券卖家、未获券卖家和试点范围整体的展示及完成交易，不能只看获券卖家增长。若整体交易也稳定改善、成本可接受，且可比依据与相互影响足以支持解释，才支持考虑扩大；若主要是未获券者减少、整体无改善，应调整分配或停止。共享流量、跨范围浏览及同时发生的活动都可能影响比较；若样本或试点范围不足，先作探索性观察，扩大范围或改进比较后再判断。按市场划分是一条可选路径；仅在分析时给跨市场用户归组，并不能阻止他们跨市场浏览交易，也不等于消除了干扰。以上均为拟议方法和口径，报道个例不能证明效果。
