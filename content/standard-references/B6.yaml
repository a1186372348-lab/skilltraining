    text: |-
      我的判断是，低价是重要入口，但不必假定它足以解释每一笔选择：在赶饭点时，用可预期的预算较省事地解决一餐，可能是它在价格之外提供的价值。这是由场景提出的判断，不是已证实的用户动机排名。

      学校附近的学生可能更受生活费约束；写字楼里午休紧张的人可能更在意不用反复挑选和赶上饭点；同一人周末和工作日也可能有不同选择。案例观察到学校、写字楼周边订单密集，饭点有人在群里分享拼单链接；这与预算和决策便利有关，但不能单独证明每个人为什么下单。媒体转引称，截至 2024 年 8 月约有 1.2 亿人使用过，不等于当时的活跃或复购人数。

      用户可以拿食堂、自带饭或其他外卖作比较：拼好饭的低价和免配送费可能更适合预算，但也可能以选择较少、等待或品质波动为代价。对于有人吐槽配送慢、分量却仍复购的现象，一种可能是这些代价还没有超过其可接受底线；也可能吐槽和复购来自不同人，不能由总单量直接证明个人愿意交换。应访问有连续订单与吐槽记录、且同意接受回访的用户，比较其预算、实际等待、替代选项和复购原因；也可观察价格或预计送达时间变化后不同人群的选择，注意其他变化的干扰。

      商家可能通过低价获得订单和新客，但薄利润、差评与低价心智会带来压力；集中配送可能改变骑手的每单收入和工作安排，需看其每小时收入及劳动强度，而不能假定一定受益或受损。平台面对外卖用户增长压力，低价供给与需求集中可能共同推动这个模式，但各自贡献尚未证实。如果补贴减少后商家靠降低品质维持经营，或骑手收入与体验底线持续受损，应重新评估低价是否仍创造净价值。
