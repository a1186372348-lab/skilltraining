question_id: B8
references:
  - id: B8-reference-1
    text: |-
      我会分析报告中投资者实际收益与对应基金净值表现的差距，而不是把「某些人亏损」直接等同于这个差距。现有材料不足以确定销量榜是主因，也不足以排除它有影响。

      至少有四种可能机制需要比较：第一，销量榜把热销信息放在显眼位置，可能让缺乏经验的人用热度代替风险判断、在上涨后买入；但喜欢追热点的人也可能本来就更爱看榜。第二，用户自身的买卖时点、频繁交易和持有期可能使实际收益偏离基金表现，即使没有榜单也可能存在。第三，行情波动会改变不同买入时点的投资结果；报告中盈利人数占比从 2020 年末的 70.42% 降至 2021 年一季度末的 53.28%，反映同期盈利情况变化，不能单独量化行情造成的收益差距。第四，不同基金的资产、风险和走势可能影响部分人何时买入或卖出；例如案例中的中欧医疗健康曾热销，之后遭遇市场回撤。若持有人因波动而改变买卖时点或持有期限，其实际收益可能与同一基金在报告比较时段的净值表现产生差距。这只是待检验路径，基金回撤本身不等于该差距，也不能据此断言机制成立或所有人亏损；需要同基金的买卖时点、持有期、费用及收益数据才能进一步分析。

      短期持仓者盈利占比与长期持仓者不同只是横截面关联，不能据此保证持有越久就越赚钱。接近负 60% 的「行为损耗率」是景顺长城旗下符合特定条件基金的五年测算：客户年度平均收益与基金净值增长率之差相对于后者的比例，并非三家公司全部账户的结果、不是本金亏掉六成，也没有提供蚂蚁销量榜渠道归因。

      榜单对新用户可能是省力的选择捷径和从众信号；用户要求「更准的榜」也未必等于了解自己的风险与持有期限。要区分榜单诱导和自选择，可比较相近风险偏好、买入时期和基金类型下，不同渠道或榜单接触程度用户的持有期、买卖时点及收益；再看拆榜前后同批用户，并尽可能设置不受变更影响的对照。若条件允许，随机比较榜单展示方式可更直接检验展示造成的行为变化；普通观察对照仍可能受未观测差异和同期市场变化干扰。不同结果会分别指向平台展示、投资者引导或基金风险匹配等不同处理，而不能预先认定某一方是唯一原因。
