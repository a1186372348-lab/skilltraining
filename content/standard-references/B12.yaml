  - id: B12-reference-1
    text: "候补机制面对的是稀缺票源下，旅客难以在公平、可预期的规则中取得退票或余票的问题，不是创造票源。旅客预付最高票款使订单有履约约束，截止未兑现原额退款避免长期占用资金；系统按订单生效时间排队、利用官方售票入口中退改签票源兑现，减少反复刷票和第三方软件速度优势。免费减少额外费用，订单及组合数量限制和人证核验限制占位与滥用；这些措施改善规则可预期性，不证明完全消除不公平。它不能保证每个人兑现，也不能保证新增运力。\r\n\r\n我选择改进等待过程的信息不透明：在订单页显示该组合的队列规模区间和过去七日已兑现数量，并注明数据统计范围、更新时间及历史不代表个人成功概率。若样本过少或长期无兑现，只显示数据不足或近期无兑现，不推算某个人的概率；退款、取消和多个候补组合仍按既有规则处理，不改变订单顺序。\r\n\r\n旅客可能更容易理解等待情况，但是否降低焦虑需要验证；铁路承担统计维护、解释及误读风险，精确位置还可能被用于策略性占位，因此只给区间并评估对公平性的影响。先小范围测试用户理解、取消率、客服咨询及异常占位，若误读、占位或弱势用户受损明显增加，则暂停或调整展示。此处提出的是待验证改进，不承诺个人兑现成功。"
