    text: |-
      买不到票确实让人着急，而且每趟车怎样分配票额并不透明，怀疑有其原因；但光凭「秒光」不能证明票锁给内部渠道。热门车次一般不到两千个席位，开售时每秒可能涌入数万张需求，供不应求是票很快售罄的主要原因。中间站一开售就候补则不同：铁路先预分票额，长途优先并兼顾短途，之后会动态调整、敞开发售。

      候补像免费排队：提交并支付预付款后，按订单生效时间等可匹配的票额，退改或调整释放的票再按规则兑现。长途旅客和整体座位利用可能受益，短途旅客则可能一开始就买不到，候补者也承担等不到的风险，所以这是有代价的相对公平，并非人人满意。官方公布整体兑现率超过 70%，不代表每条线路都如此，更不保证个人买到。建议在 12306 尽早提交候补，按需要选择可接受的车次和日期；付费加速包不能突破官方候补规则。
