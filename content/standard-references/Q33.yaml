  - id: Q33-reference-1
    text: |
      在 2014 年的有限信息下，我会优先试点允许同一库中不同的可共享游戏同时使用，但仍限制同一份游戏许可的并发。比维持整库互斥，这可能减少家庭中互不相关的使用冲突；比允许一份游戏多人同时玩，它保留更清楚的内容许可边界。两项收益与商业影响都尚未证实。对平台而言，这种安排可能减少访问冲突及相关客服负担，也需要与开发者协调许可并投入技术维护和客服支持；这些收益与代价都是假设，须在试点中验证。

      所有者与借用者各用自己的账户和存档。旧规则是所有者使用整个共享库时优先；我的拟议规则允许不同游戏并行，竞争同一份游戏时仍保留所有者优先。如果借用者正使用所有者想玩的同一份游戏，应提醒借用者保存，并在约定期限后退出，让所有者进入；期限和提示方式须在试点前与内容方协商，不能假定历史期限。不同借用者竞争同一份游戏时，可提示占用原因并提供等待或购买选择；这部分是新方案，不直接承诺所有游戏都能共享。保留所有者优先保护了其访问权，却仍可能中断借用者；完全先到先得可减少中断，却可能让所有者等待，需与双方验证取舍。若开发者未允许或技术条件不支持，应清楚标记不可共享。

      用自愿参加的小范围家庭及同意试点的游戏比较现有规则和新规则，观察不同游戏并发被阻挡的频率、游戏启动成功与中断、用户理解，以及销售和内容方反馈；注意既有购买习惯不同会干扰比较。若内容方退出增加、争议或异常访问明显上升，应暂停并重新协商；若共享体验改善且风险可控，再扩大样本。不能由共享使用量直接推断新增收入，所选方案在 2014 年只是待验证判断。
