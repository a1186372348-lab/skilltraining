question_id: B15
references:
  - id: B15-reference-1
    text: |-
      我会在未来两个季度验证三个命题：用户能更方便地找到并购买合适商品且愿意复购；买手和商家有机会持续经营；商业化没有明显损伤社区内容体验。案例中平台公布近 4000 万日活用户有求购意图，说明其观察到需求线索，但这是公司口径，不等于这些人都会下单或产生新增消费。

      指标分三层：结果看购买人数、成交额、同批购买用户的复购及商家经营表现；例如 30 天复购率以某期首次下单用户为分母、30 天内再下单者为分子。过程看从内容浏览、进店到下单的转化，以及买手与商家有效撮合；护栏看社区内容消费、互动、留存和带货内容投诉。再看活跃买手留存、中位数产出、头部成交占比及未获额外扶持的自然成交占比。官方公布的买手规模增长 27 倍和撮合数增长 370% 缺少充分基数与投入背景，不能独自证明模式健康。

      比较上，一是与转型前自营时期相近季节、品类和用户群比较，并记录当时和现在的经营成本；二是把新增成交及可核算收益与流量扶持、补贴和运营投入比较，而非只看成交额。前后变化还受大盘、季节与投入变化影响，不能直接归因。若业务允许，可在合资格买手中随机分配一部分额外扶持，比较其后续表现和社区护栏，但这一对照只能估计额外扶持的影响，不能单独证明整个转型的因果效果。结合用户跨周期站内购买轨迹和自愿调查其原有站外购买行为，估计新增消费与渠道搬移；调查误差和未观察到的站外交易仍会限制结论。

      对买家看选择是否省心、价格与售后是否可接受；对买手看能否脱离单次扶持持续经营；对商家看投入产出及复购。若复购与可核算收益相较合适的自营期基准改善、扣除扶持和运营投入后仍达到试点前商定目标，且供给侧留存稳定、社区护栏未触及底线，可考虑有条件增加投入；若成交主要依赖头部或补贴、社区体验明显恶化，则缩减扶持并修正链路。目标及护栏阈值应在观察前结合基线和预算商定，题面没有给出。两个季度可观察复购、自然成交和护栏趋势，不能据此断言长期品牌心智或社区价值的因果变化，需更长时间及合适对照。
