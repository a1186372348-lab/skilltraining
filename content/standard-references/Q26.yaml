    text: 可以这样向负责人说明：『不能据此说所有学校、所有人都自动免费。材料介绍的是面向符合条件的基础教育师生及注册学区的教育服务；本校是否适用，需要按所在地区、学校类型和验证要求核实。它可以帮助教师制作课堂材料，也可为学校提供统一配置账号等管理能力。』教师可确认本人验证条件及如何加入学校团队；管理员可确认学区注册资格和成员配置责任。集中配置可能减少逐人处理的工作，但需要设置与维护。免费和工具丰富并不证明成绩提升，不应对尚未知晓的功能范围或效果作保证。
