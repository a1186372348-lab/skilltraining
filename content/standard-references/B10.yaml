  - id: B10-reference-1
    text: "基于 2021 年 12 月的信息，我倾向在受限预算内试做农产品直播，而不把它认定为最优转型或成功已定。原有业务受冲击是题设事实；截至当时 800 多位教师报名、400 多人完成培训，直播电商已有市场而农产品存在损耗和低毛利难题，构成可尝试的资源与约束，并不证明培训能力必然转成销量。直播能否形成持续业务仍待验证。\r\n\r\n农户可能获得展示和销售渠道；消费者可能获得对商品的解释与比较；公司及转型教师可能利用表达能力寻找新收入。每一项都是潜在价值：前提是消费者信任并购买、供给质量和履约可靠、教师表达能转化为持续成交，而不是由报名或单次关注直接证明。已有教师报名和农户需要渠道的线索相对具体，消费者是否买单、是否复购及其经济性则更脆弱；最大不确定性是消费者需求、复购与低毛利下的单位经济能否同时成立；需补充分群需求、退货履约成本、复购及可承受损失数据。\r\n\r\n建议小规模试点，预先约定单位订单贡献、复购、履约质量和现金消耗的评价口径；若销售增长仍无法覆盖新增成本或复购不足，就停止扩大。可迁移标准是：冲击是否不可逆；可迁移资产是否适配新场景；多方价值是否能被独立验证；单位经济和失败代价是否可承受。例如假想一家线下培训公司转做企业培训，可先核对教师能力能否满足企业采购需求、试点续约及交付成本，任一条件不成立就不扩大。若这些条件不能证明，先保留现金并缩小试验，不把试点当成全面转型成功。"
    status: approved
