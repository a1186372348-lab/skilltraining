  - id: B13-reference-1
    text: |-
      我选择转向以合作共建为主，同时维持现有网络服务，对连接关键线路或确有需求缺口的自建站设上限和逐站审批。暂不按原节奏全面扩张，也不因亏损立即停掉已有网络；低利用区域的新建先暂停，是否由合作方承接须另行谈妥。

      继续自建可以维护补能便利、网络覆盖和 BaaS 差异化，也保留较强控制权，但需承担建站、备用电池和运营成本；全面收缩可以节约新增投入，却可能损害用户可用性、合作信心和已作出的服务承诺。应核对并履行老车主适用的权益，对新车主已调整的权益透明说明，不能把所有人的权益视为相同。共建可能分担投入并带来合作车型，但标准协调、收益分配及排他性下降是代价，合作宣布不等于实际接入和利用率已经提升。

      案例中的四代站单站建设成本约 150 万元、累计网络投入超 50 亿元均为媒体援引；2024 年 224 亿元是公司整体净亏损，不能直接当作换电业务亏损。三代站日均约 60 单盈亏平衡、约两成站点达标是 2023 年报道时的口径，也不能直接套到当前所有站点。评估时应分别看新增资本支出、站点运营费用和利用率；过去已投入的钱不是继续投的充分理由，但停建对网络连续性、BaaS 与用户承诺的影响属于未来成本。

      同样预算也可以投入整车价格、研发或渠道。我暂保关键换电投入，是因为它与既有车型和服务绑定，但需要与这些替代方案按新增成本、潜在用户价值和风险比较，材料不足以算出可靠回本期。每季度检查同类站日单量、站点成本、合作车型实际接入和服务体验，并比较快充的实际等待体验。若合作接入和利用率按事先约定目标改善、服务稳定，可适度恢复重点自建；若长期不达标或快充使时间优势明显缩小，就进一步收紧新增投资、与合作方调整网络。阈值需基于真实预算和站点数据确定。
