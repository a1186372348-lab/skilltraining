  - id: Q30-reference-1
    text: 我建议免费展示易理解的基础睡眠记录及其局限，把跨月汇总、较详细趋势解释作为候选付费内容；这是题目的设计提案，不声称当年或现在已经如此划分。偶尔查看者可以先了解记录，持续佩戴并希望观察变化的人再决定是否为深入分析付费。与把更多解释都放进 Premium 相比，我选择免费开放基础解释，接受付费差异变小、部分用户可能不再升级的代价；基础记录是否形成长期价值仍需观察。现有月度画像要求兼容设备及每月至少佩戴 14 晚，这不是所有拟议付费分析的共同规则。一个近期指标是：在新划分可用后四周，具备相应设备的用户中主动查看过基础解释的人数比例；与上线前可比人群的基线相比，比例上升可支持基础解释被更多人使用的有限判断，不能单独证明付费价值、因果效果或健康改善。如果将来评价月度画像本身，应覆盖用户实际能够生成、看到并使用画像的完整周期。需要避免把动物类别或设备记录误解为疾病诊断。
