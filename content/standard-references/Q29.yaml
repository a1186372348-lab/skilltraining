  - id: Q29-reference-1
    text: 我会先比较完成购票后的进站环节：在同一车站和相近时段，从乘客到达闸机队列末尾开始计时，到成功通过闸机结束，按乘客记录并报告中位数、较慢乘客的耗时及样本数；同时单列未通过、换其他票和未完成的比例。可在自愿且具备两种方案使用条件的乘客中按人随机提供 Google Pay 手机碰闸票或替代二维码电子票的指引，观察一周并按站点、繁忙程度分层；这是一种拟议做法，不是已发生的试验；按最初随机分配的指引组统计，并另外记录实际使用方式及中途换票，避免只比较最后成功使用的人。还要检查购票和保存所需时间，避免把麻烦转移到进站之前。若 Google Pay 手机碰闸经常失败，应核查兼容设备和票证；若替代二维码电子票扫码失败，则应核查二维码与扫码设备，分别调整提示并保留其他可用购票方式；设备不兼容或电量不足的人不应被迫使用。手机票可能让有兼容设备的乘客少找纸票，但运营和客服也有成本。公告没有耗时对照数据，目前不能断言实际节省了多少时间。 若进站耗时下降，但失败、换票或购票保存时间明显增加，我不会判断端到端已经省时；只有相对可比方式的改善没有被这些负担抵消，才支持限定人群中的便利。按指引分组得到的是该推广安排的效果；实际使用方式不同，解释还需保留。
