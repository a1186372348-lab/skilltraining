  - id: Q38-reference-1
    text: |
      先在受控测试中使用自建站点 A、B 和嵌入的第三方，比较隔离前后第三方能否用同一 Cookie 关联两个站点，同时检查第一方登录状态是否仍可维持。验证对象是 Cookie 通道，不能由此推断指纹等其他追踪已被阻断。

      用同意参与的用户或合成账号，在覆盖不同网站类型和浏览环境的小范围中比较登录、加购与结账等任务完成率、失败步骤和恢复时间。以尝试该任务的次数为分母；网站自身变更、网络及账号差异需控制或单独记录。记录汇总结果和必要错误类型，不上传 Cookie 值、完整浏览历史或账户内容。

      分阶段放量并预先约定兼容失败和隐私测试失败的停止边界。出现第三方登录问题时先复现，若确认符合授权例外条件，再限制在必要站点和必要时间；重大故障先回退并持续监控，不为了单个网站关闭所有保护。只有隐私测试持续通过且关键任务未出现不可接受的损失，才扩大样本。
