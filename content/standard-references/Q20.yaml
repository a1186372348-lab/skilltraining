    text: 我优先定义的问题是：首次使用补助支付的用户需要在下单前知道购物车中哪些部分可用 EBT、哪些费用仍需其他支付方式，才能决定是否继续。它不同于商户不参与 SNAP 或 EBT 卡无法添加，这些情况要分开诊断。按本题采用的 Instacart 帮助页，使用 EBT 卡前还需向账户添加信用卡或借记卡，用于承担不符合 EBT 条件的商品及有关费用；哪些费用可用补助支付仍按相应规则判断。如果用户没有可用卡，应说明现有流程限制并提供求助路径，不能暗示调整购物车就能绕过要求。我会在购物车及结账确认前说明支付分配、需要另付的费用和修改支付方式的路径。先用小样本任务测试检查用户能否准确解释最终支付，而不是凭一次点击或满意度断言问题解决；如有条件再观察不同商户和购物车情境下的中断。若原因主要是卡片或商户不支持，就应调整优先级。现有帮助页只说明规则，没有证据证明某个障碍最常见。
