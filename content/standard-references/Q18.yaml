question_id: Q18
references:
  - id: Q18-reference-1
    text: 假定此应用拟将应用内相关活动与其他公司的应用或网站数据关联，用于广告个性化和效果衡量，且核心功能不依赖此类追踪。启动时请求可能覆盖更多用户，但用户未必理解用途；在相关场景请求更容易结合用途解释，却可能让未进入该场景的人一直不授权。我暂选相关场景请求，接受部分可用信号减少的可能。拟议用途说明：「如你允许，我们会将你在本应用中的相关活动与其他公司的应用或网站中的数据关联，用于广告个性化和效果衡量。你可以拒绝，并继续使用不依赖这类追踪的核心功能。」实际用途必须与应用数据流一致，并填写系统要求的用途说明；这段拟议文字不能替代系统授权界面。拒绝后按规则停止相关追踪。用户获得更清楚的选择，但是否真正理解仍需测试；开发者与广告相关方可能失去部分个性化信号，也可能需要改造，实际影响不能从规则公告推算。我会与研发核对用途和数据流，用可理解性测试检查用户能否复述选择，并观察授权、核心任务完成和投诉。授权率本身不能证明用户理解；如果说明误导用户，应先修正体验。
