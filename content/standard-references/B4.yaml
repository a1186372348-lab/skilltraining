    text: |-
      50 万次下载支持的判断是：这份出境购物资料引起了不少人的获取兴趣。下载发生在使用之前，不能据此断言多少人读完、带到现场使用、解决了问题，也不能证明攻略内容可信或某种产品形态已经成功。

      我会把问题界定为：有出境购物计划的人，在出发前需要结构清楚且可信的购物信息；到了现场，还可能遇到价格、库存或营业时间变化以及个人问题。静态攻略难以及时更新或回答这些问题，实际可用的信息与用户在决策时点希望获得可靠、较新且可追问的信息之间有差距。本次处理信息供给，包括价格信息的获取；商品如何定价、供货、履约或实际办理退税不在本次承诺内。

      我倾向先小范围试「更新攻略＋编辑答疑」：沿用团队已有的内容生产能力，在易变化的信息旁标更新时间，并设置提问入口。它能保留结构化内容，但编辑能否跟上更新和回答量尚未知晓。另一种是让用户互助分享，可能覆盖更多具体问题，却依赖用户愿意持续提供准确内容，也有冷启动和质量风险；如果编辑能及时覆盖主要问题，未必需要急于转社区，反之可试受控互助，但须核验回答。

      先回访不同来源的下载者，询问是否阅读、何时使用、遇到什么断点以及原本怎样解决；再观察小范围答疑的有效回答率、更新耗时和用户反馈。若多数人并未读到关键内容，应先查可发现性与内容质量；若问题集中在变化快的现场信息且答疑及时有效，再扩大试点。用户是否愿意贡献和维护答案也要实测。现有材料没有给出上述比例，因此现在只能选择一个待验证的方向，不能宣布已解决需求。
