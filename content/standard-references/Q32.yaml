    text: |
      我会在监护人设置的主机级总时长上限基础上，设计个人使用规则。首次设置时由监护人配置两名孩子的身份、各自时长和可申请的例外；较小的孩子看到简明图示，较大的孩子看到剩余时间、到时行为及申请方式，监护人可查看和调整规则、撤销例外。这是拟议的新体验，不声称任天堂已有逐人时限。

      到时前预告，到时按预先选择的提醒或暂停方式处理；仅提醒不会强制阻止继续玩，需要强制执行时须选择暂停。孩子可提出有期限的延期请求，由监护人批准或拒绝。为避免在两个已配置孩子身份之间直接切换绕过规则，我会要求每次切到另一成员身份时由监护人在主机上作保护确认，成人及未配置身份也不能免确认进入；已用时间按原身份累计，切换不重置。这个方案会增加等待，也不能保证识别实际是谁在操作。

      多人同玩时先由监护人确认参与身份，分别计入参与孩子的时间；无法可靠确认时按事先约定的主机级上限处理，不假装知道每个孩子的身份。离线或监护人没有手机时，拟允许监护人在主机本地确认；若本地确认不可用则沿用主机级上限。发生误拒时，监护人可在主机上核实并给一次限时例外，且不清零已用时间；不在场时说明限制原因和待监护人确认的求助路径。

      这比全机同一规则更灵活，但频繁确认会减少孩子自主性，也可能误拒。只记录执行规则所需信息，不默认增加活动监控。与家庭测试两个已配置身份互切、多人游戏、离线、本地误拒恢复和延期请求，观察规则理解、误拒和家长负担；若确认负担过高，就与家庭调整授权方式及主机上限，而不宣称可以完全防止冒用身份。
