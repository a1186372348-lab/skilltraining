    text: |-
      给顾客的文案：
      「出发前，请先确认你的 IKEA Family 会员资格、参与门店和家具是否在回购范围内，再完成线上估价。家具需按规定清洁、完整组装且功能正常。线上金额只是估价，最终是否接受及金额由门店检查确定。请按估价通知的有效期带家具和估价信息到店；接受最终报价后，你获得的是 IKEA 退款卡，可用于 IKEA 购物，不是现金。家具或资格不确定时，先联系门店确认。」

      排序与验证：先说资格和门店，帮助用户在搬运前排除明显不适用的情况；再区分估价与最终结果，并讲清退款卡，以免形成现金或必定回购的预期。现行帮助页写明估价后 30 天内到店，具体仍应按确认信息和当时条款核实。验证时让首次使用者复述是否一定收购、何时确认价格及拿到什么，观察误解；点击人数本身不能证明理解。
