    text: |
      馆内说明可写：“打开‘首都图书馆’微信小程序，登录并绑定读者卡。选择符合外借条件的图书，按馆内指引扫描图书标识。请确认本次借阅已经登记成功；未能确认，或绑定、扫码遇到问题时，请向馆员求助。”

      在可外借书架附近放简短步骤，读者选书后就能看到指引。成功状态的名称、显示位置、可核对的信息及扫码标识，均须上线前与馆方确认。建议成功反馈让读者能核对图书和本次借阅状态；核实前不把该界面当成已上线事实。人工协助作为未成功或无法确认时的路径，不默认所有人都要到服务台核验。目前资料只说明计划中的基本路径，不能保证服务已按时开放。

      可选的后续研究是邀请读者按指引尝试，观察能否识别扫码对象及确认结果，再根据观察修改说明；这不是本题的必答任务。
