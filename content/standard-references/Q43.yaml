    text: |
      一类是假设中的高频比价者：购买较贵商品后会反复查看价格，想知道能否少做几次手动申请；另一类是忙于工作或不熟悉售后入口的人：不一定主动比价，但希望符合条件时不要错过差额。前者可能更关心监控的价格和计算方式，后者可能更关心是否已生效以及结果如何收到。这些只是研究假设，不能代表人群比例。

      我会招募近期购买带标商品、做过和没做过手动价保的消费者，围绕一次真实或模拟订单询问购买后如何关注价格，再请其找到资格、期限和补差记录，观察是否理解款项、京券或京豆等不同返还方式。不要先问“自动价保是不是更好”，以免诱导。

      未带标商品、超期或不符合具体降价规则的订单不应被承诺自动退差；对适用订单优先清楚说明生效范围与进度，允许用户查规则和求助。这样可能增加一部分界面文字，却能减少把所有降价都理解为现金退款的误期望；复购或满意度是否提升仍需另行验证。
