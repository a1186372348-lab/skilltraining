  - id: Q22-reference-1
    text: 我会在开启前用简短文字说明 2018 年拦截针对 Monzo 卡向赌博商户的交易，系统依据商户代码尽力识别；如果商户未被识别，交易可能仍会通过，也不能承诺覆盖现金、其他账户或全部支付方式，并让用户主动确认开启。开启后显示状态和如何求助，不在普通账单界面暴露额外敏感描述。若一笔付款被误拦，提供联系支持团队和核实交易的路径，客服只收集处理所需的信息。2018 年公告中的关闭机制是先联系支持团队，再等待 48 小时，之后由用户在 app 中自行关闭；我会在这条既有机制上设计清晰的申请入口及状态说明，让用户知道每一步和可求助方式，而不是把入口藏起来或用羞辱语言阻止用户。便利与保护之间没有零成本方案：太容易退出可能削弱自愿设置的边界，太难退出或误拦又可能影响正当使用。应与有相关经验的用户及支持人员测试范围理解、误拦求助、隐私感受和关闭流程是否可预期，同时监控投诉与处理时间。拦截次数不能证明伤害减少；必要时应指向其他支持资源，但不能把银行功能说成治疗。
