    text: |
      我会先让玩家选择当前方便使用的输入方式与是否需要协助，而不是根据诊断名称推断能力。引导应允许键盘、可用开关或他人协助等路径；提供清晰文字与语音等替代形式，具体可行性需要先做无障碍测试。

      设置时逐个识别已接入的输入，允许玩家为关键游戏动作选择映射，并通过短暂、可重复的测试显示输入是否被识别。无法触发时保留已完成步骤、提供替代动作和求助入口；进入游戏前可试操作，之后仍能返回修改。协助者只在玩家授权下操作，界面不强制收集诊断信息。

      首先做连接、映射和试操作的低保真原型，邀请动作能力、外设与协助需求不同的玩家完成同一组任务；记录独立完成或主动求助情况、卡住位置和能否重试，并征求其对疲劳与控制感的反馈。先保障这一条主路径，再考虑复杂预设和更广泛的兼容设备。样本不能代表所有人，具体硬件适配和成本须另行核验，不能保证所有游戏或玩家都可直接使用。
