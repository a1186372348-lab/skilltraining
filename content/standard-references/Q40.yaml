  - id: Q40-reference-1
    text: |
      我会把学校设为一个社区，校方指定的管理员负责全校公告和审核纳入哪些群；班级或活动各有独立讨论群，由相应管理员管理。家长加入社区后，能看到公告和可申请加入的相关群，加入具体群后才参与讨论；退出某个讨论群不必退出整个社区。成员可见范围和加入审批必须在试点中与学校、家长共同确认。

      首次说明可写：“这里是学校社区。校方会在公告区发布全校消息；选择孩子所在班级或感兴趣的活动群参与讨论。你可以退出不再需要的讨论群；如需退出整个社区，请先查看退出范围并确认。”这是拟议文案，具体设置和界面须核实。我的拟议规则是，退出整个社区前说明将失去哪些公告和社区内群的访问，并请用户确认；独立于社区的其他群不受此操作影响。实际界面要区分退出讨论群和退出社区。重要校务不应只依赖家长留在应用内，学校还需明确其他必要通知渠道。

      用校方和不同年级家长试做发布公告、查找班群、申请加入和退出，观察是否误认为所有讨论对全校可见、是否遗漏重要公告以及通知是否过量。按结果调整默认通知和权限，不声称这些提案在 2022 年已经实现，也不把后续版本当作成功证据。
