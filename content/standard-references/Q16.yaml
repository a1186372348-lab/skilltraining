  - id: Q16-reference-1
    text: 我选择计划开车去郊外、出发前有 Wi-Fi 的用户。出发前，在路线确认附近提供是否保存沿途可用地图的选择，说明下载所需空间、覆盖区域和完成状态；不要默认所有人愿意用移动流量。下载失败时显示原因和重试入口，没完成时明确提示离线可用范围尚不确定。断网后，若当前位置和路线仍在已保存区域，清楚标识正在使用离线地图，继续提供当时公告支持的驾车导航与地点搜索，同时告知实时交通等在线信息可能不可用。离线状态显示地图保存或更新时间；若已知数据可能过期，就提醒地点信息和道路状况可能变化，不能把过期数据展示成实时信息。路线超出保存范围或数据不可用时，应明确限制；可提示在安全地点停车后，尝试联网、查看其他可用路线信息或寻求当地帮助。恢复网络后说明已切回在线，必要时提供更新地图的选择。临时断网且未提前下载地图的人无法靠此方案立刻获得完整区域，应明确限制而非承诺解决。可通过弱网任务测试观察用户是否理解下载、离线状态和限制。
