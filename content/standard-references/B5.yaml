  - id: B5-reference-1
    text: "我把核心用户定义为在平台上反复完成具体生活决策、并对经验内容供给或消费产生持续价值的人，而不是简单等同于人数最多的年龄或性别群体。这是一种价值贡献口径；如果以新增人数为口径，答案可能不同。\r\n\r\n典型用户在旅行、购买或装修前带着问题来：先搜索攻略或测评，再比较多篇普通人的使用经验，最后形成自己的选择。搜索阶段需要定位适用场景，比较阶段需要可信的细节、代价和反例，决定阶段需要把经验与自身约束匹配。平台图文笔记与普通用户经验便于查找和比较，社区互动可能补充细节，因此我初步优先这一决策型群体；题设所述搜索行为和 UGC 供给支持它值得研究，但不能证明其比浏览群体贡献更高，这一比较仍需分群验证。\r\n\r\n另一类用户在通勤或睡前浏览兴趣内容，目标是消遣和发现同好，也贡献流量，但与决策前查证的目的不同。搜索使用等题设给出的平台总体数据可支持搜索值得重视，不能直接证明某个人群的留存、商业贡献或替代性。\r\n\r\n我暂将平台的核心价值判断为降低生活决策的信息搜寻成本；广告与真实经验的平衡是条件而非已证因果。要检验，应按使用目的分群追踪任务完成、回访和商业转化，并核对样本代表性；如果浏览人群长期贡献更高或搜索决策者难以持续回访，我会调整核心用户定义和价值判断。"
