  - id: Q37-reference-1
    text: |
      我会让发起者在首次使用时明确选择新会话默认保留或自动消失，而不是未经说明地替所有人选一个短期限。用户尚未选择时，暂时默认保留新会话历史，并明确告知这一规则与设置入口；这是偏向避免不可逆信息丢失的暂定选择，在缺少研究数据时需要验证，而非唯一正确答案。

      对不需要长期保存的日常对话，自动清理可以减少到期后留在设备上的历史，降低设备丢失或被他人接触时旧消息暴露的风险；若双方日后需要查询约定，保留历史则可能更有价值。这种保护取决于消息已到期并从设备清除，不能阻止接收者事先另存或拍照，也不能保证信息绝不泄露。

      创建会话时双方都看到当前计时和影响，允许在会话内调整，并让变更对双方可见。双方想法不同时，在达成一致前不悄悄修改既有计时；发送前让双方看见将采用的规则，新会话可先请求确认保留方式。仍不同意时可暂缓发送需要特殊保留条件的内容，或另选双方接受的沟通方式。这是有交流摩擦的设计提案，不是 Signal 的历史规则；其他能让双方知情的自洽方案也可以。消息到期不可恢复的边界应在设置前说明；也要提醒接收者可以另行留存，计时并不提供绝对保密。

      用模拟对话观察双方能否解释何时消失、知道怎样改变设置及理解另一方仍可保存；统计经同意的设置理解、修改和误操作信号，而不收集消息内容。若大量参与者意外丢失必要信息，应改善提示或重新考虑默认；若无明确选择导致需要自动清理的人长期忽略设置，也要调整引导。
