    text: |-
      我会把问题定位为：午高峰出餐、路况与交付的不确定性，可能同时造成用户预期不准和骑手被不可控延误考核。用户不愿承担「主动多等」的责任，不能据此推断他们接受任意时长；骑手的收入又受时效和单量影响。试点只在一个城市的午高峰进行，不增骑手、不延长工时，不以大额补贴或让用户主动多等换取效果。

      先用已有订单数据核对各环节耗时与异常：对商家出餐慢、交付困难小区和恶劣天气分别估算合理时间，调整派单与展示的预计送达时间；餐前页面给出可信预期，出餐、取餐与配送进度如实更新，不能靠普遍拉长承诺时间制造准时。和商家约定及时反馈备餐状态，核实持续出餐延误的原因并协商改善。对有证据的等餐、临时交通限制等不可控延误设例外处理和申诉通道，核实后不将其简单算作骑手责任；考核兼顾安全与实际可完成的工作量。难以核实的情况先人工复核，避免自动免责或误罚。

      在条件相近的片区或时段分批试行并保留对照，尽量平衡商家、距离和天气差异；记录骑手跨区流动等干扰。用户侧同时看预计与实际送达误差、真实等待时长、超时投诉和取消率；骑手侧看单位工作时长收入、超时及有效申诉、安全事件；商家侧看备餐耗时及异常比例。只看超时率可能因承诺时间变长而虚假改善，因此要连同真实等待与订单完成情况判断。

      先短期观察数据质量和异常申诉，再按事先商定的体验、安全、收入和成本底线决定扩大、调整或叫停：若安全或收入明显变差，或预计虽更准但实际等待明显增加且用户体验下降，就暂停并查原因；只有多方指标相对于对照稳定改善，才考虑扩大。具体阈值须根据试点前基线与团队目标商定，案例并未提供。
