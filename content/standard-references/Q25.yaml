  - id: Q25-reference-1
    text: 我会把过程分为已识别漏洞、是否有可用补丁、是否生成更新请求、团队是否完成评审测试、合并后是否确认问题解除。不同阶段可能受不同限制：没有补丁不能靠催促合并解决；工具或权限错误需要诊断；请求存在但测试失败可能是兼容性问题；即使一切正常，团队也可能需要依据严重性和资源排序。这些都是假设，当前文档只能证明某些机制和错误可能存在，不能证明它们在某团队中最常见。先按漏洞严重性、是否有补丁和仓库类型统计每阶段数量与处理时间，再抽样查看失败原因并访谈维护者。若最集中的是生成失败，我会在提醒旁展示可理解的失败原因和帮助入口，而不是默认自动合并；对高风险更新仍保留评审和测试。验证可比较相近仓库或分阶段上线前后的可处理提醒、请求生成和最终解决比例，并监控误报、测试失败与敏感信息暴露。若瓶颈主要是补丁不存在，界面提示不会解决根本问题，应调整优先级。例如将某周新出现的合资格安全提醒按仓库、漏洞、受影响依赖及版本去重，保留不同版本或处理状态，每条提醒观察 30 天：分别报告有可用补丁、生成更新请求、完成评审和最终确认解决的数量及其占全部提醒的比例；对仍未完成的提醒明确列出未完成状态。按补丁可用性、严重性和仓库规模分层，再比较相似仓库或按仓库分配改动，避免同一仓库互相污染。30 天与去重规则是拟议口径，不能误当成 GitHub 的既定标准。
