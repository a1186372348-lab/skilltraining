  - id: Q24-reference-1
    text: 我会先观察一张卡片进入完成列表后，谁负责改到期状态、加标签和通知，分别记录动作次数、耗时和是否存在需要人工判断的例外。负担可能来自重复录入，也可能来自团队对完成标准不一致；如果后者更突出，先自动执行反而会把错误状态扩散。最小尝试可以只在明确的卡片类型上，移动到完成列表后更新到期状态，并保留人员核对；通知和标签暂不一并自动化。应让成员知道规则何时触发，并通过可用的日志或测试记录发现失败和误触发。比较改动前后同类卡片的维护时间、误更新和返工，同时记录人工例外，而不是把自动执行次数当成效率。若团队发现需要逐张判断，或异常处理耗时抵消收益，就应缩小适用范围。材料提供的是功能例子，没有证据表明这个假设团队已发生延误，也不能据此量化节省。
