    text: 诚实地说：仅凭案例内证据，无法在两种主要解释之间做出区分。解释一「主动挤水分」：与投放收缩和 MAU 下滑的时间同步性吻合，公司口径前后一致；但它无法自证「高活跃用户在增加」——没有分圈层数据支撑。解释二「基本盘受损」：有「水化」抱怨、创作者流失记录、分发机制变化等间接证据，能解释水分的来源，但同样没有直接数据证明流失的近 3000 万里包含多少核心用户。两个解释都能解释 MAU 曲线，分歧点在曲线内部结构，而这恰恰是黑箱。所以我的结论是条件式的：若高活跃用户留存与时长企稳，会增强主动优化解释；若同步恶化，会增强基本盘受损解释，但两者均不能单独排除其他原因或确定主因。当前最需要补的证据：按渠道与注册月份拆新客获取、按同期群追踪老客留存，并比较高活跃用户占比和时长、创作者月活跃产出；对照不同投放强度时期及可比群体，控制季节和口径变化后再评估替代解释。在证据到手前，「暂时无法确定主因」本身就是最合理的判断，强行二选一是对证据的不诚实。
