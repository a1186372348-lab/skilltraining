    text: |
      先限定 2021 年公告所述加拿大鉴定服务计划：计划初期针对部分品牌和款式的全新球鞋，更多品牌与二手鞋是后续扩展计划，价格门槛的币种还需核实。把信任拆为用户信心、真伪或描述争议、交易完成三件事，不能用满意度替代鉴定准确性。

      例如对计划上线后一周接触合资格商品的买家发自愿问卷，分别报告对检查表示信任的人数除以有效答卷人数，以及有效答卷人数占受邀人数的比例；未回复者可能不同，不能当作全体信心。另以一周内付款成功的合资格订单为队列，每单观察付款后 30 天：确认收货订单数除以该队列订单数，作为履约完成比例。对该队列已收货订单再各自观察收货后 30 天，报告提出真伪或描述争议的订单数除以已收货订单数，每单只计一次；另记未完成订单与支付前流失。这些均是拟议口径，不是 eBay 已公布指标。

      比较品牌、价格、卖家和时间相近的合资格交易与合理对照，若分阶段推出则检查共同趋势；自选择和商品构成仍可能影响归因。对通过和未通过的样本按预设规则独立复核，并处理买卖双方申诉；复核可估计潜在漏判和误判，但也不是绝对真值。同步监控成交到收货时间、鉴定及物流成本、卖家退出和争议处理时长；若误判或延迟超过事先约定的底线就暂停并改进。2020 年销量增长早于该计划，不能证明服务有效。
