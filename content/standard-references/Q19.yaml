  - id: Q19-reference-1
    text: 对于目的地未定、想找周末灵感的人，按树屋或独特位置探索可能帮助发现原本不会搜索的房源；对于已经确定城市和日期、只想找交通方便住处的人，目的地搜索可能更直接。同一个人也可能先探索，再用日期与预算筛选。价值不只看类别点击，还应看用户能否找到在其日期、价格和位置约束下可考虑的房源，以及是否愿意保存或继续比较；另一方面，分类可能增加不相关结果和筛选成本。房东获得曝光是否转化为合适订单也需要单独观察。可以对相似用户随机提供不同的起始入口，跟踪有效房源查看、保存、后续预订及搜索中断，同时按季节、目的地和房源可用性分层；如不能随机，只能作相关性观察。若点击增加但合适房源的后续行动没有改善，或用户更难回到明确目的地搜索，我不会仅凭点击判断成功。公司后续欧洲分析可启发问题，但不能直接证明本次变化由 Categories 引起。例如以被随机分配入口的合资格用户为分母，统计其中 14 天内至少保存一个符合所填日期、预算及位置条件且仍有空房的房源的人数，每人计一次；另看预订与中断，承认用户未填写条件和房源状态变化会影响口径。这是待验证设计而非平台既有统计。
