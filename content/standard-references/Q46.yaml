    text: |
      在首次启用入口旁可写：“开启后，PDF 内容会尝试按手机屏幕重新排列。你可以调整文字大小和间距；复杂页面可能无法准确呈现，请对照原文件核查。”读者在启用前就能看到变化与边界，适合在作选择时提醒，不保证所有文件都能正确处理。

      发现重排异常时，读者应对照原始页面；具体怎样返回、按钮名称及当前文档是否支持该模式，需按实际版本确认，不能仅凭发布说明编造。涉及表格、图片或重要数据时尤其应提醒读者核对。

      可选的后续研究是让几位手机阅读者分别打开简单文本和复杂表格，观察是否误以为原始文件被修改或所有内容一定准确，再改进容易误解的提示；这不是本题的必答任务。不能把公司的产品宣传当成普遍效率提升证据。
