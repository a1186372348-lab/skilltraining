  - id: Q15-reference-1
    text: 我先把要解释的现象限定为原本有应用内练习的用户连续七天没有完成任何 Duolingo 课程；打开产品、完成课程和连续记录是否增加应分别记录。应用内不活跃不能证明用户停止了其他方式的语言学习。官方文章发现过去须达到每日目标才延续记录，因此有人连续使用却未保持记录，这支持先排查记录口径是否制造了表面中断。官方报告的 A/B 结果为规则调整影响该实验中的连续记录和留存提供了证据，但不能据此确定全部中断的主因，也不等于证明语言学习成效。对确实没有完成课程的人，我提出两种可能且可并存的解释：一是工作或生活安排变化，使用户暂时难以腾出练习时间；二是课程难度或反馈不合适，使用户在某些学习环节受挫后离开。材料没有给出这两种原因的占比，上述规则实验也不能区分它们，两者仍是假设。若用户此前练习时间随日程波动，中断后又在空闲时回来，并在访谈中提到时间受限，会更支持第一种解释；若用户常在特定课程环节开始后退出，且访谈或任务观察反复出现理解困难，会更支持第二种解释。日志与受访者回忆都有偏差，不能单凭一种信号认定原因。我会先核查课程完成事件是否丢失，再优先调查课程体验：退出节点可帮助定位可改进环节，这只是按可行动性排序，并非断定它贡献最大。若访谈和观察指向某个难点，再为该环节提供可选解释，与现有体验做小范围随机比较；以分配到各组的用户为分母，观察七天内至少完成一节课的比例、目标课程完成情况和负面反馈。若未改善或负面反馈增加，不应推广，应继续调查时间等其他原因。七天和试验范围只是拟议口径，课程入口内的比较也不能代表所有已流失用户。
