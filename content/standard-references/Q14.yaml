  - id: Q14-reference-1
    text: 我会把 2022 年美国公告档位作为待测起点，与广告更少、月费相应更高的方案比较。前者可能降低进入门槛，但用户需要让出更多注意力；后者保护观看连续性，却可能失去最价格敏感的一部分用户。我暂选公告档位，前提是用户选择前理解广告中断和内容限制，并保留无广告选择；广告销售能力、授权和技术可行性需要核实。广告主可能获得触达机会，但实际展示和续投仍待验证。净影响应比较新增订阅带来的贡献、原用户降档造成的贡献变化、广告收入，以及新增销售、服务和技术等成本，不能把新增人数直接当作净收益。可以在可行范围内对新访客和已有订阅者分别随机分配不同档位方案，以 28 天内开始付费的人数除以该组分配的新访客人数，另以同期从无广告降档的人数除以该组分配的现有订阅者人数，并观察观看中断、投诉和广告有效展示。28 天只是拟议窗口，不是已知基准；若体验护栏越线，应减少广告或调整展示。Nielsen 的电视观看份额是市场背景，不能证明广告档有增量；材料也没有足够成本和迁移数据，不能先行承诺净收益或最优广告时长。
