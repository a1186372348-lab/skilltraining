    text: 我会把目标限定为：听众接触到此前可能不熟悉、并愿意主动再次选择的音乐。与用户自己在熟悉的歌单或朋友推荐中找歌相比，每周送来陌生候选可能减少主动搜寻的时间；但若用户更重视自己挑选，或推荐不合口味，价值可能有限并带来跳过的成本。材料没有提供这些方式的比较结果或节省时间的数据，这只是条件式判断。以下实验只判断新推荐策略相对旧策略是否增加这类发现；若要判断整个歌单相对其他找歌方式的增量价值，仍需另设比较，当前不作该因果结论。作为待验证的设计选择，以周一进入实验的合资格用户为单位随机分配新旧推荐策略；对每个用户，把分配前 90 天内未在 Spotify 收听过的推荐曲目暂作「可能陌生」。一个示例主指标是：分母为该周随机分配到某组的全部合资格用户；分子为其中在七天歌单周期内对至少一首可能陌生的歌收听至少 30 秒，且从首次收听起七天内主动收藏或再次播放该曲目的用户数，每人最多计一次。这些窗口和 30 秒只是事先约定的候选口径，不是 Spotify 公布的标准，也不是唯一合理答案。平台外曾听过、90 天前听过的歌曲会被误判为陌生；用户也可能从其他入口再次遇到歌曲，因此应补充问卷或入口归因作敏感性分析。比较以随机分配的全部用户为分母，避免只挑点击歌单的人造成选择偏差；如有条件，可观察不同收听情境。累计播放超过千亿次只说明使用规模。还应同时监控跳过、投诉和整体听歌体验；若主指标改善但负反馈明显恶化，可降低推荐激进程度。若不能随机，分层观察只能提供相关性线索。具体决策阈值应依据试验前基线和团队目标商定，材料未给出。
