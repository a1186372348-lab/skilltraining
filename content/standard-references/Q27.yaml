question_id: Q27
references:
  - id: Q27-reference-1
    text: 我建议把进入指定课程付款页面且符合实验纳入条件的学习者按用户随机分配到旧版或新版入口；实验纳入不等于已经通过财务资格审核。主要指标可暂定为分组后 30 天内获得批准并至少开始一次课程学习的用户数，除以该组所有纳入用户数，每人只计一次。这是待验证设计选择，不是 Coursera 已有标准；另看 14 天内提交申请比例、申请到批准耗时和课程持续参与。拆开看到入口、开始和完成申请、审核与开始学习各步：若看到的人增加但提交比例不变，可能是申请负担或条件理解障碍；若提交增加而批准耗时变长，应排查审核能力。比较时按课程和进入时间观察，检查重复访问、跨设备和其他入口污染。访谈不同语言、时间与经济约束的自愿参与者，只收必要信息、避免暴露财务材料。公司报告人数翻倍值得研究，但无可比人群分母不能判断增量，更不能证明长期学习效果；若批准后实际参与没有改善或申请误解上升，我会调整入口说明或申请流程。 这个指标只覆盖进入指定付款页并被纳入试验的人，衡量获资助及开始参与的近端变化；它不能代表尚未到达付款页的人，也不能仅凭一次开始学习证明资助解决了经济障碍或改善长期结果。可在自愿、最少收集信息的前提下了解费用是否曾阻碍目标，并结合获资助后能否使用目标课程的相应权益判断；资格审核不能当作需求测量的绝对真值。
