  - id: Q28-reference-1
    text: 给读者：『我们正在更新桌面阅读界面，希望让查找与浏览文章更容易。新版目录提供文章结构和跳转入口；具体显示可能因站点与登录状态不同，请查看站点说明并告诉我们哪些操作难找。』给编辑者：『这次更新希望让编辑者更容易找到常用工具，也会影响熟悉的桌面导航，登录用户滚动时会看到公告所述固定页头。请在自己参与的站点查看部署说明；遇到编辑工作受阻，可在项目反馈页面描述步骤和页面环境。』两段都说目标而不保证每个人更快，也不假定所有站点提供相同回退选项。安排上，在各受影响站点公告和帮助页提供前后操作示例，面向读者与编辑者分别征集反馈，由项目团队在上线首周每日归类可复现问题并公开处理状态。观察常见任务完成情况和反馈中可复现的问题，若某类人找不到关键入口，先补说明或修复对应障碍；是否进一步改界面要结合站点、样本与实际证据决定。
