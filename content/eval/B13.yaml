    换电对蔚来的价值要分三层看。收益侧：其一，3 分钟换电是当前唯一接近加油的补能体验，构成高端品牌叙事与用户口碑的地基，直接支撑定价；其二，BaaS 车电分离把购车门槛立减 7 万，把一次性电池成本变成持续的服务收入，电池资产还具备灵活升级与储能调峰的延展性；其三，三千多座站的网络规模与县县通、高速干线布局是竞品短期无法复制的先发资产。代价侧：显性代价是超 50 亿的建站投入与持续运营亏损——三代站日均 60 单才盈亏平衡、2023 年报道时仅约两成站点达标，说明利用率是最大软肋；隐性代价是机会成本与用户契约的让步：2023 年降价 3 万、免费换电退出基础权益，本质是把权益货币化来缓解财务压力，而连年两百亿级亏损挤占的是研发与渠道投入。风险侧：一是 800V 快充把补能时间差从「质变」压成「几分钟的量变」，换电的体验溢价随时间衰减；二是标准之争，若快充成为行业主流，重资产网络可能沦为沉没资产；三是开放合作的双刃剑——引入长安、吉利、宁德时代能分摊成本、做大标准胜算，但也稀释排他性，网络未来未必为蔚来独享。我的判断标准有三条：单站日单量曲线能否从少数达标走向多数达标、合作车企车型的实际接入量、换电对销量与留存的可归因贡献。三者持续向好，就值得继续加注；若单站经济模型长期跑不通、快充体验追平，则应从「自建护城河」降级为「合作共建的基础设施」，收缩资本开支、用合作保住服务体验即可。
