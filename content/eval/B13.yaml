  - text: |
      我的立场：继续加注，但重排节奏——自建集中投向利用率达标的高速干线与核心城市，低密度县域覆盖交给与宁德时代、长安、吉利的共建网络承接。比较三条路：把这笔钱转去整车降价，2023 年降价 3 万的前例说明换来的是短期订单与权益争议，价格战没有终点；转投研发与渠道当然必要，但换电是蔚来高端叙事与 BaaS 模式的物理载体，收缩它等于同时改写产品定义与对老车主的承诺——2023 年免费换电退出基础权益已经引发过一次契约争议，直接收缩的信誉代价远高于账面节省；而维持原节奏全面自建，在三代站日均 60 单盈亏平衡、2023 年报道时仅约两成站点达标的现实下，是把利用率风险继续留给自己。我的判断依赖三个假设：单站成本沿一代约 300 万到四代约 150 万的曲线继续下降；合作车企车型接入带来增量单量；换电相对 800V 快充的体验溢价不会衰减到抹平差异。改判信号一一对应：达标站点比例一年内无实质提升、合作接入量不及预期、快充实测体验追平——任一成立，立场就降级为「以共建为主、自建止损」。案例给的数据只够支撑方向判断，算不出可靠的回本年限，我不假装算得出。
    quality: high
    note: "立场：有条件加注并重排节奏（自建聚焦达标区域与干线、县域交共建承接）；三条路线的收益/代价/风险比较均落到案例事实，明示三条假设与一一对应的改判信号，并声明财务数据只够方向判断——以判断结构取胜而非财务精确计算（复审修改项④）"
  - text: |
      先算一笔账：全网累计投入超 50 亿，目前日均 8.8 万次换电，假设每次换电毛利 20 元，一年毛利约 6.4 亿，回本要八年开外，这还不算公司一年 224 亿的整体亏损。再算机会成本：50 亿拿去做整车降价，每辆降 3 万够补贴 16 万辆车，接近 2024 年交付量的七成，销量翻倍不是难事。结论很清楚：换电是一门算不过来的生意，蔚来应该立即停止新建换电站，预算全部转投整车降价和渠道扩张，先把销量做上去才有资格谈护城河；宁德时代愿意投不超过 25 亿，正好让宁德接盘。李斌说换电是先发优势，那是站在自己立场上的说法，财报里的亏损才是事实。
    quality: medium
    note: "以精确计算包装单一结论：回本测算建立在自创假设（每单毛利 20 元）上却当作事实呈现；只算了收缩一边的账，不回应收缩对老车主承诺与高端定位的代价，无依据比较、无次要方向处理、无改判信号；把官方观点直接否定而非作为分析对象——财务精确计算不构成加分，取舍质量缺失不得高分（复审修改项④反例锚点）"
