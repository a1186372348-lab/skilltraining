# 仅供评测集使用（T28），不得泄露进题库运行时字段
question_id: B3
answers:
  - "表面看，2003 年的淘宝缺的是支付工具；实际上支付工具一直都在——银行汇款、邮局汇款都能用，只是没人敢用。真正的问题是：在没有任何信用背书、互不相识的买卖双方之间，「先付款」与「先发货」构成死结——买家怕钱货两空，卖家怕发货收不到钱，谁都不敢先动。这是一个信任问题，而不是支付问题。\n问题定义不同，产品形态完全不同。把问题定义为「支付问题」，解法是做一条更顺的付款通道：多接银行、优化支付成功率——这解决不了任何人「不敢」的问题。把问题定义为「信任问题」，解法则变成重构交易关系：引入一个双方都信得过的第三方，由它保管货款、担任仲裁，买家确认收货，钱才到卖家手里。担保交易因此诞生——支付宝的本质不是支付工具，而是信用中介。\n这个定义是可以被验证的：第一笔担保交易中，买家付款后立刻后悔申请退款，是客服承诺「出了问题我用工资赔你」才完成交易，说明卡点在信任而非工具；担保交易上线不到一年覆盖淘宝 70% 以上商品，说明定义击中了要害。\n由此得到的方法论是：当用户说「我要一个更好用的支付方式」时，要看他的行为而不是言辞——他不是不会付，是不敢付。问题定义的工作，就是从「用户要什么」下潜到「是什么在阻止他达成目的」。"
