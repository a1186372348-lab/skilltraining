# B4 标准参考答案 ｜ AI 起草，待人工评审修订（T33 / D31）
# 仅供评测集使用（T28），不得泄露进题库运行时字段
question_id: B4
answers:
  - "50 万次下载证明的是「需求存在」，而不是「问题被解决」——这是理解小红书这次转身的钥匙。\n用户真正要解决的问题，不是「拿到一份攻略」，而是「在出境购物的完整决策链路里，随时获得真实、最新、可追问的经验信息」：出发前要知道买什么、去哪买、怎么退税；到了现场，价格变了、断货了、想问一句「这个色号适合我吗」，都需要即时的、来自真实经验者的回答。攻略 PDF 是静态文档：生产慢、无法实时更新、无法互动追问——它覆盖的是决策链路的起点，覆盖不了链路本身。\n问题定义到这一层，产品形态就只剩下一条路：让信息持续生长的社区。编辑团队再扩编，也追不上全球商品与价格的变化速度；只有让去过的人、住在当地的人持续分享，信息才能「高频迭代」。种子用户自发上传韩日购物经验、互相讨论，正是这个答案的自然涌现——用户不只是信息消费者，也是生产者。\n事后看，这个定义被验证了：社区崛起，小红书长成 3 亿月活、「做决策前先搜一搜」的入口。但对当时的团队，真正有价值的判据是方法论：当一种形态已被下载量「证明成功」，仍要追问——它解决的是用户嘴上的需求，还是链路上的真实问题。"
