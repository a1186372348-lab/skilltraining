# Q09 标准参考答案 ｜ AI 起草，待人工评审修订（T33 / D31）
# 仅供评测集使用（T28），不得泄露进题库运行时字段
# 分层说明：4 份样本覆盖两种立场的高质量答案、结构有但口径与证据边界弱的中等样本、
# 流畅但复述现成结论的低分样本；高质量样本均不把单一解释当唯一事实（answers 条目格式：{text, quality, note}）
question_id: Q09
answers:
  - text: |
      我的定义：当前最值得解决的不是「9.9 要不要停」，而是补贴驱动的需求结构与单店盈利模型之间的失衡——9.9 常态化后，瑞幸无法区分需求里有多少是补贴买来的、多少是自然需求，定价与扩张决策都失去了基准。
      对象与场景：落在公司整体经营上，出现在每次定价与开店决策中；一季度 GAAP 净亏损 8320 万、自营同店 -20.3% 是这个失衡的读数，而不是问题本身。
      目标差距：当前是「有券就有量、无券不知量」，管理层无法回答 9.9 的增量利润为正还是负；期望是任一价格政策都能说清其增量需求与增量利润；差距是缺少一套按口径核算增量、按门店分组验证的机制。
      边界：本次只处理 9.9 政策的核算与验证，不承诺一并解决门店密度与竞争对峙——它们各自独立成立。
      依据：收缩后部分渠道改为限定款、部分渠道仅限新客，说明公司自己也在试探需求的补贴弹性；同店销售是收入口径，不能据此断言杯量下降，这恰恰支持「缺核算」的定义。
      反证：若内部数据显示无券订单占比稳定，且收缩门店同店显著好于商圈可比的未收缩门店，则失衡已被管住，我的定义应让位于竞争议题。
    quality: high
    note: "立场A高质量：定义为「需求结构与单店模型的失衡（增量无法核算）」；五要素齐备，主动用同店口径限定证据效力，给出可比性要求与反证条件——未把单一解释当唯一事实"
  - text: |
      我把问题定义在门店网络一侧：价格战与一年近翻倍的开店叠加，单店被分流、联营商回本周期被拉长，而公司仍按「2024 年破 2 万家」的计划扩张——当前最值得解决的是门店网络的增长质量问题。
      对象与场景：落在联营商与单店模型上，场景是点位加密后的同城竞争：同店下滑可能来自 9.9 压价，也可能来自新店分流，两种机制对加盟商是同一种痛，但解法完全不同。
      目标差距：当前是公司规模指标（门店数、月均交易客户）与单店指标（同店、门店层面利润率一季度降至 7.0%）背向而行；期望是扩张不以持续牺牲单店盈利为代价；差距是缺少「单店健康优先于开店数量」的决策规则。
      边界：不处理品牌与价格心智问题；若证据表明同店下滑主因是补贴而非密度，本定义自动收缩为子问题。
      依据：2023Q4 自营门店层面经营利润率同比降 8.1 个百分点至 13.5%，2024Q1 进一步降至 7.0%；对手库迪联营商侧屡传关店，模式风险是行业性的。
      反证：若分商圈数据显示低密度区域同店同样大幅下滑，分流解释被削弱，我会把定义退回价格政策本身。
    quality: high
    note: "立场B高质量：定义为「门店网络增长质量」而非价格政策，与立场A形成真实分歧；结构完整、给出定义自动收缩的条件——检验「同题多解均可高分」"
  - text: |
      问题是 9.9 把用户惯坏了，补贴一停需求就塌。2024 年一季度由盈转亏、自营同店下降 20.3%，说明靠低价撑起来的增长不可持续。
      对象是想喝咖啡但只认 9.9 的用户，场景是每周用券下单。当前状态是用户只等券，期望状态是用户接受正常价格，差距是用户心里的价格被锚定在 9.9 上。边界上我只管 C 端用户心智，不管加盟商和竞争。
      判断依据：9.9 缩水上了热搜，有网友说「不是 9.9 就喝别的 9.9」，说明用户已经不认正价；2023 年靠杯量和爆款还能对冲降价，2024 年杯量涨不动了，毛利缺口就暴露出来。
      验证上，我会看 LTV 和无券复购率，无券交易占比高就说明经营健康。瑞幸自己在收缩活动，正好可以当天然实验，对比收缩前后的同店变化，就知道补贴还有没有用了。
    quality: medium
    note: "结构有但口径与证据边界弱：五要素雏形具备，但把「价格被锚定」当既定前提、复述「杯量对冲」媒体解释并由同店倒推杯量、无券占比单独证明健康、「收缩即天然实验」未论证可比性、LTV 未分收入/利润口径"
  - text: |
      9.9 早已不是补贴，而是瑞幸给自己戴上的镣铐。当低价从获客手段变成价格锚点，用户的参考价格就被永久改写了，恢复正价在用户心里等于涨价，这是不可逆的心智迁移。去年狂赚、今年亏惨就是最好的证明：2023 年杯量和爆款还能对冲降价，2024 年杯量一放缓，毛利缺口立刻暴露，一季度由盈转亏就是价格战的账单。更深一层，这是典型的囚徒困境：瑞幸和库迪都在失血，但谁先在核心区域退出谁丢份额，补贴于是从手段变成了人质，对手不退，瑞幸就无法停战。所以问题的本质是：瑞幸被自己亲手建立的低价心智绑架了。破局只能慢慢缩水、逐步试探，用同店销售和无券复购率观察用户还认不认正价。这本质上是一场心理战，谁更懂用户心智，谁才能笑到最后。
    quality: low
    note: "流畅但依据不足：通篇复述「价格锚点/不可逆/囚徒困境/去年狂赚今年亏惨」等现成结论，无对象-场景-差距-边界结构，无口径意识，无事实校验与反证条件——用于检验评分器不被流畅文风带高分"
