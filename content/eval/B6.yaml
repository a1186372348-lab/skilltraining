question_id: B6
answers:
  - |-
    拼好饭的用户不是笼统的「价格敏感人群」，至少有三类处境分明的人：一是月底预算见底的大学生——学校周边正是订单密集区，要的是「用最低成本吃饱」；二是午休只有一小时的写字楼白领，要的是「不用纠结、快速解决的工作餐」，拼团群里到点甩链接、跟着下单，决策成本几乎为零；三是收入不稳定的蓝领，15 元是一餐的常态预算线。共同点不是穷，而是：这顿饭刚需、高频，且不愿为它付溢价。

    「便宜」只是表面动机。用户真正买的是三样东西：一是确定性——10 元上下、免配送费、爆品套餐，价格与内容可预期，不用在满减规则里做算术；二是决策成本为零——平台替用户选好「卖什么」，跟着拼单就行，这对疲惫的打工人本身就是价值；三是「不丢人的性价比」——拼单让低价成为集体行动，消解了买便宜货的心理负担。这解释了表面矛盾：对配送慢、分量缩水的吐槽不断，订单峰值却从 500 万涨到 800 万——吐槽的是体验波动，复购是因为交换仍划算。

    这笔交换的本质是：用户让渡等待时间、选择范围与品质上限，换取价格与确定性。觉得划算的是把午餐当「任务」的人；把午餐当「享受」的人不会来——这条分界线就是拼好饭的用户边界。

    对美团，这是外卖见顶后用低价激活存量的业务，用户价值真实，但代价在商家利润与骑手收入里。边界也清楚：若补贴退坡后商家靠缩水保利润，用户让渡的会越来越多，交换终将不划算——那时「便宜」不再是留下的理由，而是离开的倒计时。
