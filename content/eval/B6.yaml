question_id: B6
answers:
  - text: |-
      拼好饭的用户不是笼统的「价格敏感人群」，至少有三类处境分明的人：一是月底预算见底的大学生——学校周边正是订单密集区，要的是「用最低成本吃饱」；二是午休只有一小时的写字楼白领，要的是「不用纠结、快速解决的工作餐」，拼团群里到点甩链接、跟着下单，决策成本几乎为零；三是收入不稳定的蓝领，15 元是一餐的常态预算线。共同点不是穷，而是：这顿饭刚需、高频，且不愿为它付溢价。

      「便宜」只是表面动机。用户真正买的是三样东西：一是确定性——10 元上下、免配送费、爆品套餐，价格与内容可预期，不用在满减规则里做算术；二是决策成本为零——平台替用户选好「卖什么」，跟着拼单就行，这对疲惫的打工人本身就是价值；三是「不丢人的性价比」——拼单让低价成为集体行动，消解了买便宜货的心理负担。这解释了表面矛盾：对配送慢、分量缩水的吐槽不断，订单峰值却从 500 万涨到 800 万——吐槽的是体验波动，复购是因为交换仍划算。

      这笔交换的本质是：用户让渡等待时间、选择范围与品质上限，换取价格与确定性。觉得划算的是把午餐当「任务」的人；把午餐当「享受」的人不会来——这条分界线就是拼好饭的用户边界。

      对美团，这是外卖见顶后用低价激活存量的业务，用户价值真实，但代价在商家利润与骑手收入里。边界也清楚：若补贴退坡后商家靠缩水保利润，用户让渡的会越来越多，交换终将不划算——那时「便宜」不再是留下的理由，而是离开的倒计时。
    quality: high
    note: 高质量锚点：「不只是便宜」立场，动机拆解路线（初始参考作答）
  - text: |-
      拼好饭的用户买的是什么？我的答案：就是便宜——但「便宜」要说清楚才算回答。

      先看预算约束。学生月底生活费见底，蓝领一餐预算卡在 15 元上下，白领不是没钱、是不愿为一顿工作餐付溢价：对「这顿饭」，他们的预算上限是硬的。再看替代选择：食堂要排队、口味固定，自带饭要前一晚准备，主站外卖按财报推算客单价约 48 元、还要在满减规则里做算术。在 10~15 元、免配送费、不用动脑的约束组合里，拼好饭不是最想要的，是预算内的最优解。

      最后看接受的代价。用户清楚让渡了什么：配送慢、分量可能缩水、选择范围窄。吐槽不断、复购不停、日单峰值从 500 万涨到 800 万，恰恰说明这是知情后的交换——省下的钱大于让渡的体验。所谓确定性、决策成本低，不是独立动机，而是低价成立的前提：价格可预期、不用凑单，便宜才真正到手。

      结论：核心动机就是价格，成立条件是预算约束真实存在、替代选择更贵或更麻烦、让渡的代价在底线之内。哪天补贴退坡、价格突破这条线，用户会流失——这反过来证明，他们买的就是便宜。
    quality: high
    note: 高质量锚点：以价格为核心动机但论证扎实（预算约束＋替代选择＋接受的代价），复审修改项③补充
  - text: |-
      拼好饭的用户主要是年轻人，尤其是大学生和刚入职的白领。他们追求性价比，也追求一种「会过日子」的自我认同。拼单本身是一种社交，大家在群里互发链接，买到便宜好饭还有小小的成就感。

      所以他们真正买的不是便宜，而是一种精打细算、但不委屈自己的生活方式。吐槽配送慢、分量少，说明他们对品质有要求；持续复购，说明平台懂他们。未来只要美团继续补贴、持续优化体验，拼好饭会成为更多人的日常选择，甚至改变年轻人对「一顿工作餐」的期待。
    quality: medium
    note: 中等样本：表达流畅但断言无据，动机判断未用行为证据支撑，也未触及预算约束与代价分析
