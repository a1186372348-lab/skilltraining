# Q02 标准答案 ｜ AI 起草，待人工评审修订（T33 / D31）；仅供评分回归基准，不得进入题库运行时字段
# 格式：answers 为 {text, quality, note} 列表；quality ∈ high/medium/low；note 注明评审用途
# 复审补产（产品负责人裁决）：主测改为产品取舍后，题面允许重仓提准确率、重仓人工纠错与条件式排序
# 三种高分立场（取消「纠错优先」隐含标准），另附一份流畅但依据不足的对照；高质量样本均给出成立条件
# 与反转信号，不把单一解释当唯一事实；口径统一为订单级完全正确率 90%（约 10% 订单存在至少一处错误）
question_id: Q02
answers:
  - text: |
      我重仓 A，继续把订单级完全正确率推向 95% 以上，但这是一个有前提的排序。先看账：90% 是订单级口径，约 10% 的订单存在至少一处识别错误；推到 95% 意味着问题订单减半，错扣赔付、客诉处理与运营商对账成本同口径下降，而纠错路径处理的是「错误发生之后」，并不减少错误本身。再看成本结构：纠错人力随单量线性增长，若要做到结算前拦截还需承担实时审核的时效成本，单量越大越不划算；算法投入虽然边际难度上升，但一旦突破，成本不随单量放大。B 不是不做，而是降为底线：保留客诉申诉通道与货损对账，控制在小团队规模，不建实时审核中台。关键假设有二：一是错误结构可学习——若 10% 错误集中在相似包装、遮挡等可通过数据与模型迭代收敛的场景，A 的收益成立；若错误主要来自新品持续涌入，模型永远在追新，结论反转。二是运营商愿意等——若客诉已导致点位解约，需先用 B 止血。验证：先拆解最近一个季度的错误订单构成，再在 20 个点位灰度新模型，盯订单级完全正确率与客诉率；三个月内错误率下降不及预期一半，切换重仓 B。
    quality: high
    note: "立场A高质量：重仓提准确率，按订单级口径算同口径账、给出 B 的降级处理与两条反转信号，未把「算法路线」当无条件正确"
  - text: |
      我重仓 B，优先建设人工纠错能力，理由是当前阶段错误的确定性损失大于准确率提升的不确定性收益。第一，90% 是订单级完全正确率——每 10 笔订单约 1 笔出错，落到消费者是错扣、落到运营商是月底对不上账，这类损失直接侵蚀信任且正在发生；把准确率推向 95% 处在平台期，研发投入大、周期与结果都不确定，即使成功问题订单也只是减半而非消除，剩余约 5% 仍需有人兜底。第二，纠错的代价可以主动设计边界，而不是被动线性扩张：按错误金额与类型分级，高金额与高频 SKU 在结算前人工复核，低金额争议走事后申诉赔付，先控住损失大头；同时设定纠错率目标，把「逐步自动化」写进建设路线。第三，纠错沉淀的标注数据有反哺模型的潜力，但我只把它当待验证的期权——能否反哺取决于标注质量与是否真有训练闭环，不作为重仓的主论据。关键假设是错误可被发现、且单均纠错成本低于单均错误损失；若试点显示时效做不到结算前拦截、或单均成本高于损失，排序反转为重仓 A。验证：选 20 个点位上线分级纠错机制，与对照点位比较客诉率、货损率与运营商续签意愿，四周看损失收敛幅度。
    quality: high
    note: "立场B高质量：重仓人工纠错，论证建立在「确定性损失 vs 不确定收益」的比较上，给出边界设计与反哺条件性（期权而非论据），含反转条件"
  - text: |
      仅凭题面信息，我无法在 A、B 之间给出无条件排序——决定排序的几个关键数字题面都没有，强行拍板是抛硬币。先把能确定的摆上桌面：90% 是订单级完全正确率，即约 10% 订单存在至少一处错误；A 的收益是同口径错误减半的长期确定性，代价是平台期的研发投入与周期；B 的收益是错误损失的即时收敛，代价是随单量增长的人力与必须解决的时效问题。排序取决于四个关键未知：其一，10% 错误订单的结构——集中在相似包装、遮挡等可学习场景，A 的边际收益可期；集中在新品持续涌入，模型永远在追新，B 更务实。其二，错误的发现率与发现时点——若多数错误靠消费者申诉才暴露，纠错只能事后赔付，止损效果打折。其三，单均纠错成本与单均错误损失的比值——这决定 B 是「划算的生意」还是「昂贵的安慰」。其四，运营商的耐心阈值——若信任已崩到解约边缘，再正确的长期投入也救不了当季。我的条件式排序：错误以可学习场景为主且信任未崩，重仓 A、B 做底线兜底；新品错误占比高或信任已在流失，重仓 B 并设纠错率目标逐步自动化。补齐依据只需拆解一季度错误订单加一次 20 点位试点，在那之前这是最诚实的答案。
    quality: high
    note: "条件式排序承认未知：先充分利用已有信息摆清两路径的确定收益与代价，再列明决定排序的四个关键未知及补齐方式——对应反机械化规则「承认未知须先充分利用已有信息」"
  - text: |
      答案很明确：优先建设人工纠错能力。准确率从 90% 提到 95% 只是把错误减半，治标不治本，技术上也不现实——深度学习早就过了红利期，再投研发就是烧钱无底洞。而人工纠错立竿见影，直接消灭错扣客诉、重建运营商信任，这才是商业闭环。行业早就给出了标准答案：亚马逊 Just Walk Out 号称全自动，背后靠的是上千名人工审核员，连亚马逊都离不开人工兜底，说明「AI+人工」是唯一正确的形态，重仓算法路线已经被行业证伪。更重要的是战略眼光：纠错团队沉淀的标注数据会反哺模型，形成数据飞轮，纠错做得越多模型越聪明，这是一举两得的复利投资，提准确率只是单点优化。所以建议 All in 人工纠错，三个月建成审核中台，客诉率必然大幅下降，准确率问题交给飞轮自然解决即可。
    quality: low
    note: "流畅但依据不足：用「只把错误减半」压低提准确率路径、拿 JWO 当「行业通行形态」的铁证（不区分人工形态、不核官方口径）、把数据飞轮当既定事实、不算成本账不设边界，结论先行且过度承诺（「必然」）"
