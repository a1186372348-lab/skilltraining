# B2 标准参考答案 ｜ AI 起草，待人工评审修订（T33 / D31）
# 仅供评测集使用（T28），不得泄露进题库运行时字段
# 覆盖：立场A「坚持不做+承接设计」高质量、立场B「有限度地做」高质量、流畅但依据不足低分、合理承认未知高分；
# 题面允许多种立场成立，高质量样本均不把单一立场当作唯一正确答案（answers 条目格式：{text, quality, note}）
question_id: B2
answers:
  - text: "我的决定：维持不做已读，但「不做」不是什么都不做——发送方的确定性需求是真实的，必须用别的机制承接。\n设计五要素：适用场景为微信个人聊天与群聊全场景，不引入已读状态；状态定义只保留「已送达」一层（消息到达对方设备），不引入「已读」；展示与开关上无已读可展示、无需开关；关键异常方面，群聊同样不做已读（避免「谁看了没回」的群内压力），语音消息不做播放回执；双方代价是发送方失去「对方已看到」的确认，接收方保留「看到暂不回复」的缓冲。\n承接设计分两层：其一，保留送达确认并在发送失败时明确提示，消除「是否送达」的不确定；其二，「必须确认对方收到」的强需求（约见、紧急通知、工作协同）由显式确认工具承接——强提醒、接龙、待办，把「默认监控」换成「按需请求确认」；工作场景的效率需求由企业微信分工承接。\n残余损失必须承认：客服、电商等半熟场景的效率损失让渡给了对手；暧昧期、讨债等关系场景里发送方的焦虑无人承接，这是保护接收方必须支付的代价。\n验证：用情境原型测试，招募用户在有/无已读的原型中完成典型沟通任务，测量双方压力量表差异；若多数用户在多数场景强烈偏好已读且压力可控，我会重启评估。"
    quality: high
    note: "立场A高质量：选「不做」且按裁决要求给出确定感承接安排与残余损失清单；五要素齐备，验证用情境原型而非上线试验，含立场翻转条件"
  - text: "我的决定：有限度地做——只在「服务与协同」场景引入已读回执，私人聊天不做。\n适用场景：服务通知、客服会话、企业微信互联消息等非私人关系场景；私人单聊与群聊不引入。\n状态定义：已读=对方打开会话且消息上屏，与送达（消息到达设备）严格分层；不承诺「对方读懂」。\n展示与开关规则：已读仅对服务提供方可见，用于履约确认与纠纷举证，不向私人聊天渗透；接收方可对单个服务号关闭回执，服务方仅看到「用户已关闭回执」的中性提示；关闭是双向的——服务方同时失去向该用户发送「已读未回」式催促的能力。\n关键异常：群聊不做已读排行（制造身份压力）；语音消息不做播放回执；陌生人首条消息不发送回执。\n双方代价：服务方获得履约确认，代价是回执覆盖率不可能满格（用户可关）；接收方在服务场景让渡部分隐身权换取效率，私人关系的缓冲完整保留。\n参照边界：WhatsApp 的「可关闭+例外」证明机制可行，但其场景与关系链和微信不同，只能参照参数、不能当作因果对照。验证：先访谈与情境原型测试，再在客服场景做对照试点（部分会话开回执、部分不开），比较履约率、投诉与关闭率；关闭率高企或投诉上升则收缩范围。"
    quality: high
    note: "立场B高质量：「有限度地做」立场——场景切割清晰、五要素完整、双向关闭规则有设计、明示跨产品参照的证据边界，验证采用对照试点并给出收缩条件"
  - text: "微信不做已读，本质上是对用户的温柔。好的产品是用完即走的，微信十三年如一日地克制，正是中国互联网最稀缺的品质。已读功能看似方便，实则是一种社交暴力，它把每个人都绑在了必须立刻回复的刑架上。钉钉有已读，所以钉钉注定只是打工人的工具；微信没有已读，所以微信是生活。数据也证明了这一点：八成网友反对已读，43.56% 的人把它选为最讨厌的社交媒体功能，民心所向、一目了然。如果管理层用回复率和打开时长来挑战，我会告诉他：短视的效率指标换不来长期信任，微信的护城河是熟人关系链，任何伤害关系链的功能都不能做，而且一旦上线就永远无法回头。我的建议是继续坚持不做，并且永远不做，这是对十三亿用户最好的承诺。历史会证明，克制比聪明更重要。"
    quality: low
    note: "流畅但依据不足：通篇口号与复述官方立场，无任何设计产出（无场景/状态/开关/异常/代价），把网络投票当全体用户结论，直接使用「永远无法回滚」等被裁决禁止的预设断言"
  - text: "坦白说，现有材料不足以让我确定「做」还是「不做」是唯一正确答案，我给出一个有保留的立场：默认维持不做，同时把证据缺口摆上台面。\n能确定的部分：官方立场多年一致且有公开解释（接收方的心理负担与社交压力）；网络投票中反对声占多数，但这只能说明参与者的态度——投票样本是自选择的，无法代表 13.85 亿月活用户；WhatsApp 的可关闭方案与微博的下线案例是跨产品参照，场景与关系链不同，不能当作微信的因果证据。\n不能确定的部分：发送方确定感需求的真实强度与分布，投票里没有呈现；「已读」对熟人关系的长期压力，目前没有公开的因果性研究能定量回答。\n因此我的过渡方案是「不做+承接」：保留送达确认，用显式确认类工具承接紧急确认需求，效率场景交给企业微信；同时在客服会话试点对照研究（部分会话开回执、部分不开），观察履约率与投诉。\n要把判断做实，还需要三类证据：大规模随机抽样的用户态度调查（而非网络投票）、情境原型实验测量的双方压力变化、服务场景试点的对照数据。证据到位前我坚持「不做」，但保持可推翻：若随机调查显示多数用户在多数场景需要已读且压力可控，我会转向有限度方案。"
    quality: high
    note: "合理承认未知：充分利用已有信息给出过渡立场与承接设计，明确证据缺口（投票自选择、跨产品参照限制）与所需补充证据清单，给出可推翻条件——符合反机械化规则的高分路径"
