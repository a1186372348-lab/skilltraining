# Q12 标准参考答案 ｜ AI 起草，待人工评审修订（T33 / D31）
# 仅供评测集使用（T28），不得泄露进题库运行时字段
# 分层说明：4 份样本覆盖「值得有限试点」与「不值得进入」两种立场的高质量答案、结构有但依据边界与口径
# 意识弱的中等样本、流畅但复述现成结论的低分样本；高质量样本均不把单一解释当唯一事实
#（answers 条目格式：{text, quality, note}）
question_id: Q12
answers:
  - text: |
      我的结论：值得有限试点——限定在「已选定目的地」场景的购券环节，而不是尚未选店时的找店推荐。
      为谁创造什么价值：对用户的价值不是「逛」，而是缩短——已经决定去某家店的人，在导航途中顺手买到比到店价低的券，省下的是比价与现场决策的时间；对商户，高德送来的是接近成交的高意图客流，获客成本可能低于泛流量平台，但这要按城市实测，不能当作既定事实；对平台，价值在于把导航关系延伸为交易关系，这是三环里最弱的一环。
      成立条件有三个：券的供给密度足够（用户想买时买得到）、核销与售后体验不输美团、导航核心体验不被打扰。
      最大不确定性：已选定目的地的用户里，有多少会在这个时点改变消费习惯——他们可能早在美团买好了券，高德只是最后十公里的工具。阿里已披露高德整体单季盈利，但这是高德整体口径，推不出到店业务赚钱，更推不出团购赚钱。
      验证：选 2~3 个供给密度足够的城市试点，对照城市须在体量与竞争格局上可比；核心指标是「导航结束后的到店核销率」与补贴退坡后的自然复购。导航完成、到店、核销是三件事，测量必须分开，导航结束不等于进店。若试点城市核销率显著高于对照且退坡后留存，结论才初步成立。
    quality: high
    note: "立场A高质量：值得有限试点（已选定目的地场景的购券环节）；价值对谁成立、三个成立条件、最大不确定性齐备；主动限定盈利口径外推范围、区分导航/到店/核销测量边界、要求对照城市可比——未把单一解释当唯一事实"
  - text: |
      我的结论：在「尚未选店」的找店场景，不值得进入；高德应把到店业务收缩到服务已选定目的地用户的工具性环节。
      为谁创造价值：找店场景的价值假设是「导航流量里有大量未决策用户，高德可以影响他们去哪」。我不认为它成立：用户打开高德时大多已知道去哪，决策发生在美团、抖音或朋友推荐里——导航更像决策的执行环节，而非决策本身。扫街榜想改变这一点，但官方介绍里榜单本就综合导航、用户评价与信用等多种信号，权重未公开，「真实行为替代主观评价」未必成立；「永不商业化」的承诺对象是榜单排名，它不能证明榜单无偏，更不能证明榜单能改变用户的决策习惯。
      对商户，如果高德只能带来「本来就要来」的客流，商户的付费意愿有限；对平台，用补贴换决策心智的成本极高，而单季盈利说明集团对效率的要求只会更严。
      最大不确定性：我无法获得高德内部「导航发起前未决策」的占比数据；若该占比远高于我的估计，结论需要反转。
      验证方式：抽样统计导航发起前用户在 App 内的搜索与浏览行为——若绝大多数导航目标在打开高德前已确定，找店场景的价值假设即被证伪。
    quality: high
    note: "立场B高质量：不值得进入（尚未选店场景）；把官方扫街榜口径与「永不商业化」承诺作为待检验对象而非论据，明示证据缺口与结论反转条件——检验「同题不同立场均可高分」"
  - text: |
      我的判断是高德值得做团购，但应该谨慎推进。高德最大的优势是目的地流量：用户导航去餐厅时消费意图已经很明确，这比美团的主动找店和抖音的内容种草都更接近成交。短板是用户心智偏工具性，用完即走，评价体系也比美团薄弱，商户不太敢把宝押在高德身上。
      方案上我设计一个闭环：用户搜索餐厅→扫街榜推荐→购券→导航到店→核销→复购。扫街榜用真实导航与到店数据生成，比刷出来的好评可信，而且承诺永不商业化，用户会信任它。商户按真实到店效果计费，只为实际客流付钱，成本低。
      指标看四层：POI 页点击率、购券转化率、导航到店率、核销率，再加导航体验的护栏指标。验证用分城市灰度，试点城市和对照城市比较，再看补贴退坡后的留存。
      风险是增量还是抢单的问题：用户本来就要去这家店，团购可能只是抢了美团的单，需要用对照组客流增量来判断。
    quality: medium
    note: "结构有但依据边界弱：「目的地流量最接近成交」无依据支撑、「评价体系薄弱」无比较依据、把「永不商业化」直接当信任证据、强制「按真实到店效果计费」、导航到店率未区分导航完成与进店、灰度未论证可比性、增量vs抢单只停留在口号"
  - text: |
      高德做团购是降维打击。导航是消费决策的下一跳，用户人在路上、意图明确，这是美团和抖音都没有的独有资产，目的地流量天然就是交易流量。扫街榜用真实行为数据替代主观评价，刷单刷榜在它面前失效，加上永不商业化的承诺，榜单公信力碾压大众点评——这是高德手里最锋利的刀。闭环也清晰：榜单种草、导航转化、核销闭环，每一步都只有高德能做，核销与轨迹交叉验证的到店数据是可独有度量的指标，对手抄不走。到店市场本来就是高毛利，商户在高德能获得低成本流量，阿里又有战略决心，10 亿补贴只是开始。当然高德也有短板：工具心智用完即走、评价体系缺失，但补贴和产品迭代足以解决。验证上分城市灰度、看核销率、补贴退坡看留存即可。真正的问题只有一个：增量还是抢单——只要证明是增量，这个生意就成立。
    quality: low
    note: "流畅但复述现成结论：通篇堆叠「独有资产/天然交易流量/真实行为替代评价/公信力碾压/评价体系缺失/高毛利/低成本流量」等未经检验的定性，无量纲边界与证据意识，「增量还是抢单」沦为口号——用于检验评分器不被流畅文风带高分"
