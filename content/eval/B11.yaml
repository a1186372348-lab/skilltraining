# B11 标准答案 ｜ 供评分回归基准（T28 评测集），AI 起草，待人工评审修订
question_id: B11
answers:
  - "先把问题重新定义：这道题的核心不是「外卖不够快」，而是配送时间的「不确定性」被失衡地分配——等餐、等电梯、进小区、天气等一切变量都由最弱势的骑手被动消化，而用户拿到的预估时间又常常不可信。用户要的其实是「确定的预期」，骑手要的是「不被变量惩罚」。据此，方案按三个机制层展开。第一层，预估时间的生成：把异常场景从平均时长里拆出来单独建模——对长期出餐慢的商家自动补时、恶劣天气自动延时甚至限单、交付难的小区给出额外裕度，让预估回归「可信」而非「极限」。第二层，展示与预期管理：把单点送达时间改为区间或分档提示，并透出出餐、取餐、配送进度，用透明换信任，而不是用极限时间讨好用户。第三层，考核与激励：超时考核与不可控因素脱钩，申诉自动化、恶劣天气免责常态化，骑手奖励从纯单量转向兼顾安全与稳定，否则任何「加时间」都会被单量冲动吃掉。落地节奏上，先改展示与考核（见效快、技术风险低），再改预估模型与调度，选 2~3 个城市灰度试点后推广。验证用护栏指标组合：用户侧看超时差评率与「预期准不准」的调研评分，骑手侧看超时率、申诉率、收入波动与违章事故，商家侧看出餐时长分布。关键是警惕数字游戏——单纯放宽预估时间会让超时率变好看但体验变差，所以北极星指标应是「预期准确率」，而非超时率本身。"
