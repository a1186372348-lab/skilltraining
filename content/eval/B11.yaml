# B11 标准答案 ｜ T33 基线题（主测维度：方案设计）
# 复审返工：高分样本改为「一个城市的午高峰 + 三条硬约束（运力不变／体验底线／预算有限）」下的
# 受约束试点设计，替换原「全国系统方案＋灰度推广」样本；medium/low 覆盖「方向对但机制浅」与
# 「无视约束的全国铺开大方案」两类典型表现。AI 起草，供评分回归基准使用；待人工评审修订（D31），
# 不泄露进题库运行时字段。
# 格式：answers 为 {text, quality, note} 列表；quality ∈ high/medium/low；note 注明评审用途
question_id: B11
answers:
  - text: |
      先把问题重新定义：在试点城市的午高峰，核心矛盾不是「外卖不够快」，而是配送时间的不确定性被失衡分配——等餐、等电梯、进小区等变量都由骑手被动消化，用户拿到的预估时间又常常不可信。用户要的是确定可信的预期，骑手要的是不被不可控变量惩罚。试点方案在三条约束内按三个机制层展开。第一，预估生成：运力不变，就向精度要空间——对该市午高峰长期出餐慢的商家自动补时、交付难小区加裕度、恶劣天气自动延时，让预估回归可信而非极限。第二，考核脱钩：不可控因素导致的超时不计入考核，申诉自动化，骑手奖励从纯单量转向兼顾安全与稳定，否则任何补时都会被单量冲动吃掉。第三，展示透明：预算不花在补贴上，花在进度透出——出餐、取餐、配送状态对用户可见，用透明换信任，而非用极限时间讨好用户。验证用对照设计：试点城市内分片区灰度，护栏指标看超时差评率与事故违章，北极星指标是「预期准确率」而非超时率——单纯放宽预估会让超时率变好看但体验变差。三个月后若预期准确率升、骑手申诉降而差评不升，再谈推广。
    quality: high
    note: "受约束试点设计锚点：问题重定义落在「不确定性的分配」，三层机制均在运力／体验／预算三条硬约束内展开；验证用对照设计＋「预期准确率」北极星，区分真改善与账面改善"
  - text: |
      我认为应该优化配送时间的预估算法，让它更准确。首先，美团应该收集更多数据，比如商家出餐时间、小区配送难度、天气情况，用更准的模型给出合理预估。其次，要关心骑手：恶劣天气延时，出餐慢的商家给骑手补时。第三，对用户要诚实，展示真实送达时间。落地就按题目要求选一个城市做试点，跑三个月看效果。验证方面，看超时率和用户差评率有没有下降、骑手满意度有没有提升，数据好就推广到全国。当然不能只放宽时间，要在用户体验和骑手安全之间找到平衡，既保证用户尽快吃到饭，也让骑手安全送达，实现三方共赢。
    quality: medium
    note: "方向对但机制浅：承认试点框架与约束，但「优化算法」「收集数据」「找到平衡」均为口号，无机制拆解；验证只有指标名单、无判断基准与对照设计——方案设计中低分锚点"
  - text: |
      这个问题需要系统性地解决。美团应该成立专项组，全国推广「骑手关怀计划」：一方面加大投入，给骑手更好的装备和保险、提高配送单价，让骑手收入有保障；另一方面用 AI 全面优化调度，实现最优派单。对用户，推出会员制度，愿意多等的用户给优惠券补偿，形成良性循环；对商家，建立出餐速度评级，倒逼商家提高效率。同时加强企业文化建设，把骑手关怀纳入全员 KPI。只要平台、用户、商家、骑手四方共同努力，一定能走出困局，实现科技向善。
    quality: low
    note: "无视约束的全国铺开大方案：提高单价＝补贴换时间、优惠券换用户多等＝触碰体验底线，直接违反两条硬约束；全是投入口号无机制，无验证设计——低分锚点"
