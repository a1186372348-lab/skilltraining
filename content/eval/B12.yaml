# B12 标准答案 ｜ 供评分回归基准（T28 评测集），AI 起草，待人工评审修订
question_id: B12
answers:
  - "这套方案对付的真问题不是「票不够」——供给问题它解决不了——而是稀缺退票资源的分配规则被技术外挂劫持：拼手速、拼软件，官方渠道旅客输在起跑线。候补购票的关键设计有四处。一是预付款：它是一份真实性承诺，把黄牛批量占坑、随意刷需求的成本从零下拉到票面价，同时不兑现就原额退还，旅客的资金风险为零。二是按生效时间顺序排队：把分配规则从「刷新频率」改写为「登记先后」，规则简单、可解释、可信任——只有官方独占票源信息，这套排队才能成立。三是免费：守住铁路的公共产品属性，与第三方加速包收费形成鲜明的价值立场，这是它能赢得旅客信任的根本。四是防滥用与兜底：订单与组合数量限制、人证核验、行程冲突规则，保证公平不被二次钻空。对比替代方案更能看清取舍：价高者得会让稀缺资源向购买力倾斜，违背公共属性；抽签牺牲了先来后到的可预期性，对刚需旅客是纯运气；免费排队是公平、效率与可解释三者之间最稳的选择。它的能力边界也很清楚：候补只是再分配退票、改签产生的票源，不增加总供给，热门线路「开售即候补」、候补到截止仍无票是必然；它真正交付的是「确定的排队位置与公平感」，而非「一定有票」。后续可迭代的方向是排队位置与兑现概率的透明化，缓解等待焦虑。验证则看兑现率、候补渗透、第三方抢票使用率与相关投诉舆情的变化。"
