# B16 标准答案 ｜ AI 起草，待人工评审修订（T33 / D31）；仅供评分回归基准，不得进入题库运行时字段
# 返工说明：随题目返工同步重写——样本只使用决策时点（2018 年上市前后）可得信息，不再引用亏损、
# 补贴收缩后 DAU 下滑等 reveal 数据；高质量样本均不把单一解释当唯一事实，且术语准确
# （对照实验不称「自然实验」、不用整体活跃变化冒充留存证据）（answers 条目格式：{text, quality, note}）
question_id: B16
answers:
  - text: "这组指标证明的是「增长的规模与速度」，证明不了「生意成立」。逐项拆：装机 1.81 亿只证明触达；月活 6220 万证明打开规模，但月活含新增与回流，说明不了留存质量；登录率 95% 最值得追问——签到领金币本身就要求登录，登录可能是激励的副产品而非粘性证据；时长 55.6 分钟同理，做任务赚金币也会推高时长。更关键的是同源污染：注册、登录、时长、裂变都绑在同一套金币机制上，它们互相印证不了，只能印证「发钱有效」。要判断生意是否成立，我会追问三组数据：一是同期群留存，按注册月份分群看 30/90/180 天留存曲线，重点看金币之外的留存；二是单位经济，单用户广告收入对比单用户激励与获客成本——收入侧招股书有披露，成本侧要追问财报口径，算清回收期；三是激励依赖度，设计一个分地区或分用户群停减激励的人为对照实验（准实验设计，而非等待自然发生的对照），处理组停发签到金币四周、对照组不变，观察留存与时长塌陷幅度——塌陷小说明产品价值真实，塌陷大说明活跃是买来的。当前结论：证据不足以判定这是一门好生意；若对照实验中处理组留存高位走平、单用户广告收入稳定覆盖激励与获客成本，我会转为正面判断。"
    quality: high
    note: "立场A高质量：判断「现有证据不足以证明好生意」，逐项拆解指标能/不能证明什么，给出术语准确的检验设计（同期群留存、单用户经济、人为对照实验）与翻转条件——主测维度完整路径"
  - text: "我倾向于认为这组指标证明了一件真实的事：下沉市场的娱乐资讯需求是真实的，趣头条用金币机制把服务送到了一个被主流平台忽视的群体手里——约七成用户来自三线及以下城市、人均单日 55.6 分钟，说明产品击中了真实存在的空闲场景；营收一年增长九倍、腾讯与人民网旗下基金背书，说明广告主与资本市场现阶段认可其流量价值。在这个意义上，「亮眼」不全是假象。但「需求真实」与「生意成立」之间隔着两个未验证的变量。第一是留存性质：55.6 分钟是「想看」还是「想赚」？登录率与签到金币天然同构，现有数据无法区分，需要按注册月份分群的同期群留存来回答，尤其是激励之外的内容消费占比。第二是单位经济：广告占营收约 93%，模式能否成立取决于单用户广告收入能否稳定覆盖激励与获客成本，这需要财报口径数据才能测算。所以我的结论是条件式的：若同期群留存在激励退坡后仍走平，这是一门被低估的好生意；若留存随激励同步退潮，这就是一台昂贵的流量转手机器。在数据到手前，我的判断是「需求成立、模式待验」。"
    quality: high
    note: "立场B高质量：谨慎乐观——承认规模与需求真实性有证据支撑，但把「生意成立」挂在两个可检验变量上并给出双向翻转条件；与立场A互为对照，检验「同题多解均可高分」"
  - text: "坦率说，仅凭上市前后的公开数据，我无法判定这组指标的含金量。能说清的是边界：装机、月活、登录率、时长全部属于规模与行为指标，它们证明「很多人在做某些动作」，证明不了「为什么做」「会不会持续做」「每个动作值多少钱」。尤其登录率 95%：当登录本身绑定签到奖励时，这个数字的解释力完全依赖口径披露，而公司并未公布登录率的分母定义。要把判断做实，我需要三类证据：第一，分群留存——按获客渠道与注册月份拆开的同期群留存曲线，用来区分「为内容留下」与「为金币留下」；第二，单用户经济账——单用户广告收入、激励成本、获客成本三者的关系与回收期；第三，一次激励退坡的对照检验——哪怕只在部分城市做小流量停发金币的人为准实验，看活跃与时长的弹性。在证据到手前，「无法判定」不是回避判断，而是对这组指标最诚实的评估：它们唯一能确定证明的是「补贴驱动的增长机器运转良好」，而这恰恰是最不需要证明的事。"
    quality: high
    note: "合理承认未知：充分利用已有信息说清证据边界，列出三类所需证据与各自用途，明示「承认未知」之前的分析过程——对应能力模型「证据不足+说明需要什么证据是合法严谨产出」的反机械化规则"
  - text: "趣头条无疑是近年最惊艳的互联网黑马。两年时间做到月活 6220 万，登录率高达 95%，要知道很多资讯平台的登录率都不到 30%；人均使用时长 55.6 分钟，足以媲美头部应用，这样的数据放在任何一家公司身上都堪称完美。更难得的是它开创性地用金币模式激活了沉睡的下沉市场，让小镇用户第一次享受到移动互联网的红利，这是一种普惠。资本市场已经用真金白银投了票：腾讯、小米、人民网旗下基金争相入股，上市首日五次熔断、大涨 128%，46 亿美元市值就是市场对它的定价。互联网的本质是流量生意，有了流量就有了一切，趣头条坐拥上亿装机用户，广告收入一年翻九倍，未来只需按部就班变现，成为下一个百亿美金公司只是时间问题。那些质疑「网赚模式」的声音，本质上是一线城市精英对下沉市场的傲慢与偏见。"
    quality: low
    note: "流畅但依据不足：被官方战报与上市纪录带着走，用「流量生意」「普惠」「精英傲慢」套话替代证据检验，把市值当作价值证明，无口径意识与检验设计，并对质疑预设立场——用于检验评分器不被流畅文风带高分"
