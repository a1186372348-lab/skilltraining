# B16 标准答案（T33 / D31：AI 起草，待人工评审修订）
question_id: B16
review_status: draft
answers:
  - |
    结论先行：月活 6220 万、登录率 95% 证明不了这是一门好生意，它们只证明「现金激励能把人叫来」。判断一门生意要回答三个问题：用户为什么来、用户值多少钱、留住用户要花多少钱——这三组好指标恰好都绕开了它们。

    先看指标的同源污染：签到、阅读、收徒全部绑定金币，注册量、登录率、时长、裂变系数被同一台发钱机器同步推高——登录率 95% 不是粘性，是签到的副产品。同源的指标不能互相印证。

    要追问三组数据。第一组是自然留存：看补贴退坡后的表现——事实给了答案：2020 年 Q4 收缩补贴，DAU 同比下滑 29.3%，活跃是买来的，不是长出来的。第二组是单位经济：单用户日广告收入对比单用户参与成本（约 0.12 元）；销售与营销费用占营收比 2018、2019 年达 114%、101.3%——每赚 1 元先花掉 1 元多，增长越快亏得越多。第三组是用户价值结构：羊毛党占比、激励敏感用户的广告变现效率——低价值用户只能吸引低质广告，引来 315 点名后变现进一步恶化，形成死亡螺旋。

    检验方法上，最直接的是自然实验：选定部分城市或用户分群停减金币，观察四周内 DAU、时长、留存的塌陷幅度，塌陷越深，指标含金量越低；同时分群对比非激励用户的留存与时长是否健康。

    什么证据能改观？补贴退坡后留存能在高位走平、非激励用户规模自然增长、单用户广告收入稳定覆盖参与成本。在此之前，DAU 的增长只是一项开支的会计回声，不是资产。
