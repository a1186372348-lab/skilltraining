# B8 标准答案 ｜ AI 起草，待人工评审修订（T33 / D31）；仅供评分回归基准，不得进入题库运行时字段
question_id: B8
answers:
  - |
    用户说「要更准的榜单」，但真实问题是：基民不赚钱的主因不是选错基金，而是自己的行为。4682 万客户的真实交易数据显示，基民行为给收益带来的损耗接近 -60%：持仓小于 3 个月的盈利占比只有 39.10%，持有 120 个月以上的达 98.41%。销量榜恰恰是这种行为的放大器——它按「别人在买什么」排序，等于把追涨制度化：用户在高点蜂拥而入（上榜基金单周超 9 万人买入），回撤时割肉离场，亏损后归罪榜单「被操纵」。此时把榜单做得「更准」，只会让用户更敢重仓短期热点、持有期更短、亏损更快——直接满足表面诉求反而加深真实问题。所以问题的正确定义不是「如何推荐更赚钱的基金」，而是「如何设计机制，减少用户行为对自身收益的伤害」。蚂蚁的解法正由此而来：拆掉销量榜、把收益率展示从近 1 年拉长到近 3 年、增加夏普比率等风险指标、提示 A/C 份额费用差异——用信息设计引导长期持有，而不是强化短期决策。当然平台也有自己的账要算：销量榜是转化效率最高的入口之一，拆榜是拿短期销量换用户长期信任，这需要有数据论证「受伤的用户终将流失」才立得住。判断对错的标准是：改版后用户持有期、盈利人数占比、定投渗透率是否改善，而不是销量是否回升。
