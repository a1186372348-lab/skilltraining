# 答案；低分样本流畅但整段复述导读级结论链——用于检验评分器不被流畅文风带高分
question_id: Q11
answers:
  - text: |
      我的核心用户是一家 8 家门店的连锁奶茶品牌运营店长李娜，管各店原料库存与排班。她的处境具体是：数据散在 8 个 Excel 文件和 3 个微信群里——「没有 IT 支持、预算有限」是我核实的处境而非套用的前提，换到有 IT 部门的用户，刻画会不同。角色在她身上部分兼任：她既是搭建者也是买单者，店员是使用者，张力在于店员嫌麻烦不愿填、她需要数据及时准确。
      典型流程：每晚各店把库存截图发群，李娜汇总到 Excel，发现断货再电话确认补货，常常第二天才发现昨晚就该补。
      首次路径我选「导入现有表格」而非模板：她已有现成库存表，导入后十分钟内配上「库存低于安全值自动通知店长」。啊哈时刻不是「自动通知」这个功能本身，而是她第二天早上不再挨个打电话催表、断货当天就被发现——这才是具体任务的改善。分享时我会让她先看到「店员只能填自己店的行、她能看全部」，简洁但边界清楚。
      介绍：「把你现在发在群里的表放进来，谁改了什么、哪家店快断货，打开就能看到，不用等别人回消息。」我不承诺它替代专业 ERP——她这个阶段也不需要；但若发展到五十家店，权限、自动化、BI 这些能力接得住。边界按她的场景和产品能力说，不是给产品画死天花板。
    quality: high
    note: "立场A高质量：角色兼任但有张力、路径选「导入现有表格」并给出与用户的匹配理由、啊哈时刻落到任务改善（减少人工催办）、边界按场景与能力说明而非画死产品边界、共享边界讲清谁能看谁能改"
  - text: |
      我选的核心用户是 12 人电商代运营小团队的项目负责人阿凯。他的团队里三个角色是分立的：他搭建、客服与美工填、老板买单，张力具体——老板要「看得见进度」却不愿多花钱，客服怕多一道填报工序。他的替代品不是抽象的「Excel 习惯」，而是具体的一张共享 Excel：谁改坏了格式全组遭殃。我不把「首先竞争 Excel」当通用答案，只是在他的场景里它恰好成立。
      典型流程：周一晨会过进度，之后靠群里问；客户需求变更靠记忆同步，漏一次就赔一次好评。
      首次路径我反而选场景模板而非导入：他的 Excel 结构太乱，导入会把混乱带进新工具；用项目进度模板，十分钟内把本周三个真实项目填进去并切到看板——啊哈时刻是他第一次按客户而非表格行看到全部进度，发现两个项目已逾期两天却没人提过。选模板不是因为它「正确」，而是对这个用户，模板替他完成了最缺的结构设计。
      介绍面向他老板：「零代码搭个进度系统，员工填表，你看板」——对这位懂点技术的老板，术语是高效的；面向客服我会换成「填表一次，全组同步，不再背锅」。我只把面向老板这版讲透，版本数量不重要，讲准听众才重要。
    quality: high
    note: "立场B高质量：与立场A形成真实分歧（路径选模板、角色三分立、介绍面向老板且使用术语）——检验「不同合理选择均可高分」；替代品判断限定在自己场景内，未泛化为固定答案"
  - text: |
      核心用户是中小企业的业务人员，他们没有 IT 部门、不会写代码，平时用 Excel 和微信群管理业务，很痛。典型流程是用 Excel 记录、微信沟通、版本混乱。
      首次使用路径：让新用户从场景模板开始，比如选一个客户管理模板，十分钟就能用起来，这就是啊哈时刻；再引导他切换看板视图、设置自动通知，体验产品的强大功能。设计上要隐藏数据库、权限这些复杂概念，渐进披露，避免吓到新手。
      产品介绍我写了两个版本。面向一线员工：「不会写代码，也能把一摊事管起来」；面向老板：「多维表格是轻量低代码平台，让每个人变成业务高手」。边界上我不承诺它替代专业系统——它服务的就是轻量业务管理，这样不会过度营销。
      为什么是它而不是别的 SaaS？因为它的竞争对手首先是 Excel 的使用习惯，赢了 Excel 就赢了用户。
    quality: medium
    note: "结构有但分析与边界弱：用户停留在「中小企业」均值人、角色未区分；路径选模板却无与用户的匹配理由，啊哈时刻只有功能动作没有任务改善；复述「轻量低代码平台」「每个人变成业务高手」当自己的论证；把「首先竞争 Excel 习惯」当固定答案；为凑两版而两版"
  - text: |
      多维表格的答案很清楚：它服务的是不会写代码的一线业务人员，这是官方定位「让每个人变成业务高手」的题中之义。它的竞争对手首先是 Excel 的习惯，打胜仗的关键是模板场景驱动：让用户十分钟内在招聘漏斗、门店巡检的真实场景里看到价值，隐藏数据库和权限这些重型概念，渐进披露。啊哈时刻就是表格状态一改、负责人自动收到通知的那一刻。产品介绍必须避开低代码、数据库这类术语，比如「给不会写代码、但要管一摊事的人：你的表自己会干活」。它只服务轻量业务管理，不替代专业系统，这是必须守住的边界。只要按这套打法，多维表格就能从文档套件里长出来，成为每个企业的业务系统。
    quality: low
    note: "流畅但依据不足：通篇复述官方口号与导读级结论链（模板驱动、渐进披露、啊哈=自动通知、避开术语、只服务轻量管理），把可能情况当固定答案，无具体用户与角色张力，功能动作未落到任务改善——用于检验评分器不被流畅文风带高分"
