    周源总，关于匿名功能，我的建议是：正式下线，并用专业身份认证承接可信表达。理由三层。第一，匿名保护的对象已经错位：它的初衷是保护「说真话的人」，如今却更多保护了「编故事的人」。1888 万彩礼事件中，匿名用户杜撰情节引发全网舆情，平台只能事后封号，而被污名化的地域与群体受到的伤害无法撤回；有企业家被匿名造谣后甚至无法自证。这类事件每发生一次，都在透支知乎「专业、真实」的社区心智——那是我们内容供给与商业化共同的根基。第二，外部环境已经变化：网信办今日发布的网络暴力信息治理规定征求意见稿，已把匿名投稿环节明确纳入平台管理责任，继续保留匿名，合规风险与舆情风险只会递增。第三，业务上可以承接：四月上线的专业身份认证，正在把「可信表达」变成新的供给机制。我也认真想过反方最强的理由：下线会损失一部分只有匿名才敢说的真实分享，比如职场与家庭中的敏感经历。这个损失真实存在，但值得用更可控的方式承接——例如限定可见范围、敏感话题先审后发——而不是保留一个零成本编故事的通道。落地建议：历史匿名内容限期自助转实名、下线公告与认证引导同步上线，三个月后复盘真实分享类内容供给量与造谣类舆情事件数的变化。以上，请您决策。
