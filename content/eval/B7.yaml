# B7 标准答案 ｜ AI 起草，待人工评审修订（T33 / D31）；仅供评分回归基准，不得进入题库运行时字段
question_id: B7
answers:
  - |
    MAU 下滑要拆成「获取、留存、结构」三层看。第一层是表层解释：公司主动缩减投放、低活跃用户流失——这是事实的一部分，2021 年营销费用同比翻倍式增长换来的用户，投放收紧后留不住并不意外。但「主动优化」只解释了下滑为什么现在发生，没有解释水分当初为什么存在。第二层是机制根因：增长引擎早已从社区自然增长切换为「买量+热点分发」。推荐与热榜取代关注关系成为默认分发后，流量向娱乐化、热点化内容倾斜，专业答主的回答被挤出前排，创作者收益又低于同类平台，优质供给持续流失；被热点吸引来的新用户与老用户期待的「专业问答社区」形成体验错位——老用户抱怨「水化」，新用户本就低忠诚。第三层是根本问题：商业化与社区调性的长期失衡，商业内容解决方案一年增长六倍，平台用信息密度换收入、用投放换规模。所以「挤水分」是症状不是病根，病根是增长模式透支了社区信任。验证方法：若真是主动优化，高活跃用户的时长、留存、盐选续费率应同步企稳；若这些指标仍在下滑，说明流失的是基本盘。判断对错的标准不在 MAU 本身，而在核心用户结构与创作者产出的变化趋势。
