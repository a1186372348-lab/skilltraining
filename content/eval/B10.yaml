# B10 标准答案 ｜ T33 基线题（主测维度：产品价值判断）
# 返工重写：样本按「2021 年 12 月决策时点初答」撰写，不引用任何决策时点之后的后续结果；
# AI 起草，供评分回归基准使用；待人工评审修订（D31），不泄露进题库运行时字段
question_id: B10
