  - text: |
      先说你说对的部分：每趟车的票额具体怎么分，官方只按「一车一策」制定，细账不公开，旅客只能看到「有票/候补」两种结果——信息不透明，换成我也会犯嘀咕。但「锁给内部渠道」不成立：票是真不够卖。一趟车定员不超两千席，热门车次开票那一秒涌进来每秒几万张需求，不到一秒售罄；高峰方向需求是运力的两倍以上，放多少都秒光。至于短途开售即候补，是「长途优先、兼顾中短途」的分配原则：票额先保全程和长途区间。这套原则的代价要说白：短途旅客让步了，中间区间常常一开售就只能候补；受益的是长途旅客和整列车的座位利用——短途敞开卖会把座位切成闲置碎片，长途旅客更买不到。候补则是官方免费排号：按订单生效时间排队，退改签、加挂、动态调整放出的新票按顺序兑现。官方公布整体兑现成功率 70% 以上——注意这是全国口径，具体到某条线路某个站间可能高也可能低，官方自己的例子里就有兑现率明显更低的站间；所以候补是「值得排」，不是「保证有」。第三方加速包不能插队，只是替你交候补还收你钱。建议：开票就抢，抢不到第一时间提交候补、多选几个车次日期组合，提交页面会显示预测的兑现成功率，可作参考。
    quality: high
    note: "复审修订高质量锚点：承认质疑的合理成分（票额预分细账不公开、信息不对称成立），「相对公平」落到分配原则与代价（谁受益、谁让步），成功率明确标注「全国整体口径、站间差异大」的局限，结尾落到可操作动作"
  - text: |
      票没有被锁，你这属于想多了。秒光原因很简单：人多票少——一趟车两千个座位，开票一秒钟几万人抢，系统再快也没用。短途显示候补是因为「长途优先」策略，先保长途旅客，这样最公平，不然座位利用率太低。候补就是官方排队，按提交顺序兑现，成功率 70% 以上，所以老老实实排基本都能买到，不存在画饼。第三方加速包确实是智商税，别花那冤枉钱。总结一句：这套机制已经很合理了，你抢不到票主要是手慢——下次提前定好闹钟，开售后第一时间下单，没抢到就马上候补，问题基本能解决。
    quality: medium
    note: "机制方向基本对但三处硬伤：质疑被全盘归为「想多了」、不承认信息不对称；把 70% 整体口径说成「基本都能买到」的个人承诺；「最公平」只给结论、不说谁让步谁受益——修订后 Rubric 下的中等表现锚点"
  - text: |
      兄弟你这是阴谋论，12306 是官方平台，怎么可能锁票给内部渠道？秒光就是中国人太多，没办法的事，哪个国家春运不抢票？候补是国家给的免费福利，排上队就等着就行，还有啥不满意的。官方都说了成功率 70% 以上，你买不到纯粹是运气差，多提交几次总能中。加速包确实没用，这个你骂对了，早就该管管这些第三方平台。我的建议是别纠结，回不了家就错峰出行或者买机票，铁路是公共服务，要相信国家会安排好一切，抱怨解决不了问题，有这时间不如多搬两块砖。
    quality: low
    note: "流畅但依据不足：回避机制只诉诸权威与「相信国家」式口号、把官方整体口径当个人兑现承诺（「多提交几次总能中」）、建议跑偏（错峰/买机票不回应机制疑问）——低分锚点"
