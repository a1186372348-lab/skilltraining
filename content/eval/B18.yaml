    票不是被锁了，是真的不够卖。先看一组数：一趟列车定员一般不超过两千个座位，而热门车次开票那一秒，涌进来的购票需求是每秒几万张——系统不到一秒就把席位卖完，这就是「秒光」。春运等高峰期，一些热门方向的需求甚至是运力的两倍以上，放多少票都会被瞬间抢空。那为什么同一趟车全程有票、短途却没有？因为长途列车实行「长途优先、兼顾中短途」：大部分票额先分给始发站和长途区间，很多中间站间一开始就没放票，所以开售即显示候补。这不是偏心——如果短途敞开卖，座位会被切成一段段闲置的碎片，长途旅客买不到票，整车运力也被浪费。候补又是什么？你可以把它理解成官方排号机：没买到票时先免费登记需求并预付款，系统按登记顺序排队；一旦有人退票改签、列车加挂车厢、或动态调整放出新票，就按顺序自动兑现，官方公布的成功率在 70% 以上。所以正确姿势是第一时间提交候补、多选几个车次日期组合——第三方「加速包」并不能插队，它只是替你交了份候补订单还收你钱。下次开票没抢到，别刷新骂系统了，先去排号。
