# B1 标准参考答案 ｜ AI 起草，待人工评审修订（T33 / D31）
# 仅供评测集使用（T28），不得泄露进题库运行时字段
# 复审返工后重写：样本扩为 4 份分层——两种立场的高质量答案（选图文 / 选搜索，界定互不相同）、
# 流畅但依据不足的低分样本、合理承认未知的高分样本；题面允许多种问题定义与共同逻辑判断成立，
# 高质量样本均不把单一解释当作唯一事实（answers 条目格式：{text, quality, note}）
question_id: B1
answers:
  - text: |
      我选定图文扩张，把问题定义为：带着明确信息获取目的的用户，在短视频形态下「拿不到、带不走」的效率断点。
      对象与场景：想在抖音查攻略、教程、清单类内容的用户——他们目的明确、需要快速浏览与保存，断点发生在「找到内容后提取信息」的环节：视频要配合 BGM 节奏卡点，不方便截图保存，用户只能在进度条里来回拖拽找信息点。
      目标差距：当前状态是目的性信息被封装在视频流里，获取效率受制于视频时长与节奏；期望状态是用户按自己的节奏浏览、提炼、保存；差距不在内容供给，而在媒介形态与信息密度的错配。
      边界：本定义只覆盖信息密集、目的明确的需求场景，不解释消遣型刷视频需求，也不承诺图文替代视频。
      依据与反证：图文上线后单日阅读量超 100 亿、超七成活跃用户每天看十几篇图文，可支持「需求真实存在」；但它不能证明做图文是唯一解——若数据显示图文阅读主要来自推荐流被动消费而非主动查找，我会把定义退回「内容形态补充」重新审视。
      共同逻辑判断：搜索与图文共享「承接目的性需求」的逻辑，本地生活还涉及供给与履约，超出本定义边界——共同逻辑部分成立，扩张到交易环节时证据不足。
    quality: high
    note: "立场A高质量：选定图文，定义为「短视频形态的信息获取效率断点」；对象/场景/差距/边界/依据五要素齐备，共同逻辑判断为「部分成立」并给出依据，未把单一解释当唯一事实"
  - text: |
      我选定搜索扩张，问题定义落在「需求已在站内自发生长、但产品没有承接」的错位上。
      对象与场景：带着明确目的打开抖音的用户，场景是搜索框——2021 年 2 月官方披露视频搜索月活超 5.5 亿，说明目的性使用已自发形成规模，不是平台教育出来的。
      目标差距：当前状态是海量用户带着问题来，但搜索结果的形态与消费链路不完整，搜到视频后仍要在进度条里找答案；期望状态是从提问到获得可行动结果的路径被打通；差距在「承接目的的产品形态」，而非需求本身。
      边界：本定义解释搜索与图文这类信息型目的；对电商、本地生活这类交易型目的只有部分解释力——交易还涉及供给组织与履约成本，我不主张用一个定义通吃。
      依据与反证：搜索月活数据能证明使用规模，但不能独自证明扩张的战略必然性——也可能是既有用户行为的自然外溢。要区分二者，需要看到搜索 query 的意图分布，以及用户在站外（搜索引擎、图文社区）的替代使用对比。证据到手前，我把它作为待验证假设使用。
      共同逻辑判断：信息型扩张之间成立，扩展到交易型扩张时证据不足，我选择「部分成立」。
    quality: high
    note: "立场B高质量：选定搜索，定义为「目的性需求已存在但缺承接形态」——与立场A的断点位置判断不同，形成真实分歧；明确区分「使用规模证据」与「动机证据」，共同逻辑同样判部分成立"
  - text: |
      抖音的扩张是典型的超级应用逻辑。流量见顶之后，平台必然焦虑，必须寻找第二增长曲线，图文、搜索、电商、本地生活都是这个逻辑下的标准动作。中国互联网的历史已经反复证明，超级应用是终局形态，微信如此，支付宝如此，抖音也不会例外。本质上，抖音是在把流量优势变现为生态优势，从娱乐方式进化为生活方式，这是管理层早就定下的战略。图文用户占比 70% 说明图文战略大获成功，GMV 增长 256% 说明电商和本地生活已经跑通，回头看这些扩张都是必然的，也都是正确的。产品经理要学的，就是抖音这种在正确的时间做正确的事的战略定力，以及「高频打低频」的扩张方法论。下一个业务，抖音应该继续做金融和出行，把超级应用进行到底。
    quality: low
    note: "流畅但依据不足：通篇复述「超级应用/流量见顶焦虑/战略定力」等现成观点，无对象/场景/差距/边界的界定，误用「70%」「256%」后验结果倒推扩张必然正确——用于检验评分器不被流畅文风带高分"
  - text: |
      我能从案例中确认的断点事实有限：视频搜索月活超 5.5 亿（2021 年 2 月披露）说明目的性使用已存在；图文上线一年内单日阅读量超 100 亿说明形态补充被接受。
      基于此给出暂定定义：抖音要解决的是「目的性需求在站内已自发生长、但短视频形态承接效率不足」的问题——对象是带着明确目的的用户，场景是搜索与攻略类信息获取，差距在承接形态而非需求本身。边界上只覆盖信息型目的场景，不承诺解释交易型扩张。
      但必须承认证据缺口：第一，5.5 亿月活是使用规模证据，不能证明扩张动机——可能是主动战略卡位，也可能是被动承接，案例内没有决策层动机的一手证据；第二，图文阅读量包含推荐流被动消费，无法区分「主动查找」与「顺便刷到」，两者对应完全不同的问题定义；第三，6 亿 DAU 是最后一次官方口径，此后官方未再披露，无法据此判断流量是否见顶。
      要把定义做实，需要三类证据：搜索 query 的意图分布、图文消费的主动与被动结构、扩张决策时的内部优先级记录。在此之前，我把上述定义作为待验证假设使用，共同逻辑是否成立暂不判定——这不是回避，而是现有证据只够走到这里。
    quality: high
    note: "合理承认未知：给出暂定定义并逐项标明证据缺口与所需补充证据，符合能力模型「现有证据不足+说明需要什么证据是合法严谨产出」的反机械化规则——应得高分"
