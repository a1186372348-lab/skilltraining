# B15 标准答案（T33 / D31：AI 起草，待人工评审修订）
question_id: B15
review_status: draft
answers:
  - |
    「走对了」要先翻译成三个可证伪的命题：一，有真实需求的用户在站内完成购买且持续复购；二，买手与商家能稳定赚钱、持续经营，而非靠平台扶持刷存在感；三，电商化没有反噬社区基本盘。三者同真才算走对。

    指标体系分三层。结果层：GMV、购买用户数、复购率、客单价，看「买」是否成立；过程层：求购评论到点击到下单的转化漏斗、买手与商家撮合效率、店播 GMV 占比，看链路是否顺畅、生态是否从头部买手向中腰部与店播扩散；护栏层：社区 DAU、时长、笔记互动率、带货笔记负反馈率，看商业化是否伤害基本盘。

    判断标准用三把尺子：与转型前自营时期比，购买规模是否远超福利社时代；与时间表比，如一年内店播 GMV 占比是否过半；与投入比，GMV 增量是否对得起千亿流量与亿级补贴的机会成本。

    同时校正官方数字的虚荣性：买手规模增长 27 倍、撮合增速 370% 是低基数加强扶持下的增速，要换成质量口径——90 天后仍活跃的买手占比、剔除流量扶持的自然成交占比、买手月产出的中位数。章小蕙破亿证明的是天花板，不是地板。

    验证方法用对比代替单点：转型前后同周期对比；受扶持买手与自然生长组对比；追踪单用户跨周期行为，区分「新增消费」与「存量消费搬家」。结论设成条件式：复购率与护栏指标健康、自然成交占比持续上升，则加注；GMV 涨但社区互动与留存连续两季下滑，或成交高度依赖头部买手与补贴，则判定证伪，收缩扶持、回头修链路。
