# B15 标准答案（T33 / D31：AI 起草，待人工评审修订）
# 复审修订（修改项④核查落实）：原高分样本有条件式结论但无归因边界意识，已替换——
# 新样本对齐题干「2 个季度窗口与比较基准」，体现混杂排除与归因边界（answers 条目格式：{text, quality, note}）
question_id: B15
review_status: draft
answers:
  - text: "先把「走对了」翻译成三个可证伪命题：用户愿意站内购买并持续复购；买手与商家不靠扶持也能稳定经营；电商化没有反噬社区基本盘。以未来 2 个季度为窗口，指标分三层：结果层看 GMV、复购率、剔除扶持流量的自然成交占比；过程层看求购到下单的转化漏斗与撮合效率；护栏层看社区活跃、互动与留存。判断基准：与转型前自营期比是否数量级提升，与千亿流量扶持和补贴的投入比是否值回机会成本。同时校正官方口径：「27 倍、370%」受低基数与扶持影响，换成 90 天活跃买手留存、买手产出中位数等质量口径；且前后对比不自动证明转型有效——大盘自然增长与扶持加码都是混杂因素，需用受扶持组与自然生长组对照、单用户跨周期追踪排除，区分新增消费与存量搬家。最后说清归因边界：复购、自然成交占比、护栏趋势在窗口内可验证；品牌心智是否受损、社区长期价值变化，2 个季度内无法归因，需要更长周期与对照数据，这部分只能标注「暂无定论」而非强行下结论。若复购与自然成交健康、护栏不破则加注；若成交依赖补贴与头部买手、或社区指标持续受损，则收缩扶持回头修链路。"
    quality: high
    note: "复审修订后的高分锚点：在三命题、三层指标与双基准（自营期/投入）之上，明确前后对比需排除大盘增长与扶持投入等混杂因素，并明示归因边界——品牌心智等窗口内无法归因的判断标注「暂无定论」而非强行收敛；对应 Rubric 新增的混杂排除与归因边界得分通道"
