    我的排序：优先闪购，优选收缩聚焦、设定止损线。依据有四。一是需求属性：闪购解决「现在就要」的即时性需求，高频、时效溢价明确，与外卖用户高度重合，是存量用户的场景延伸；优选解决计划性低价采购，需求真实但用户价格敏感、忠诚度低，且与美团既有用户重合度低，需要重新教育市场。二是能力复用：闪购复用骑手配送网络与本地商户供给，边际投入小、单量密度能快速爬坡；优选要从零重建仓储、物流与团长网络，件均履约成本只有在极大单量密度下才降得下来——这正是管理层后来承认「规模增长低于预期」的死结。三是竞争与政策：社区团购要正面迎战原生低价打法的对手，而「九不得」早已锁死低价倾销这条最快的扩张路径，赢面小、打法受限；即时零售当时尚无统治性玩家，且与美团「本地生活」心智一致。四是止损设计：优选不必立即放弃——下沉市场入口的价值真实存在——但应限定区域与预算，以「件均履约成本的下降斜率」为去留硬指标，不达标即退出，而非被「五年一遇的机会」叙事拖着无限投入。验证信号：盯三组数——闪购日均单量与用户复购频次（需求是否成立）、非食品类占比（能否突破客单价天花板）、新业务亏损收窄速度（投入是否可承受）；同时盯优选的件均履约成本与用户留存。若闪购单量爬升而优选成本曲线走平，就加码闪购、关停优选。事后看，美团 2024 至 2025 年实际走的正是这条路径——但高质量的答案不在猜中结局，而在排序依据与止损设计在事前就站得住。
