      我的排序相反：优选优先，闪购限定预算跟随。第一，买菜是高频刚需入口，社区团购在低线城市站稳，换来的是美团最缺的东西——下沉市场新用户：2021 年美团新增交易用户 1.8 亿、是上年三倍，王兴称之为五年甚至十年一遇的机会，战略价值不止买菜本身的毛利。第二，竞争窗口：行业刚洗完牌，同程生活破产、橙心与十荟团收缩，第一梯队只剩多多买菜与优选，此时收缩等于把 2600 个市县的履约网络让给拼多多，而拼多多主站与美团用户重合度低，输掉这一仗伤的是美团未来的用户基本盘。第三，闪购虽增长快但盘子小、客单价低——630 万峰值单量对外卖 5000 万峰值，且京东到家联合小时购在商超供给上更深；它复用骑手网络即可低成本生长，不需要大额增量投入。我的关键假设是「监管框架内，优选件均成本能随单量密度降到盈亏平衡」；若 2022 年底件均成本仍无明显下降，或新业务亏损率仍高于七成，就降级为区域经营。验证信号：优选件均成本与密度的关系曲线、新用户 12 个月留存与跨业务转化、闪购客单价与复购频次。
    quality: high
