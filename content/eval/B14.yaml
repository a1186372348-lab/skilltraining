      坦率说，现有信息不足以让我拍板唯一排序，我给的是条件式结论。两条线的关键未知数不同：优选的问题是「件均履约成本能否随单量密度降到盈亏平衡」——2021 年 GMV 约 1200 亿未达目标、新业务亏损率 76.4%，但案例内没有分区域的单位经济数据，无法判断是模式不成立还是密度不够；闪购的问题是「约 3 亿消费者、低客单价的即时需求能否撑起一个大盘子」——630 万峰值单量增速可观但基数小，且京东到家在商超供给端更深。在拿到三组数据之前——优选分区域件均成本与密度的对应关系、闪购用户的复购频次与客单价分布、两条线各自新增用户的留存——我的过渡安排是：两边都不追加超额投入，闪购按现有复用模式自然增长，优选冻结新开城、把预算集中到件均成本最低的几个区域做对照，三个月后按数据再定优先级。当前证据能支持「两条线都有真需求」，但不能支持「哪条线的单位模型先跑通」；强行二选一，是对证据的不诚实。
