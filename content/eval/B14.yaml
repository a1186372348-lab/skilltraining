      我的排序：闪购优先，优选收缩聚焦并设止损线。依据有四条，都落在事实上。一是需求与空间：即时零售对应「现在就要」的场景，现有约 3 亿消费者、以高线年轻用户为主，与美团 6.9 亿交易用户和外卖心智重合，是存量用户的场景延伸；优选对应计划性低价采购，需求真实，但用户价格敏感、忠诚度存疑。二是成本结构：外卖 5000 万单峰值摊出来的配送网络可被闪购直接复用，而优选的仓储与团长网络要另起炉灶——2020 年四季度 60 亿新业务亏损约一半来自优选，说明其单量密度还撑不起履约成本。三是监管与竞争：九不得与 650 万顶格罚款封死了低价补贴这条最快的路，而剩下的对手多多买菜恰恰最擅低价打法；即时零售虽有京东到家 372 亿 GMV 在前，美团份额约 37% 尚且领先。四是止损设计：优选不立即放弃——与公司 1.8 亿年新增用户相伴的下沉入口价值真实——收缩到件均成本最低的优势区域，以件均履约成本的下降斜率为去留硬指标，两个季度不达标就退出。验证信号：闪购盯日均单量、复购频次与客单价，优选盯件均成本与留存，同时盯新业务亏损收窄速度。
