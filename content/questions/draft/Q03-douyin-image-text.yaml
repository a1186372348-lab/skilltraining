main_question: "一个以短视频为绝对主形态的产品，为什么要上线「图文」这种看似倒退的内容形态？请按资料中的具体阶段（2021 年 11 月图文功能上线、2022 年 9 月创作者大会加码扶持）分析：每个阶段抖音在回应哪些用户与创作者的需求，设计与资源动作如何与这些需求对应。再回答第二问：如果由你负责图文在抖音里的位置，你首先要保护什么（如用户留存、消费体验、优质供给、创作者收益），并愿意为此接受什么代价？图文若替代了一部分视频观看时间，你如何判断这种替代是否改善了用户价值？"
ability_tags:
  - 用户理解
  - 产品价值判断
  - 方案设计
difficulty: 基础
domain: "内容/社交"
rubric:
  dimensions:
    用户理解:
      - "供给端差异：能指出哪类创作者在短视频形态下遇到的具体生产困难（如不具备策划/拍摄/剪辑的能力或时间、没有持续出镜条件、已有图文素材无处可用），并说明图文缓解了其中哪些困难、哪些并未缓解——「供给门槛低」类资料观点须展开为具体机制才算独立论证，仅复述按证据使用质量评分。"
      - "消费端差异：按「读者带着什么任务来」区分图文与视频各自更适配的场景（如检索、收藏、比对、照做类任务与沉浸观看、动态演示类任务的差别），并说明判断依据；不预设图文或视频全面更优。"
      - "跨场景切换：能解释同一用户为何会在不同场景下于图文与视频之间切换（任务目标、时间约束、信息密度需求如何变化），而非把用户静态划分为「图文人群」与「视频人群」。"
      - "比较对象的使用：可以把小红书等平台用户作为比较对象来推断任务差异，但须把人群标签还原为有依据的任务与场景分层；仅以「小红书用户」标签代替分层依据的不得高分。"
    产品价值判断:
      - "价值来源与成立条件：论证图文对抖音的价值来自哪里、对谁成立（用户任务完成、创作者供给、平台分发与商业化中的哪一环），并说明每一环成立的条件——「形态多元化→创作者盘子扩大→变现面扩大」之类链条须逐环给出依据，不得当作必然。"
      - "对资料观点的检验：「图文是种草/电商转化的内容基础设施」「对标小红书、争夺种草心智」等为资料中的可质疑判断而非高分必答结论——予以论证、修正或有依据地质疑均可得分；仅复述不当作独立论证，按证据使用与检验质量评分。"
      - "立场与判据：对「是否形态倒退」立场不限，但判据须具体可检验（补全了哪个生产成本带与消费场景、代价是什么、什么证据会改变判断），而非口号式表态。"
    方案设计:
      - "目标用户与场景明确：方案服务的创作者与读者画像、场景与自己的用户分析对应，而非泛泛「加一个入口」。"
      - "保护清单先行：先说明要保护什么（如用户留存、消费体验、优质短视频供给、创作者收益），并据此定义要控制的风险与可观测的越线信号，而非以「不伤害基本盘」一句带过。"
      - "可接受代价：允许图文替代部分视频观看时间，关键是能解释这种替代是否改善用户价值、判据是什么；把「图文绝不能分走视频时长」当前提，或完全不考虑替代代价的，均不得高分。"
      - "链路完整：供给侧冷启动（激励、分成、工具）或消费侧承接（分发场景、搜索与收藏等任务链路）至少一条设计完整，并说明它与风险控制的配合方式。"
  forbidden_leaks:
    - "「图文是对生产成本带与消费场景的补全、与短视频互补而非形态倒退」的整套定性链条（把「为什么做」与「做得对不对」一次给全的导读级结论）"
    - "对图文与短视频关系的定性判断（「必然稀释/伤害基本盘」或「完全无害、纯增量」均不得直接给出）"
    - "「图文替代部分视频时长是否改善用户价值」的结论性答案（「替代即提效」或「替代即堕落」均不得直接给出）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目含两问：「为什么做」与「图文该怎么安放、控制什么风险」。动笔前先想清楚：回答「为什么」时，你会从供给端（创作的人）还是消费端（看的人）切入，还是两端互证？你在第一问里的用户分析，打算如何成为第二问设计判断的地基？"
  - level: 2
    stage: 视角补充
    question: "想象一个想在抖音发点什么、但对着拍摄键犹豫了三次最终放弃的人——他可能卡在哪？再想象一个着急查「空气炸锅怎么选」的人：30 秒短视频和 9 张图，他更想要哪个？还是这同一个人，周末躺沙发刷半小时放松时，他又会选哪个形态，为什么？"
  - level: 3
    stage: 反例/风险
    question: "字节此前做过独立图文社区「新草」，一年即停运。这个失败能说明什么、不能说明什么——它独自就能证明图文是伪需求吗？试着从三个角度比较新草与抖音图文：用户场景（用户各自来完成什么任务）、分发条件（独立 App 冷启动与站内既有流量池）、执行差异。比较之后，新草的结局对判断抖音图文意味着什么？"
  - level: 4
    stage: 取舍权衡
    question: "首页流量近似零和：每分给图文一份，短视频就少一份。动笔前先列出你的保护清单——用户留存、消费体验、优质视频供给、创作者收益，哪个排在最前、为什么？在这份清单下，你愿意接受图文分走哪类时长，哪类代价你越线不接受？"
  - level: 5
    stage: 验证方式
    question: "图文上线一段时间后，你会同时看哪几组数来判断它做对了——这些数能否区分「增量生态」（把蛋糕做大）和「存量挪移」（视频用户换个地方花时间）？如果图文确实替代了一部分视频观看时长，什么数据能说明这种替代改善了用户价值，什么数据说明它在损害？"
