# Q03 ｜ 抖音为什么上线「图文」内容形态
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
# 复审返工（产品负责人裁决：有条件通过，4 项调整 + 横切 forbidden_leaks 收窄）：
# ① Rubric 三维改开放判断式：用户理解改测场景差异（供给端困难/消费端任务/同用户跨场景切换），
#   「小红书用户」仅作比较对象；「图文是电商基础设施」等资料观点为可论证判断而非高分必答结论；
# ② 改完整复盘口径：主问题删「当时的」，按资料具体阶段分析；时序修正——「探索」入口内测与图文
#   流量分成是 2022 年 9 月创作者大会动作（新华网 2022-09-21 报道核实），非 2021 年 11 月上线时已有；
# ③ 第二问由「不伤害短视频基本盘」改为「先说明保护什么 + 可接受代价」，允许图文替代部分视频时长，
#   只要能解释替代是否改善用户价值；
# ④ 提示树 L3 重写：新草一年停运不能独自证明图文是伪需求，须比较用户场景、分发条件与执行差异；
# 横切：forbidden_leaks 收窄为整套作答导读级结论链，资料观点移出并在 Rubric 注明「复述不算独立论证」
id: Q03
title: "抖音为什么上线「图文」内容形态"
case_title: "短视频霸主为何「倒退」做图文"
case_background:
  product:
    text: "抖音——字节跳动旗下短视频平台，以单列全屏沉浸式视频流为核心形态。"
    citations: [1, 2]
  audience:
    text: "内容消费者（泛娱乐用户）与内容创作者（从专业机构到普通用户）；平台侧关注创作者生态与商业化（广告、电商）——2022 年 9 月抖音宣布以流量、产品、变现三大手段扶持图文作者。"
    citations: [1, 3]
  scenario:
    text: "2021 年 10 月，抖音在短视频绝对强势的时期内测短图文发布功能，同年 11 月图文功能正式上线：用户可发布多张图片配文字，以类似翻页相册的形式在信息流中被消费。上线初期图文没有独立入口，流量激励、变现渠道等系统加码是 2022 年 9 月创作者大会前后才宣布的。"
    citations: [1, 2, 3]
  features:
    text: "图文能力按阶段铺开：2021 年 11 月上线时为图文发布器与信息流翻页相册形态；2022 年 9 月创作者大会宣布一组加码动作——针对部分图文兴趣用户内测首页「探索」一级入口（以双列瀑布流分发图文）与搜索「经验」卡、上线多款图文创作工具，并宣布将面向部分创作者开放有用图文流量分成（优质图文按搜索量与收藏量获得现金激励）、向部分万粉以下优质图文作者开放星图权限；2023 年起进一步延展到图文带货等电商场景。"
    citations: [1, 3]
  status:
    text: "图文已成为抖音内容生态的常驻形态并持续加码：2022 年 9 月创作者大会披露图文日均播放量已超百亿，并宣布未来超四成图文流量向「生活经验、攻略测评」与「小众兴趣」两类方向倾斜；2023 年抖音电商生态大会宣布重点突破图文方向，2025 年内测支持约 4000 字的长图文；同期市场上已出现约二十款对标小红书的产品或功能，多数未果。"
    citations: [3, 1, 4, 2]
