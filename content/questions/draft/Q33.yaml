id: Q33
title: "Steam 家庭共享：怎样取舍资源共享和游戏访问限制"
case_title: "共享游戏库时，谁能先玩？"
case_background:
  product:
    text: 2014 年 2 月 28 日，Valve 宣布 Steam Family Library Sharing 向 Steam 用户开放。
    citations:
      - 1
  audience:
    text: 该功能面向共用电脑、希望共享游戏库的玩家；各人可保留自己的成就和云存档。
    citations:
      - 1
  scenario:
    text: 2014 年报道说明，一个共享游戏库同一时间只能由一人使用，即使两人想玩不同游戏也有冲突。
    citations:
      - 2
  features:
    text: 玩家可授权共用电脑访问游戏库；2014 年报道说所有者开始使用时，借用者会收到提示并需退出。2013 年测试公告还提及购买游戏的选择。
    citations:
      - 1
      - 2
      - 3
  status:
    text: 这道题以 2014 年开放时的共享库限制为决策背景；资料未提供销售、并发需求或开发者反馈数据。
    citations:
      - 1
      - 2
