id: Q19
title: Airbnb 分类搜索：没有固定目的地时用户能获得什么价值
case_title: 先选想住的地方类型，再决定去哪
case_background:
  product:
    text: Airbnb 提供房源搜索与预订；2022 年夏季发布将 Categories 作为新的房源发现方式。
    citations:
      - 1
  audience:
    text: 案例关注旅行日期或目的地有一定弹性的潜在旅客，以及向平台提供房源的房东。
    citations:
      - 1
      - 3
  scenario:
    text: Airbnb 将目的地未完全确定、希望先探索独特房源的旅行规划作为相关场景。
    citations:
      - 1
      - 3
  features:
    text: 2022 年发布介绍按房源风格、位置或活动等组织的分类；同次还介绍拆分长住订单的 Split Stays。
    citations:
      - 1
      - 2
  status:
    text: Airbnb 于 2022 年 5 月开始推广新版搜索；后续材料描述过分类及搜索的进一步变化，但不应当成 5 月已知效果。
    citations:
      - 1
      - 5
