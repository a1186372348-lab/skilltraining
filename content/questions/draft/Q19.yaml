main_question: 假设你需要判断 Categories 对没有固定目的地的旅客是否有价值：请选择至少两类旅行规划场景，说明分类搜索相对按目的地搜索可能改善什么、又可能增加什么成本；再提出一套验证价值的办法。可以认为不同人或同一人在不同时刻会得出不同答案。
ability_tags:
  - 产品价值判断
  - 用户理解
  - 指标与验证
difficulty: 中等
domain: 出行
kind: daily
rubric:
  dimensions:
    产品价值判断:
      - 将潜在价值落在具体规划任务，并与按目的地搜索这一替代方式比较。
      - 讨论发现灵感与筛选成本或不相关房源之间的权衡，不预设分类总是更好。
      - 结论须说明成立条件与证据不足，不能把公司旅游分析当作因果证明。
    用户理解:
      - 区分目标明确与愿意探索的人，或区分同一人在不同旅程阶段的需要。
      - 同时考虑房源供给方与旅客的信息需要，但不凭空声称某类房东受损。
      - 分析类别、位置、时间和预算等约束如何改变用户选择。
    指标与验证:
      - 提出衡量发现过程与后续行动的指标，说明观察对象和窗口。
      - 设计可执行的对照，并考虑目的地、房源可用性和季节差异。
      - 设置相关性或信息负担护栏，指出仅看点击量的局限。
  forbidden_leaks:
    - 完整的旅客分层、价值比较和实验指标组合。
    - 分类搜索一定带来更多预订或一定削弱目的地搜索的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 一个人已经确定城市，另一个人只想住有特色的地方，他们会从哪里开始？
  - level: 2
    stage: 视角补充
    question: 同一个用户在找灵感和确认出行日期时，搜索需求会改变吗？
  - level: 3
    stage: 反例与风险
    question: 如果喜欢某个房源但日期、预算或距离不合适，分类点击意味着什么？
  - level: 4
    stage: 取舍权衡
    question: 你会优先减少哪种成本，同时接受什么额外筛选负担？
  - level: 5
    stage: 验证方式
    question: 如何比较两种入口而不把季节和房源差异误认作效果？
