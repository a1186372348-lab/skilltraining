# B3 ｜ 支付宝诞生：先解「信任」，再解「支付」
# 批次：T33 题库扩容第一批基线题（B3）｜ 主测维度：问题定义 ｜ 状态：草案，待产品负责人评审后上架
id: B3
title: "支付宝诞生：先解「信任」，再解「支付」"
case_title: "一笔差点被退掉的 750 元相机交易"
kind: baseline
domain: 金融
difficulty: 基础
case_background:
  product:
    text: "支付宝——蚂蚁集团旗下第三方支付平台，其前身是 2003 年 10 月淘宝网为站内交易推出的「担保交易」服务：由淘宝暂时保管货款，待买家确认收货后再转给卖家；2004 年 12 月 8 日，支付宝正式成立。"
    citations: [1, 3]
  audience:
    text: "淘宝网上的陌生买家与卖家——C2C 交易中双方互不相识、分处异地；当时中国个人信用体系覆盖面极其有限，早期电商用户大多只能选择同城见面交易，远程汇款则让买卖双方都不放心。"
    citations: [1, 4]
  scenario:
    text: "「先付款还是先发货」是个死结：买家怕付了钱收不到货，卖家怕发了货收不到钱，谁也不相信谁，交易一谈不拢就停摆；有用户在淘宝论坛提出「只要淘宝能保证资金安全，就敢用线上交易」。第一笔担保交易中，西安买家付款后立刻后悔、申请退款，是客服报出自己的真实姓名、工号和手机号，并承诺「如果出了问题，我用工资赔你」，才让他重新建立信心完成交易。"
    citations: [1, 2]
  features:
    text: "担保交易的机制：买家先把货款打给淘宝保管 → 卖家发货 → 买家收到货并确认无误 → 淘宝再把钱转给卖家，淘宝在交易链条中担任第三方担保与仲裁角色。2003 年 10 月，西安大学生焦振中以 750 元买下一台二手富士相机、卖家崔卫平身在日本横滨，这笔跨境交易成为支付宝史上第一笔担保交易。"
    citations: [1, 2]
  status:
    text: "担保交易迅速被接受：不到一年时间，淘宝 70% 以上的商品已被担保交易覆盖；2010 年支付宝推出快捷支付，将支付成功率从 65% 大幅提升至 95% 以上；蚂蚁集团董事长井贤栋多年后总结：担保交易「真正激活了电子商务里的信任机制」，让 8 亿人得以放心网购；如今支付宝已从电子钱包发展为数字生活开放平台，服务超 10 亿用户与 8000 万商家。"
    citations: [1, 3, 4, 5]
