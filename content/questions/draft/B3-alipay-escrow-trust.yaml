# B3 ｜ 2003 年淘宝的交易死结
# 批次：T33 题库扩容第一批基线题（B3）｜ 主测维度：问题定义 ｜ 状态：草案，待产品负责人评审后上架
# 返工说明：评审意见「题目先给出信任结论、独立定义空间不足」——主问题改为让用户依据 2003 年
# 交易行为自行界定问题；官方多年后「信任问题」总结与后续结果移入 reveal_after_first_answer（初答后披露）
id: B3
title: "2003 年淘宝的交易死结"
case_title: "一笔差点被退掉的 750 元相机交易"
kind: baseline
domain: 金融
difficulty: 基础
case_background:
  product:
    text: "淘宝担保交易——2003 年 10 月，C2C 网站淘宝网为站内交易推出「担保交易」服务：买家货款先由淘宝暂时保管，买家确认收货后，淘宝再把钱转给卖家（该服务次年 12 月独立为支付宝）。"
    citations: [1, 3]
  audience:
    text: "淘宝网上的陌生买家与卖家——C2C 交易中双方互不相识、分处异地；当时中国个人信用体系覆盖面极其有限，早期电商用户大多只能选择同城见面交易，远程汇款则让买卖双方都不放心。"
    citations: [1, 4]
  scenario:
    text: "「先付款还是先发货」是个死结：买家怕付了钱收不到货，卖家怕发了货收不到钱，谁也不相信谁，交易一谈不拢就停摆；有用户在淘宝论坛提出「只要淘宝能保证资金安全，就敢用线上交易」。第一笔担保交易中，西安买家付款后立刻后悔、申请退款，是客服报出自己的真实姓名、工号和手机号，并承诺「如果出了问题，我用工资赔你」，他才重新决定完成交易。"
    citations: [1, 2]
  features:
    text: "担保交易的机制：买家先把货款打给淘宝保管 → 卖家发货 → 买家收到货并确认无误 → 淘宝再把钱转给卖家，淘宝在交易链条中担任中间保管与协调角色。2003 年 10 月，西安大学生焦振中以 750 元买下一台二手富士相机、卖家崔卫平身在日本横滨，这笔跨境交易成为担保交易的第一笔订单。"
    citations: [1, 2]
  status:
    text: "担保交易上线时，国内电商刚刚起步：早期用户大多只能同城见面交易，远程汇款让买卖双方都不放心；新机制也没有立刻打消顾虑——第一笔订单的买家在付款后随即反悔、申请退款，最终靠客服的个人承诺才完成交易。"
    citations: [1, 2]
