main_question: "支付宝官方多年后总结：它最初解决的本质上是「信任问题」。请你回到 2003 年复盘这个定义——当时真正需要被解决的问题到底是什么，为什么它不能被简化为「做一个更好用的支付工具」？这个定义又是如何决定「担保交易」这个产品形态的？"
ability_tags:
  - 问题定义
  - 用户理解
  - 根因分析
rubric:
  dimensions:
    问题定义:
      - "能区分「用户说出的需求」（更安全的付款方式）与「真正的问题」（陌生买卖双方互不信任、款货无法两讫的死结），并指出定义不同会导出不同产品形态：支付通道 vs 信用中介。"
      - "能把「交易做不起来」还原为交易链路中的具体断点（付款与收货的时间错位、缺少担保与仲裁环节），而非笼统归因于「用户还不习惯网购」。"
      - "能指出该问题定义的适用边界：它解释的是 C2C 陌生交易的死结，而非所有线上交易（如自营 B2C 的痛点不同），避免把个案结论无限泛化。"
      - "能用案例中的事实证据（论坛用户原话、第一笔交易因不信任险些退款）校验自己的问题定义，而非纯概念推演。"
    用户理解:
      - "能分别站在买家与卖家视角，还原各自的具体恐惧（付了钱收不到货／发了货收不到钱），并指出双方恐惧发生在交易的不同时点。"
      - "能解释既有替代方案（同城见面、银行汇款、先货后款）为什么撑不起一个全国性 C2C 平台——背后是交易成本与信任结构，而非用户「保守」。"
      - "能识别第一笔交易中用户行为（付款后立刻后悔申请退款、被客服个人承诺说服）所暴露的真实决策心理：缺的不是工具，是敢用的理由。"
    根因分析:
      - "能给出分层归因：表层是支付工具不便（汇款繁琐、U盾门槛），中层是交易机制缺失（无担保、无仲裁），底层是商业信任制度缺位（个人信用体系覆盖有限）。"
      - "能说清「根因定义为信任问题」与「定义为支付问题」的解空间差异：后者优化付款环节，前者重构交易关系（引入第三方担保与仲裁）。"
      - "能用结果证据反向校验根因判断：担保交易不到一年覆盖淘宝 70% 以上商品、此后电商爆发，说明根因找对了方向。"
  forbidden_leaks:
    - "「付款与收货时间错位导致款货无法两讫」的交易结构分析框架"
    - "「平台从支付通道变为信用中介／担保人」的形态推论"
    - "「担保交易一年覆盖 70% 商品反向证明问题定义正确」的校验逻辑"
    - "「用户不是不会付、是不敢付」的言辞与行为区分方法"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求你定义「真正需要解决的问题」。动笔之前先分清三件事：用户嘴上说想要的（更方便的付款方式）、用户行为暴露出来的（不敢完成交易）、平台数据能看到的（支付成功率低）——这三者是同一个问题吗？你会先验证哪一个？"
  - level: 2
    stage: 视角补充
    question: "代入 2003 年的两个人：西安那个想买二手相机的大学生，和日本横滨那个想卖相机的留学生。把这笔交易在「没有任何第三方介入」的情况下推演一遍——他们各自最怕的那一刻，分别发生在交易的什么时间点上？"
  - level: 3
    stage: 反例/风险
    question: "当时并非没有替代方案：同城见面交易、银行汇款、货到付款都有人用。这些方案各自解决了什么、又留下了什么？为什么它们撑得起一笔一笔的零散交易，却撑不起一个全国性的 C2C 平台？"
  - level: 4
    stage: 取舍权衡
    question: "担保交易让平台自己成了「资金保管人」：替别人管钱，意味着资金安全、合规、「平台会不会卷款跑路」的质疑全都要自己扛。如果你是当时的负责人，你凭什么判断把这份责任揽上身是值得的？什么信号出现，说明这个判断做错了？"
  - level: 5
    stage: 验证方式
    question: "如果回到 2004 年让你复盘「问题有没有被定义对」，你会看哪几组数据——是支付成功率、交易转化率，还是别的？这些数据怎么区分「用户真的敢交易了」和「只是把线下已发生的交易搬到了线上」？"
