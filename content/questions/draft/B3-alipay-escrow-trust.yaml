uncertainty:
  - "第一笔担保交易的具体日期存在口径差异：解放日报报道为 2003 年 10 月 18 日，另有部分媒体写为 10 月 15 日，案例背景只写「2003 年 10 月」以规避冲突。"
  - "第一笔交易相机价格有「700 多元」（解放日报）与「750 元」（央广网、证券时报）两种表述，案例采用多数口径 750 元。"
  - "卖家姓名主流报道为「崔卫平」，个别报道误写为「崔伟平」，案例采用崔卫平。"
  - "「担保交易不到一年覆盖淘宝 70% 以上商品」分别见于解放日报（「不到一年」「70% 以上的商品」）与 36氪（「仅仅一年」「占比达到 70%」），两源口径一致，予以采用。"
  - "井贤栋「8 亿人放心网购」为 2020 年演讲口径，反映的是当时规模；案例背景中的现状数据以证券时报 20 周年报道的「服务超 10 亿用户与 8000 万商家」（2024 年口径）为准。"
