id: Q10
title: "Keep 做健身商城：场景延伸还是分散焦点"
case_title: "当健身 App 卖货收入曾占半壁江山：Keep 商城的十年之问"
case_background:
  product:
    text: "Keep——2015 年 2 月上线的健身 App，早年以免费健身软件形象示人；2023 年 7 月 12 日在港交所主板上市（3650.HK），被称为「运动科技第一股」。"
    citations: [1, 3]
  audience:
    text: "健身初学者与大众运动用户——2021 年公司口径注册用户超过 3 亿，为当时中国最大的在线健身平台；2023 年平均月活 2976 万、平均月度订阅会员 319 万；上市后还要对资本市场负责。"
    citations: [1, 3, 5]
  scenario:
    text: "用户在 App 内跟练课程，同时被推荐智能动感单车、手环、跑步机、健身装备与健康轻食等自有品牌商品。"
    citations: [1]
  features:
    text: "免费与会员课程、Keep App 商城（自有品牌消费品）、智能硬件（手环、跑步机、动感单车）、Keepland 线下健身房。公司年报口径：自有品牌运动产品同时通过自有线上渠道（含 Keep App 商城）、第三方电商平台与批发渠道销售——因此「自有品牌收入」并不等于 Keep App 商城的销售表现。"
    citations: [1, 2, 8]
  status:
    text: "自有品牌运动产品曾是 Keep 第一大收入来源：2020 年收入占比接近六成、2022 年为 51.4%，但 2023 年占比已降至约 44.2%，被线上会员及付费内容（46.6%）反超；且该占比是全渠道加总口径，App 商城的单渠道表现并无单独公开数据。上市后营收连续下滑：2023 年 21.38 亿元（同比减少 3.3%）、2024 年再降约 3.4%；2024 年经调整净亏损约 4.7 亿元。此后公司收缩聚焦并押注 AI：2025 年营收 16.37 亿元（同比减少 20.7%），首次实现年度经调整盈利（经调整净利润 2521.6 万元），但 IFRS 口径仍净亏损 7178.6 万元。"
    citations: [1, 2, 4, 5, 6, 7, 8, 9]
