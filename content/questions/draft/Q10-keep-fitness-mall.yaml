# Q10 ｜ Keep 做健身商城：场景延伸还是分散焦点
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q10
title: "Keep 做健身商城：场景延伸还是分散焦点"
case_title: "当健身 App 一半收入来自卖货：Keep 商城的十年之问"
case_background:
  product: "Keep——2015 年上线的健身 App，以免费健身课程与运动记录工具起家，2023 年 7 月 12 日在港交所上市（3650.HK），被称为「运动科技第一股」。"
  audience: "健身初学者与大众运动用户，对装备专业度要求不一；上市后还要对资本市场负责。"
  scenario: "用户在 App 内跟练课程、记录运动，同时被推荐瑜伽垫、跑步机、动感单车、代餐等自有品牌商品。"
  related_features: "免费/会员课程、运动记录、Keep 商城（自有品牌消费品）、智能硬件（手环、跑步机、单车）、Keepland 线下健身房、虚拟赛事奖牌。"
  current_status: "自有品牌运动产品长期是 Keep 第一大收入来源（招股书期占比约 51%~55%），高于会员订阅及线上付费内容；上市至今营收连续下滑（2023 年 21.38 亿元、同比 -3.3%；2024 年再降约 3.4%），月活缩水（2023 年平均月活约 2976 万、同比 -18%），2024 年经调整净亏损扩大至约 4.6~4.9 亿元；公司近年收缩聚焦并押注 AI，2025 年首次实现年度经调整盈利。"
main_question: "一个健身工具/内容 App 去做电商卖货，是顺理成章的场景延伸，还是分散焦点的副业？如果你是 Keep 的产品负责人，请定义：Keep 商城到底在解决谁的什么问题？自有品牌收入占比过半，说明它做对了什么、又可能错在哪里？你会如何论证「继续做商城」或「收缩商城」？"
ability_tags:
  - 问题定义
  - 产品价值判断
  - 根因分析
difficulty: 中等
rubric:
  dimensions:
    问题定义:
      - "能定义商城要解决的真实需求：健身场景下装备、器材、补给的天然购买需求（用户本就需要瑜伽垫、哑铃、代餐），而非为变现硬造需求。"
      - "能区分「Keep 的问题」与「商城的问题」：Keep 的核心问题是免费工具变现难，商城是变现答案之一，商城表现差不等于方向错。"
      - "能把「场景延伸 vs 分散焦点」转化为可判定的判据：购买是否与训练场景强关联、是否强化主产品的留存与生命周期价值。"
      - "能识别收入结构信号：自有品牌占比过半意味着 Keep 实质已是「消费品公司+内容公司」混合体，组织能力与资本市场预期都被此定义。"
    产品价值判断:
      - "能论证商城的独特价值来源：内容与场景带来的低获客成本、运动数据驱动的推荐、品牌信任，并对比纯电商是否有结构性差异。"
      - "能指出价值陷阱：标品（瑜伽垫、跑步机）拼的是供应链与价格，Keep 相对专业运动品牌与电商平台无结构性优势，毛利与复购受限。"
      - "能分层评估品类：与训练内容强耦合的（课程配套器材、代餐轻食、智能硬件联动）价值高于泛运动服饰标品。"
      - "能判断商城对主产品是反哺还是抽血：是否提升用户生命周期价值与留存，还是消耗组织资源、拖累整体毛利与现金流。"
    根因分析:
      - "能解释 Keep 走上商城路的根因：免费内容与广告的天花板低，会员付费率有限，电商是离交易最近的变现路径。"
      - "能分析「占比过半仍亏损」的结构原因：消费品低毛利加履约与获客成本，叠加月活下滑使流量基本盘收缩，形成双重挤压。"
      - "能指出执行层根因：品类铺得过宽（吃穿用练全做）带来供应链与库存压力，智能硬件重资产、长周期。"
      - "能结合上市后财报证据（营收连降、月活缩水、亏损扩大、收缩聚焦后 2025 年首次经调整盈利）验证自己的因果判断。"
  forbidden_leaks:
    - "「用户本就有装备购买需求，商城是承接而非创造需求」的判据"
    - "「标品无结构性优势、只有内容强耦合品类才成立」的分层结论"
    - "「商城是变现答案之一，表现差不等于方向错」的区分框架"
    - "「消费品低毛利+月活下滑双重挤压」的结构性根因"
    - "以 2025 年收缩聚焦后首次经调整盈利作为反证线索"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "回答「延伸还是分散」之前，先回答：一个用户在 Keep 里从「想健身」走到「买瑜伽垫」，这条链路天然存在吗？如果不存在，商城在靠什么成交？"
  - level: 2
    stage: 视角补充
    question: "把商城里的商品分成两类：和某门课、某个训练场景强相关的，和在淘宝、迪卡侬也能买到的。这两类的购买理由、毛利结构、对 App 的意义，一样吗？"
  - level: 3
    stage: 反例/风险
    question: "工具产品做商城，有做成功的也有做失败的，你能各想一个例子吗？它们的分界点是什么？Keep 更接近哪一边，依据是什么？"
  - level: 4
    stage: 取舍权衡
    question: "如果砍掉商城，Keep 会失去什么、保住什么？如果保留，只保留哪一部分？组织资源、资本市场预期和用户心智分别会怎么反应？"
  - level: 5
    stage: 验证方式
    question: "假设你主张「收缩商城、只保留与课程强耦合的品类」，一年后你用什么数据证明这个决定是对的？哪些数据出现就说明你错了？"
