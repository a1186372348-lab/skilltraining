main_question: "一个健身工具/内容 App 在站内做商城卖货，是顺理成章的场景延伸，还是分散焦点的副业？请你以「Keep App 商城」为研究对象来定义：这个商城到底在解决谁的什么问题？健身用户确实需要装备，但这能否推出「他需要通过 Keep 购买」？你认为断点具体在哪里——适配训练、选型判断、购买便利，还是其他有材料支持的问题？自有品牌收入曾经占公司收入过半，但这一口径同时包含第三方电商与批发渠道，它能说明什么、不能说明什么？如果你认为现有资料不足以单独判断 App 商城的表现，请明确指出归因缺口。最后，你会如何论证「继续做商城」或「收缩商城」——你的因果判断，能被现有证据支持到哪一步？"
ability_tags:
  - 问题定义
  - 产品价值判断
  - 根因分析
difficulty: 中等
domain: "健康/运动"
rubric:
  dimensions:
    问题定义:
      - "对象与断点界定：能把「健身用户需要装备」与「用户需要通过 Keep 购买」分开——界定 App 商城要解决的具体断点（如适配训练内容、选型判断、购买便利，或其他有材料支持的问题），并说明依据来自案例事实还是自己的推测，而非把「天然购买需求」直接当成已成立的问题。"
      - "公司诉求与用户问题分别界定：能区分公司侧的商业诉求（变现、增长、资本市场压力）与用户侧的购买问题，说明两者如何关联但不混为一谈；「Keep 的核心问题是免费工具变现难」只能作为待论证判断提出，需给出证据与边界，不得预设成立。"
      - "研究对象口径：能识别「自有品牌收入」与「App 商城销售」的口径差（自有品牌同时经第三方电商与批发渠道销售），说清「曾经占比过半」这一信号能支持什么、不能证明什么；资料不足以单独判断商城表现时，明确指出归因缺口而非强行下结论。"
      - "可判定判据：能把「场景延伸 vs 分散焦点」转化为可检验的判据（如购买是否依托训练场景发生、商城是否强化主产品的留存与用户生命周期价值），并给出什么证据会支持或推翻自己的定义。"
    产品价值判断:
      - "价值来源论证需证据支撑：论证商城可能的价值来源（如依托内容与场景的流量、训练数据带来的匹配、品牌信任）时，说明每一项的成立条件与所需证据——例如「商城获客成本低」不能从自有品牌总收入直接推出，需要 App 商城单渠道数据支撑。"
      - "竞争与替代分析：能比较用户在 Keep App 商城购买与在综合电商、线下渠道购买的差异，说明在哪些品类、哪些用户上 Keep 可能有优势、在哪些上没有，而非笼统断言「标品无优势」。"
      - "品类判断不预设结论：若做品类分层（与训练强关联的、泛运动标品），需比较各类的用户购买理由、替代选择与经营贡献；承认同一商品可能同时具有多重属性（如瑜伽垫既与训练相关、也能在其他平台买到），不把「只有强关联品类成立」当作前提。"
      - "反哺还是抽血需条件判断：判断商城对主产品是反哺还是抽血时，给出可检验的条件（是否提升留存与用户生命周期价值、是否消耗组织资源与拖累毛利），并说明现有财报数据能验证到哪一步。"
    根因分析:
      - "变现路径归因需检验：解释 Keep 做商城的原因时，形成并比较可能解释（如免费内容与广告的变现天花板、会员付费率有限、电商离交易更近），说明每种解释的证据支撑，而非把「免费工具变现难」当作无需论证的前提。"
      - "「收入占比高仍亏损」的结构分析：区分事实与推断——毛利率、履约费用、营销费用、月活变化各有财报口径可查，而「商城拖累整体」这类结论需要分渠道数据；说明现有证据能把原因定位到哪一层、哪些还无法定位。"
      - "2025 年经调整盈利的因果边界：能指出「首次年度经调整盈利」是公司整体结果，同期发生的有收缩品类、大幅降本、赛事收入下滑、AI 投入等多件事——比较可能的解释，说明现有证据无法把盈利单独归因于「收缩商城」或「押注 AI」，并给出能区分这些解释所需的证据。"
      - "材料观点的使用：材料与报道中的分析观点（如「AI 是救命稻草」「必须闯过盈利和估值两道关」「卖货已是 Keep 的基本盘」）可作为分析对象；复述这些观点不得当作独立论证，按用户对其证据的使用与检验质量评分——指出它与哪些事实一致、哪些仍需佐证，而非全盘接受或预设立场。"
  forbidden_leaks:
    - "「商城承接健身用户的天然购买需求、是顺理成章的场景延伸」的现成定性结论"
    - "「自有品牌收入占比高＝App 商城表现好、商城获客成本低」的等同推论"
    - "「免费工具变现难是 Keep 的核心问题、商城是变现答案」的预设定性"
    - "「标品无优势、只有与内容强耦合的品类才成立」的品类结论"
    - "「2025 年首次经调整盈利证明收缩商城／押注 AI 正确」的因果结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "回答「延伸还是分散」之前，先回答：一个用户在 Keep 里从「想健身」走到「买瑜伽垫」，这条链路天然存在吗？如果不存在，商城在靠什么成交？"
  - level: 2
    stage: 视角补充
    question: "拿一件具体商品（比如瑜伽垫）来检验：它可能和某门课强相关，也同样能在综合电商或线下运动超市买到。请分开比较三件事——用户在 Keep 买它的理由、在其他渠道买的替代选择、这一单对 Keep 的经营贡献。换成智能硬件或代餐轻食，这三项答案会不一样吗？"
  - level: 3
    stage: 反例/风险
    question: "工具产品做商城，有做成功的也有做失败的，你能各想一个例子吗？它们的分界点是什么？Keep 更接近哪一边，依据是什么？"
  - level: 4
    stage: 取舍权衡
    question: "如果砍掉商城，Keep 会失去什么、保住什么？如果保留，只保留哪一部分？组织资源、资本市场预期和用户心智分别会怎么反应？"
  - level: 5
    stage: 验证方式
    question: "到这一步，你应该已经倾向于某个方案（继续做、收缩、调整结构或其他）。把它写成可验证的假设：如果它成立，一年后哪些数据应该出现？出现什么数据就说明它错了？注意把「公司整体业绩变好」与「你的方案起效」分开——你用什么办法区分两者？"
