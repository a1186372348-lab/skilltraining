# Q04 ｜ 微信读书「想法」：为什么把私密划线变成公开互动
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
# 复审修订（产品负责人裁决·有条件通过）：①案例背景与材料区分划线/发表想法/阅读记录可见/自动关注四种行为，
# 标注所涉版本的操作、可见对象与默认设置（历史版本证据：1.0 版本分析 + 2020 年判决报道，当前隐私政策不替代历史证据）；
# ②主问题改为用户任务前置（阅读情境×公开意愿分层），平台动机为辅测；③指定心理与根因改候选解释，Rubric 按证据匹配评分；
# ④产品表达辅测保留并指定听众与表达任务（向担心隐私的用户写功能说明）；⑤forbidden_leaks 收窄为整套作答导读级结论链
id: Q04
title: "微信读书「想法」：为什么把私密划线变成公开互动"
case_title: "一本「被看见」的书：想法功能的公开化设计"
case_background:
  product:
    text: "微信读书——微信团队 2015 年 8 月正式推出的移动阅读应用，App Store 官方介绍定位为「基于微信关系链的官方阅读应用」：可查看微信好友的读书动态、与好友讨论正在阅读的书籍，宣传语为「这一次，让阅读不再孤单」。"
    citations: [1, 2]
  audience:
    text: "微信生态内的阅读用户；1.0 时期的公开用户反馈显示态度明显分化——有人认可「好友推荐书籍很有意思」「排行榜能激励人阅读」，也有人吐槽「读书是私密的，个人阅读的有关信息不想公开让别人知道」；当前版本提供私密阅读、替身书架、想法发表范围等选项，印证不同公开意愿并存。"
    citations: [2, 4]
  scenario:
    text: "阅读中划线、写想法本是典型的私密行为。在 1.0 版本（2015 年）中：「想法」即为一级 tab，想法页为类似朋友圈的好友想法流；正文里他人想法以虚线划线形式嵌入、可点开查看并点赞评论；发表想法时可选择是否公开，不公开则不进入想法流；阅读界面提供「私密阅读」开关，开启后好友看不到你读过此书及相关想法动态。早期版本（1.4.4 之前）用户登录后会被自动关注共同使用的微信好友，1.4.4 起改为自行选择关注；而 2020 年判决显示，诉讼所涉 v3.3.0 版本（2019 年）中，微信好友之间的读书记录（读书时长、最近阅读、书架、推荐书籍、读书想法等）默认相互开放——无论是否互相关注，且仍存在自动添加关注。"
    citations: [2, 6, 7]
  features:
    text: "划线与写想法、他人想法以虚线划线嵌入正文、想法页（好友想法流）、读书时长排行榜、「发现」页好友在读、私密阅读开关；当前版本另提供替身书架、想法发表范围等隐私设置。"
    citations: [1, 2, 3, 4]
  status:
    text: "公开的想法与划线已沉淀为书籍的公共笔记层，被媒体视为微信读书内容生态的重要组成部分；公开化设计也持续伴随隐私争议：1.0 时期即有用户吐槽「读书是私密的」，2020 年 7 月北京互联网法院一审判决认定「自动关注微信好友 + 读书信息默认向好友开放」构成对用户个人信息权益的侵害（未认定侵害隐私权），判令停止相关行为；腾讯回应称收到诉讼后已优化版本、更尊重用户选择权并对相关社交功能加强提示，当前版本提供私密阅读、替身书架、想法发表范围等选项。"
    citations: [5, 2, 6, 7, 4]
