uncertainty:
  - "App Store 官方介绍中的宣传语为「这一次，让阅读不再孤单」（经腾讯新闻转载的人人都是产品经理系列文全文引用），注意原文为「孤单」；网络常见误引「让阅读不再孤独」未采用。"
  - "自动关注的时间线存在口径张力：人人都是产品经理系列文称 1.4.4 版本已将关注选择权交给用户；而 2020 年判决显示诉讼所涉 v3.3.0 版本（2019 年）仍存在自动添加关注（腾讯曾承认存在自动添加关注的版本，法院予以采信）。案例同时保留两处事实，不强行调和。"
  - "「社交阅读态度分化约五五开」为该文作者对知乎回答的粗略估算、非统计数据，案例背景只引用具体的用户好评与吐槽，未采用该比例。"
  - "当前隐私政策中的私密阅读、替身书架、想法发表范围等选项反映整改后现状，仅用于说明当前版本的控制方式，不作为历史版本默认设置的证据。"
