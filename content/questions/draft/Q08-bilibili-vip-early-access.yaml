# Q08 ｜ B站大会员「抢先看」：付费墙位置怎么定
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
# 复审返工（产品负责人裁决，4 项调整 + eval 补产）：
# ① 讨论对象限定为「最终会免费解锁的抢先看内容」——B站官方权益体系自身区分「抢先看」与「会员专享」，
#   删除「与爱优腾式付费墙有本质区别」的泛化概括；2014 年承诺范围写准为「bilibili 购买的正版新番
#   永远不加视频贴片广告」（官方一手页面核验，新增来源 5），后续广告「违背承诺」争议降格为有归属的
#   用户/媒体观点入材料（裁决指定的官方活动页抓取后不含权益区分内容，未引用，见 uncertainty）；
# ② 取消固定价值排序——「免费用户不能觉得自己是二等公民」移出高分唯一立场，Rubric 改为价值成立条件
#   （谁愿付费、免费用户可接受的等待条件、收入能否支持供给及代价、窗口何时缩短/延长/取消）；
#   主问题「这个位置是怎么定出来的」改为「你会如何确定」；
# ③ 「付费墙前移增收」改为待验证假设；护栏指标须有依据与容忍边界，不隐藏「免费留存下降必然不可接受」的预设；
# ④ 修正对照方法——番剧间比较不能直接称自然实验，同节目改窗口须考虑跨组讨论与剧透干扰；
#   提示树 L2 明确剧透发生的讨论空间（弹幕按集分隔，不默认不同集数共用同一弹幕池）；
# ⑤ forbidden_leaks 收窄（社区观点与风险事实移出，仅保留导读级结论链），补产 content/eval/Q08.yaml。
id: Q08
title: "B站大会员「抢先看」：付费墙位置怎么定"
case_title: "免费延迟、会员抢先：B站的付费墙该砌在哪"
case_background:
  product:
    text: "哔哩哔哩（B站）——以 ACG（动画、漫画、游戏）内容与弹幕互动起家的视频社区；2014 年 10 月，站长 bishi 在官方「新番承包计划」页面承诺「bilibili 购买的正版新番永远不加视频贴片广告」，商业化长期受这一承诺的约束。"
    citations: [1, 2, 5]
  audience:
    text: "一侧是免费用户（社区基本盘，含二次元核心用户与泛用户），另一侧是付费「大会员」；排播决策背后还有要求各平台规则保持一致的版权方。"
    citations: [1, 2]
  scenario:
    text: "新番、国创等版权内容的排播：对实行「付费抢先」的作品，免费用户在新一集播出后才能观看上一集（存在约一周延迟），大会员可优先观看最新一集，抢先内容最终会向免费用户免费开放；部分作品曾支持单部付费「承包」（一部番剧 10 B 值，即 10 元）。在 B站大会员权益体系中，「付费连载抢先看」与「会员专享」（需付费或会员方可观看的内容）是两类并列权益；本题只讨论最终会免费解锁的「抢先看」内容。"
    citations: [1, 3]
  features:
    text: "大会员订阅、付费抢先排播（抢先内容最终免费解锁）、会员专享内容、单部承包（10 B 值/部）、免费内容延迟解锁、广告（开屏、信息流、2026 年上线的暂停广告）。"
    citations: [1, 3, 4]
  status:
    text: "2016 年 10 月 B站首次上线大会员，官方当时表态「『只有大会员才能看的新番』也不会有（除非版权方强制要求全网都付费的片子）」；2018 年 1 月起部分新番实行「付费抢先」（大会员优先看最新集，普通用户延后免费看），此后排播规则多次调整并引发社区争议；大会员权益中至今仍保留「付费连载内容抢先看」一项。与此同时，B站此后陆续上线开屏、信息流广告与 2026 年暂停广告——这些广告形式不在 2014 年承诺（正版新番不加视频贴片广告）的范围内，但部分用户与媒体将其与承诺对照，质疑 B站「违背承诺」（属有归属的用户与媒体观点，见扩展资料）。"
    citations: [1, 2, 3, 4]
