# Q08 ｜ B站大会员「抢先看」：付费墙位置怎么定
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q08
title: "B站大会员「抢先看」：付费墙位置怎么定"
case_title: "免费延迟、会员抢先：B站的付费墙该砌在哪"
case_background:
  product: "哔哩哔哩（B站）——以 ACG 内容与弹幕社区起家的视频平台，商业化长期受「正版新番永不加贴片广告」承诺的约束。"
  audience: "免费用户（社区基本盘，含二次元核心用户与泛用户）与付费「大会员」；背后还有版权方与 UP 主生态。"
  scenario: "新番、国创等版权内容的排播：免费用户延迟观看，大会员可提前看最新一集；部分作品曾支持单部付费「承包」。"
  related_features: "大会员订阅、付费抢先排播、单部承包（10 B 值/部）、内容免费解锁节奏、广告（开屏、信息流、2026 年上线的暂停广告）。"
  current_status: "2016 年 10 月推出大会员；2018 年 1 月起部分新番实行「付费抢先」（大会员优先看最新集，普通用户延后免费看），此后排播规则多次调整并引发社区争议；会员抢先至今仍是番剧、国创与部分影视内容的常见排播方式；与此同时 B站在广告等商业化动作上反复面临「违背承诺」的舆论压力。"
main_question: "付费墙到底应该砌在哪？如果你是 B站负责番剧/国创排播的产品经理：「会员提前看、免费延迟看」这个位置是怎么定出来的？它锁住了什么价值、又让渡了什么价值？请给出你的价值判断、关键取舍，以及一套验证这个位置是否合理的指标方案。"
ability_tags:
  - 产品价值判断
  - 产品取舍
  - 指标与验证
difficulty: 中等
rubric:
  dimensions:
    产品价值判断:
      - "能说清「抢先看」售卖的本质是时间差与抢先权而非内容本身——内容最终对免费用户开放，这与爱优腾式纯会员内容付费墙有本质区别。"
      - "能识别该设计保护的存量价值：免费可看维持社区氛围、弹幕生态与「无贴片广告」承诺下的用户信任。"
      - "能识别该设计获取的增量价值：为追更冲动付费的转化率，以及对版权成本的分摊。"
      - "能结合 B站社区属性判断：付费墙位置的价值高度依赖「免费用户不觉得自己变成二等公民」的感知。"
    产品取舍:
      - "明确核心取舍：付费墙前移（付费内容更多、免费延迟更久）则短期收入升但免费体验与社区信任受损，后移则相反，并给出自己的位置选择与理由。"
      - "能把「延迟时长/免费解锁节奏」当作连续调节旋钮而非二元开关来讨论（如延后一周 vs 完结后全免）。"
      - "能预见取舍的代价：延迟过长会催生盗版观看与社区剧透矛盾，并将其纳入决策。"
      - "能区分内容品类（独播版权新番 vs 国创 vs 综艺影视）付费墙位置可以不同，并说明依据。"
    指标与验证:
      - "指标成体系：付费侧（大会员转化率、抢先看内容的转化拉动）、免费侧（免费播放量、追更留存、解锁后播放回补）、生态侧（弹幕评论互动、负面舆情）。"
      - "能给出对照验证方法：如不同延迟窗口的 A/B 实验或不同番剧间的自然实验，明确自变量与观测指标。"
      - "能区分北极星指标与护栏指标，如「大会员收入提升不得以免费用户追更留存显著下降为代价」。"
      - "能指出归因难题（大会员增长可能来自权益包整体而非单一抢先看），并提出拆解思路。"
  forbidden_leaks:
    - "「售卖的是时间差而非内容」这一价值本质判断"
    - "「免费用户不能有二等公民感知、社区信任是护栏」的预期结论"
    - "「延迟时长是连续旋钮、按品类差异化」的取舍要点"
    - "盗版与剧透是延迟过长的预期风险"
    - "付费/免费/生态三层指标体系与护栏指标的构成"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「付费墙位置怎么定」。在回答「怎么定」之前，先定义：这里被出售的东西到底是什么？把它用一句话说清楚。"
  - level: 2
    stage: 视角补充
    question: "代入一个免费用户：他追的番更新了，但讨论区已经在聊最新一集，而他还看不了。再代入一个大会员。这两种人在同一个弹幕池和评论区里相遇时，会发生什么？"
  - level: 3
    stage: 反例/风险
    question: "如果把免费用户可看的节奏再往后压（比如完结前完全不可看），会发生什么？你能想到其他平台更激进的付费墙案例吗，结果如何？"
  - level: 4
    stage: 取舍权衡
    question: "付费墙往前移一寸，谁受益、谁受损？同样的位置上，B站和一家没有社区包袱的长视频平台，选择会一样吗？为什么？"
  - level: 5
    stage: 验证方式
    question: "假设你把免费解锁节奏从「延一周」改成「延两周」，你会看哪些数字、怎么设计对比，才能判断这是多赚了钱还是在透支社区？"
