  - id: 5
    title: "新番承包计划（站长 bishi：「bilibili 购买的正版新番永远不加视频贴片广告」）"
    publisher: "哔哩哔哩官方页面"
    url: "https://www.bilibili.com/html/2014_anime_i_want_you_html5.html"
main_question: "付费墙到底应该砌在哪？如果你是 B站负责番剧/国创排播的产品经理：对最终会免费解锁的「抢先看」连载内容（「会员专享」等不免费解锁的内容不在本题讨论范围），「会员提前看、免费延迟看」这个位置你会如何确定？它锁住了什么价值、又让渡了什么价值？请给出你的价值判断、关键取舍，以及一套验证这个位置是否合理的指标方案。"
ability_tags:
  - 产品价值判断
  - 产品取舍
  - 指标与验证
difficulty: 中等
domain: "内容/社交"
rubric:
  dimensions:
    产品价值判断:
      - "能说清讨论对象的边界：本题只针对最终会免费解锁的「抢先看」内容，它售卖的本质是时间差与抢先权而非内容本身；不把部分内容的排播模式泛化为整个平台的商业模式——B站权益体系中「抢先看」与「会员专享」并存，两者规则不同。"
      - "能识别该设计保护的存量价值：免费可看维持社区氛围、弹幕生态，以及 2014 年「正版新番不加视频贴片广告」承诺积累的用户信任；引用承诺时范围准确，不扩展为「全站无广告」。"
      - "能说清增量价值的来源与成立条件：哪些人、为什么愿意为抢先观看付费（如追更冲动、第一时间参与社群讨论），他们愿意为「时间差」付多少钱，而非笼统断言「会员收入会涨」。"
      - "能给出价值成立的条件式判断：免费用户能接受什么等待条件（延迟时长、解锁确定性、剧透环境），收入能否支持内容供给、为此付出了什么代价，什么情况下应缩短、延长或取消抢先窗口。"
      - "对材料中的社区观点（如「免费用户不能觉得自己是二等公民」「B站违背了承诺」）：引用、质疑或验证均可，按证据使用与检验质量评分；复述这些观点不得当作独立论证，也不因持有某一立场直接得高分。"
    产品取舍:
      - "明确核心取舍并给出自己的位置选择与理由；把「付费墙前移能提高收入」当作待验证假设而非既定事实——前移可能同时降低付费转化、加速免费用户流失，净收益方向需要证据支撑。"
      - "能把「延迟时长/免费解锁节奏」当作连续调节旋钮而非二元开关来讨论（如延后一周 vs 完结后全免）。"
      - "能预见取舍的代价：延迟过长会催生盗版观看与社区剧透矛盾，并将其纳入决策。"
      - "能区分内容品类（独播版权新番 vs 国创 vs 综艺影视）付费墙位置可以不同，并说明依据。"
    指标与验证:
      - "指标成体系：付费侧（大会员转化率、抢先看内容的转化拉动）、免费侧（免费播放量、追更留存、解锁后播放回补）、生态侧（弹幕评论互动、负面舆情）。"
      - "能给出对照验证方法并说明证据效力边界：如不同延迟窗口的 A/B 实验，明确自变量与观测指标；不同番剧之间的差异比较不能直接视为自然实验——内容热度、质量、宣发、更新节奏都可能影响结果，需说明如何控制混杂因素或承认其限制；同一节目改变窗口的对照也要考虑跨组讨论与剧透干扰。"
      - "能区分北极星指标与护栏指标，并为护栏给出依据与容忍边界：如以免费用户追更留存作护栏，需说明为什么选它、下降到什么程度不可接受、依据是什么，而非把「免费留存下降必然不可接受」当作隐藏预设标准。"
      - "能指出归因难题（大会员增长可能来自权益包整体而非单一抢先看），并提出拆解思路。"
  forbidden_leaks:
    - "「抢先看售卖的是时间差与抢先权而非内容本身」的价值本质判断"
    - "「延迟时长是连续调节旋钮、按品类差异化」的取舍要点"
    - "对「付费墙前移是否增收」的定性结论（「前移必然增收」与「前移必然透支社区」均不得直接给出）"
    - "「付费/免费/生态」三层指标体系的完整构成"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目把讨论限定在「最终会免费解锁的抢先看内容」。在回答「位置怎么定」之前，先定义：这里被出售的东西到底是什么？把它用一句话说清楚。"
  - level: 2
    stage: 视角补充
    question: "代入一个免费用户：他追的番更新了，最新一集的评论区已经在聊剧情，而他还看不了；再代入一个大会员。注意讨论空间并不相同：弹幕按集分隔、各集有各自的弹幕池，而评论区、社区动态与跨集讨论串是跨集流动的——剧透与摩擦具体会发生在哪些空间？对这两种人分别意味着什么？"
  - level: 3
    stage: 反例/风险
    question: "如果把免费用户可看的节奏再往后压（比如从延一周压到延一个月），会发生什么？你能想到其他视频平台更激进的付费墙案例吗，结果如何？注意先分清：那些案例里的内容最终是否也会免费解锁？"
  - level: 4
    stage: 取舍权衡
    question: "付费墙往前移一寸，谁受益、谁受损？收入一定增加吗——什么条件下反而会减少？同样的位置上，B站和一家没有社区包袱的长视频平台，选择会一样吗？为什么？"
  - level: 5
    stage: 验证方式
    question: "假设你把免费解锁节奏从「延一周」改成「延两周」，你会看哪些数字、怎么设计对比，才能判断它对收入与社区的净影响？如果只能拿不同番剧互相对比，哪些差异会污染你的结论，你打算怎么处理？"
