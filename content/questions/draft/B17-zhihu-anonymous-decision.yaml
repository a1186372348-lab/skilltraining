main_question: "假设你是知乎社区方向的产品经理，在匿名功能去留争议最大的时刻，请向 CEO 写一段 300 字左右的决策汇报：明确你的立场（支持下线、反对下线，或提出折中方案），并说服他接受你的判断。"
ability_tags:
  - 产品表达
  - 用户理解
  - 产品价值判断
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品表达:
      - "立场明确且前置：开头即亮明结论与建议，而非铺垫背景后让 CEO 自己找观点。"
      - "论据与立场之间有清晰的推理链：每个理由都能落到案例中的具体事实（如杜撰事件、当事人无法自证、监管动向），而非抽象口号。"
      - "正面回应反方最强质疑（如「下线会损失真实分享」或「保留会持续透支社区信任」），体现说服的完整性，而非自说自话。"
      - "符合向上汇报的场景感：语言简洁有边界，结尾给出可执行的下一步安排（如过渡方案、复盘节点），而非止于表态。"
    用户理解:
      - "区分匿名功能对不同人群的意义：有隐私顾虑的真实分享者、消费内容的读者、被匿名内容伤害的当事人。"
      - "用案例事实说明匿名机制被滥用的具体方式（杜撰身份与情节、造谣后难以自证），而非笼统归因于「环境复杂」。"
      - "识别「匿名保护表达者」与「实名保护读者可信度」两种信任价值的冲突，并说明自己的立场偏向保护了哪一端。"
    产品价值判断:
      - "明确比较下线与保留各自的收益与代价，且代价与收益能对应到具体人群或社区资产，而非只讲单边。"
      - "把外部环境（监管规定、舆论压力）纳入决策考量，并说明它影响的是决策方向还是决策时机。"
      - "给出立场之外的边界安排或配套方案（如历史内容处理、敏感分享的承接机制、认证体系衔接），体现对决策代价的管理意识。"
  forbidden_leaks:
    - "「结论先行—分层论据—回应反方—落地建议」的汇报结构模板"
    - "「匿名保护表达者、实名保护读者」的信任权衡框架"
    - "「保护对象已错位：本应保护说真话的人，实际保护了编故事的人」的核心论点"
    - "历史内容转实名、专业身份认证承接、限范围可见等配套方案清单"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "这段汇报的读者是 CEO——他要做的不是判断「匿名好不好玩」，而是决定是否为一个有争议的机制负责。动笔之前，先列出你的汇报必须回答的两到三个问题，并想清楚：如果 CEO 只记住你第一句话，那句话应该是什么？"
  - level: 2
    stage: 视角补充
    question: "请分别代入三种人：一个只有匿名才敢说出真实经历的普通用户、一个被匿名造谣却无法自证的当事人、一个靠知乎查专业信息的读者——同一个「下线匿名」，他们各自失去了什么、得到了什么？你的立场打算如何向每一方交代？"
  - level: 3
    stage: 反例/风险
    question: "站到你立场的对立面：反对者最有力的一条理由是什么（注意找最强的，不是最弱的）？如果你的汇报只讲自己立场的收益、不正面处理这条理由，CEO 当场会怎么挑战你？"
  - level: 4
    stage: 取舍权衡
    question: "假设评估显示：你的方案会降低一类风险，但也会让某一类内容供给或某一人群的利益受损——这个代价由谁承担？你打算全盘接受这个损失，还是在方案里设计补偿安排？判断的依据是什么？"
  - level: 5
    stage: 验证方式
    question: "汇报结尾通常要给决策留出「回头看」的锚点：三个月后复盘时，你会建议 CEO 看哪几个信号来判断这个决定做对了还是做错了？这些信号能不能区分「短期阵痛」和「方向性错误」？"
