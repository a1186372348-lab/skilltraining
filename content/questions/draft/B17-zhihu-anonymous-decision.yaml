# B17 ｜ 知乎下线匿名功能：如何把争议决策讲给 CEO 听
# 批次：T33 基线测评题第一批（B17）｜ 状态：草案，待产品负责人评审后上架
id: B17
title: "知乎下线匿名功能：如何把争议决策讲给 CEO 听"
case_title: "一个社区早期机制的去留之争"
domain: "内容/社交"
case_background:
  product:
    text: "知乎——在线问答与知识分享社区，用户以真实身份分享知识、经验和见解；2023 年第一季度月平均活跃用户 1.02 亿，其中 3 月活跃用户数超过 1.1 亿。匿名功能是社区早期的产品机制，官方称其上线初衷是「建立在用户开放讨论、友善互动的基础之上」。"
    citations: [4, 1]
  audience:
    text: "三类关键人群：以真实身份创作的回答者与创作者（2023 年第一季度月平均订阅会员 1490 万）、消费内容的广大读者，以及被匿名内容波及的当事人——如企业家黄渊普称遭知乎匿名用户造谣，向 CEO 周源提议「反证功能」未果后，表示将向相关部门持续实名举报。"
    citations: [4, 1]
  scenario:
    text: "用户可通过「匿名发布」入口匿名创建问题或匿名发布内容。2022 年 10 月 16 日，一匿名用户发布「被江西萍乡女友索要 1888 万天价彩礼」的回答，2023 年 1 月引爆全网讨论后被证实系杜撰，知乎依据社区规范对该账号永久封禁；事件让匿名机制的争议被推到台前。"
    citations: [2, 1]
  features:
    text: "「匿名发布」入口（可匿名创建问题、匿名发布内容）；对历史匿名内容，用户可自主选择是否转为实名；2023 年 4 月知乎推出专业身份认证，鼓励用户以真实身份进行创作，让内容更专业、表达更真实。"
    citations: [1]
  status:
    text: "2023 年 6 月 22 日，CEO 周源在朋友圈回应匿名功能争议，称机制初衷是让用户分享个人经历时没有隐私顾虑，但「在今天复杂的沟通环境下」产生了越来越多的困扰，知乎会做出改变；7 月 7 日知乎官方公告：匿名功能将在新旧版本 App 端及 PC 端正式下线。同日，国家网信办发布《网络暴力信息治理规定（征求意见稿）》，拟规定「禁止创建以匿名投稿、隔空喊话等名义发布导向不良等内容的话题版块和群组账号」。决策落地后，知乎副总裁、社区业务负责人张宁在播客中复盘：下线匿名回答的内部判断很快，认为其与专业身份心智相反，经 AB 实验测量发现影响不大。"
    citations: [1, 3, 5]
