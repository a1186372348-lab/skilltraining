# B16 ｜ 趣头条 6220 万月活的含金量
# 批次：T33 基线测评题（B16）｜ 状态：草案，待产品负责人评审后上架
id: B16
title: "趣头条 6220 万月活的含金量"
case_title: "给一组「好指标」卸妆"
case_background:
  product:
    text: "趣头条——2016 年 6 月上线的聚合资讯 App，以算法推荐娱乐八卦、养生、情感等轻资讯；标志性机制是「金币系统」：注册、每日签到、读文章、看视频、邀请好友（收徒）、分享内容均可获得金币，金币积累到一定数量可兑换现金提现。"
    citations: [1, 2]
  audience:
    text: "目标用户是三线及以下城市的下沉人群——2017 年三四线城市及非线级人口占比高达 68.4%（易观数据）；创始人谭思亮曾透露，平台中老年用户约占总用户数的 40%~50%。变现侧客户是广告主，广告贡献超过 90% 的营收。"
    citations: [2, 1]
  scenario:
    text: "增长曲线惊人：上线 10 个月积累 600 万用户，1 年后月活 1500 万，两年半日活突破 3000 万；2018 年累计装机量达 1.81 亿、月活用户 6220 万、用户登录率高达 95%。营收同步暴涨：2016~2019 年营业收入分别为 0.58 亿、5.17 亿、30.22 亿、55.70 亿元。"
    citations: [1, 3, 2]
  features:
    text: "金币任务体系（签到、阅读、收徒分成）+ 算法资讯推荐 + 广告变现；上市前后获得腾讯领投、小米跟投的 2 亿美元融资，并通过定向增发获得阿里巴巴 1.71 亿美元投资。"
    citations: [1, 3]
  status:
    text: "2018 年 9 月 15 日以 7 美元发行价登陆纳斯达克，用时 2 年 3 个月刷新中国互联网企业最快上市纪录，首日五次触发熔断、收盘市值约 46 亿美元。但公司从未盈利：2018、2019 年净亏损分别为 19.43 亿、26.89 亿元，销售与营销费用（含用户金币激励）占营收的比例高达 114%、101.3%；DAU 在 2019 年 Q4 见顶 4570 万后持续流失，2020 年 Q4 补贴收缩后 DAU 同比下滑 29.3%；2020 年被央视 315 晚会点名广告乱象；2023 年 3 月从纳斯达克退市，市值仅剩约 500 万美元。"
    citations: [2, 4, 1]
