# 初答后披露（供 AI 总监追问引用）：决策时点之后的后续结果，不进案例背景
reveal_after_first_answer:
  text: "上市之后的实际结果（供追问阶段引用）：2018、2019 年营收分别达 30.22 亿、55.70 亿元，但公司始终未盈利，同期净亏损分别约 19.43 亿、26.89 亿元；用户金币激励计入销售与营销费用，该项费用占营收的比例 2018、2019 年高达 114%、101.3%，折合每用户每天参与费约 0.12 元；MAU 环比增速从早期 91% 一路降至 3%。DAU 在 2019 年 Q4 见顶 4570 万后持续流失，2021 年 Q4 降至约 2500 万；2020 年 Q4 公司收缩补贴，当季 DAU 同比下滑 29.3%；2020 年 7 月被央视 315 晚会点名广告乱象；2022 年 5 月发布 2021 财年年报后停止披露财务业绩；2023 年 3 月从纳斯达克退市，市值仅剩约 500 万美元。追问时先确认用户是否用上了当时可得的信息：招股书在上市时已披露持续亏损（2016 年、2017 年及 2018 年上半年净亏损），它在初答材料中就已可见，不属上市后的新信息——上述 2018 全年与 2019 年亏损才是上市后才披露的口径。追问时引导用户回到方法层面检验：这些后续数据各自能支持什么、不能证明什么——整体 DAU 含新增与回流用户，其下滑不等于自然留存下降（留存需按同期群分群观察）；补贴收缩与 DAU 下滑的时序重叠不能独自证明因果，仍需对照组或排除竞争、市场环境等混杂因素。"
  citations: [5, 7, 6, 8]
main_question: "时间回到 2018 年趣头条上市前后的高光时刻：两年三个月刷新最快上市纪录、首日收盘市值近 46 亿美元，累计装机 1.81 亿、月活 6220 万、登录率 95%、人均单日时长约 55.6 分钟的成绩单摆在面前。请你判断：这组指标能在多大程度上证明这是一门好生意？要求：逐一说明这些指标各自能证明什么、不能证明什么；列出你会追问的数据，并给出可执行的检验设计（说清指标口径、对照方式与判断基准）；最后给出你当前的结论与置信程度——如果现有证据不足以定论，说明卡在哪些证据上、什么证据出现会改变你的判断。"
ability_tags:
  - 指标与验证
