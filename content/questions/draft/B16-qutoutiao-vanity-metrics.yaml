id: B16
title: "趣头条 6220 万月活的含金量"
case_title: "两年三个月跑进纳斯达克"
case_background:
  product:
    text: "趣头条——2016 年 6 月上线的聚合资讯 App，依托智能化数据分析系统，为用户推荐娱乐、生活资讯等轻内容；标志性机制是「金币系统」：每日签到、阅读资讯、开宝箱、邀请好友（收徒）、分享内容等行为均可获得金币，金币可按比例兑换现金提现。"
    citations: [1, 2, 3]
  audience:
    text: "目标用户是三线及以下城市的下沉人群：据披露趣头条用户约 70% 来自三线及以下城市和农村乡镇地区；创始人谭思亮的创业判断是，主流资讯平台以一二线城市居民和年轻人为主，漏掉了三四五线城市大量 40 岁以上中年群体的资讯需求。变现侧客户是广告主——广告收入约占总营收的 93%（2018 年上市前口径）。"
    citations: [3, 1]
  scenario:
    text: "增长曲线惊人：截至 2017 年底，累计注册用户超 7000 万、月活近 3000 万；招股书披露，截至 2018 年 7 月累计装机量达 1.54 亿、月活用户 4880 万；仅一个月后，2018 年 8 月累计装机量达 1.81 亿、月活用户 6220 万，公司称用户登录率高达 95%（称其他资讯平台不到 30%）、人均单日使用时长约 55.6 分钟。营收同步暴涨：2016 年约 5800 万元、2017 年 5.2 亿元，2018 年上半年 7.2 亿元、同比增长超 5 倍。"
    citations: [4, 1, 3, 2]
  features:
    text: "金币任务体系（签到、阅读、收徒分成、开宝箱）+ 算法资讯推荐 + 广告变现；资本密集加持：2017 年 10 月获华人文化产业基金领投、成为资本和红点创投跟投的 4200 万美元 A 轮，2018 年 3 月获腾讯领投、小米等跟投的超 2 亿美元 B 轮（投后估值超 16 亿美元），2018 年 8 月引入人民网旗下基金等约 6000 万美元战略投资。"
    citations: [2, 1, 4]
  status:
    text: "2018 年 9 月 14 日（美东时间）以 7 美元发行价登陆纳斯达克（代码 QTT），从上线到上市仅用 2 年 3 个月，刷新中国互联网企业最快上市纪录，成为「移动内容聚合第一股」；首日开盘较发行价涨 30%，盘中五次触发熔断、一度涨逾 190%，收盘大涨 128.14% 报 15.97 美元，收盘市值近 46 亿美元、盘中一度超 58 亿美元。招股书同时披露公司持续亏损且亏损快速扩大：2016 年净亏损约 1086 万元、2017 年约 9476 万元，2018 年上半年净亏损约 5.14 亿元（上年同期约 2868 万元）——亏损在上市时点即为公开信息。"
    citations: [1, 2, 9]
