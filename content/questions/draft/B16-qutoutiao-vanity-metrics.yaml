uncertainty:
  - "「月活 6220 万、用户登录率 95%」为 2018 年公司对外披露口径（经铅笔道报道转引），具体统计口径（如登录率的分母定义）未公开。"
  - "上市首日市值存在「收盘约 46 亿美元」与「盘中一度超 58 亿美元」两个口径，案例正文采用收盘口径。"
  - "「DAU 峰值 4570 万（2019 年 Q4）、2021 年 Q4 约 2500 万」为时代周报援引公司财报的口径；趣头条自 2022 年 5 月发布 2021 财年年报后停止披露财务业绩，此后经营数据缺失。"
  - "「销售与营销费用占营收 114%/101.3%」为节点财经按财报计算的口径，该费用同时包含用户金币激励与市场推广支出。"
