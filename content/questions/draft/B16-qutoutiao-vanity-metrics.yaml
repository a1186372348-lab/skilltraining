  - 产品价值判断
difficulty: 基础
kind: baseline
domain: "内容/社交"
rubric:
  dimensions:
    指标与验证:
      - "区分规模指标与健康度指标：指出装机量、月活、登录率、上市速度只证明触达与增长的规模，判断生意是否成立还需留存质量、用户结构、变现效率与单位经济等健康度证据，而非被「增长快、上市快」的叙事带着走。"
      - "识别指标同源污染风险：指出装机、登录率、时长、裂变等亮眼数据可能由同一套金币机制同步推高、彼此不能互相印证，并提出拆解思路（如区分激励行为驱动的活跃与自发活跃），而非把登录率 95% 直接当作粘性证据。"
      - "给出术语准确、可执行的激励剔除检验设计：如分地区或分用户群停减激励的人为设计对照实验（属对照实验/准实验范畴，不能称为「自然实验」），事先说清处理组与对照组、观察指标、周期与判断基准；分组设计须交代依据与控制——按什么分组（地区/用户群）、为什么这样分、组间保持哪些变量一致（如内容供给、推送策略、版本功能），只写方法名称而不说明如何分组、控制什么差异的不得分；观察留存时按同期群分群，而非只看整体活跃数。"
      - "建立投入产出口径：提出用单用户广告收入对比单用户激励与获客成本（或营销费用与营收的关系）检验增长的可持续性；上市时点招股书已披露持续亏损（2016、2017 年及 2018 年上半年净亏损，已载入案例背景）但单用户口径尚未完整公开，应把单用户拆分列为「需追问的财报口径」并说明拿到后如何判断，而非预设结论。"
      - "说清证据能说明什么、不能说明什么：整体活跃指标（如 DAU）含新增与回流用户，其变化不等于自然留存变化；激励调整与活跃变化在时序上先后发生，不能独自证明因果（需对照组或排除竞争、市场环境、季节等混杂因素）；证据不足时给出条件式结论并列出所需证据是合法高分路径，把单一解释当已证实结论为低分。"
    根因分析:
      - "围绕「用户为什么来、为什么留」形成并比较多个有依据的候选解释（如现金激励驱动、轻资讯消遣价值真实存在、熟人关系链裂变效率等），每个解释标注案例中的支撑事实与证据强度，而非直接断言「第一驱动是发钱」。"
      - "能说明金币机制可能同步推高注册、登录、时长、裂变多组指标的机制链条，并区分链条中哪些环节有案例事实支撑、哪些环节仍属推测。"
      - "对「激励驱动用户的广告变现价值」提出可检验的假设与所需数据（如激励敏感用户的广告点击与转化质量），而非直接给出「低价值用户—低质广告—变现恶化」的既定结论。"
    产品价值判断:
      - "立场明确且判据可检验：无论判断「指标足以证明」「不足以证明」还是「暂无法判断」，都给出具体可检验的判据与翻转条件（什么证据出现会改变结论），而非骑墙含糊或用事后结果倒推。"
      - "能把指标判断转化为生意判断：说清「这门生意是否成立」取决于哪些尚未观察到的变量（自然留存、单用户收入与成本、用户结构等），各变量观察到什么水平会支持或否定结论。"
      - "评估「激励驱动增长 + 单一广告变现」模式时只依据决策时点可得的信息推理，指出其潜在结构性风险的同时说明风险成立的可检验条件，不直接宣判模式死刑。"
  forbidden_leaks:
    - "「活跃是买来的、不是长出来的」核心结论"
    - "「剔除金币激励看自然留存」的检验方法设计"
    - "「注册/登录/时长/裂变被同一套金币机制同源推高、不能互相印证」的污染逻辑"
    - "「营销费用占营收 114%/101.3%」「每用户每天参与费约 0.12 元」等单位经济证据"
    - "上市后才披露的亏损数据（2018 全年、2019 年净亏损等）、补贴收缩后 DAU 下滑、315 点名、退市等后续结果数据"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问这组指标「能在多大程度上证明这是一门好生意」。动笔前先想清楚：要证明一门生意成立，至少要回答哪几个问题——用户为什么来、来了留不留得下、每个用户能带来多少收入、留住他要花多少成本？装机量、月活、登录率这几个数字，分别能回答其中哪几个、又回答不了哪几个？"
  - level: 2
    stage: 指标构成
    question: "以「登录率 95%」为例拆一拆它的构成：一个用户为什么会「登录」？把可能的原因都列出来——想看内容、想领签到金币、被推送唤起、帮亲友做任务……如果只能拿到这一个总数，你能区分这些原因各占多少吗？区分不了的话，这个数字能证明什么、不能证明什么？"
  - level: 3
    stage: 证据互证
    question: "检查一下你手里的证据链：装机量、月活、登录率、使用时长、收徒裂变——它们是各自独立地证明了产品受欢迎，还是可能由同一个因素同步驱动？如果是后者，「多指标互相印证」还成立吗？你会用什么办法把这些指标拆开看？"
  - level: 4
    stage: 检验设计
    question: "假设公司宣称「用户是真的喜欢我们的产品，不只是为了金币」，而你有权索取数据或做一个小规模检验来验证：你会要求哪些口径的数据（按什么分群、观察多长周期），或者设计一个怎样的对照——动哪个变量、哪部分用户保持不动、观察哪些指标？什么结果会支持这个说法，什么结果会推翻它？"
  - level: 5
    stage: 结论边界
    question: "现在收敛：这组指标的含金量，你准备写到什么强度——足以证明、不足以证明，还是现有证据无法判定？无论选哪一档，写出一个会改变你结论的证据。再检查一步：如果你的数据只显示两件事在时间上一前一后发生，你愿意据此断定因果吗？还需要排除什么？"
