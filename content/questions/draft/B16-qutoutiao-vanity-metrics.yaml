main_question: "面对趣头条「上线两年月活 6220 万、登录率 95%、两年三个月登陆纳斯达克」的亮眼成绩单，请你判断：这些指标能在多大程度上证明这是一门好生意——你会追问哪些数据、用什么方法检验它们的含金量？"
ability_tags:
  - 指标与验证
  - 根因分析
  - 产品价值判断
difficulty: 基础
domain: 内容/社交
kind: baseline
rubric:
  dimensions:
    指标与验证:
      - "区分规模指标与健康度指标：指出月活、装机量、登录率只证明触达与打开，证明生意成立还需补充留存质量、变现效率与单位经济指标。"
      - "识别指标同源污染：指出注册、登录、时长、裂变等数据被同一套金币机制同步推高、不能互相印证，登录率 95% 是签到激励的副产品而非粘性证据。"
      - "提出「激励剔除」检验：要求看补贴退坡后的自然留存与时长变化（如 2020 年 Q4 收缩补贴后 DAU 同比下滑 29.3%），判断活跃是买来的还是长出来的。"
      - "建立投入产出口径：用单用户广告收入对比单用户金币与获客成本，或用营销费用占营收比（2018~2019 年为 114%、101.3%）检验增长的可持续性。"
      - "设计可执行的验证动作：如分地区/分群停减激励的自然实验、激励与非激励用户的留存与广告价值分群对比。"
    根因分析:
      - "指出增长的第一驱动是现金激励而非内容价值，并解释「签到+收徒」机制如何同时推高注册、登录、时长多组指标。"
      - "解释价值错配链条：为金币而来的用户广告价值低 → 只能承接低质广告 → 监管风险与口碑恶化 → 变现能力进一步下降。"
      - "用案例事实（销售费用超过营收、补贴退坡后用户流失、停止披露财报）支撑因果链，而非泛谈「模式不可持续」。"
    产品价值判断:
      - "明确表态这些指标不能证明这是一门好生意，并给出「什么证据出现才能改观」的条件（如补贴退坡后留存高位走平、单位经济转正）。"
      - "区分「补贴买增长」与「价值留用户」的长期结局差异，可对照同样发金币但活下来的极速版产品说明分野在哪里。"
      - "识别「单一广告变现 + 激励驱动增长」的结构性风险，并说明其对资本市场估值的反噬（上市即巅峰、退市收官）。"
  forbidden_leaks:
    - "「活跃是买来的、不是长出来的」核心结论"
    - "「剔除金币激励看自然留存」的检验方法"
    - "「营销费用占营收 114%/101.3%」的单位经济证据"
    - "「金币机制同源推高注册/登录/时长多组指标」的污染逻辑"
    - "「低质广告—监管点名—变现恶化」的死亡螺旋链条"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问这些指标「能否证明这是一门好生意」——动笔前先想清楚：要证明一门生意成立，需要回答哪几个问题？月活、登录率这类数字分别能回答其中哪几个、又答不了哪几个？"
  - level: 2
    stage: 视角补充
    question: "请分别代入两个角色：一位每天签到攒金币的县城用户，和一位在趣头条投广告的品牌主——他们各自为什么留在这个产品上？这两个理由之间存在怎样的错位？"
  - level: 3
    stage: 反例/风险
    question: "「登录率 95%」听起来是惊人的粘性——但如果签到本身就能换现金，这个指标还能证明用户喜欢这个产品吗？还有哪些看似漂亮的指标，可能是被同一套机制顺手推高的？"
  - level: 4
    stage: 取舍权衡
    question: "假设你是当时的投资人，CEO 向你汇报「DAU 又涨了 20%」。在鼓掌之前，你会坚持先算清哪一笔账？如果这笔账算出来是亏的，增长还值得追吗？"
  - level: 5
    stage: 验证方式
    question: "如果管理层宣称「用户已经离不开趣头条」，而你有权做一个为期一个月的小实验来验证真伪——你会动哪个变量、观察哪些指标的变化来下结论？"
