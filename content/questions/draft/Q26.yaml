main_question: 学校负责人问：『这是一个所有学校、所有人都能免费使用的产品吗？我们为什么要考虑它？』请写一段面向负责人的简短说明，再列出教师和学校管理员各自需要确认的一项条件或问题。请基于材料回答；不清楚的资格或功能不要保证。
ability_tags:
  - 产品表达
  - 产品价值判断
difficulty: 基础
domain: 教育
kind: daily
rubric:
  dimensions:
    产品表达:
      - 正面回应是否普遍免费，讲清材料支持的对象、资格与待核实边界，并以学校负责人能理解的语言说明用途与潜在价值；不限定唯一叙述顺序。
      - 区分学区注册、教师与学生使用、管理员负责的事项，不把不同角色混为一谈。
      - 对无法从材料确认的地区或个人资格给出可核实的下一步，不承诺所有学校自动适用。
    产品价值判断:
      - 指出教学内容制作或学校统一配置能解决的具体任务及适用条件。
      - 说明教师或管理员可能获得的具体价值，并识别一项资格核实或账号配置成本。
      - 不把免费公告、宣传数据或功能清单直接当作学习效果改善的证据。
  forbidden_leaks:
    - 面向负责人的完整介绍与分角色确认事项。
    - 对全部学校免费和必然提高学习效果的绝对承诺。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 学校负责人问是否所有学校、所有人都免费，材料能支持什么，哪里还要核实？
  - level: 2
    stage: 视角补充
    question: 教师和管理员在制作内容与管理账号上承担的任务相同吗？
  - level: 3
    stage: 反例与风险
    question: 公告讲的是注册学区，资格页面又要求哪些核实？
  - level: 4
    stage: 取舍权衡
    question: 如果接入需要验证身份或配置团队，对学校有什么成本？
  - level: 5
    stage: 验证方式
    question: 写出一段可直接发送的说明，再给两类角色各一个核实问题。
