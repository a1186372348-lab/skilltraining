id: Q26
title: Canva 教育工具：怎样向学校解释免费服务的边界
case_title: 一份面向学校的介绍，怎样既说清价值也说清条件
case_background:
  product:
    text: Canva 提供用于制作视觉内容的在线工具；其教育产品介绍将课堂设计与教学资源作为使用场景。
    citations:
      - 1
      - 2
  audience:
    text: Canva for Districts 公告面向学校系统，并描述学区注册后教师和学生可获得教育工具访问权限。
    citations:
      - 1
  scenario:
    text: Canva 自称自 2019 年 12 月起为 K–12 教师和学生提供免费的教育产品，后又介绍面向学区的集中部署。
    citations:
      - 1
  features:
    text: 学区公告列出单点登录、集中账户配置和发布控制；当前帮助页区分学校团队中教师、学生和管理员的权限。
    citations:
      - 1
      - 4
  status:
    text: 公告称注册学区的教师与学生可免费访问其所述高级功能；当前资格指引另列验证条件，具体适用范围须按学校情况核实。
    citations:
      - 1
      - 3
