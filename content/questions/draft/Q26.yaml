uncertainty:
  - 学区公告页面未显示明确发布日期；不能把其发布年份等同于 2019 年教育产品上线年份。
  - 现行资格和权限指引会变化；材料没有证明所有学校符合条件或学习成绩因此改善。
  - 禁止泄露点的编辑口径：限制导师在用户完成判断前代写整套答案，不限制题面提供必要机制事实和正常资料，也不要求用户采用参考答案的具体词语、排序或方案。
