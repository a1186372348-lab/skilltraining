main_question: "假设你是蔚来能源业务的负责人，正在拍板下一阶段的换电投入。约束摆在台面上：这张网络累计投入已超 50 亿元、四代站单站建设成本约 150 万元，而公司 2024 年净亏损 224 亿元——同样一笔钱不投进换电，就可以投向整车降价、研发或渠道。请给出你的立场：继续按现有节奏加注、有条件收缩，还是转向以合作共建为主？要求：比较各选项的收益、代价与风险，依据落到案例事实上；对你没有选的方向给出具体处理（做到什么程度、什么条件下再调整）；说明你的判断依赖哪些假设、出现什么信号时你会改变立场。"
ability_tags:
  - 产品取舍
  - 根因分析
  - 产品价值判断
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品取舍:
      - "明确给出资源分配立场（继续加注／有条件收缩／转向合作共建），并对次要方向给出具体处理（收缩到什么程度、限定预算观察、退出止损或交给合作方承接的条件）；「全都要」「边走边看」式的不表态不得分。"
      - "立场从比较中得出：同时呈现加注与收缩（或共建）各自的收益、代价与风险——补能体验差异化、BaaS 门槛与持续收入、网络资产，对比建站与运营投入、持续亏损、权益收缩——依据落到案例事实；只论证自己选的一边，得分有限。"
      - "识别决策的机会成本：同等投入用于整车降价、研发或渠道的可能替代收益被纳入比较，说明为什么换电是（或不是）这笔钱当前最好的去处，而非孤立评价换电本身。"
      - "区分「战略亏损」与「失控亏损」时说明判断逻辑：结论依赖哪些假设（站点利用率能否爬升、单站成本能否继续下降、合作车型接入能否放量）、什么信号会改变判断；不要求凭空算出可靠的财务结论，计算精确性不作为得分点——只有测算数字而没有假设与改判信号，按笼统表态处理。"
      - "看到代价在不同利益相关方之间的分配：新车主权益被剥离、老车主权益保值、股东承担亏损，并纳入取舍考量。"
    根因分析:
      - "解释蔚来「难以停下」的结构性原因：换电已绑定车型平台、BaaS 商业模式与高端用户承诺，停建的损失不只是已投入的金钱。"
      - "把亏损拆成可分析的来源（建站资本开支、站点运营费用、利用率不足），而非一句「烧钱」带过。"
      - "用案例中的事实（单站成本下降、盈亏平衡单量、站点达标比例、开放合作进展）支撑因果链，而非纯观点推演。"
      - "识别外部环境变化对决策前提的冲击（快充与 800V 平台普及正在压缩换电的时间优势），说明决策前提而非只评价决策结果。"
    产品价值判断:
      - "分别从用户价值与企业价值两个立场评估，指出二者一致之处（补能便利）与冲突之处（免费权益收缩）。"
      - "检验「护城河」叙事是否成立：网络规模、排他性、用户转换成本分别给出了什么证据与反证。"
      - "评估开放合作（长安、吉利、宁德时代）的双向影响：分摊成本与做大标准的同时，排他性被稀释。"
      - "给出面向未来的验证指标（单站日单量、合作车型接入量、能源业务盈利时点），而非停留在价值表态。"
  forbidden_leaks:
    - "「收益／代价／风险」的现成三段清单"
    - "「换电是被车型平台与用户承诺锁死、停不下来」的根因结论"
    - "「权益货币化／服务从标配转付费」的定性结论"
    - "「开放网络以分摊成本、争夺行业标准」的战略答案"
    - "「800V 超充稀释换电时间价值」的风险结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求同时分析收益、代价与风险——动笔之前，你打算怎么搭答案的骨架？你会按「谁受益／谁付费」来拆，还是按「短期／长期」来拆？先写下你认为必须回答的三个子问题。"
  - level: 2
    stage: 视角补充
    question: "请分别代入三类人：一位正在对比蔚来和同级竞品、补能不方便的准车主；一位 2022 年提车、手握终身免费换电权益的老车主；一位要在明年决定换电站建设计划的管理层——同一张换电网络，在他们各自的账本上分别是什么？"
  - level: 3
    stage: 反例/风险
    question: "行业里的另一条技术路线在加速：多家车企押注 800V 高压快充，十分钟补能数百公里已不罕见。如果未来充电只要十分钟，换电省下的那几分钟还值多少钱？你前面写下的收益里，哪几条会最先被动摇？"
  - level: 4
    stage: 取舍权衡
    question: "把你没有选的那条路当作认真的备选再审视一遍：它被放弃或降级，代价是什么——彻底停下、限定预算观察，还是交给合作方承接？再给自己装一个「改判触发器」：什么信号出现时你会推翻现在的立场，届时具体改什么？"
  - level: 5
    stage: 验证方式
    question: "两年后复盘这张换电网络：你会同时看哪几组数来判断它做对了还是做错了——这些数能否区分「换电真的带来了增量销量与收入」和「只是用亏损换来留在牌桌上的资格」？"
