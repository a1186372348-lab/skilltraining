# B13 ｜ 蔚来换电：持续加注的重资产投入，值不值
# 批次：T33 基线测评题（第一批）｜ 主测维度：产品取舍 ｜ 状态：草案，复审「有条件通过」条件已落实，待复核后上架
# 复审修订说明（局部修改，案例背景/资料/来源未动）：
#   ① 题干补充下一阶段资源约束与备选投入（累计投入超 50 亿、四代单站约 150 万、2024 年净亏损 224 亿；备选用途：整车降价/研发/渠道——均为案例已有事实，未编造新数字）；
#   ② 产品取舍 Rubric 落在比较与行动选择上：立场（加注/收缩/共建）＋依据比较＋对次要方向的处理；
#   ③ 单站经济模型条目改为要求说明判断逻辑（依赖哪些假设、什么信号改变判断），计算精确性不作为得分点；
#   ④ eval 高分样本核查：原样本以判断结构取胜、无自创精确测算，已按新题干重写，并新增 medium 反例锚点。
id: B13
title: "蔚来换电：持续加注的重资产投入，值不值"
case_title: "一张用三千多座换电站铺出来的网络"
domain: 出行
case_background:
  product:
    text: "蔚来（NIO）是定位高端市场的智能电动车企，其最鲜明的差异化选择是自研自建换电体系：车辆可充、可换、可升级，用户在换电站约 3 分钟即可换上满电电池。2020 年 8 月，蔚来发布电池租用服务 BaaS——车电分离，用户购车时不购买电池包、车价立减 7 万元，改为按月支付电池租用服务费（发布时 70kWh 电池包为每月 980 元）。"
    citations: [2, 5]
  audience:
    text: "核心用户是蔚来中高端车型的车主，尤其是对长途出行与补能效率敏感的人群——高速换电网络的设计目标就是让电车长途出行「说走就走」。2024 年蔚来全年交付 22.2 万辆；随着换电网络 2023 年底起对外开放，长安、吉利等合作车企的车型与运营车辆也成为这套网络的潜在使用者。"
    citations: [5, 6, 4]
  scenario:
    text: "换电网络贯穿蔚来车主的补能场景，也是购车决策的一部分：截至 2024 年 8 月，蔚来已建成 2480 座换电站、累计为用户提供超 5100 万次换电服务，并发布「加电县县通」计划，宣布到 2025 年底在 27 个省级行政区、超 2300 个县实现换电站全覆盖；到 2025 年 4 月底，蔚来在全国建成换电站 3289 座，高速换电网络贯通「9 纵 9 横 14 大城市群」。"
    citations: [1, 5]
  features:
    text: "围绕换电的一整套产品设计：3 分钟换电、BaaS 电池租用、电池按需灵活升级，换电站还具备储能属性、可参与电网调峰。2023 年 6 月，蔚来宣布全系新车起售价下调 3 万元，同时免费换电不再作为首任车主基础用车权益——用户可选择单次付费换电，或花 3 万元购买「权益升级包」恢复每月 4 次免费换电。"
    citations: [4, 3]
  status:
    text: "投入与回报的张力正在公开化：蔚来 2024 年全年净亏损 224 亿元，连续第二年超过 200 亿元。据媒体报道，换电站单站建设成本从一代约 300 万元降至四代约 150 万元，全网总投入已超 50 亿元，换电业务至今未能实现盈利；三代换电站日均 60 单才能达到盈亏平衡，2023 年 11 月时约 20% 站点达到这一标准。2025 年 3 月，宁德时代宣布与蔚来共建换电网络，并推进对蔚来能源不超过 25 亿元的战略投资。"
    citations: [6, 7, 4]
