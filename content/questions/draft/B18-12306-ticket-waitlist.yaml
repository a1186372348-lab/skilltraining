# B18 ｜ 向非产品同事讲清楚：火车票为什么秒光、候补在排什么
# 批次：T33 基线测评题第一批（B18）｜ 状态：草案，待产品负责人评审后上架
id: B18
title: "向非产品同事讲清楚：火车票为什么秒光、候补在排什么"
case_title: "「票是不是被锁了」：一次跨部门的机制解释"
domain: "出行"
case_background:
  product:
    text: "铁路 12306——中国铁路官方网络售票平台（网站与 App），也是铁路唯一的官方互联网售票渠道。其「候补购票」功能 2018 年底试点、2019 年 5 月推广至所有旅客列车：车票售罄后，旅客可免费提交候补订单并预付款，由系统按订单生效的时间顺序自动排队兑现。"
    citations: [3, 1, 5]
  audience:
    text: "全国铁路旅客；春运、节假日等高峰期出行需求高度集中——部分时段、部分区段的旅客出行需求是铁路最大运输能力的 2 倍以上，如 4 月 30 日 19 时至 23 时北京至郑州方向的旅客购票需求为有效运力的 5 倍以上。"
    citations: [1, 4]
  scenario:
    text: "热门车次开票常出现「秒光」：每趟旅客列车定员一般不超过 2000 个席位，而热门车次起售时旅客提交的购票需求可达每秒数万张，以 12306 系统的处理能力不到 1 秒席位全部售出。同时，一些长途列车的中间站间一开售就显示无票、只能候补，引发「票是不是一开始就被锁了」的质疑。"
    citations: [1, 4]
  features:
    text: "候补购票规则：免费服务，票款之外不收取任何手续费；每名购票人可同时保有 6 个待兑现候补订单，每个订单最多选择 3 个乘车日期、合计不超过 60 个「车次+日期」组合；系统 24 小时持续兑现，最晚兑现截止时间为开车前 20 分钟。长途列车实行「长途优先、兼顾中短途」售票策略，车票发售经历票额预分、动态调整、敞开发售三个阶段。"
    citations: [3, 1, 2]
  status:
    text: "官方数据显示，候补兑现成功率在 70% 以上（其中 51% 为短途车票），2026 年春运以来已通过候补购票兑现 1280 万张车票。但误解依然普遍：第三方平台把免费候补包装成付费「加速包」「双通道抢票」售卖，市场监管部门已查处相关虚假宣传案件并明确——现有抢票软件无法突破 12306 官方平台的候补规则，所谓「加速」「优先」均为营销噱头。"
    citations: [2, 4, 5]
