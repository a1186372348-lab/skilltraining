main_question: "假设一位不懂产品的同事在公司群里吐槽：「12306 一放票就秒光，票肯定被锁给内部渠道了，候补就是画饼」——请你写一段 300 字左右的回复，向他讲清楚：票为什么秒光、候补到底在排什么，以及为什么这套机制是当前约束下相对公平的方案；他的质疑里哪部分有道理、哪部分站不住，也一并说清楚。"
ability_tags:
  - 产品表达
  - 根因分析
  - 用户理解
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品表达:
      - "从听众的认知与情绪切入：先正面回应「锁票」「画饼」的质疑——承认其中合理成分（每趟车的票额分配细账不公开、旅客只能看到「有票/候补」，信息不对称确实存在），再指出不成立的部分，而非把质疑全盘否定或自顾自灌输概念。"
      - "结构可被听众复述：有明确的核心结论、有限的分层与落点明确的行动建议，听完能记住「一句话答案」。"
      - "善用日常类比解释抽象机制（如排队、库存分配），且类比与机制的关键特征对应准确，不产生新的误导。"
      - "控制信息密度：每个论点只配最关键的一两个事实，避免把官方说明全文搬运给听众。"
      - "评分口径：不以「同事是否被说服、是否接受结论」为得分条件——同事理解了依据与代价后仍保留不同看法，不构成表达失败；评价只看传递质量（结论前置、依据落到事实、回应到异议点上）。"
    根因分析:
      - "把「秒光」拆分为供需结构（高峰期需求数倍于运力）与售票策略（长途优先、三阶段发售）两层原因，并区分主次，而非单一归因。"
      - "区分「开售后秒光」（需求扎堆、席位瞬时售罄）与「开售即候补」（中间站间未预分票额）两种现象的不同成因。"
      - "用案例中的关键数据（定员上限、每秒数万张需求、需求为运力 2~5 倍）支撑因果链，而非断言「就是系统不行」。"
      - "在充分利用案例已有信息的前提下，准确说明机制证据的局限与未知：如「70% 以上」是官方整体口径、具体线路与站间差异很大（官方示例中就有兑现率明显更低的站间）、每趟车的票额预分细账未公开——准确承认局限是加分项；但空喊「不确定」而不利用已有信息不得高分，把整体口径说成对每条线路的确定承诺则扣分。"
    用户理解:
      - "识别听众真正关心的问题（「我怎样才能买到票」），让解释最终落到可操作的建议，而非停留在机制科普。"
      - "把「相对公平」落到具体分配原则与代价：说清「长途优先、兼顾中短途」与「按候补订单生效时间排队」让谁受益（长途旅客、整列运力利用）、谁让步（短途旅客开售即候补、候补者承担兑现不确定性），而非只抛「这样最公平」的结论。"
      - "预判听众的常见误解（第三方加速包更快、候补没希望）并用事实化解，而非指责听众不懂。"
  forbidden_leaks:
    - "「供需矛盾是根、售票策略是规则、候补是缓冲」的现成三层框架"
    - "「官方排号机／官方排队」等现成类比模板"
    - "「先处理情绪、再讲机制、最后给建议」的表达结构点破"
    - "「开售后秒光 vs 开售即候补」两种成因的区分结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "动笔前先看清同事的这句话：他真正问的是机制原理，还是「我为什么买不到票」的委屈？你这段回复必须化解他的哪几个具体质疑？少回答一个，会有什么后果？"
  - level: 2
    stage: 视角补充
    question: "请代入三个人：买始发站到终点站全程票的长途旅客、只坐中间两站的短途旅客、希望每个座位都不空驶的铁路运营方——同一趟车的票，他们各自心中的「公平」一样吗？差别在哪里？"
  - level: 3
    stage: 反例/风险
    question: "假设按同事的意思改：取消长短途区别对待、所有区间先到先得，并且取消候补、卖完即止——热门车次会发生什么？谁会受益，谁会比现在更买不到票？"
  - level: 4
    stage: 取舍权衡
    question: "如果只能在「短途旅客随时买得到票」和「整列车座位利用最大化」之间优先保一个，你会保哪个？你打算怎么向利益受损的那一方解释这个选择？"
  - level: 5
    stage: 验证方式
    question: "解释发出去之后，你怎么判断同事是真听懂了还是嘴上应付？如果他只能记住一句话，你希望是哪句——为什么这句话不应该是「以后早点定闹钟抢票」？"
