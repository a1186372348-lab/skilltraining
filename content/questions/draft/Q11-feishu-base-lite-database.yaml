main_question: "在一个「文档套件」里长出一个「轻数据库/业务系统搭建工具」，它到底是给谁用的？如果你是多维表格的产品负责人：请刻画它的核心用户与典型场景；设计一个最能体现其价值的首次使用路径（从打开到「啊哈时刻」）；并写一段面向目标用户的一句话产品介绍——不是官网广告语，而是让用户明白「这和我用 Excel 有什么不一样」。"
ability_tags:
  - 用户理解
  - 方案设计
  - 产品表达
difficulty: 基础
domain: "办公协同"
rubric:
  dimensions:
    用户理解:
      - "用户刻画具体到角色与处境：如连锁门店店长管排班与库存、运营管活动进度、小团队负责人管客户——有真实业务流程但无 IT 支持，而非笼统的「职场人」。"
      - "能识别用户的真实替代品：Excel 加微信群、纸质台账、或昂贵的定制系统，多维表格的竞争对象首先是 Excel 的使用习惯而非其他 SaaS。"
      - "能用用户的语言陈述核心诉求：不是「数据库」，而是「事情有人管、进度看得见、不用求人开发」。"
      - "能区分三种角色的不同诉求：使用者（一线填表的人）、搭建者（团队里会玩表格的那个人）、买单者（中小企业主或 IT 负责人）。"
    方案设计:
      - "首次使用路径围绕具体场景模板而非功能导览：让用户在自己的业务（如招聘漏斗、门店巡检）里十分钟内看到价值。"
      - "「啊哈时刻」定义清晰且与价值主张一致：如「表格状态一改、负责人自动收到通知」或「一键切到看板视图看到全局」。"
      - "路径设计有减法意识：隐藏数据库、权限等重型概念，渐进披露，避免首屏暴露企业级复杂度。"
      - "能利用飞书生态作为分发与协作杠杆（消息通知、文档嵌入、群联动），并考虑独立使用版本的定位差异。"
    产品表达:
      - "一句话介绍使用用户语言而非技术语言：说清与 Excel 的区别（协作、自动流转、视图切换），不出现「低代码/零代码/数据库」等术语。"
      - "表达含具体场景或角色锚点，让目标用户能自我代入（如「给不会写代码、但要管一摊事的人」）。"
      - "表达有边界感：不承诺替代专业系统，清楚它服务的是轻量业务管理，避免过度营销。"
      - "能给出两个以上版本并说明各自面向哪类用户或渠道，体现表达的对象感。"
  forbidden_leaks:
    - "「竞争对手首先是 Excel 习惯而非其他 SaaS」的判断"
    - "「使用者/搭建者/买单者」三角角色拆分"
    - "「模板场景驱动、隐藏重型概念渐进披露」的期望设计要点"
    - "「啊哈时刻等于自动化通知或视图切换」的预期答案"
    - "「表达要避开低代码/数据库术语」的评分标准"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「是给谁的」。先别列功能：找一个你身边具体的人，他现在正用什么笨拙的方式管理一摊事？把他的一天描述出来，这就是用户刻画的起点。"
  - level: 2
    stage: 视角补充
    question: "一个团队里，搭这张表的人、每天填这张表的人、决定要不要继续用这张表的人，往往是三个不同的人。他们各自想要什么？谁最可能中途放弃？"
  - level: 3
    stage: 反例/风险
    question: "很多工具死于「功能强大，但第一次打开不知道该干嘛」。你能想到新手路径做得好和做得差的产品各一个吗？差的那种，用户在第几分钟流失的？"
  - level: 4
    stage: 取舍权衡
    question: "如果只能让新用户在第一天体验一个能力，你选哪一个？是展示「强大」（百万行、权限、BI），还是展示「马上有用」？为什么？"
  - level: 5
    stage: 验证方式
    question: "把你写的一句话介绍拿给三个真实的目标用户看，你会观察他们的什么反应来判断这句话成不成立？什么样的反应说明你没说动他？"
