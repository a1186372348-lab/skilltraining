# Q11 ｜ 飞书多维表格：文档套件里的「轻数据库」是给谁的
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q11
title: "飞书多维表格：文档套件里的「轻数据库」是给谁的"
case_title: "长在办公套件里的业务系统：多维表格的用户之问"
case_background:
  product:
    text: "飞书——字节跳动旗下办公协作平台；多维表格是长在其中的业务系统搭建产品，官方定位为「不仅是表格，更是 AI 时代的业务系统」：无需编写代码，像搭积木一样把表格搭成业务应用，官方演示场景含进销存、客户关系管理、电商直播、采购与行政服务等。"
    citations: [1, 6]
  audience:
    text: "使用飞书的企业组织，尤其是不会写代码、但有业务流程管理需求的一线业务人员与中小企业——CEO 谢欣称多维表格与低代码平台、飞书项目「都是直接为企业的一线业务服务」，官方主张让「每个人变成业务高手」。"
    citations: [3, 4]
  scenario:
    text: "团队过去靠 Excel 加微信群管理项目进度、客户名单与库存，版本混乱、进度靠人肉追问——官方把这类传统业务工具的痛点总结为「不打通、不灵活、不好用」；多维表格的答法是「零代码搭系统」，让业务人员不写代码就能搭出轻量业务系统。"
    citations: [1, 3]
  features:
    text: "多维表格（表格与多视图、仪表盘与 BI 分析、精细行列级权限、AI 字段与模型插件）、与飞书生态的集成、飞书低代码平台与飞书项目（同属官方「业务三件套」）、可脱离飞书独立使用并登陆企业微信与钉钉。"
    citations: [1, 2, 3, 5, 6, 7]
  status:
    text: "多维表格 2020 年 11 月在首届飞书未来无限大会发布，同年 12 月开启独立应用内测；此后逐年强化（自动化、仪表盘等能力陆续加入），2024 年 9 月数据库化、单表容量突破 100 万行，当时月活约 600 万；2025 年 7 月升级至千万行级数据库并加入 AI 能力，月活逼近 1000 万；2025 年 8 月起支持脱离飞书跨平台使用（企业微信已可打开、钉钉已提交申请），与钉钉 AI 表格等同类产品正面交锋。"
    citations: [2, 4, 5, 6, 7]
