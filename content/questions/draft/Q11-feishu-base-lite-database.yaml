main_question: "在一个「文档套件」里长出一个「轻数据库/业务系统搭建工具」，它到底是给谁用的？如果你是多维表格的产品负责人，请完成四件事：选定一个核心用户——一个具体的角色而非笼统的一类人，说清他在什么处境下、想完成什么、受什么约束；还原他的一条典型业务流程——他现在怎么把这摊事管起来、卡在哪一步；为他设计一条首次使用路径——从打开到「啊哈时刻」，以「十分钟内让他在自己的业务里看到价值」为设计目标，场景模板、导入现有表格、引导搭建等路径均可成立，说明你的选择与理由；最后写一版面向他的产品介绍——不是官网广告语，而是让他明白「这和我用 Excel 有什么不一样」。"
ability_tags:
  - 用户理解
  - 方案设计
  - 产品表达
difficulty: 基础
domain: "办公协同"
rubric:
  dimensions:
    用户理解:
      - "用户刻画具体到一个角色与他的处境：如连锁门店店长管排班与库存、运营管活动进度、小团队负责人管客户——有真实业务流程要管；处境按所选场景具体判断（有无 IT 支持、预算与人力约束、现有工具用到什么程度），不把「没有 IT 支持」当作所有用户的固定前提，也非笼统的「职场人」。"
      - "替代品依据场景判断：所选用户的替代品可能是 Excel 加微信群、纸质台账、其他 SaaS 或昂贵的定制系统——「首先竞争 Excel 使用习惯」是许多轻量业务场景下的可能情况而非固定答案；高分在于说清自己选定的场景里替代品是什么、用户为什么仍留在旧办法里。"
      - "能用用户的语言陈述核心诉求：不是「数据库」，而是「事情有人管、进度看得见、不用求人开发」。"
      - "能区分使用者（一线填表的人）、搭建者（团队里会玩表格的那个人）、买单者（中小企业主或 IT 负责人）三类角色的目标、约束与张力；允许同一人兼任多个角色（小团队中常见）——高分来自还原目标、约束与角色张力，而非列齐三个身份。"
      - "对材料中的官方表述与第三方观点（如「让每个人变成业务高手」「多维表格的实质是轻量版低代码平台」）：支持、质疑或修正均可，复述这些观点不得当作独立论证，按证据使用与检验质量评分——指出它与你所选场景的事实是否一致、哪些仍需佐证。"
    方案设计:
      - "首次使用路径开放：场景模板、导入现有表格、引导搭建等路径均可成立，不强制模板优先；评分看所选路径与所选核心用户、典型流程的匹配理由——为什么这个用户、这条流程适合这样进场，而非路径形式本身。"
      - "设计目标与「啊哈时刻」：以「十分钟内让用户在自己的业务里看到价值」为设计目标（题干设定，不作评分硬约束）；「啊哈时刻」与所选场景的价值主张一致——「切换看板」「自动通知」是功能动作而非价值本身，用户还应解释它如何改善具体任务（如更快发现逾期事项、减少人工催办）。"
      - "减法与边界：不让新手先学数据库、权限模型等重型概念，渐进披露；但涉及分享与协作时共享边界必须清楚——让用户明白「谁能看、谁能改」，首次路径兼顾简洁与可控。"
    产品表达:
      - "表达面向选定听众，说清与 Excel 的区别（协作、自动流转、视图切换等）；术语是否合适取决于听众——面向一线业务用户应少用「低代码/零代码/数据库」等技术语言，面向 IT 或管理层则可以使用；评分关注理解与准确性，不因术语本身扣分。"
      - "表达含具体场景或角色锚点，让目标用户能自我代入（如「给不会写代码、但要管一摊事的人」）。"
      - "表达有边界感且边界按选定场景、版本与能力说明：说清在所选场景下不承诺替代什么、解决到什么程度；不把「只服务轻量管理、不替代专业系统」当作整个产品的固定边界——官方定位已包含企业级业务系统与专业业务应用；过度营销与无依据的自我设限同样不得高分。"
      - "一版表达清楚即可得高分；若主动给出多个版本，须说明各自面向哪类用户或渠道——版本数量不是评分标准，对象感才是。"
  forbidden_leaks:
    - "「核心用户＝不会写代码但要管一摊事的一线业务人员、首次路径从其业务场景切入、介绍用大白话对标 Excel」的整套作答主线"
    - "「啊哈时刻＝自动化通知或视图切换」的预期答案（功能动作如何改善具体任务，须由作答者自己解释）"
    - "「隐藏数据库与权限等重型概念、渐进披露，同时讲清共享边界」的设计要点"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「是给谁的」。先别列功能：找一个你身边具体的人，他现在正用什么笨拙的方式管理一摊事？把他的一天描述出来，这就是用户刻画的起点。"
  - level: 2
    stage: 视角补充
    question: "一个团队里，搭这张表的人、每天填这张表的人、决定要不要继续用这张表的人，可能是三个不同的人，也可能同一个人兼任。在你选的场景里，他们各自想要什么、受什么约束？张力出现在哪？谁最可能中途放弃？"
  - level: 3
    stage: 反例/风险
    question: "很多工具死于「功能强大，但第一次打开不知道该干嘛」。你能想到新手路径做得好和做得差的产品各一个吗？差的那种，用户在第几分钟流失的？"
  - level: 4
    stage: 取舍权衡
    question: "如果只能让新用户在第一天体验一个能力，你选哪一个？是展示「强大」（百万行、权限、BI），还是展示「马上有用」？为什么？再延伸一步：如果你选的核心用户平时并不在飞书里办公（比如团队在微信或钉钉上协作），你的首次路径与介绍还成立吗？这对它的跨平台定位与分发意味着什么？"
  - level: 5
    stage: 验证方式
    question: "把你写的产品介绍拿给三个真实的目标用户看，你会观察他们的什么反应来判断这段话成不成立？什么样的反应说明你没说动他？"
