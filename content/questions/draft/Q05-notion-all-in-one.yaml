# Q05 ｜ Notion 从文档工具走向 All-in-One 的边界判断
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
id: Q05
title: "Notion 从文档工具走向 All-in-One 的边界判断"
case_title: "工具箱的边界：Notion 该做到哪一步"
case_background:
  product:
    text: "Notion——Notion Labs 出品的协作工作空间，以 block（块）为基本单位，把文档、知识库（wiki）、数据库与项目管理组合在同一空间里。"
    citations: [4, 6]
  audience:
    text: "个人知识工作者与中小团队；其 all-in-one 叙事所对标的，是「在多个单点工具（文档、表格、项目管理、Wiki）间来回切换」的团队——Notion 官方亦称多数工具彼此割裂，来回切换带来上下文切换成本。"
    citations: [1, 4]
  scenario:
    text: "2016 年发布 1.0（以文档/笔记为主），2018 年 3 月发布 2.0 后明确 all-in-one workspace 定位，创始人 Ivan Zhao 称「Notion 2.0 is really the 1.0 for us」；此后持续向更多工作场景扩展：2024 年 1 月推出 Notion Calendar（由收购的 Cron 更名而来），2025 年 4 月上线 Notion Mail。"
    citations: [4, 5, 1, 2]
  features:
    text: "页面与 block 编辑器、数据库（表格/看板/日历视图）、wiki、模板生态、第三方集成与 API、AI 能力（如 Notion Mail 的自动整理与起草邮件）。"
    citations: [4, 6, 2]
  status:
    text: "all-in-one 已是 Notion 官方持续阐述的愿景（官方博客称希望把「时间层」带入 Notion 的各个方面：笔记、项目、任务）；但场景扩张有进有退——Notion Mail 上线约一年半后，Notion 宣布其于 2026 年 9 月 22 日停运，公司称将把重心转向 AI agents。"
    citations: [1, 2, 3]
