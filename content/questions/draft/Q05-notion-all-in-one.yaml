main_question: "Notion 从文档工具扩张为 all-in-one workspace 的合理性来自哪里，边界又在哪里？如果你是其产品负责人，面对「要不要进入某个新场景（如日历、邮件、表单）」的决策，你会用什么框架来判断？"
ability_tags:
  - 问题定义
  - 产品价值判断
  - 方案设计
difficulty: 中等
domain: "工具/效率"
rubric:
  dimensions:
    问题定义:
      - "把「边界判断」定义清楚：判断的不是「能不能做」，而是「做了是否强化核心闭环」。"
      - "区分扩张的真实驱动力（工具切换成本、数据割裂）与伪驱动力（竞品都有、收入焦虑）。"
      - "识别 Notion 的扩张逻辑是积木式能力组件复用，而非简单功能堆叠。"
    产品价值判断:
      - "论证 all-in-one 的价值来源：数据在同一空间互通、减少上下文切换、替代多份工具订阅。"
      - "指出边界处的价值递减：离核心数据模型（block/页面/数据库）越远，赢过专业工具的成本越高。"
      - "用创始人 toolbox/「让用户自建软件」的愿景佐证扩张的一致性，而非仅凭市场热度或个人喜好下判断。"
    方案设计:
      - "提出可操作的判断框架（例如：是否复用核心数据模型、是否高频、是否强化而非分流核心场景）。"
      - "把框架应用到至少一个具体场景（日历/邮件/表单任选），做出明确判断并说明理由。"
      - "考虑自建之外的选项（API 集成、嵌入、收购）作为边界外的解法。"
  forbidden_leaks:
    - "判断框架的具体条目（核心数据模型复用、高频、强化核心场景）"
    - "「离核心数据模型越远越不该做」的判据"
    - "「积木复用 vs 功能堆叠」的区分结论"
    - "日历/邮件/表单任一场景的应做/不应做结论"
    - "集成/收购替代自建的案例提示（如 Cron）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要的不是列举 Notion 做了什么，而是交付一个「可复用的判断框架」——先想清楚：你的框架要对谁可用？判断的输入是什么、输出是什么？"
  - level: 2
    stage: 视角补充
    question: "代入一个 20 人创业团队的主管：他现在用四五个工具各管一摊、每月付五份订阅——all-in-one 对他真正的吸引力是什么？再代入一个深度用户：他最怕 Notion 变成什么样？"
  - level: 3
    stage: 反例/风险
    question: "反例比比皆是：不少工具型产品扩张成「全家桶」后被用户嫌臃肿——它们的扩张和 Notion 的扩张有什么不同？什么信号说明 all-in-one 开始反噬核心体验？"
  - level: 4
    stage: 取舍权衡
    question: "每进入一个新场景，都在「留住用户的全部工作」和「做深现有体验」之间分配资源——按你的框架，哪类场景宁可让用户去用专业工具，也不该自己做？"
  - level: 5
    stage: 验证方式
    question: "假设按你的框架决定进入某个场景并上线了，半年后你会看哪些信号来检验框架本身判对了没有？什么结果说明框架需要修正？"
