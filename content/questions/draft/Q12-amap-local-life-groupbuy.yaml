main_question: "如果你是高德到店业务的产品负责人，请选定一个具体到店场景（例如「尚未选定去哪」的找店、「已选定目的地」后的购券、导航途中临时起意之一），给出明确立场：高德在这个场景做团购/到店「值得进入 / 不值得进入 / 值得有限试点」。要求说清四件事：这个结论为谁创造什么价值（用户、商户、平台分别说明）、价值成立需要哪些条件、最大的不确定性是什么、什么证据会改变你的结论；并为支撑立场，简要说明该场景下关键环节的设计思路与验证方法。注意两点：导航用户处于不同决策状态（尚未选店、已选定目的地、途中临时找店），不要把所有导航流量当作消费决策的同一阶段；高德的价值也不以「让用户逛起来」为前提——缩短找店、购券、到店的过程同样可能创造价值。"
ability_tags:
  - 产品价值判断
  - 方案设计
  - 指标与验证
difficulty: 中等
domain: "出行"
rubric:
  dimensions:
    产品价值判断:
      - "立场与价值结构：立场明确（值得进入／不值得进入／值得有限试点），说清价值对谁成立（用户省下了什么、商户得到了什么、平台获得了什么），判据具体可检验，而非「既导流又做生态」两头好话或「流量大所以该做」式倒推。"
      - "场景选择体现决策状态区分：能区分尚未选店、已选定目的地、途中临时找店等不同状态，说明所选场景处于消费决策的哪一段、高德在该段介入凭什么比现有替代方式（美团找店、抖音种草、到店直接买）更好，而非把所有导航流量视为同一决策阶段。"
      - "优势与短板的表述有依据边界：导航意图与位置数据可构成相对优势，但核销与位置观察并非高德独有；「评价体系薄弱」类判断须给出与美团的比较依据，「缺失」等绝对化结论扣分；「用完即走」心智等有归属的媒体观点可引用、可检验——复述这些观点不得当作独立论证，按证据使用与检验质量评分。"
      - "对扫街榜机制与承诺的检验：官方介绍明确提及导航模式、用户评价与信用等信号，具体算法权重未公开——不宜把「真实行为完全替代主观评价」当作既定事实或唯一得分点，未知部分应保留；「永不商业化」须注明承诺对象（榜单排名）与公开表述范围，与团购交易的商业化分别讨论，且承诺本身不能证明榜单已无偏或无法被操纵。"
      - "盈利与财务口径：阿里 2025 年 2 月 20 日披露的是「高德整体、截至 2024 年 12 月 31 日的单季」盈利——不能推出到店业务或团购盈利，也不能再以无时期与口径限定的「高德长期未盈利」作为现状结论；「到店市场高毛利」「商户获得低成本流量」需进一步论证，不能自动迁移为高德的经营优势。"
    方案设计:
      - "方案围绕所选场景的决策状态设计触发点（如目的地确定后的套餐呈现、途经点的顺路提示、到达后的结算入口），而非把美团的团购列表搬进地图。"
      - "关键环节发挥地图优势，但不强求每一步独有：决策与到店引导是地图的主场环节，付款、核销与售后可靠顺畅即可（可复用阿里体系内既有能力），方案须说清地图在哪些环节创造差异、哪些环节不创造。"
      - "测量边界意识：导航完成、进入商户附近、实际进店、核销消费是不同事件，方案须说明各环节分别如何度量、误差在哪（如导航结束不等于进店、到附近不等于消费）。"
      - "商户侧价值主张成立但不预设唯一计费模式：按效果计费、按曝光计费、佣金制等可由用户比较选择并说明取舍理由，不强制「按真实到店效果计费」。"
      - "能明确不做什么：克制对导航核心体验的侵入（如不在驾车导航中强推），有场景边界意识。"
    指标与验证:
      - "指标体系分层且有判断基准：流量转化（POI 页点击→详情→购券）、履约（购券→到店→核销）、生态（商户客流变化、复购）、护栏（导航核心体验指标不受影响），每层说明「什么算成立、什么算证伪」。"
      - "归因判断：能区分增量创造与存量迁移（用户本就要去这家店，团购是增量还是抢单），并进一步分别判断——存量迁移不自动意味着无价值，更便利的购买、更低的交易成本仍可能产生价值，消费者、商户、平台三方收益须分别判断。"
      - "验证设计的可比性：分城市灰度须说明试点与对照城市的可比性（体量、竞争格局、补贴力度），补贴退坡测试须排除同期干扰，不能仅凭灰度结果或退坡数据断言因果。"
      - "承认证据边界：如榜单是否已被操纵、核销数据能否获得、未决策用户占比多大等当前无法定论的问题，说明需要什么证据才能区分——属合法高分路径，不得按「没给结论」扣分。"
  forbidden_leaks:
    - "对「值得进入／不值得进入／值得有限试点」的预设立场及配套论证链（立场须由用户自行形成，任一侧结论均不得预给）"
    - "「目的地流量天然等于交易流量／工具心智注定失败」的单边定性结论链"
    - "「扫街榜以真实行为取代主观评价、因此榜单不可操纵」的定性结论（官方口径为多信号合成、权重未公开，须由用户自行检验）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求你先选定一个具体场景再给立场。动笔前先拆：一个导航去餐厅的用户，可能处于「还没选定去哪」「已选定目的地」「途中临时想找点别的」哪种状态？你选的场景里，用户在高德出现之前本来是怎么完成这件事的？"
  - level: 2
    stage: 视角补充
    question: "站在三个人的角度：导航途中的用户、商场里一家新开的湘菜馆老板、美团的到店产品经理。高德在你选的场景做团购，谁最紧张、谁最无感、谁最可能受益？"
  - level: 3
    stage: 反例/风险
    question: "试着给自己的立场找反例：如果你判断「值得」，工具 App 塞入交易功能失败的教训里，哪一条最可能击穿你的成立条件？如果你判断「不值得」，「缩短找店、购券、到店的过程本身也是价值」这句话有没有你无法反驳的部分？"
  - level: 4
    stage: 取舍权衡
    question: "你的结论成立，最依赖哪一个假设——是「导航流量里有足够多的未决策用户」，是「商户愿意为高德带来的客源付费」，还是别的？如果只能先验证一个假设，你验证哪个、为什么？"
  - level: 5
    stage: 验证方式
    question: "假设上线三个月，老板问：这些到店消费是高德创造的增量，还是从美团抢的存量？再进一步：如果主要是存量迁移，它对消费者、商户、平台三方各自意味着什么——一定没有价值吗？你会用什么数据回答？"
