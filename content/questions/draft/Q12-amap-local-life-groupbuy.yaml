# Q12 ｜ 高德地图做本地生活团购：工具产品的场景扩张
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
# 返工说明：复审裁决「退回重写」——①主测改为形成价值结论（选定一个场景→值得进入/不值得进入/值得
#   有限试点→为谁创造什么价值、成立条件、最大不确定性），并要求区分导航用户的不同决策状态（尚未选店/
#   已选定目的地/途中临时找店），不以「让用户逛起来」为价值前提；②删除「独有数据」「评价体系缺失」硬结论，
#   扫街榜信号与「永不商业化」承诺按官方口径限定范围（多信号合成、权重未公开、承诺对象为榜单排名）；
#   ③修正盈利口径：阿里 2025-02-20 财报电话会披露高德于截至 2024-12-31 的季度实现盈利（高德整体、单季
#   口径，推不出到店业务或团购盈利）；④闭环与验证校准：关键环节发挥地图优势即可、付款核销售后可靠即可、
#   商户计费方式开放比较、存量迁移不自动等于无价值、分城市灰度须说明可比性；⑤难度升为中等；
#   ⑥补产 content/eval/Q12.yaml；横切：forbidden_leaks 收窄为整套作答导读级结论链，材料观点移出清单，
#   并在 Rubric 注明「复述这些观点不得当作独立论证」。
id: Q12
title: "高德地图做本地生活团购：工具产品的场景扩张"
case_title: "从「导航用高德」到「生活用高德」：工具产品的到店野心"
case_background:
  product:
    text: "高德地图——阿里旗下地图导航 App，导航是核心场景，月活规模为数亿级（媒体口径）；2021 年 7 月品牌升级为「出门好生活开放服务平台」，定位从「导航用高德」扩展到「生活用高德」。"
    citations: [1, 3, 4]
  audience:
    text: "一侧是有明确出行与目的地意图的驾车、出行用户，另一侧是渴求线上流量的线下餐饮、酒旅商户——高德官方称希望每天能为线下餐饮及其他服务业多带去 1000 万客流。"
    citations: [1, 2, 3]
  scenario:
    text: "用户导航去商场或餐厅的路上、或到达目的地后，看到附近团购套餐、扫街榜推荐；商户希望通过真实到店客流获得线上曝光。阿里官方介绍，扫街榜综合导航模式、真实用户评价与用户授权后的信用等多种信号生成榜单，具体算法权重未公开。"
    citations: [1, 2, 7]
  features:
    text: "导航与路径规划、附近搜索与 POI 页、高德指南（酒旅餐饮团购）、高德扫街榜（2025 年 9 月上线，官方称综合导航、用户评价与信用等信号生成，高德公开承诺榜单「永不商业化」）、烟火好店支持计划（超 10 亿元补贴）。"
    citations: [1, 2, 4, 7]
  status:
    text: "高德 2020 年发布「高德指南」试水酒旅餐饮团购；2021 年 7 月升级为「出门好生活开放服务平台」；2023 年 3 月与口碑正式合并，承接阿里全部到店业务；2025 年 2 月 20 日，阿里巴巴在财报电话会上披露高德于截至 2024 年 12 月 31 日的季度实现盈利（高德整体、单季口径，不等于到店业务单独盈利）；2025 年 9 月推出「扫街榜」切入到店消费决策，上线首日用户超 4000 万；到店业务对美团、抖音的份额争夺仍处早期。"
    citations: [1, 3, 4, 5, 6, 8]
