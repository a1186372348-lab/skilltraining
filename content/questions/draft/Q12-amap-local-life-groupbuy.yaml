main_question: "一个「用完即走」的工具产品，凭什么做「逛起来」的本地生活？如果你是高德到店业务的产品负责人：请判断高德做团购/到店的独特优势与结构性短板；设计一个最能发挥「导航场景」优势的到店产品闭环（从用户决策到到店核销）；并给出验证这个闭环是否成立的指标体系。"
ability_tags:
  - 产品价值判断
  - 方案设计
  - 指标与验证
difficulty: 基础
rubric:
  dimensions:
    产品价值判断:
      - "能说清高德的独特资产：意图明确的「目的地流量」（导航是消费决策的下一跳）、位置数据与真实到店行为，区别于美团的主动找店与抖音的内容种草。"
      - "能识别结构性短板：工具心智「用完即走」、使用时长与内容生态薄弱、交易心智与评价体系缺失。"
      - "能判断「扫街榜」的差异点：用真实行为数据替代主观评价生成榜单，以及「永不商业化」承诺的信任价值。"
      - "能评估战略价值与财务现实的张力：到店是高毛利市场、对阿里有战略意义，但高德长期未整体盈利，补贴效率存疑。"
    方案设计:
      - "闭环设计围绕导航场景原生触发（如目的地附近套餐、顺路推荐、停车后到店），而非把美团的团购列表搬进地图。"
      - "方案覆盖完整链路：决策（榜单/推荐）→ 购券 → 导航到店 → 核销 → 复购与行为回流，且每一步与地图能力挂钩。"
      - "能明确不做什么：克制对导航核心体验的侵入（如不在驾车导航中强推），有场景边界意识。"
      - "方案兼顾双边：给商户的价值主张（按真实到店效果计费、低成本流量）同样成立。"
    指标与验证:
      - "指标体系分层：流量转化（POI 页点击→团购详情→购券）、履约（导航到店率、核销率）、生态（上榜商户客流增量、复购）、护栏（导航核心体验指标不受影响）。"
      - "能提出「真实到店」这一高德可独有度量的指标（如导航到店轨迹、核销与轨迹的交叉验证），并说明对手难以复制之处。"
      - "能设计验证方法：分城市灰度、对照组比较、补贴退坡后的自然流量留存测试。"
      - "能指出关键归因难题：用户本就要去这家店，团购是增量还是抢单，并提出辨别思路（如对照组客流增量对比）。"
  forbidden_leaks:
    - "「目的地流量、导航即决策下一跳」是独特资产的预期判断"
    - "「用完即走心智、评价体系缺失」是预设短板"
    - "「核销率/导航到店率是可独有度量的指标」的预期答案"
    - "「增量 vs 抢单」的归因难题是评分要点"
    - "「不在导航中强推、场景边界克制」的期望设计原则"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "先想清楚：用户打开美团找餐厅，和打开高德去餐厅，这两个动作的意图阶段有什么不同？你的方案要利用的到底是哪一个瞬间？"
  - level: 2
    stage: 视角补充
    question: "站在三个人的角度：导航途中的用户、商场里一家新开的湘菜馆老板、美团的到店产品经理。高德做团购，谁最紧张、谁最无感、谁最可能受益？"
  - level: 3
    stage: 反例/风险
    question: "地图 App 里塞榜单、团购、打车、酒店，「工具变臃肿」的教训历史上不少。你能想到反例吗？高德凭什么认为自己不会重蹈覆辙？"
  - level: 4
    stage: 取舍权衡
    question: "补贴可以快速起量，但补贴换来的到店用户会留下来吗？如果只能在「补贴拉新」和「把导航体验做得更好」之间分配资源，你怎么分？"
  - level: 5
    stage: 验证方式
    question: "假设团购上线三个月，老板问：这些到店消费是高德创造的增量，还是从美团嘴里抢的存量？你会怎么用数据回答这个问题？"
