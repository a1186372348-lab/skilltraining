# Q12 ｜ 高德地图做本地生活团购：工具产品的场景扩张
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q12
title: "高德地图做本地生活团购：工具产品的场景扩张"
case_title: "从「导航用高德」到「生活用高德」：工具产品的到店野心"
case_background:
  product:
    text: "高德地图——阿里旗下地图导航 App，导航是核心场景，月活规模为数亿级（媒体口径）；2021 年 7 月品牌升级为「出门好生活开放服务平台」，定位从「导航用高德」扩展到「生活用高德」。"
    citations: [1, 3, 4]
  audience:
    text: "一侧是有明确出行与目的地意图的驾车、出行用户，另一侧是渴求线上流量的线下餐饮、酒旅商户——高德官方称希望每天能为线下餐饮及其他服务业多带去 1000 万客流。"
    citations: [1, 2, 3]
  scenario:
    text: "用户导航去商场或餐厅的路上、或到达目的地后，看到附近团购套餐、扫街榜推荐；商户希望通过真实到店客流获得线上曝光——扫街榜正是基于用户真实导航与到店行为生成的榜单。"
    citations: [1, 2, 4]
  features:
    text: "导航与路径规划、附近搜索与 POI 页、高德指南（酒旅餐饮团购）、高德扫街榜（2025 年 9 月上线，基于真实导航到店行为生成、承诺永不商业化）、烟火好店支持计划（超 10 亿元补贴）。"
    citations: [1, 2, 4]
  status:
    text: "高德 2020 年发布「高德指南」试水酒旅餐饮团购；2021 年 7 月升级为「出门好生活开放服务平台」；2023 年 3 月与口碑正式合并，承接阿里全部到店业务；2025 年 9 月推出「扫街榜」切入到店消费决策，上线首日用户超 4000 万；但本地生活整体盈利与对美团、抖音的份额争夺仍处早期。"
    citations: [1, 3, 4, 5, 6]
