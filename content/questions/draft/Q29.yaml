id: Q29
title: Google Pay 电子车票：怎样检验手机乘车是否真的省时
case_title: 车票保存到手机后，乘客从进站到通行是否更顺畅
case_background:
  product:
    text: Google 在 2018 年介绍了将拉斯维加斯单轨车票保存到 Google Pay 的体验。
    citations:
      - 1
  audience:
    text: 该方案面向购买拉斯维加斯单轨车票、使用兼容手机的乘客；官方同时描述了无 Google Pay 用户的其他电子票方式。
    citations:
      - 1
      - 2
  scenario:
    text: Google 介绍乘客可在线购买车票并保存到手机，再将手机靠近单轨交通闸机通行。
    citations:
      - 1
  features:
    text: 2018 年 Google 公告称乘客无需打开应用即可持手机靠近闸机通行；运营方所载公告另列通过邮件或短信接收二维码电子票并扫码通行的选择。
    citations:
      - 1
      - 2
  status:
    text: 2018 年发布说明描述了手机票入口，但没有提供可比较的进站耗时数据。
    citations:
      - 1
      - 2
