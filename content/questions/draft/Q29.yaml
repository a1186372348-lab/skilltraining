main_question: 假设你要判断手机票是否让乘客更快进站。请定义一个能计算的时间指标，设计一个简单而公平的比较，结合所选计时范围说明必要步骤及失败时可用的替代方式。说明什么方向的结果支持省时判断，什么情况会让你保留或改变判断；再说出这项功能对谁可能有价值，材料里哪些结论还不能直接得出。
ability_tags:
  - 指标与验证
  - 方案设计
  - 产品价值判断
difficulty: 基础
domain: 出行
kind: daily
rubric:
  dimensions:
    指标与验证:
      - 明确计时起点、终点、观察单位与统计方法，并说明比较的人群和时间窗口。
      - 把失败、未完成和极端等待纳入报告，不只统计成功且顺利的乘客。
      - 区分公告描述的流程与省时效果，说明有无随机或可比对照对结论的影响。
    方案设计:
      - 结合所选计时范围说明完成进站所需的关键步骤，不要求画完整购票流程。
      - 识别兼容设备、电量或票证等一种可能例外，说明失败时可用的替代方式。
      - 比较安排与所选步骤相匹配；若提出改进动作，可作为补充而非必答。
    产品价值判断:
      - 说明对已有兼容手机且熟悉电子票的乘客可能产生的便利及其成立条件。
      - 考虑不具备兼容设备或遇到故障的乘客，说明价值可能受限。
      - 不把使用手机或公司宣传自动等同于每个人都更省时。
  forbidden_leaks:
    - 带完整计时口径、对照、失败处理与价值判断的方案。
    - 电子票必然比所有替代方式省时的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 乘客从哪里开始排队，到什么时候算通过闸机？
  - level: 2
    stage: 视角补充
    question: 只计算顺利通过的人，会遗漏哪些情况？
  - level: 3
    stage: 反例与风险
    question: 使用手机票的人可能和使用其他票的人原本就不同吗？
  - level: 4
    stage: 取舍权衡
    question: 手机没电或票未保存时，怎么让乘客继续完成行程？
  - level: 5
    stage: 验证方式
    question: 怎样的结果支持进站省时？如果失败率或购票保存时间增加，你会怎样调整结论？
