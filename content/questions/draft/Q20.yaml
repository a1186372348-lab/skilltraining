main_question: 假设你要改善首次使用 EBT SNAP 的线上购物体验。基于材料先定义值得解决的具体问题：用户在商品选择、资格判断与支付分配之间可能遇到哪些不同障碍？选择一个最优先问题，说明受影响人群、成功结果和边界，再提出最小验证或改进思路。不要假设已有某个环节的失败率。
ability_tags:
  - 问题定义
  - 用户理解
difficulty: 中等
domain: 电商
kind: daily
rubric:
  dimensions:
    问题定义:
      - 把宽泛的结账困难界定为特定人群、任务、障碍和期望结果。
      - 区分所选障碍与回答中涉及的其他相关障碍，不将其混为同一问题；不要求穷举所有可能环节。
      - 依据证据强弱提出优先级，并明确尚需验证的范围，不编造失败率。
    用户理解:
      - 针对首次使用者说明所选购物情境中需要理解的信息，不要求额外分析已有经验的用户。
      - 结合订单资格、可用支付卡或商户支持等条件说明具体障碍，不以收入标签代替场景。
      - 指出支付失败、费用超出预期等可能顾虑之一，并说明它仍是待验证的假设。
  forbidden_leaks:
    - 完整的问题界定、优先级理由和验证思路。
    - 首次使用者普遍无法完成支付或现有流程已经解决所有问题的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 同一购物车里，哪些商品和费用可能适用不同支付规则？
  - level: 2
    stage: 视角补充
    question: 新用户与已经用过 EBT 的用户，需要看到的信息会一样吗？
  - level: 3
    stage: 反例与风险
    question: 如果用户没有另一张可用的支付卡，系统应如何解释限制？
  - level: 4
    stage: 取舍权衡
    question: 商品资格、商户支持、卡片添加和结账说明中，你先验证哪个问题？
  - level: 5
    stage: 验证方式
    question: 怎样区分用户看到了信息与真正理解了支付分配？
