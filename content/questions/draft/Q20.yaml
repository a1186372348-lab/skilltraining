id: Q20
title: Instacart 食品补助支付：结账链路的问题应如何定义
case_title: 一笔订单中哪些费用能用补助支付
case_background:
  product:
    text: Instacart 的帮助页说明，参与美国 SNAP 项目的用户可在支持的商户使用 EBT 卡购买合资格商品。
    citations:
      - 1
      - 5
  audience:
    text: 相关对象包括持有有效 EBT 卡的用户与参与线上交易的商户；是否支持取决于州和商户。
    citations:
      - 1
      - 5
  scenario:
    text: 用户在选择商品并准备提交线上订单时，需要区分可用补助支付的商品与其他费用。
    citations:
      - 2
      - 3
  features:
    text: 帮助页介绍可打开商品 SNAP 资格显示。按本题采用的 Instacart 帮助页，使用 EBT 卡前还需向账户添加信用卡或借记卡，用于承担不符合 EBT 条件的商品及有关费用；哪些费用可用补助支付仍按相应规则判断。
    citations:
      - 1
      - 2
      - 3
  status:
    text: 所列帮助页面为 2026 年 11 月核验时的公开说明，商户、地区与规则可能变化。
    citations:
      - 1
      - 3
      - 5
