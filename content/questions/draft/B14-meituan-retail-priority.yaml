# 初答后披露（供 AI 总监追问引用）：决策时点（2022 年 4 月 19 日）之后的后续结果，不进案例背景
reveal_after_first_answer:
  text: "决策时点之后的实际演进：2024 年三季度，美团闪购日均单量突破 1000 万单，「七夕」当日峰值超 1600 万单，非食品类增长快于食品类；2024 年美团即时配送日订单峰值达 9800 万单，新业务经营亏损收窄至 73 亿元，当年三季度新业务除优选外首度整体盈利。2024 年 3 月业绩电话会上，管理层承认优选「规模增长低于预期」导致件均履约成本难以大幅下降、激烈竞争导致商品加价率与补贴难降，「这个市场比我们先前的预期更艰难」。2025 年 6 月优选退出大部分省份（美团对媒体回应口径为「转型升级、局部业务调整」），2025 年 12 月最后运营区域停止服务；资源转向闪购、小象超市（原美团买菜）等即时零售方向。"
  citations: [11, 10, 12, 13]
rubric:
  dimensions:
    产品取舍:
      - "明确给出排序与资源分配立场，并对次要方向给出具体处理（收缩聚焦／限定预算／退出止损）及触发条件；「全都要」「边走边看」式的不表态不得分。若主张现有信息不足以排序，须说清缺口与过渡安排，否则视为回避取舍。"
      - "排序依据多元且落到案例事实：从需求频次与空间、履约成本结构、与外卖主业的协同、竞争格局、监管约束等维度中至少选取三条组织论证，每条依据都能回指案例事实（亏损账本、单量与覆盖、九不得与处罚、双寡头与京东到家等）；只凭单一对比（如「重仓储 vs 轻配送」）或只论证自己选的一边，得分有限。"
      - "两边的账都算：所选方向的收益与代价、被收缩方向的机会成本（同样的资源投向另一边的替代收益）都有交代，而非只列一边的好处。"
      - "区分「这个业务本身好不好」与「适不适合美团在此时做」：排序依据落在后者——同一方向换个主体（如拼多多做社区团购）或换个时点，结论是否不同。"
      - "关键假设显性化：排序依赖的核心假设（如「某边的件均成本会随单量密度降下来」「即时需求的盘子足够大」）说清楚，并给出假设被证伪时的预案。"
    用户理解:
      - "区分两个方向服务的人群与需求场景：计划性、价格敏感的次日自提，与即时性、时效敏感的 30 分钟送达；能用案例中的用户结构事实（即时零售约 3 亿消费者、高线年轻用户为主）支撑判断。"
      - "回答「哪类需求与美团既有用户和外卖场景更重合、哪类需要重新获客」，并把答案与美团 6.9 亿交易用户、年新增 1.8 亿等事实联系起来，而非空谈「流量协同」。"
      - "识别供给侧角色的处境差异：团长与自提点、本地商户与骑手、自营前置仓，各自在两种模式下的收益机制与压力。"
    指标与验证:
      - "提出可观察的验证指标（件均履约成本、单量密度、复购频次、客单价、单位经济模型、亏损收窄速度）支撑排序，而非只做定性表态。"
      - "设计的信号能区分「方向本身不成立」与「执行没跟上」，并说明两类信号分别触发什么动作（收缩、加码、调整打法）。"
      - "给出预设的复盘节奏或止损条件（如多长时间内件均成本或单量密度达不到什么水平就收缩），而非「边走边看」。"
  forbidden_leaks:
    - "「优选优先还是闪购优先」的现成排序结论"
    - "「复用骑手网络一定优于自建仓储」或「重资产模式必败」的直接对比结论"
    - "「计划性低价需求 vs 即时性便利需求」的需求分层答案"
    - "「监管锁死低价打法、社区团购已无胜算」的现成外因结论"
    - "「件均履约成本必须靠单量密度摊薄」的单位经济答案"
    - "「优选负责拉新、闪购负责变现」的现成分工结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "排优先级不是选「哪个是好业务」，而是选「先把资源给谁、给多少」。动笔之前，你会先立下哪几个判断维度（需求、成本、协同、竞争、监管……），让排序有据可依而不是凭感觉？这些维度里，哪一个对「美团」这个主体最重要，为什么？"
  - level: 2
    stage: 视角补充
    question: "请分别代入两类用户：一位一周买三次菜、愿意为了便宜两块钱今天下单明天自提的家庭采购者；一位深夜发现洗发水用完、希望半小时送达的年轻上班族。两个方向各自在解决谁的什么问题？哪一类需求离美团现有的 6.9 亿用户和骑手网络更「近」，哪一类需要重新获客？"
  - level: 3
    stage: 反例/风险
    question: "支持你排序反方向的证据同样存在：如果你优先闪购，如何回应「即时零售消费者只有约 3 亿人、客单价低，京东到家已经跑在前面」的质疑？如果你优先优选，如何回应「一年亏掉外卖和到店酒旅的全部利润、监管又限制了低价打法」的现实？请针对你的排序，主动写出对它杀伤力最大的一条反对意见，并给出你的回应。"
  - level: 4
    stage: 取舍权衡
    question: "假设两个方向明年合计只能再投一笔固定预算：全给一边，还是按比例分？你的分配方案背后最关键的那个假设是什么（比如「某边的单位成本一定会随规模降下来」或「某边的市场空间足够大」）？如果这个假设被证伪，你的预案是什么？"
  - level: 5
    stage: 验证方式
    question: "一年后复盘你的排序：你会盯哪几组数？这些数能否帮你区分「方向本身错了」和「方向对但执行没跟上」——这两种结论分别会触发你什么不同的动作？"
