# B14 ｜ 美团的两条零售线：优选与闪购的优先级
# 批次：T33 基线测评题（B14）｜ 主测维度：产品取舍 ｜ 状态：草案，评审返工重写，待产品负责人评审后上架
# 返工说明：评审意见「材料已写两条线分出胜负、资源转向结局，明显引导排序；重仓储 vs 轻配送不能成为唯一排序依据」——
# ① 决策时点固定为 2022 年 4 月 19 日（2021 年度业绩公告 2022-03-25、完整年报 2022-04-19 发布之后），案例背景全部事实截至该时点；
# ② 优选 2025 年关停、资源转向即时零售、「除优选外首度盈利」等后续结果移入 reveal_after_first_answer；
# ③ 产品取舍 Rubric 重写为多元依据（需求/成本/协同/竞争/监管任选其三以上），「重仓储 vs 轻配送」仅为候选依据之一。
# 批次 2 校订：主问题时点由「2022 年初」精确为 2022 年 4 月 19 日（美团 2021 年报发布日，meituan.com/investor 口径）；
#   五篇阅读资料全文已逐篇核查、不含该时点之后信息；uncertainty 升级两篇晚发表转述报道的原始披露出处注释。
# 批次 3 校订：核心资料 2（新浪财经）摘要「年度交易用户 6.9 亿（年新增 1.8 亿）」与原文不符——原文仅「同比增长 35.2%」，
#   「年新增 1.8 亿」实出自经济观察网（case_sources 8）转述的年报口径；摘要已改回原文表述，1.8 亿仍保留于 features 字段（引用含来源 8）。
id: B14
title: "美团的两条零售线：优选与闪购的优先级"
case_title: "外卖赚来的利润，该烧给谁"
domain: 本地生活
case_background:
  product:
    text: "美团是以餐饮外卖起家的本地生活平台，核心资产是庞大的骑手即时配送网络——2021 年餐饮外卖交易金额 7021 亿元，单日订单峰值于 2021 年 8 月突破 5000 万单。2021 年，美团将公司战略由「Food+Platform」升级为「零售+科技」，王兴亲自带队零售特别小组。商品零售方向上先后长出两条业务线：社区团购「美团优选」（2020 年 7 月上线，「预购+次日自提」模式）与即时零售「美团闪购」（2018 年上线，依托即时配送网络的「30 分钟万物到家」），另有自营前置仓业务美团买菜。"
    citations: [6, 9, 13, 1]
  audience:
    text: "两条线面向的需求并不相同：优选服务计划性采购——用户提前下单、次日到自提点取货，靠低价吸引价格敏感的家庭买菜人群，到 2021 年三季度已布局超 2600 个市县、日均单量约 3000 万件；闪购服务即时性需求——应急与便利场景下 30 分钟送达，2021 年 12 月单日订单量峰值超 630 万单、年活跃买家 2.3 亿。行业研究口径下，2021 年即时零售消费者约 3 亿人，以高线城市 26~40 岁、消费能力较强的年轻用户为主。"
    citations: [13, 5, 8, 9]
  scenario:
    text: "两个方向都需要持续烧钱，也都各自顶着压力。优选一侧：王兴曾称社区电商是「五年甚至十年一遇的机会」、美团「整个业务的优先战略领域」，但 2021 年美团新业务经营亏损由 2020 年的 109 亿元扩大至 384 亿元，优选是亏损大头，2021 年 GMV 约 1200 亿元、未达 1500 亿元目标，当年四季度美团开始压缩投入；监管上，2020 年 12 月「九不得」首要约束低价倾销，2021 年 3 月美团优选等五家平台因低价倾销、价格欺诈被顶格罚款合计 650 万元。闪购一侧：赛道同样拥挤——京东到家截至 2021 年 9 月的 12 个月 GMV 372 亿元、年活跃消费者 5710 万，2021 年 10 月再联合京东发布「小时购」；美团官方则预计即时零售市场规模有望在 5 年后达到万亿。"
    citations: [7, 1, 2, 3, 4, 9]
  features:
    text: "优选的关键能力是仓储、物流等履约基础设施与团长自提点网络，需要从头自建；闪购的关键能力是复用外卖的骑手配送网络与本地商户供给——券商口径 2021 年美团闪购与京东到家在即时零售平台模式中的份额分别约 37% 和 19%。美团买菜为自营前置仓模式，2021 年 GTV 同比增长 160%、用户数增长 80%，覆盖北京、上海等 7 个城市。另据 2021 年报，美团年度交易用户达 6.9 亿、同比新增 1.8 亿；餐饮外卖分部净利润 62 亿元，到店酒旅分部净利润 141 亿元——新业务 384 亿元的亏损几乎吃掉了两者的利润。"
    citations: [13, 1, 9, 8, 6]
  status:
    text: "截至 2022 年 4 月 19 日 2021 年年报发布（年度业绩公告已于 3 月 25 日发布）：外卖与到店酒旅稳定盈利，新业务整体亏损 384 亿元、经营亏损率 76.4%；优选已完成全国布局但 GMV 未达目标、投入开始收缩；闪购体量尚小——单日峰值 630 万单对比外卖 5000 万单的单日峰值——但保持高速增长，美团 CFO 陈少晖给出的中期目标是日订单量 1000 万单。社区团购赛道经过 2021 年洗牌，同程生活破产、橙心优选与十荟团收缩，第一梯队剩多多买菜与美团优选（市占率均超 30%），且无一平台实现盈利。"
    citations: [6, 7, 8, 5]
