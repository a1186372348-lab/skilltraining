uncertainty:
  - "「2020 年 7 月济南上线」「预购+自提模式」「退出 19 个省份」等细节来自正观新闻复盘报道（正观号作者稿），属媒体二手口径；美团官方未就优选全面关停发布正式公告，21 世纪经济报道称美团官方未正面回应，案例按多源一致的时间线表述。"
  - "384 亿元为 2021 年美团「新业务及其他」分部整体经营亏损（含优选、美团买菜、共享单车等），并非优选单独亏损额；「优选是亏损大头」为 21 世纪经济报道表述。"
  - "2025 年 6 月优选收缩时，美团对媒体的回应口径为「转型升级、局部业务调整」，与 12 月全面关停的事实演进存在差异，案例背景以 2025 年 12 月终局为准。"
  - "闪购「七夕峰值超 1600 万单」与正观新闻所述「闪购日订单峰值超 1.5 亿单」分属 2024 年三季度与 2025 年不同时点口径，案例背景采用已注明年份的 2024 年财报口径。"
