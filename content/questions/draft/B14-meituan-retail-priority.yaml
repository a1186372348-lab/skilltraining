main_question: "假设你是美团商品零售业务的负责人，面对「社区团购（优选）」与「即时零售（闪购）」两个都需要持续投入的方向，你会如何排定优先级——请给出你的排序与依据，以及你打算用哪些信号来验证或推翻自己的选择？"
ability_tags:
  - 产品取舍
  - 用户理解
  - 指标与验证
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品取舍:
      - "明确给出两个方向的排序，以及对次要方向的具体处理（收缩聚焦／限定预算／退出止损），不含糊其辞。"
      - "排序依据同时覆盖两边的收益与代价（需求频次与市场空间、履约成本结构、与外卖主业的协同复用、竞争格局），而非只论证自己选的一边。"
      - "识别核心取舍点：为优选重建仓储供应链的重投入，与闪购复用既有骑手配送网络的轻投入之间的对比。"
      - "把外部约束纳入取舍：监管「九不得」对低价补贴打法的限制如何影响优选的扩张路径与优先级。"
      - "区分「这个业务本身好不好」与「适不适合美团做」两个层面，排序依据落在后者。"
    用户理解:
      - "区分两个方向服务的人群与需求场景：计划性、价格敏感的提前下单自提，与即时性、时效敏感的 30 分钟送达。"
      - "指出优先级判断必须回答「哪类需求更高频、更刚需、与美团既有用户更重合」，并给出自己的判断。"
      - "识别供给侧角色的差异：团长与自提点，对比本地商户、连锁零售商与品牌商，各自在两个方向中的收益机制。"
      - "分析两个方向与外卖存量用户的关系：是低成本的场景延伸，还是需要重新获客的新市场。"
    指标与验证:
      - "提出可观察的验证指标（件均履约成本、单量密度、复购频次、单位经济模型、亏损收窄速度）支撑排序，而非只做定性表态。"
      - "设计的信号能区分「方向本身不行」与「执行没跟上」，并说明两类信号分别触发什么动作。"
      - "给出预设的复盘节奏或止损条件（如多长时间内件均成本降不到某个水平就收缩），而非「边走边看」。"
      - "能用案例中的事实（优选 GMV 未达目标、闪购日均千万单、新业务亏损收窄至 73 亿）反向校验自己的判断逻辑。"
  forbidden_leaks:
    - "「复用骑手配送网络 vs 重建仓储供应链」的直接对比结论"
    - "「计划性低价需求 vs 即时性便利需求」的需求分层答案"
    - "「优选优先还是闪购优先」的现成排序结论"
    - "「件均履约成本／单量密度决定社区团购生死」的直接点破"
    - "「监管九不得锁死低价打法」的现成外因结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "排优先级不是选「哪个是好业务」，而是选「先把资源给谁」——动笔之前，你会先立下哪几个判断维度（比如需求、成本、协同、竞争），让排序有据可依而不是凭感觉？"
  - level: 2
    stage: 视角补充
    question: "请分别代入两类用户：一位一周买三次菜、愿意为了便宜两块钱今天下单明天自提的家庭采购者；一位深夜发现洗发水用完、希望半小时送达的年轻上班族——两个方向各自在解决谁的什么问题？哪一类需求离美团外卖的用户和骑手网络更「近」？"
  - level: 3
    stage: 反例/风险
    question: "支持你排序反方向的证据同样存在：如果你优先闪购，如何回应「即时零售客单价低、市场盘子够大吗」的质疑？如果你优先优选，如何回应「社区团购连年亏损、监管又限制了低价打法」的现实？请针对你的排序，主动写出对它杀伤力最大的一条反对意见，并给出你的回应。"
  - level: 4
    stage: 取舍权衡
    question: "假设两个方向今年合计只能再投一笔固定预算：全给一边，还是七三开？你的分配比例背后最关键的那个假设是什么（比如「某边的单位成本一定会随规模降下来」）？如果这个假设被证伪，你的预案是什么？"
  - level: 5
    stage: 验证方式
    question: "一年后复盘你的排序：你会盯哪三组数？这些数能否帮你区分「方向本身错了」和「方向对但执行没跟上」——这两种结论分别会触发你什么不同的动作？"
