main_question: "假设你是美团商品零售业务的负责人，时间是 2022 年 4 月 19 日，美团刚发布 2021 年年报。请只依据截至此时已经公开的信息回答：社区团购（优选）与即时零售（闪购）两条线都还在投入期、都需要继续烧钱，而外卖与到店酒旅挣来的利润就这么多。你会如何排定两条线的资源优先级？要求：给出明确排序与依据（哪几条依据、各自对应哪些事实）；对次要方向给出具体处理（继续投入／收缩聚焦／限定预算／退出止损）及触发条件；列出你打算用来验证或推翻这个排序的信号。如果你认为现有信息不足以排定优先级，说明还缺什么信息、在拿到之前你会怎么过渡。"
