# B14 ｜ 美团的两条零售线：优选与闪购的优先级
# 批次：T33 基线测评题（第一批）｜ 主测维度：产品取舍 ｜ 状态：草案，待产品负责人评审后上架
id: B14
title: "美团的两条零售线：优选与闪购的优先级"
case_title: "外卖赚来的利润，该烧给谁"
domain: 本地生活
case_background:
  product:
    text: "美团是以餐饮外卖起家的本地生活平台，核心资产是庞大的骑手即时配送网络（2024 年即时配送日订单量峰值达 9800 万单）。围绕「零售+科技」战略，美团在商品零售上先后长出两条业务线：社区团购「美团优选」（「预购+自提」模式）与即时零售「美团闪购」（依托即时配送的「30 分钟万物到家」），另有自营前置仓业务小象超市。"
    citations: [1, 6, 2]
  audience:
    text: "两条线面向的需求并不相同：优选服务计划性采购——用户提前下单、之后到自提点取货，靠低价吸引价格敏感的家庭买菜人群，2020 年底已覆盖全国 90% 以上的市县、数量超 2000 个；闪购服务即时性需求——应急与便利场景下 30 分钟送达，截至 2024 年末已与超 5600 家大型连锁零售商、41 万本地小商户以及超 570 家品牌商合作。"
    citations: [6, 2, 1]
  scenario:
    text: "两个方向都需要持续烧钱。优选 2020 年 7 月上线后高速扩张，王兴曾称社区电商业务「或许是 5 年甚至 10 年一遇的好机会」，但 2021 年美团新业务经营亏损扩大至 384 亿元（上年为 109 亿元），优选是新业务亏损的大头；2020 年 12 月，市场监管总局联合商务部对社区团购提出「九不得」，首要约束低价倾销。闪购一侧，2024 年三季度日均单量突破 1000 万单，「七夕」当日峰值超 1600 万单。"
    citations: [6, 3, 2, 4, 5]
  features:
    text: "优选的关键能力是仓储等履约基础设施与团长自提点网络，社区团购模式「低毛利、重仓储」；闪购的关键能力是复用外卖骑手配送网络与本地商户供给。小象超市则从生鲜电商升级为全品类即时零售平台，已布局超 30 个城市，并开始在线下开实体大店。"
    citations: [6, 1, 2]
  status:
    text: "两条线的优先级已经分出胜负：2024 年美团新业务经营亏损收窄至 73 亿元，当年三季度新业务除优选外首度整体盈利；2024 年 3 月业绩电话会上，美团管理层承认优选「规模增长低于预期」导致件均履约成本难以大幅下降、激烈竞争导致商品加价率与补贴难降，「这个市场比我们先前的预期更艰难」。2025 年 6 月优选退出 19 个省份，12 月最后运营区域停止服务；资源转向闪购、小象超市等即时零售方向。"
    citations: [1, 2, 6]
