# Q01 ｜ Cursor 的 Agent 模式：对谁、对什么任务是关键变化？
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
# 复审修订（产品负责人裁决，有条件通过的 4 项调整 + 横切要求）：
# ① 主问题由「论证为什么是质变」改为「对哪些开发者、哪些任务是关键变化，哪些情况收益有限甚至增加负担」——
#    主测落到用户目标、任务、约束与行为选择，用户理解名实相符；标题同步中性化；
# ② 用户理解 Rubric 按任务特征重写（任务跨度/需求明确程度/可委托程度/风险与审查能力，同一开发者跨任务切换）；
#    Tab 能力按官方 Tab 更新公告修正（已支持整段编辑建议与编辑位置跳转，不能归为「省按键」）；
# ③ 取消强制高分结论：「抬高定价空间」「分层共存」「省整块任务时间」可作有依据的判断也可被质疑；
#    价值判断第 3 条改为「对官方叙事的使用与检验质量评分」，引用官方叙事本身不算论证完成；
# ④ 融资口径由「彭博社报道、未经官方确认」改为「Cursor 官方 Series C 公告披露」（2025 年 6 月），
#    保留边界：这些数字不能证明 Agent 单独造成增长；
# ⑤ forbidden_leaks 收窄至整套作答导读级结论链条；事实性/背景性条目（缓释设计清单、分层共存、定价链条、
#    人机关系表述、价值对比结论）移出，由 Rubric 相应维度「复述现成观点不得分，按证据使用与检验质量评分」承接
id: Q01
title: "Cursor 的 Agent 模式：对谁、对什么任务是关键变化？"
case_title: "从「帮你写」到「替你做」：Cursor 的 Agent 模式"
case_background:
  product:
    text: "Cursor——Anysphere 公司出品的 AI 代码编辑器，基于 VS Code 分叉构建，集成多家大模型并支持 Agent 智能体编码。"
    citations: [2, 4, 5]
  audience:
    text: "软件开发者（从独立开发者到企业研发团队），尤其是愿意让 AI 深度参与开发流程的团队；Cursor 官方为企业团队提供沙箱终端管控、审计日志、团队共享规则等管理能力。"
    citations: [2, 4]
  scenario:
    text: "开发者完成一个真实编码任务的全过程：理解需求、定位代码、编写与修改多个文件、运行命令与测试、修复报错——而不只是在光标处续写下一行；官方博客称，习惯由 Agent 写代码后，用户的主要工作变为「为每个 Agent 提供完成任务所需的上下文」。"
    citations: [1, 2, 3]
  features:
    text: "Tab 补全（官方称 Tab 不止在光标处续写：会建议光标附近的整段修改，并预测「下一个编辑位置」引导跳转，目标是「消除代码编辑中的繁琐」）、Chat/Ask 对话、Agent 模式（自主探索代码库、编辑多文件、在沙箱终端运行命令）、后台计划（Plan）模式、多 Agent 并行（同一提示最多 8 个，以 git worktrees 或远程机器隔离）、内嵌 Browser。"
    citations: [2, 3, 6, 7]
  status:
    text: "2025 年 Cursor 2.0 将编辑器重心转向多 Agent 管理；官方博客称用户主要工作正变为「为 Agent 提供完成任务所需的上下文」。2025 年 6 月，Cursor 官方公告完成 9 亿美元融资、估值 99 亿美元，年化收入（ARR）超 5 亿美元，客户覆盖过半财富 500 强企业（此前由彭博社等媒体率先报道）。"
    citations: [1, 2, 8, 4]
