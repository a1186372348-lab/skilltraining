main_question: "以 Cursor 为例回答两个问题：对哪些开发者、哪些任务，Agent 模式相比代码补全带来了关键变化？在哪些情况下收益有限、甚至增加负担？请从用户的目标、任务特征与约束出发作答：给出你切分「开发者 × 任务」的依据（而不是笼统断言「Agent 更强」），说明同一开发者在不同任务中会如何选择两种模式，并标明你的判断哪些有案例事实支撑、哪些是推测、什么证据会改变它。"
ability_tags:
  - 用户理解
  - 产品价值判断
  - 产品取舍
difficulty: 基础
domain: "工具/效率"
rubric:
  dimensions:
    用户理解:
      - "切分依据落在任务特征上：用任务跨度（单点修改 vs 跨环节完整任务）、需求明确程度、可委托程度（目标能否说清、产出能否快速验证）等特征区分场景；用「已经知道怎么写／知道目标但不愿做全链路」这类固定人群标签替代任务分析不得分。"
      - "把风险与审查能力纳入分层：指出同一开发者在不同任务间会在补全与 Agent 之间切换，选择取决于任务出错代价与其审查 AI 产出的能力，而非「一类用户只用一种模式」。"
      - "还原具体任务链路：说清一次完整开发任务的各环节（理解需求、定位代码、修改、运行验证、修复报错）分别由谁承担，Agent 接管了哪一段、把什么新工作（澄清上下文、审查产出）留给了人；复述「人定义目标、AI 执行、人审查」等现成表述而无具体场景支撑不得分。"
      - "对补全能力的描述符合事实：Tab 已支持整段编辑建议与编辑位置跳转（官方口径），不只是光标处续写；把补全简化为「省按键」来反衬 Agent 的论证按事实错误扣分。"
    产品价值判断:
      - "价值判断有条件、可检验：说清价值变化落在何处（如从输入效率到任务闭环）、对谁成立、成立条件是什么；「省整块任务时间」「抬高定价空间」等可作为有依据的判断得出，也可被质疑——不预设强制结论，结论相反但论证有据同样可得高分，无依据复述上述结论不得分。"
      - "覆盖收益有限的边界：指出 Agent 在哪些任务或用户上收益有限甚至为负（如审查成本超过节省的时间、结果不可控导致返工），并说明边界情形如何影响整体价值判断，而非只论证价值成立一侧。"
      - "对官方叙事的使用与检验质量评分：官方说法（「用户主要工作变为为 Agent 提供上下文」、融资与 ARR 数据）可引用、可比较、可质疑，但引用本身不算论证完成；能指出官方数字不能证明什么（如 ARR 增长无法归因于 Agent 单一功能）者按检验质量给分。"
    产品取舍:
      - "指出 Agent 模式带来的至少两项代价并落到具体场景：自主操作的权限与风险设计成本、结果不可控感、审查负担向用户转移、模型调用成本等。"
      - "说明缓释设计（终端命令需确认/可编辑、Plan 模式、diff 审查等）分别回应哪类代价、不能回应什么；罗列缓释设计清单本身不得分，按其与取舍论证的结合质量评分。"
      - "对补全与 Agent 的关系给出有依据的判断：分层共存、逐步替代、按场景分化均可，但立场须由任务分析支撑并给出理由；复述「分层共存」等现成结论而无论证不得分。"
  forbidden_leaks:
    - "「Agent 相比补全是质变（或只是功能叠加/营销噱头）」的整体定性结论——主问题要求用户自行检验，任一侧定性都不得预给"
    - "「按任务跨度、需求明确程度、可委托程度、风险与审查能力切分场景」的完整分层框架，及由其导出的「哪些任务关键变化、哪些收益有限」的结论链条"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问了两个问题：对哪些开发者、哪些任务 Agent 是关键变化，在哪些情况下收益有限甚至增加负担。动笔前先想：你打算按什么把「开发者 × 任务」切开——按人群分，还是按任务特征分？哪种切法能解释同一个开发者有时用补全、有时开 Agent？"
  - level: 2
    stage: 视角补充
    question: "依据案例与资料还原一次完整的开发任务：从拿到需求到交付，中间经过哪些环节？哪些环节靠补全的整段编辑与跳转就能覆盖，哪些环节需要 Agent 接手？把每个环节「人做什么、AI 做什么」分别列出来。"
  - level: 3
    stage: 反例/风险
    question: "为「收益有限」这一侧找最强的支持场景：什么样的任务里，审查与纠正 AI 产出的成本会超过它节省的时间？一个代码库被 AI 自作主张改乱过的开发者，下一次会在什么任务上重新打开 Agent、在什么任务上坚决不用？"
  - level: 4
    stage: 取舍权衡
    question: "让 AI 自主改多个文件、跑命令，用户让渡了什么、换回了什么？官方提供的终端命令确认、Plan 模式、diff 审查等设计，分别在为哪一类担忧兜底？这对你判断「价值对谁成立」有什么影响？"
  - level: 5
    stage: 依据与边界
    question: "回看你的结论：哪些部分有案例事实或资料支撑，哪些是推测？官方的说法（用户工作变为提供上下文、融资与 ARR 数字）能证明什么、不能证明什么？出现什么证据时，你会修改现在的判断？"
