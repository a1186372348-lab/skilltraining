# B1 ｜ 抖音为什么从短视频走向「超级应用」
# 批次：T17b 基线测评题（B1）｜ 状态：草案，待产品负责人评审后上架
# 返工说明（产品负责人复审裁决）：①主任务由「拆解扩张统一逻辑」改为「选定一种扩张、界定其
# 对应用户场景的问题」（对象/场景/目标差距/处理边界/依据五要素，对齐能力模型 v0.2 §2），统一战略
# 逻辑降为根因分析辅测，「下一个业务该做什么」原则降为 reveal 后追问素材；②取消「焦虑式扩张 vs
# 战略演化」「必然/侥幸」两组强制分类，共同逻辑成立/部分成立/证据不足均可，评分看事实与推理；
# ③修正「图文占比 70%」口径（观看图文内容的活跃用户比例，非内容或播放量占比），功能上线、战略
# 表态与数据披露时间分别记录；④后验结果保留在材料中，但 Rubric 不据结果倒推扩张必然正确；
# ⑤ability_tags 首标签保持问题定义，辅测收敛为用户理解、根因分析，产品价值判断降为 reveal 后追问；
# ⑥forbidden_leaks 收窄为整套作答导读级结论链，事实性与框架性条目移出并在 Rubric 补「复述现成
# 观点不得分」表述。
id: B1
title: "抖音为什么从短视频走向「超级应用」"
case_title: "一个短视频 App 的扩张边界"
case_background:
  product:
    text: "抖音——字节跳动旗下短视频平台，以单列全屏沉浸式视频流和个性化推荐分发为核心形态。2020 年 9 月，时任北京字节跳动 CEO 张楠在抖音创作者大会上公布：截至 2020 年 8 月，包含抖音火山版在内，抖音日活跃用户已超过 6 亿。张楠在 2021 年初的访谈中把抖音这些年的变化总结为：从一种娱乐方式，变成一种社交方式，再到一种生活方式。"
    citations: [1, 3]
  audience:
    text: "内容消费者（泛娱乐用户）与内容创作者——张楠公布，截至 2020 年 9 月的前一年里，有超过 2200 万人在抖音合计收入超过 417 亿元；随着交易场景扩张，商家与本地商户成为第三类关键用户：2023 年超过 450 万家门店在抖音生活服务获得生意增长，超 58 万团购达人获得稳定收益。"
    citations: [2, 8]
  scenario:
    text: "抖音的扩张沿着内容形态与交易场景两条线展开，功能上线、战略表态与数据披露时点各异：2021 年 2 月，张楠首次公布抖音视频搜索月活用户超 5.5 亿，并宣布加大对搜索的投入；2021 年 4 月，抖音电商总裁康泽宇在首届抖音电商生态大会上提出「兴趣电商」概念；图文功能 2021 年 10 月开始内测、同年 11 月正式上线；2022 年 8 月，抖音与饿了么官宣合作，探索「即看、即点、即达」的本地生活服务；2024 年 1 月官方发布《2023 年度数据报告》披露：2023 年抖音生活服务平台总交易额同比增长 256%，门店覆盖 370+ 城市。"
    citations: [4, 5, 6, 7, 8]
  features:
    text: "图文发布器与首页「探索」双列入口；视频搜索；以「兴趣电商」为定位的短视频带货与直播带货；本地生活团购、达人探店，以及与饿了么合作的外卖服务——服务场景从内容消费一路扩展到交易与履约。"
    citations: [6, 4, 5, 7]
  status:
    text: "扩张已见规模化结果：2022 年 9 月抖音创作者大会披露，抖音图文单日用户阅读量已超 100 亿，超七成活跃用户每天会在抖音看十几篇图文内容（指观看图文内容的用户比例，非图文占全站内容量或播放量之比）；2024 年 1 月发布的《2023 年度数据报告》显示，2023 年生活服务平台总交易额增长 256%，其中通过搜索带来的交易额增长 2.6 倍、直播交易额增长 5.7 倍；财新等深度报道显示，抖音在餐饮「种草」能力上已可与大众点评抗衡，部分商户预算从点评转向抖音。"
    citations: [9, 11, 8, 10]
