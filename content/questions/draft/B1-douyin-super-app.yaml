main_question: "抖音以短视频信息流为绝对主形态起家，2021 年前后连续长出图文、搜索、电商与本地生活。请你从中选定一次扩张，回到它所对应的具体用户场景，界定抖音彼时要解决的问题。要求说清五件事：问题的对象（哪类用户在什么处境下遇到障碍）、发生的场景（带着什么目的、在哪段使用路径的哪个环节）、目标差距（原有短视频形态下这件事实际怎样完成、期望它怎样完成、断点具体在哪）、处理边界（你的定义适用于哪类需求、不承诺解决什么）、判断依据（哪些案例事实支持你的定义、什么证据出现会推翻它）。在此基础上进一步说明：你界定的问题能否同时解释其他几次扩张——共同逻辑成立、部分成立还是证据不足，请给出依据，但不得用后来的经营结果倒推当初扩张的必然性。如果你认为现有事实不足以唯一确定问题定义，请明说还缺什么证据。"
# 追问素材（降级处理，首答前不披露，供 AI 总监追问引用）：「下一个业务该做什么」原则不作主测，
# 首答后请用户用自己界定的问题与处理边界检验新业务假想
reveal_after_first_answer:
  text: "张楠在访谈中谈到抖音从一种娱乐方式变成社交方式、再到生活方式，同时也谈到抖音「不变的根」；2022 年 8 月抖音切入外卖履约环节时，选择与饿了么合作而非自建配送体系。追问方向：请用户用自己界定的问题与处理边界检验——按这套边界，抖音「下一个该做与不该做的业务」分别是什么样？什么信号出现时，某项扩张该收缩？"
  citations: [3, 7]
ability_tags:
  - 问题定义
  - 用户理解
  - 根因分析
difficulty: 挑战
domain: "内容/社交"
rubric:
  dimensions:
    问题定义:
      - "界定对象与场景：明确指出问题落在哪类用户身上（如带着明确目的找攻略、查商品、找店的用户，或希望低门槛创作的供给方），发生在什么具体使用路径的哪个环节，而非笼统说「满足更多需求」「用户需要更多内容」。"
      - "目标差距结构：拆出当前状态（原有短视频形态下该需求实际如何被完成、在哪里断裂）、期望状态、两者差距具体是什么，三段齐备且互相咬合；断点须落到形态或链路层面（如单列沉浸式信息流、视频媒介的信息密度、内容到交易的路径），而非泛泛的「体验不好」。"
      - "处理边界：说明定义适用于哪类需求与场景、不承诺解决什么（如所选定义能否同样解释其他扩张方向、哪些需求明确不在本次处理范围），不把单点定义无限泛化为「超级应用什么都可以做」。"
      - "用案例事实校验定义：至少用两处案例事实（如视频搜索月活超 5.5 亿、图文上线后的使用数据、张楠对抖音变化的自述等）检验定义能否解释这些事实，而非纯概念推演；复述材料或媒体中现成的问题定性不得分，按对证据的使用与检验质量评分。"
      - "判断依据的可检验性：给出可检验的判据——什么观察或数据会支持该定义、什么证据会推翻它；或明确指出现有证据不足以唯一确定定义、还需要补充什么。合理承认未知是合法高分路径。"
    用户理解:
      - "还原所选场景下用户的具体场景链：带着什么目的进入、一步步怎么用、在哪个环节离开或绕路，而非贴标签式归因（「因为懒」「图方便」）或笼统谈论「用户」。"
      - "区分所选扩张对应的不同角色处境（如目的明确的内容消费者、希望低门槛创作的创作者、需要获客的商家），说明各方目标与约束，并标明判断依据来自案例事实还是自己的推测。"
      - "分析用户在短视频形态下完成该任务时的替代行为与妥协（如在视频中查找信息点、截图保存、跳转到其他 App），从行为证据读出断点位置，而非把障碍笼统归因为「内容不够多」。"
    根因分析:
      - "对「几次扩张是否存在共同逻辑」给出基于证据的判断：成立、部分成立或证据不足均可得分，评分看事实与推理质量，不因未收敛到唯一结论扣分；但「承认未知」须先充分利用已有信息，再说明具体缺口及什么证据会改变判断。"
      - "区分证据能支持什么、不能证明什么：搜索月活、交易额增长等数据可支持使用规模与业务表现的判断，但不能独自证明扩张动机或战略必然性；用图文阅读量、GMV 增长等后验结果倒推当初扩张「必然正确」不得分。"
      - "时序与口径意识：区分功能上线、战略表态与数据披露的时间（如 256% 交易额增长披露于 2024 年初的年度报告，而非功能上线时点），不把最后一次公开的 6 亿 DAU 当作流量见顶的直接证据。"
      - "把材料中的官方自述与媒体定性（「生活方式」叙事、「焦虑式扩张」解读等）作为分析对象使用和检验：复述现成观点不得分，需指出它与哪些事实一致、哪些事实它解释不了或仍需佐证。"
  forbidden_leaks:
    - "「用户在短视频形态下完成目的性任务存在断点」的完整问题定义答案链（对象—场景—目标差距的现成结论，须由用户自行界定）"
    - "各扩张方向一一对应的现成问题定义清单（如直接点破某业务「解决的就是某类断点」）"
    - "「几次扩张存在统一战略逻辑／只是流量焦虑」的定性结论（成立与否、证据是否充分须由用户自行论证）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求从四次扩张中选定一次、界定它要解决的问题。动笔前先看案例中的事实分布：你会依据什么标准选定分析对象（事实最充分、断点最清晰，还是争议最大）？选定之后，你准备先回答哪几个子问题，让答案不变成「抖音做了什么」的动作清单？"
  - level: 2
    stage: 视角补充
    question: "代入一个具体的用户时刻：一个想找周末出行攻略的人打开了抖音。请还原他从产生需求到拿到结果的完整路径——在只有短视频信息流的形态下，这条路径上哪里顺、哪里卡？卡住的是「没有内容」，还是「有内容但拿不到、带不走」？"
  - level: 3
    stage: 结构梳理
    question: "试着用三句话写出「当前状态—期望状态—差距」：原有短视频形态下这件事实际怎样完成、你希望它怎样完成、中间差的那一块到底是什么。写完检查：你填在「差距」里的，是内容供给、分发形态，还是交易链路？哪条案例事实支撑你这个判断？"
  - level: 4
    stage: 边界校验
    question: "用你的定义去套另外三次扩张：它能解释其中几个？能解释与解释不了的分界在哪里——这决定了你定义的是一个具体场景的问题，还是一句万能口号。反过来，哪些需求是你明确不承诺解决的？"
  - level: 5
    stage: 依据与反证
    question: "回看案例事实清单，把它们分成两类：能说明「用户确实在用、业务确实在长」的，与能说明「当初为何要做」的——前者能否独自证明后者？如果出现什么新证据，你会修改甚至放弃现在的定义？"
