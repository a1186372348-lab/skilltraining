# B1 ｜ 抖音为什么从短视频走向「超级应用」
# 批次：T17b 基线测评题（B1）｜ 状态：草案，待产品负责人评审后上架
id: B1
title: "抖音为什么从短视频走向「超级应用」"
case_title: "一个短视频 App 的扩张边界"
case_background:
  product:
    text: "抖音——字节跳动旗下短视频平台，以单列全屏沉浸式视频流和个性化推荐分发为核心形态。2020 年 9 月，时任北京字节跳动 CEO 张楠在抖音创作者大会上公布：截至 2020 年 8 月，包含抖音火山版在内，抖音日活跃用户已超过 6 亿。张楠在 2021 年初的访谈中把抖音这些年的变化总结为：从一种娱乐方式，变成一种社交方式，再到一种生活方式。"
    citations: [1, 3]
  audience:
    text: "内容消费者（泛娱乐用户）与内容创作者——张楠公布，截至 2020 年 9 月的前一年里，有超过 2200 万人在抖音合计收入超过 417 亿元；随着交易场景扩张，商家与本地商户成为第三类关键用户：2023 年超过 450 万家门店在抖音生活服务获得生意增长，超 58 万团购达人获得稳定收益。"
    citations: [2, 8]
  scenario:
    text: "抖音的扩张沿着内容形态与交易场景两条线展开：2021 年 2 月，张楠首次公布抖音视频搜索月活用户超 5.5 亿，并宣布加大对搜索的投入；2021 年 4 月，抖音电商总裁康泽宇在首届抖音电商生态大会上提出「兴趣电商」概念；2021 年 10 月内测、11 月正式上线图文功能；2022 年 8 月，抖音与饿了么官宣合作，探索「即看、即点、即达」的本地生活服务；到 2023 年，抖音生活服务平台总交易额同比增长 256%，门店覆盖 370+ 城市。"
    citations: [4, 5, 6, 7, 8]
  features:
    text: "图文发布器与首页「探索」双列入口；视频搜索；以「兴趣电商」为定位的短视频带货与直播带货；本地生活团购、达人探店，以及与饿了么合作的外卖服务——服务场景从内容消费一路扩展到交易与履约。"
    citations: [6, 4, 5, 7]
  status:
    text: "扩张已见规模化结果：2022 年 9 月抖音创作者大会公布，图文单日阅读量已超 100 亿、图文用户占比达 70%；2023 年生活服务平台总交易额增长 256%，其中通过搜索带来的交易额增长 2.6 倍、直播交易额增长 5.7 倍；财新等深度报道显示，抖音在餐饮「种草」能力上已可与大众点评抗衡，部分商户预算从点评转向抖音。"
    citations: [9, 8, 10]
