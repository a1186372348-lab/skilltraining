main_question: "抖音以短视频为绝对主形态起家，却在随后几年里连续长出图文、搜索、电商与本地生活，被外界称为走向「超级应用」。请你回答：这一轮扩张背后是否存在统一的逻辑——它是流量见顶后的焦虑式扩张，还是围绕用户需求与平台能力的战略演化？如果你是复盘者，哪些扩张是「必然」，哪些是「侥幸」？站在今天，你会用什么原则判断抖音下一个「该做」与「不该做」？"
ability_tags:
  - 问题定义
  - 用户理解
  - 根因分析
  - 产品价值判断
difficulty: 挑战
kind: baseline
rubric:
  dimensions:
    问题定义:
      - "把「扩张逻辑」拆解为可分析的子问题（如需求边界、分发能力、商业化、组织与供给），而非罗列四个业务的动作清单。"
      - "明确区分「焦虑式扩张」与「战略演化」两种对立框架，表明自己的立场并给出判据。"
      - "给出「超级应用」在本题中的可操作定义（如单一入口覆盖多场景需求），避免概念空转。"
      - "识别题目隐含假设（扩张等于正确、超级应用等于好）并主动检验，而非默认接受。"
    用户理解:
      - "区分无目的消遣型需求（刷）与目的性需求（搜、查攻略、买、到店），并指出扩张主要覆盖的是后者。"
      - "指出图文、搜索、本地生活各自对应的用户场景与人群差异，而非笼统说「满足更多需求」。"
      - "识别供给侧用户（创作者、商家、门店、团购达人）在各新业务中的收益机制。"
      - "分析用户在单一 App 内走完从内容到交易的连续路径时，体验上得到了什么、又失去了什么。"
    根因分析:
      - "给出多层归因（如用户时长天花板、商业化压力、分发能力外溢、竞争卡位），并区分主次，而非单一归因。"
      - "区分表层动因（对标小红书、进攻美团）与底层结构动因（内容、分发与交易之间的关系），并说明区分依据。"
      - "用案例中的事实证据（搜索月活、生活服务交易额增长等）支撑因果链，而非纯观点推演。"
      - "解释扩张为何集中发生在 2021~2022 年这一时间窗口（能力成熟度与外部环境），体现时序意识。"
    产品价值判断:
      - "对图文、搜索、电商、本地生活分别做出「必然／侥幸／有风险」的判断，且每个判断都有明确判据而非口号。"
      - "评估扩张对短视频基本盘的稀释风险，并给出边界条件（什么情况下扩张由增益转为伤害）。"
      - "同时从平台价值与用户价值两个立场评估，指出二者一致与冲突之处。"
      - "提出可操作的「该做／不该做」决策原则（如能否复用供给与分发能力、履约成本是否可控、是否形成交易闭环），并能将其应用到一个新业务假想上。"
  forbidden_leaks:
    - "「流量见顶／时长天花板」的动机结论"
    - "「推荐分发能力复用／外溢」的根因答案"
    - "「刷与搜」（消遣型与目的性需求）的区分框架"
    - "「发现—决策—交易闭环」的直接点破"
    - "逐业务「必然／侥幸」的现成结论清单"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求给出「统一的扩张逻辑」——你认为「逻辑」应该回答什么：动机、机制，还是边界？动笔之前，你会先立下哪几个必须回答的子问题，让答案不是图文、搜索、电商、本地生活四段流水账？"
  - level: 2
    stage: 视角补充
    question: "请分别代入三种人：晚饭后躺平刷视频的用户、在抖音上线团购套餐的餐饮店老板、靠探店视频赚钱的达人——同一个「抖音做本地生活」，在他们各自的世界里解决了什么，又制造了什么新问题？"
  - level: 3
    stage: 反例/风险
    question: "字节的扩张并非全胜：独立图文社区「新草」一年即停运，多款独立社交产品无疾而终，外卖也长期停留在试点。如果扩张逻辑真的成立，为什么有的成、有的败？你觉得成与败的分界线画在哪里？"
  - level: 4
    stage: 取舍权衡
    question: "假设你是负责人，新一年只能在「继续加深短视频内容生态」和「再启动一个需要自建履约体系的新业务」之间押注一个——你会看哪几个条件来做决定？什么信号出现时，你会承认某项扩张该收缩了？"
  - level: 5
    stage: 验证方式
    question: "两年后复盘这轮扩张：你会同时看哪几组数来判断它做对了还是做错了——这些数能否区分「用户多了一个留在抖音的理由」和「只是把存量时长从左口袋挪到右口袋」？"
