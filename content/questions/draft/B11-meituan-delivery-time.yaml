    title: "「逻辑错误」！上海消保委回应饿了么，美团刚刚也发声！究竟谁把外卖骑手困在系统里？"
    publisher: "新浪财经（转 21 世纪经济报道）"
    url: "https://finance.sina.com.cn/stock/hkstock/ggscyd/2020-09-10/doc-iivhuipp3441386.shtml"
main_question: "「加 8 分钟弹性时间」只是应急回应。假设你是美团外卖的产品负责人，先不追求全国铺开的大方案：请为「一个城市的午高峰」设计一个试点方案，既保住用户的点餐体验，又不再把路上的全部时间压力转嫁给骑手。试点有三条硬约束：一，运力不变——不新增骑手、不延长工时（2020 年上半年已有 20.8% 的骑手每天配送距离超过 50 公里）；二，体验底线——预估送达时间必须仍然可信，且不能依赖「让用户主动多等」（街采中多数用户不愿多等，该思路已被批「逻辑上有问题」）；三，预算有限——试点只做规则与系统改造及必要的运营配套，不靠大额补贴换时间。请回答：你会怎么定位问题、在约束内设计试点方案，并验证它真的有效？"
ability_tags:
  - 方案设计
  - 用户理解
  - 指标与验证
difficulty: 基础
kind: baseline
domain: 本地生活
rubric:
  dimensions:
    方案设计:
      - "方案落在机制上而非口号上：能拆开「配送时间如何生成、如何向用户展示、如何考核骑手」中的至少两个环节做设计，而非只说「放宽时间」或「优化算法」。"
      - "方案覆盖用户、骑手、商家三端，并说明时间压力在各方之间如何重新分配，而非只讨好其中一端。"
      - "有分场景/分层设计意识：能识别异常场景（恶劣天气、出餐慢、交付难小区等）需要从常态规则中拆出单独处理，而非一套时长打天下。"
      - "给出试点内可落地的节奏（先做什么、配套什么、什么信号下扩大或叫停），方案在三条硬约束（运力不变／体验底线／预算有限）内技术与成本基本可行，而非一步到位式的理想清单。"
      - "评分边界：「定位问题、设计方案、验证有效性」三部分可同时作答、不要求分段呈现；本维度只评问题定位与试点方案的机制设计质量，不因验证部分写得少而压低得分——验证深度属「指标与验证」维度的评分范围。"
    用户理解:
      - "指出用户的核心诉求是「确定可信的预期」而非极限的快，并能用案例证据（用户不愿主动多等、但反感被转嫁责任）支撑。"
      - "还原骑手的真实处境：收入与单量和时效强绑定，等餐、等电梯、进小区等系统变量都由骑手被动消化，而非简单归因「骑手自己想跑快」。"
      - "看到商家出餐速度差异是配送时间不确定的重要来源，方案或分析中给商家一侧留了位置。"
    指标与验证:
      - "给出多指标组合而非单一指标：用户侧（如超时差评率、预期满意度）、骑手侧（如超时率、申诉率、收入波动）至少各有一个可衡量的指标。"
      - "能指出「单纯放宽预估时间会让超时率变好但体验变差」这类数字游戏风险，说明所选指标如何区分「真改善」与「账面改善」。"
      - "提出具体的验证方式（如试点城市内分片区或分时段对照、试点前后对比、骑手与用户调研），体现小步验证意识。"
  forbidden_leaks:
    - "「预估送达时间由时间点改为时间段」的具体方案答案"
    - "「多个预估时间取最长值（三层保护时间）」的算法机制答案"
    - "「识别出餐慢商家、出餐后再调度」的具体机制答案"
    - "「用户要的是确定性而非单纯的快」的直接结论"
    - "「超时扣款改为扣分制/逐步取消超时扣款」的现成结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "先别急着给方案：在这座城市的午高峰试点里，要解决的「问题」到底是什么——是外卖送得不够快，还是别的什么？动笔之前，你会把它重写成哪几个可以分别回答的子问题？"
  - level: 2
    stage: 视角补充
    question: "代入三个时刻：饿着肚子盯着「预计 12:30 送达」的用户；在写字楼电梯里等了两分钟、眼看要超时的骑手；午高峰被催单的出餐口店员——同一个「配送时间」，在三个人的世界里分别意味着什么？"
  - level: 3
    stage: 反例/风险
    question: "饿了么「多等 5 分钟」按钮被批「逻辑错误」，受访用户也不愿主动多等——为什么「让用户出让时间」这条路走不通？这对你的试点方案划出了什么约束？"
  - level: 4
    stage: 取舍权衡
    question: "在试点城市的午高峰里，假设两个极端都摆上桌：预估时间整体放宽 10 分钟（用户抱怨变多、触碰体验底线），或维持现状（骑手继续承压）。如果你都不选，你会按什么原则在「用户的快」与「骑手的安全」之间切分？哪些场景里你愿意让哪一方让步？"
  - level: 5
    stage: 验证方式
    question: "试点运行三个月后，你会看哪几组数判断它成了还是败了——这些数能不能区分「问题真的缓解了」和「只是报表变好看了」（比如超时率下降，可能只是因为预估时间被放宽了）？什么结果会让你决定推广，什么结果会让你叫停？"
