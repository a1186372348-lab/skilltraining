# eval 高分样本改为受约束试点设计（见 content/eval/B11.yaml）。
id: B11
title: "外卖配送时间的三方困局：你是负责人怎么解"
case_title: "一篇刷屏报道之后，「加 8 分钟」只是应急"
case_background:
  product:
    text: "美团外卖——美团旗下餐饮外卖平台：用户在 App 下单后由平台调度骑手配送到家。2020 年全年，美团餐饮外卖交易笔数 101 亿笔、日均交易笔数 2770 万笔；截至 2020 年底，平台活跃商家数 680 万、年度交易用户数 5.1 亿。"
    citations: [3]
  audience:
    text: "三类关键角色：想准时吃上饭的用户、高峰期集中出餐的商家、负责配送的骑手。订单系统设置的配送时间是直接关系到骑手收入的最重要指标：一旦超时，便意味着差评、收入降低、拖团队后腿甚至被淘汰。美团研究院《2020 年上半年骑手就业报告》显示，2020 年上半年有 20.8% 的美团外卖骑手每天配送距离超过 50 公里。"
    citations: [4, 5]
  scenario:
    text: "用户下单后看到一个预估送达时间，骑手则按系统给出的配送时间被考核。为了在系统时间内送达，部分骑手疲于奔命，以闯红灯、逆行、超速行驶为代价「与时间赛跑」——2020 年 9 月 8 日，《人物》杂志报道《外卖骑手，困在系统里》刷屏，把这一矛盾推上舆论风口。"
    citations: [1, 4]
  features:
    text: "与矛盾相关的现有机制：预估送达时间展示、系统派单调度、超时考核与骑手申诉。舆论爆发后，美团于 2020 年 9 月 9 日宣布应急改进：每一单给骑手留出 8 分钟弹性时间；恶劣天气下延长配送时间甚至停止接单；升级骑手申诉功能，特殊情况核实后超时、投诉不影响考核及收入；骑手奖励从送单奖励转向综合考虑合理单量区间及安全指标。"
    citations: [2, 5]
  status:
    text: "第一轮回应并未平息争议：饿了么抢先推出的「我愿意多等 5 分钟/10 分钟」按钮被上海市消保委副秘书长公开批评「逻辑上有问题」，多数受访用户表示不愿主动选择多等，认为这是平台把责任转嫁给消费者；央视评论称「能帮外卖骑手脱困的关键不在系统而在人」——配送时间怎么定、怎么考核，成为平台必须系统回答的问题。"
    citations: [1, 5, 4]
