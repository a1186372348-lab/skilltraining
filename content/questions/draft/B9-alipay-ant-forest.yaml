# B9 ｜ 支付宝为什么要做蚂蚁森林
# 批次：T33 基线测评题（B9）｜ 主测维度：产品价值判断 ｜ 状态：草案，待产品负责人评审后上架
id: B9
title: "支付宝为什么要做蚂蚁森林"
case_title: "支付工具里的「不务正业」"
domain: 金融
case_background:
  product:
    text: "支付宝——蚂蚁集团旗下移动支付与数字生活平台，联合国环境规划署称其为「全球领先的支付和生活方式平台」。2016 年 8 月，蚂蚁金服（现蚂蚁集团）在支付宝 App 内上线生态公益项目「蚂蚁森林」。"
    citations: [1, 2]
  audience:
    text: "一侧是数亿支付宝普通用户——不需要捐钱，凭日常低碳行为即可参与；另一侧是项目落地端的公益机构合作伙伴与荒漠化地区种植养护者：蚂蚁集团 8 年为项目累计协议捐资 41.8 亿元，其中 6.3 亿元成为各地种植养护者的劳动收入，累计创造 420 多万人次种植、养护、巡护等劳动增收机会。"
    citations: [1, 3]
  scenario:
    text: "用户在蚂蚁森林里记录步行、公交出行、在线缴纳水电费等日常低碳行为，平台将其折算为「绿色能量」；能量积累到一定数值可以养成一棵虚拟树，蚂蚁森林与公益伙伴随即在荒漠化地区种下一棵真树，用户还能通过卫星实时查看自己的树。"
    citations: [1, 2]
  features:
    text: "核心玩法是「低碳行为—绿色能量—虚拟树—真树」的兑换链路；叠加好友间收取能量、互相浇水等轻互动，以及明星、企业与机构发起、用户浇水参与的「公益林」；除种树外，用户还可认领相应面积的保护地。"
    citations: [1, 5]
  status:
    text: "2019 年 9 月，蚂蚁森林获联合国最高环保荣誉「地球卫士奖」：当时 5 亿用户累计碳减排 792 万吨，在荒漠化地区种树 1.22 亿棵。到 2024 年 8 月，项目 8 年累计捐资种下超 5.48 亿棵树。2026 年项目满十年：累计用户超 7 亿，种树超 6.19 亿棵，成为「全球参与人数最多的公益项目」之一。"
    citations: [2, 3, 4]
