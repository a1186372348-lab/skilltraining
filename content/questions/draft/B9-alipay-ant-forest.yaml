uncertainty:
  - "「协议捐资 41.8 亿元」为承诺口径，截至 2024 年 8 月已实际支出 27 亿元（随各地项目实施进度拨付）；案例背景采用「协议捐资」表述并保留出处，评审时请勿混用两个口径。"
  - "「累计用户超 7 亿、种树超 6.19 亿棵」为蚂蚁集团 2026 年 4 月春种活动经媒体发布的口径；2024 年 8 月官方口径为 5.48 亿棵，两组数据时间点不同，案例已分别标注年份。"
  - "支付宝官方从未公布蚂蚁森林对其日活、留存的直接贡献数据；对话地球报道中「2017 年一季度末日活上涨 40%」为媒体转述口径，未写入案例背景，仅在扩展资料中供参考。"
