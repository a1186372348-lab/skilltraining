main_question: "支付宝的主业是支付与金融，蚂蚁森林却不收费、不带货，还要持续捐资种树，一做就是十年。请你回答：这个看似「不务正业」的功能到底值不值得做——它为谁、创造了什么价值？如果换成你，会用哪几条标准来判断一个产品该不该做这类「与主业无关」的功能？"
ability_tags:
  - 产品价值判断
  - 用户理解
  - 产品取舍
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品价值判断:
      - "明确给出「值得做／不值得做／有条件成立」的立场，判据具体可检验（如用户规模、反哺路径、成本与信任风险），而非「既做了公益又赚了名声」的两头好话。"
      - "能区分用户价值（低碳行为的可见化反馈、成就感、轻社交话题）与平台价值（打开理由、使用频次、品牌信任），并指出二者如何互相成全或在何处冲突。"
      - "能识别该功能「不直接变现」的特性，用间接价值／战略价值的框架论证其成立条件，而非只用收入与利润衡量值不值得。"
      - "能给出可迁移的判断标准（如是否服务同一批用户、是否反哺核心场景形成闭环、成本是否长期可控、价值是否可衡量），并能将其应用到一个新功能假想上。"
      - "能指出结论成立的前提与风险（公益真实性的信任生命线、游戏机制异化为无效打卡、长期投入产出的不对称），并说明什么情况下判断会反转。"
    用户理解:
      - "能解释用户为什么愿意每天参与：把抽象、无反馈的低碳行为变成可见、可积累、可被朋友看见的即时反馈，而非笼统归因于「用户有公益心」。"
      - "能区分不同用户的参与动机（公益认同、收集与养成、好友互动、仪式感习惯），并指出哪类动机更持久、哪类更容易疲劳。"
      - "能注意到落地端的另一类「用户」——公益机构与荒漠化地区种植养护者，说明他们从捐资与劳动收入中获得了什么。"
      - "能从用户视角指出潜在反感点（被收能量闹钟绑架、打卡形式化、社交比较压力），而非只看到正面价值。"
    产品取舍:
      - "能正视投入账：累计协议捐资 41.8 亿元换来的不只是树，讨论其机会成本（同等资源投在主业的其他方向）而非把公益当成「无需算账」的政治正确。"
      - "能讨论「不直接商业化」的取舍：为什么克制变现反而是该产品成立的条件，什么情况下应该／不应该为它加上商业目标。"
      - "能指出激励设计的边界：若能量规则开始诱导无效行为或形式主义打卡，公益价值会被稀释，说明激励与真实减排之间需要取舍。"
      - "能给出「该收缩或转型」的信号（用户疲劳、种树与维护成本上升、信任事件、政策与舆论环境变化），而非默认项目永远该做下去。"
  forbidden_leaks:
    - "「支付是用完即走的场景，蚂蚁森林提供了每天主动打开 App 的理由」这一平台侧核心动机"
    - "「支付与生活缴费行为产生能量、能量再把用户拉回 App」的互相喂养闭环"
    - "「把抽象低碳行为变成可见、可积累的即时反馈」的用户价值答案"
    - "「克制变现反而是该产品成立条件」的现成结论"
    - "「公益真实性是信任生命线」的风险结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「值不值得做」——你打算用什么标准来回答？动笔之前，先列出你认为必须回答的两三个子问题（比如：对谁的价值？用什么衡量？不做的代价是什么？），让答案不是「既做了公益又赚了名声」的一句话结论。"
  - level: 2
    stage: 视角补充
    question: "请分别代入三类人：每天定闹钟收能量的上班族、阿拉善靠种树养护增收的当地人、支付宝内部主张继续做这个项目的产品经理——同一个蚂蚁森林，在他们各自的世界里意味着什么？哪一方的获得感最脆弱、最容易先消失？"
  - level: 3
    stage: 反例/风险
    question: "如果这套机制真的成立，为什么市面上大量「种树、养鸡、步数兑换」的模仿者没有复制出第二个蚂蚁森林？反过来问：有没有可能用户只是在打卡薅情绪，低碳行为本身并没有真实改变？你会怎么分辨这两种情况？"
  - level: 4
    stage: 取舍权衡
    question: "假设你是支付宝负责人，有声音提议给蚂蚁森林接入电商广告位「顺便变现」，也有人主张继续加大捐资规模——你会支持哪一个、反对哪一个，还是给出条件？你的判断取决于哪几个前提？"
  - level: 5
    stage: 验证方式
    question: "如果一年后要你向管理层汇报「蚂蚁森林还值不值得继续做」，你会看哪几组数？这些数能不能区分「用户因为信任与喜爱而留下」和「用户只是被游戏机制拴住」？"
