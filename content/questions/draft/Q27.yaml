main_question: 假设你接手 2015 年少数课程的助学金入口改进。如何判断更醒目的入口是否真正帮助需要资助的学习者，而不仅仅增加了人数？请分别提出主要指标、漏斗诊断和比较方案，说明如何理解不同学习者的障碍、保护隐私，以及什么证据会改变你的判断。
ability_tags:
  - 指标与验证
  - 根因分析
  - 用户理解
difficulty: 挑战
domain: 教育
kind: daily
rubric:
  dimensions:
    指标与验证:
      - 给出以学习者为单位的可计算指标，包含分子、分母、观察窗口，并区分申请、批准和实际开始学习。
      - 提出可执行的对照和分配单位，说明课程、时间与样本组成如何影响解释。
      - 为学习参与、误导或公平性设置可观测护栏；事先未给出的阈值不冒充已知标准。
      - 所选指标应与具体机会主张对应；允许只验证近期参与，但须说明尚未验证什么，不能由申请或批准直接推出需求满足和长期结果。
    根因分析:
      - 按看到入口、理解条件、提交、审核和开始学习拆解流失，并提出可区分的原因假设。
      - 列出支持或推翻至少两种原因的证据，例如入口可见性、申请成本和审核时长。
      - 明确公司回顾缺少基线分母和可比对照，不能排除其他变化。
    用户理解:
      - 识别经济压力、语言或时间限制不同的学习者，并承认需求与实际资格不能仅凭外观判断。
      - 提出低侵扰的研究或分层办法，保护财务信息，避免让弱势群体承担额外风险。
      - 区分个体体验与群体比例，不用个例代表所有学习者。
  forbidden_leaks:
    - 申请、批准、实际学习与隐私护栏组成的完整评估设计。
    - 人数翻倍自动证明入口改动带来真实机会或因果改善。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 先画出从看到选项到实际开始课程的步骤，每一步观察对象是否相同？
  - level: 2
    stage: 视角补充
    question: 获得资助、开始学习，以及真正需要帮助的人能否获得原本负担不起的机会，有什么不同？
  - level: 3
    stage: 反例与风险
    question: 语言、申请成本和经济处境可能如何影响不同学习者？
  - level: 4
    stage: 取舍权衡
    question: 人数翻倍没有给出哪些分母或比较信息，如何构造更公平的比较？
  - level: 5
    stage: 验证方式
    question: 写出一种明确分子、分母、时间窗口及隐私保护的方案。
