id: Q27
title: Coursera 助学金：曝光改动后如何验证机会是否真正改善
case_title: 申请入口更显眼，是否让需要帮助的人真的获得机会
case_background:
  product:
    text: Coursera 提供在线课程；其助学金计划为无法负担相关费用的申请者提供财务支持。
    citations:
      - 1
      - 2
  audience:
    text: 2015 年 Coursera 调查发现，不到一半受访学习者知道其助学金计划；该调查范围不能直接代表所有潜在学习者。
    citations:
      - 1
  scenario:
    text: 2015 年的官方复盘称，团队让少数课程的付款页面更明显地展示助学金选项，并观察获得助学金的人数变化。
    citations:
      - 1
  features:
    text: 2015 年助学金申请需要学习者说明经济情况和学习动机；获批后可获得相关课程证书费用豁免。
    citations:
      - 1
  status:
    text: 公司称在少数课程修改付款页面后，获得助学金的人数翻倍；材料未给出完整对照组、分母或长期学习结果。
    citations:
      - 1
