uncertainty:
  - 人数翻倍和知晓度来自公司 2015 年 10 月 23 日复盘；缺少完整可比对照、分母及长期学习数据。
  - 较早认证产品和个人故事提供背景，但不能直接代表 2015 年所有课程或全体有需求的学习者。
  - 禁止泄露点的编辑口径：限制导师在用户完成判断前代写整套答案，不限制题面提供必要机制事实和正常资料，也不要求用户采用参考答案的具体词语、排序或方案。
