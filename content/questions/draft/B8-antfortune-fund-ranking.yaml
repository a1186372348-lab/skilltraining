uncertainty:
  - "「蚂蚁财富为首家淡化销量榜单的机构」为每日经济新闻对蚂蚁财富的采访口径。"
  - "「葛兰千亿级体量」为财联社报道引用的市场公认口径（基金经理管理规模）。"
  - "盈利洞察报告数据口径为景顺长城、富国、交银施罗德三家公司的主动权益类基金客户，不代表全行业基民；公开报道未提供按销售渠道分组的数据，无法从该报告直接区分蚂蚁渠道用户与其他渠道用户的行为差异。"
  - "「行为损耗率接近 -60%」的准确口径（富国基金官网报告解读）：仅统计景顺长城旗下成立满 5 年的主动权益类非封闭、非定期开放基金，比较过去五年客户年度平均收益率与基金净值增长率（11.62% vs 19.57%）；它不是三家公司 4682 万客户全样本的共同结论，也不是「本金亏损 60%」，且不含渠道归因信息，不能据此直接归因于蚂蚁销量榜。"
