# B8 ｜ 基民想要「更赚钱的推荐」，蚂蚁财富却拆掉了销量榜
# 批次：T33 基线测评题（B8）｜ 状态：草案，待产品负责人评审后上架
id: B8
title: "基民想要「更赚钱的推荐」，蚂蚁财富为什么拆掉销量榜"
case_title: "一个被骂「操纵」的榜单，和它的反常结局"
case_background:
  product:
    text: "蚂蚁财富——蚂蚁集团旗下理财平台（支付宝 App 内），向个人投资者代销公募基金等产品。中国证券投资基金业协会数据显示，2021 年四季度蚂蚁基金非货币市场公募基金保有规模近 1.3 万亿元，与其他代销机构拉开较大差距。"
    citations: [2]
  audience:
    text: "平台用户为海量个人投资者，其中大量是 2020~2021 年「基金出圈」中入场的新基民。行业报告覆盖了景顺长城、富国、交银施罗德三家基金公司 4682 万主动权益类基金客户账户；报告指出，行业对新基民的普遍画像是「容易追高、持有时间偏短」。"
    citations: [1, 4]
  scenario:
    text: "用户典型的选基路径是看榜单：蚂蚁财富「金选」提供「周销量 TOP」「周定投 TOP」等榜单，上榜基金单周可有超过 9 万人购买。2020~2021 年明星基金经理出圈，葛兰管理的千亿级中欧医疗健康基金长期位居销量榜前列；2021 年起市场回撤，跟风买入者被套。2022 年 2 月，中欧医疗健康从周销量榜上消失，大量用户质疑平台「操纵榜单」。"
    citations: [3, 2]
  features:
    text: "金选榜单体系（周销量 TOP、周定投 TOP、定投绩优基等）与基金详情页、购买页。2022 年 3 月，蚂蚁财富主动取消全部销量维度榜单，成为首家淡化销量榜的代销机构；「定投绩优基」的收益率指标从近 1 年拉长至近 3 年并显示定投平均期数，榜单新增夏普比率等风险指标，购买页提示 A/C 类份额在不同持有时长下的费用差异。"
    citations: [2]
  status:
    text: "行业长期痛点是「基金赚钱、基民不赚钱」：三家公司 4682 万客户、5.65 亿笔真实交易数据显示，基民的投资行为给收益带来的损耗率接近 -60%；持仓小于 3 个月的基民盈利占比仅 39.10%、平均收益率 -1.47%，而持仓 120 个月以上的盈利占比达 98.41%。仅 2021 年一季度的市场波动，就让历史全部基民的盈利人数占比从 70.42%（截至 2020 年末）降至 53.28%（截至 2021 年 3 月末）。"
    citations: [1, 5]
