main_question: "用户想要的是「更准的榜单、更赚钱的推荐」，蚂蚁财富却把销量榜整个拆掉。请你分析：用户这个诉求背后真正要解决的问题是什么，为什么直接满足它可能适得其反？"
ability_tags:
  - 根因分析
  - 用户理解
  - 问题定义
difficulty: 基础
kind: baseline
domain: "金融"
rubric:
  dimensions:
    根因分析:
      - "把「基民不赚钱」拆分为「基金损益」与「基民行为损益」两层，并用案例数据指出行为（持有期短、追涨杀跌、频繁交易）是更可控的主要损耗来源。"
      - "建立完整因果链：榜单按短期销量排序 → 强化追涨行为 → 高点买入、回撤割肉 → 亏损归罪榜单 → 要求「更准的榜单」，指出根源在行为与机制的互相强化，而非榜单准不准。"
      - "论证「直接满足表面诉求」为何适得其反：更精准的短期推荐会进一步缩短持有期、放大行为损耗。"
      - "区分问题中可归因于平台的部分（榜单设计、流量机制、销售导向）与可归因于用户的部分（投资行为），不把责任简单推给任何一方。"
    用户理解:
      - "区分用户的「表达诉求」（更赚钱的推荐）与「真实利益」（长期赚到钱），指出二者在本案例中的背离。"
      - "还原新基民的真实处境与心态：缺乏经验、把短期排名当作质量信号、依赖榜单做决策、亏损后需要归因对象。"
      - "识别销量榜对用户的功能性价值：它同时提供「从众的安全感」，是决策捷径，而不只是收益工具。"
    问题定义:
      - "把问题从「如何把榜单做准」重新定义为「如何设计机制，减少用户行为对自身收益的伤害」，并说明重定义的依据。"
      - "划清问题的可解边界：信息呈现、决策引导、默认选项属于产品设计可解；市场波动与基金经理水平不属于。"
      - "给出检验问题定义是否正确的标准：按新定义行动后，持有期、盈利人数占比等行为指标应能改善。"
  forbidden_leaks:
    - "「基民行为损益接近 -60%、行为比选基更关键」的现成结论"
    - "「持有期与盈利正相关（持仓小于 3 个月盈利占比仅 39%）」的数据答案"
    - "「销量榜把追涨行为制度化、拆榜是行为引导」的机制点破"
    - "「表达诉求与真实利益背离」的直接表述"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "「用户说要更准的榜单」和「用户真正需要的是什么」可能是两回事。动笔前，你会先立下哪几个问题来区分这两回事——比如：用户照着榜单买基金之后，实际发生了什么？"
  - level: 2
    stage: 视角补充
    question: "代入一个 2021 年初入场的新基民：他照着销量榜买入中欧医疗健康，随后一年持续下跌。他此刻想要什么、害怕什么？再代入一个持有同一只基金三年的老用户，这两个人要的真是同一样东西吗？"
  - level: 3
    stage: 反例/风险
    question: "假设平台真把榜单做到「更准」——比如改成按近三年收益排名、推荐命中率大幅提升。基民们的实际收益就会变好吗？有没有可能榜单越准，大家越敢重仓追涨，反而放大亏损？"
  - level: 4
    stage: 取舍权衡
    question: "销量榜是平台转化效率最高的入口之一，拆掉它短期必然损失销量。如果你是产品经理，你需要拿出什么样的证据链，才能说服团队「拆掉它比优化它更对用户负责」？"
  - level: 5
    stage: 验证方式
    question: "改版半年后，你会看哪几组数据判断「拆榜单」做对了——用户持有期、盈利人数占比、定投渗透率，还是销量？如果销量回升了但用户持有期没有变长，你会怎么解读？"
