main_question: "蚂蚁财富拆掉销量榜后，一种流行的解读是：销量榜诱导用户追涨杀跌，是「基金赚钱、基民不赚钱」的主要原因。请你分析：报告中投资者实际收益与对应基金收益表现之间的差距，可能由哪些机制造成——至少考虑榜单引导、用户自身投资习惯、市场行情、基金选择四个方向。依据现有材料，能否把主要原因归于销量榜？如果证据不足以支持或排除某个解释，请说明卡在哪些证据上、还需要什么证据。"
ability_tags:
  - 根因分析
  - 用户理解
  - 问题定义
difficulty: 基础
kind: baseline
domain: "金融"
rubric:
  dimensions:
    根因分析:
      - "形成并比较多个候选解释：至少覆盖榜单引导、用户自身投资习惯（持有期短、追涨杀跌、频繁交易）、市场行情波动、基金选择四个方向，而非只展开其中一个；每个方向的事实要求依据完整资料决定——资料中有对应事实就要求使用（说明它对应案例中的哪些事实），缺乏证据的方向允许指出缺口，而非强行使用。"
      - "区分相关与因果：指出「跟榜买入后亏损」的时序相关不等于「销量榜导致亏损」，识别销量榜既可能是亏损的原因之一、也可能是用户既有偏好与行为的结果（自选择/逆向因果），并说明两种方向各需要什么证据区分。"
      - "准确核对关键数据的口径：「行为损耗接近 -60%」仅是景顺长城旗下成立满 5 年的符合条件基金过去五年的测算，不能当作三家公司全样本结论，更不能理解为「本金亏损 60%」或当作「榜单导致亏损」的直接证据；持有期与盈利占比的关系是横截面统计，同样不能单独确立因果。"
      - "明示证据边界：指出现有材料缺少区分各解释所需的关键证据（如按销售渠道分组的对照数据、拆榜前后同批用户的行为变化、买入时点分布等），并说明每类证据能区分哪两个解释。"
      - "结论强度与证据匹配：明确区分「现有证据支持的判断」与「尚无法排除的可能」，结论可以是有限归因，也可以是「证据不足、需某类数据验证」；把单一解释当作已证实结论、或强行收敛到唯一根因而无证据支撑，为低分表现。"
    用户理解:
      - "区分用户的「表达诉求」（更准的榜单、更赚钱的推荐）与实际利益之间可能的错位，并用案例事实支撑这一区分，而非直接断言。"
      - "还原新基民的决策处境：缺乏经验、把短期排名与销量当作质量信号、依赖榜单降低决策成本、亏损后需要归因对象——说明这些行为特征如何参与「收益差距」的形成。"
      - "识别销量榜对用户的功能性价值（决策捷径、从众安全感）及其代价，把它作为解释用户行为的一环，而非把用户简单归为「非理性」。"
    问题定义:
      - "把「基民不赚钱」界定为可分析的差距：明确比较基准（报告中投资者实际收益与对应基金收益表现之间的差距），而非笼统的「亏钱」。"
      - "明确本题的分析对象是「差距由哪些机制造成、证据支持到哪一步」，而非替蚂蚁论证拆榜动机，也不是评判「榜单该不该存在」的价值题。"
      - "指出不同归因对应不同的可行动主体与处理方向（平台机制调整、用户行为引导、不可控的市场环境），说明归因结论将决定后续动作选择。"
  forbidden_leaks:
    - "「行为损耗接近 -60%」的准确测算口径，以及「行为因素比榜单更关键」的现成结论"
    - "「持有期与盈利正相关」（持仓小于 3 个月盈利占比 39.10% vs 120 个月以上 98.41%）的数据答案"
    - "「相关不等于因果、销量榜可能是用户偏好的结果而非原因」的直接点破"
    - "「现有材料不足以把主因归于销量榜」的总结论及所需证据清单"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "动笔前先把「差距」说清楚：报告中投资者实际收益与对应基金收益表现之间的差距，具体是哪个口径、大到什么程度？你会先立下哪几个子问题，让「哪些机制造成差距」可以逐个核对，而不是一上来就归因？"
  - level: 2
    stage: 视角补充
    question: "代入两个 2021 年初买入同一只中欧医疗健康的用户：一个看销量榜跟风买入、三个月后割肉离场；一个按定投计划持有、回撤中没有卖出。两人的「收益差距」分别由什么造成？榜单在这两个人身上扮演的角色一样吗？"
  - level: 3
    stage: 反例检验
    question: "假设「销量榜是主因」成立——那么在银行、券商等没有销量榜的渠道，基民的行为损耗应该明显更小。你手里有这个对照数据吗？如果没有，案例中哪些事实还能加强或削弱这个假设？"
  - level: 4
    stage: 证据核对
    question: "案例里的两组关键数据——「行为损耗接近 -60%」和「持仓小于 3 个月盈利占比 39.10%」——各自的统计口径是什么？它们能说明「用户行为影响收益」，但能直接说明「销量榜导致了这些行为」吗？中间还缺哪一环？"
  - level: 5
    stage: 结论边界
    question: "现在收敛你的结论：「销量榜是不是主因」，你准备写到什么强度——确认、倾向、还是无法判定？无论选哪一档，请写出一个能让你改变结论的证据：什么样的数据出现时，你会加强或放弃当前判断？"
reveal_after_first_answer:
  text: "2022 年 3 月蚂蚁财富取消销量类榜单后，董事长王珺的官方回应口径是「帮助用户更全面了解基金基本面及风险，关注长期业绩与合理配置」，蚂蚁基金由此成为首家淡化销量榜的代销机构（每日经济新闻采访口径）。2022 年第二期盈利洞察报告在市场下跌后再次验证「持有期越长成效越好、定投优于非定投、频繁交易收益更差」，中基协销售业务委员会将「研究投资者行为、有的放矢引导基金投资行为」写入工作要求。追问时应引导用户注意：官方口径与行业后续行动说明的是「平台如何解释自己的决策、行业如何响应」，并不构成对「销量榜是基民亏损主因」的因果证明——用户此前的归因结论仍需回到证据边界检验。"
  citations: [2, 4]
