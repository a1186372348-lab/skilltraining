main_question: 站在 2021 年规则即将实施时，假设你负责一个依赖广告的应用：你会怎样调整用户告知、授权请求时机和未授权后的体验？请比较至少两种符合规则的请求时机或告知安排，选定一种，说明它相对另一种保护了什么、可能损失什么，并结合假定的数据用途写出一段拟议用途说明。请比较用户、开发者及广告相关方可能得到的价值与承担的代价，并说明哪些结论还需要证据。不要设计绕过用户选择的方案。
ability_tags:
  - 产品取舍
  - 产品价值判断
  - 产品表达
difficulty: 挑战
domain: 工具/效率
kind: daily
rubric:
  dimensions:
    产品取舍:
      - 比较至少两种符合规则的告知或请求时机方案，选择一种并解释相对收益与代价。
      - 遵守用户拒绝追踪的选择，不提出通过指纹或其他方式规避规则。
      - 讨论不同授权结果下的可用体验及至少一种潜在商业代价，不将拒绝率或损失视为已知。
      - 给出可接受边界和必要的审查或复核条件。
    产品价值判断:
      - 分别分析用户控制、开发者运营和广告触达的潜在价值，说明成立前提。
      - 区分规则本身、用户是否理解以及实际广告效果，不把公司立场当作独立效果证明。
      - 允许不同合理方案，但需明确证据不足与可能改变判断的条件。
    产品表达:
      - 提供简洁、真实的权限说明，能让用户理解用途、选择及拒绝后的基本体验。
      - 引用材料时准确交代规则适用时点，不把其他时间或地区的规定自动当作 2021 年事实。
      - 以面向相关方的结构说明决定和代价，不使用恐吓或误导性按钮文案。
  forbidden_leaks:
    - 完整授权说明、请求时机和未授权分支组成的方案。
    - 隐私保护必然导致或不会导致商业损失的定性结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 先界定规则涉及什么追踪，哪些数据使用并不能直接从公告推断？
  - level: 2
    stage: 视角补充
    question: 用户、应用开发者和广告相关方分别希望得到什么？
  - level: 3
    stage: 反例与风险
    question: 拒绝追踪后，如果应用通过其他手段继续追踪，会发生什么规则问题？
  - level: 4
    stage: 取舍权衡
    question: 更早提示和在用途明确时提示，各可能付出什么代价？
  - level: 5
    stage: 验证方式
    question: 用用户能理解的文字解释用途和选择，并指出哪些商业效果尚需测量。
