id: Q18
title: iOS 追踪授权：用户隐私与应用生态之间怎样取舍
case_title: 让用户选择追踪权限，会改变哪些关系
case_background:
  product:
    text: App Tracking Transparency 是 Apple 为应用请求跨其他公司应用或网站追踪许可提供的框架。
    citations:
      - 1
      - 4
  audience:
    text: 涉及使用应用的个人、需要请求许可的开发者，以及依赖广告触达的相关参与方。Apple 将这项设计描述为给予用户选择。
    citations:
      - 1
      - 4
  scenario:
    text: 2021 年 4 月，Apple 在 iOS 14.5 等系统即将发布时向开发者重申追踪许可要求。
    citations:
      - 1
  features:
    text: Apple 说明应用需请求用户许可才能追踪或访问设备广告标识符；未获许可时不得追踪，广告标识符值为零。
    citations:
      - 1
  status:
    text: Apple 称相关要求从 2021 年 4 月 26 日适用；此前曾推迟该要求以给予开发者准备时间。
    citations:
      - 1
      - 2
