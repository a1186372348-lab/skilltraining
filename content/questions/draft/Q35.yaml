id: Q35
title: "Amazon Go 无人收银：如何判断减少结账步骤的价值"
case_title: "少一次排队，是否值得重做门店流程？"
case_background:
  product:
    text: Amazon Go 是 Amazon 的实体便利店，首家门店于 2018 年 1 月在西雅图向公众开放。
    citations:
      - 1
      - 2
  audience:
    text: 同期报道介绍，顾客使用 Amazon 账户、Amazon Go 应用和兼容手机进入门店购物。
    citations:
      - 1
  scenario:
    text: 顾客在店内选择商品后可离店，不必经过传统收银结账环节。
    citations:
      - 1
      - 2
  features:
    text: Amazon 说明该体验依靠计算机视觉、机器学习与传感器融合等技术。
    citations:
      - 2
      - 3
  status:
    text: 本题以 2018 年首店已向公众开放后的推广评估为背景。材料说明入店与离店机制，但未提供本题目标门店的排队、误扣、服务成本或经营回报数据。
    citations:
      - 1
      - 2
