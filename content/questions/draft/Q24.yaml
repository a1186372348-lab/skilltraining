main_question: 假设一个团队想知道是否值得把看板维护自动化。请以材料中的卡片完成流程为例，拆解重复劳动可能来自哪些不同环节，以及如何判断真正的主要问题。再选一处提出最小改进，并说明出现错误时如何发现。不要假设该团队已经发生延误。
ability_tags:
  - 根因分析
  - 问题定义
  - 方案设计
difficulty: 基础
domain: 办公协同
kind: daily
rubric:
  dimensions:
    根因分析:
      - 将卡片移动、状态更新和通知等动作分开，提出可区分的负担来源。
      - 说明重复动作与任务延误不必然相同，不编造现有故障或时间损失。
      - 提出能区分规则不清、操作繁琐或协作交接问题的证据。
    问题定义:
      - 界定具体团队、触发情境与需要改善的结果，而非笼统自动化一切。
      - 指出哪些步骤可能有意保留人工判断和为什么。
      - 给出优先验证一个问题的理由与边界。
    方案设计:
      - 设计与所选问题对应的最小规则及人工确认或例外处理。
      - 说明触发、动作和错误提示或日志，避免自动化失败被忽视。
      - 提出验证节省时间与错误率的方法，不把配额视为 2018 年既定规则。
  forbidden_leaks:
    - 完整的根因拆解、自动规则与异常验证方案。
    - 重复动作必然导致项目延误或自动化一定更省时的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 一次卡片完成后，团队成员分别需要做哪些动作？
  - level: 2
    stage: 视角补充
    question: 哪些动作是重复录入，哪些动作可能需要人为判断？
  - level: 3
    stage: 反例与风险
    question: 如果规则触发时状态并不适合自动完成，会发生什么？
  - level: 4
    stage: 取舍权衡
    question: 你会先自动化一个步骤还是整个流程，为什么？
  - level: 5
    stage: 验证方式
    question: 怎样知道规则没有触发或执行了错误动作？
