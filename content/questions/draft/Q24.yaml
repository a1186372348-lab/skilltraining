id: Q24
title: Trello 自动化：重复操作为什么会成为团队工作负担
case_title: 看板上的重复动作从哪里来
case_background:
  product:
    text: Trello 是团队使用看板和卡片组织工作的工具；Butler 为看板提供按规则执行动作的自动化能力。
    citations:
      - 1
  audience:
    text: 官方示例面向使用卡片跟踪工作、需要维护状态和到期信息的团队。
    citations:
      - 1
  scenario:
    text: 文章示例设想卡片被移动到完成列表后，还需要更新到期状态、加标签并发送评论。
    citations:
      - 1
  features:
    text: Butler 可以根据看板动作触发用户设定的规则，无须用户编写程序来表达该示例。
    citations:
      - 1
  status:
    text: 后续帮助文档说明自动化可查看执行日志并受使用配额约束；这些是当前资料，不能默认属于 2018 年全部规则。
    citations:
      - 3
      - 4
      - 5
