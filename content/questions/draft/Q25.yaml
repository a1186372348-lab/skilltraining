uncertainty:
  - 题目仅设想需要调查的处理链路，没有给出任何团队的真实未修复比例。
  - 2020 年发布文章与当前文档和后续变更应按各自时间理解。
  - 禁止泄露点的编辑口径：限制导师在用户完成判断前代写整套答案，不限制题面提供必要机制事实和正常资料，也不要求用户采用参考答案的具体词语、排序或方案。
