id: Q25
title: GitHub 依赖提醒：收到漏洞提示后为什么仍可能无法完成修复
case_title: 有提醒与真正完成安全更新之间的距离
case_background:
  product:
    text: GitHub 提供 Dependabot 依赖漏洞提醒，以及在适用时生成修复拉取请求的自动安全更新。
    citations:
      - 1
      - 2
  audience:
    text: 相关对象包括维护仓库依赖、接收提醒并决定是否合并更新的开发者或项目团队。
    citations:
      - 1
      - 3
  scenario:
    text: 当仓库中依赖存在已知漏洞时，团队可能先收到提醒，再评估是否及如何应用修复。
    citations:
      - 1
      - 3
  features:
    text: GitHub 2020 年介绍可在能够建议修复时生成更新依赖的拉取请求；后续文档列出自动更新可能遇到的错误。
    citations:
      - 1
      - 4
  status:
    text: 自动化安全更新曾于 2019 年向公开仓库正式提供；当前文档的具体能力和权限应按其所述版本理解。
    citations:
      - 2
      - 3
      - 4
