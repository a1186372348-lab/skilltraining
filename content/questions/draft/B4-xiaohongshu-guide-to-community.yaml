main_question: "小红书的第一代产品是下载量 50 万次的出境购物攻略：需求已被验证，团队却在几个月内放弃攻略形态、推倒重做社区。请你回答：用户真正要解决的问题到底是什么——为什么「攻略」这个看似对症的形态解不了它，而「社区」可以？"
ability_tags:
  - 问题定义
  - 用户理解
  - 产品价值判断
rubric:
  dimensions:
    问题定义:
      - "能区分「需求被验证」（50 万次下载证明用户要购物信息）与「问题被解决」（信息形态能否在真实决策链路上持续起作用），指出二者不是一回事。"
      - "能把「真正的问题」表述为决策信息问题：出境购物决策需要真实、最新、可追问、个性化的经验信息，而非一次性静态文档；表述落到具体场景，不停留在「信息不对称」的空泛概念上。"
      - "能解释形态与问题定义的对应关系：把问题定义为「缺一份攻略」，导出编辑生产的静态文档；把问题定义为「决策需要持续更新、可互动的经验」，才导出 UGC 社区。"
      - "能识别攻略形态背后的隐性假设（信息变化慢、少数专家足以覆盖所有问题、用户没有追问需求），并逐条检验其不成立。"
    用户理解:
      - "能还原用户从「出发前做功课」到「现场掏钱决策」的完整链路，指出攻略失效的具体时点（价格变动、断货、个性化问题无人可问）。"
      - "能区分两种形态提供的不同用户价值：攻略给「出发前」的确定感，社区给「随时逛、随时问、看别人真实经验」的持续陪伴，并指出后者更贴合购物决策的实际发生方式。"
      - "能解读种子用户行为（自发上传韩日购物经验、互相讨论、向创作者追问）暴露出的表达与互动需求——用户不只是信息消费者，也是生产者。"
    产品价值判断:
      - "能对「攻略 vs 社区」做价值与代价的双边比较：攻略结构化、可信，但静态且编辑产能有限；社区实时、可互动，但要承受内容质量失控与冷启动风险。"
      - "能评估第三条路（扩充编辑团队、更高频更新攻略）为什么不成立或成本更高，而非只在两个现成选项里打转。"
      - "能用后续事实（社区崛起、3 亿月活、搜索成为消费决策入口）校验当年的转型判断，同时指出后见之明不能替代当时的决策逻辑。"
  forbidden_leaks:
    - "「需求被验证 ≠ 问题被解决」的核心区分"
    - "「静态文档解不了实时、可追问的决策信息问题」的问题重定义结论"
    - "「用户既是信息消费者也是生产者」的供给侧洞察"
    - "「扩充编辑团队为何不可行」的第三方案排除结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求你定义「用户真正要解决的问题」。动笔之前先想清楚一个前置问题：50 万次下载这个数字，究竟证明了什么、又不能证明什么？把这两件事分开，你的答案才不会变成对一次成功转型的事后赞美。"
  - level: 2
    stage: 视角补充
    question: "代入一个具体的人：下周要去香港购物的女生。把她从「出发前做功课」到「在店里掏钱」的完整链路走一遍——那份出发前下载的攻略，从哪一刻开始帮不上她了？那一刻她需要的是什么？"
  - level: 3
    stage: 反例/风险
    question: "攻略形态并非一无是处：它结构化、可信、制作精良；社区形态也不是免费的午餐：内容良莠不齐、冷启动困难。你会怎么比较这两种形态各自的「解决力」？有没有第三条路——比如把编辑团队扩大十倍、把攻略做得更全更勤？"
  - level: 4
    stage: 取舍权衡
    question: "转型社区，意味着团队从「内容的生产者」变成「内容生态的维护者」——放弃对内容质量的直接控制，换取信息的规模与时效。这个交换的代价是什么？在什么情况下，这个交换是亏的？"
  - level: 5
    stage: 验证方式
    question: "假设转型半年后，你要向投资人证明「转对了」，你会拿出哪几组指标？这些指标怎么区分「用户真的解决了购物决策问题」和「用户只是来逛、来杀时间」？"
materials:
