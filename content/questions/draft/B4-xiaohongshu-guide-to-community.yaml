      summary: "创始人兼 CEO 毛文超自述整理，完整讲述「购物攻略 → 社区 → 电商」的转型逻辑：「早期的 PDF 攻略是基于事实的信息，无法做到信息碎片化，很难实时更新……相对静态的信息流使得攻略型产品很难和用户之间产生即时、双向、有粘性的互动机制」；并含创业痛点（药妆店做功课无从下手）、种子用户获取（香港购物指南 App 与人肉答疑）、用户自发分享促成改名「小红书购物笔记」等一手细节——理解本题问题重定义的最直接材料。"
