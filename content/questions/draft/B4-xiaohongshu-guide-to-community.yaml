reveal_after_first_answer:
  text: "团队的实际选择：2013 年年底，「小红书香港购物指南」App 上线，正值香港圣诞购物季，每天自然获取几百个种子用户；创始人亲自发笔记、人肉回答「有金色吗、要排队吗」这类实时问题；用户很快开始自发分享韩国、日本的购物经验并互相讨论，产品随之改名「小红书购物笔记」，转型为鼓励用户生产内容、以此推动信息高频迭代的 UGC 社区。后续结果：2014 年，小红书作为海外购物分享社区在行业内迅速崛起；到 2023 年，月活跃用户已达 3.12 亿；官方在 2023 年底的商业大会上公布：42% 的新用户来到小红书第一天就使用搜索，70% 的月活用户有搜索行为、其中 88% 为用户主动发起，并观察到用户「进入交易场前，已经在小红书做过『功课』，做好了决策」。毛文超后来复盘编辑生产路线时说：「如果我拥有 200 个编辑，那我一定是失败的。」"
  citations: [1, 2, 4, 5]
uncertainty:
  - "小红书早期时间线各媒体口径不一：PDF 攻略上线时间（2013 年 6 月／9 月／10 月）、攻略作者构成（瞿芳自述「创始团队凭自己的海外购物经验撰写」、《中国经营报》称「找长期在海外生活的人」撰写）均有出入；案例按双源合并表述为「创始团队与海外作者撰写」。"
  - "「50 万次下载」现有双源印证：创始人瞿芳署名文章（新民晚报，2021）与《中国经营报》（2019），均表述为上线不足一个月、2013 年 10 月达到 50 万次；具体起算日期未披露。"
  - "下载之后的使用数据（读完率、是否带出境使用、对购物决策的实际影响）未见任何公开披露——案例中的「未知」并非题设遗漏，而是当时真实的信息状态。"
  - "转型时点口径：瞿芳自述「很快上线了第一版 APP」，毛文超自述为 2013 年年底「小红书香港购物指南」上线后改名，《中国经营报》表述为 2013 年年底「小红书购物笔记」App 上线；reveal 按毛文超口径叙述。"
  - "當代中國报道中「超过 4.5 亿用户」为 2022 年注册用户量级口径，与月活不同；reveal 中月活统一采用时代财经「2023 年月活已达 3.12 亿」口径。"
