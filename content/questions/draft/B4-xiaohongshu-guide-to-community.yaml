main_question: "小红书的第一代产品《小红书出境购物攻略》上线不到一个月被下载 50 万次，团队因此「更加笃定方向正确」；与此同时，用户反馈的问题暴露出攻略在使用中的断点。请你回答三问：第一，50 万次下载这个数字，能支持哪些判断、不能支持哪些判断？第二，结合案例中的使用断点，你会把「当前要解决的问题」重新界定成什么——说清对象、场景、目标差距与处理边界？第三，现有信息下还有哪些关键未知，你需要什么证据才能让判断再进一步？"
ability_tags:
  - 问题定义
  - 用户理解
  - 产品价值判断
rubric:
  dimensions:
    问题定义:
      - "先明确用户对象与场景，再给出目标差距结构：当前状态（用户在出境购物决策中只有静态、会过期、无法追问的攻略信息可用）、期望状态（在决策实际发生的时点上能获得可靠、最新、可追问的购物信息）、两者差距落在哪——描述的是用户处境，而非预设某种产品形态。"
      - "能给出明确的处理边界：本次界定与处理的是购物决策的信息供给问题——价格信息属于信息形态之内，可以涉及；商品定价、供给、履约与退税流程等不属于本题边界，不承诺一并解决；边界划在哪里有理由。"
      - "能准确界定「50 万次下载」的证据效力：它支持「获取资料的兴趣」一类判断，但不能独自证明实际使用、需求成立或问题解决——下载发生在使用之前，不携带使用效果的信息。"
      - "能从问题定义开放地导出多条候选路径（如继续把攻略做得更全更勤、在攻略上增加问答或互动机制、转向用户彼此分享的社区等），并说明每条路径成立需要什么条件；选择哪条路径均可得高分，评分看界定与证据的匹配质量，不看结论方向。"
      - "能明示现有信息下仍有的关键未知（如 50 万下载者的读完率与真实使用、断点波及多少用户、用户愿不愿意从看攻略的人变成写经验的人），并指出各需要什么证据收敛，而非把未知包装成结论。"
    用户理解:
      - "能还原用户从「出发前做功课」到「现场掏钱决策」的完整链路，指出攻略信息在链路上可能失效的具体时点（信息过期、现场遇到个性化问题无法追问），而非笼统说「攻略不好用」。"
      - "能区分链路不同阶段的诉求差异：出发前要结构化、可信的功课信息，现场要即时、可追问的答案——两种诉求对信息形态的要求不同。"
      - "能对用户行为证据分层解读：下载不等于读完，读完不等于用上，用上不等于解决问题；不把单一行为数据外推为完整的用户判断。"
    产品价值判断:
      - "能对候选路径做价值与代价的双边比较（攻略结构化、可信，但编辑产能有限、更新慢；问答或社区实时、可互动，但要承担冷启动与内容质量风险），而非只给单边结论。"
      - "能把每条路径的价值判断挂在可检验的成立条件上（如「若用户愿意持续分享，社区路线才成立；反之冷启动失败」），并说明条件不成立时结论如何变化。"
      - "能识别当前证据不足以支撑价值定论的部分（如 50 万下载说明不了用户会为哪种形态持续留存），明确还需要什么证据，而非用后见之明或下载量倒推形态正确。"
  forbidden_leaks:
    - "「50 万次下载证明关注与尝试、但不证明问题被解决」的证据效力结论"
    - "「攻略形态解不了、社区形态可以」的转型结论"
    - "小红书转型社区的实际决策与后续结果（3.12 亿月活、42% 新用户首日搜索等）"
    - "「用户可能从信息消费者转为生产者」的供给侧判断"
    - "各候选路径（继续改攻略／增加问答／转社区）的现成优劣排序"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目有三问：下载量支持什么判断、问题重新界定成什么、还有哪些未知。动笔之前先想清楚一个前置问题：「下载」这个动作，发生在「使用」之前还是之后？这个先后顺序，会怎样影响这个数字能证明的事、和注定证明不了的事？"
  - level: 2
    stage: 视角补充
    question: "代入一个具体的人：下周要去香港购物的女生。把她从「出发前做功课」到「在店里掏钱」的完整链路走一遍——那份出发前下载的攻略，在链路的哪些时点帮得上她，哪些时点帮不上？帮不上的时点，她缺的到底是什么？"
  - level: 3
    stage: 反例/风险
    question: "对同一个数字，两种读法都能找到听众：「下载量这么高，说明用户要的就是这个」；「断点这么明显，说明攻略这条路走不通」。这两种读法各自悄悄跳过了哪一步？要让它们各自真正成立，分别还需要补什么证据？"
  - level: 4
    stage: 路径展开
    question: "基于你界定的问题，候选做法不止一条：把攻略做得更全更勤、在攻略上增加问答或互动、让用户彼此分享经验……先别急着选。反过来说：你的问题定义里出现哪些条件时，某一条路会变得明显更合适？"
  - level: 5
    stage: 验证方式
    question: "回到最后一问：你的答案里，哪些判断目前其实还没有证据？挑一两个你认为最关键的未知（比如下载者真实的读完与使用情况、断点波及多少用户），说说你会用什么办法拿到证据——什么结果会支持你现在的界定，什么结果会让你推翻它？"
