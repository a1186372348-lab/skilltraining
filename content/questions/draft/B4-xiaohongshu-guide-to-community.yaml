# B4 ｜ 50 万次下载之后：问题到底是什么
# 批次：T33 题库扩容第一批基线题（B4）｜ 主测维度：问题定义 ｜ 状态：草案，返工重写后待产品负责人评审
# 返工说明：评审认定原题面预置「攻略解不了、社区可以」结论（「需求已被验证」提前锁死判断空间）。
# 本次重写：题面改为「50 万次下载支持哪些判断＋结合断点重定义问题＋明示未知」；信息披露截至 2013 年 10 月决策时点，
# 转型决策与后续结果（3.12 亿月活、42% 首日搜索等）移入 reveal_after_first_answer；多路径开放，Rubric 按证据匹配评分。
id: B4
title: "50 万次下载之后：问题到底是什么"
case_title: "一份攻略 PDF 的首月数据与三道追问"
kind: baseline
domain: 内容/社交
difficulty: 基础
case_background:
  product:
    text: "小红书——2013 年 6 月由毛文超与瞿芳在上海创立；它的第一个产品形态是一份名为《小红书出境购物攻略》的 PDF 文件，放在网站上供用户下载，内容由创始团队与长期生活在海外的作者撰写（瞿芳自述，其中美国部分由她亲自执笔）。"
    citations: [3, 4, 6]
  audience:
    text: "这份攻略面向有出境旅行与购物计划的中国年轻消费者——他们出发前要「做功课」：买什么、去哪买划算、怎么退税；当时互联网上旅游攻略很多，海外旅游购物攻略却几乎是真空状态。瞿芳回忆，当时中国年出境游人次突破 7000 万，跨境购物需求旺盛，「但是大家并不清楚如何买得好、买得划算」。"
    citations: [1, 3, 6]
  scenario:
    text: "出境购物的决策链路很长：出发前要查资料做功课，到了现场又是另一番处境——毛文超自述，他在日本药妆店因「看不懂介绍、语言不通」，「即便知道有很多好东西，没有事先做功课也就无从下手」。"
    citations: [1]
  features:
    text: "《小红书出境购物攻略》是一份编辑生产的静态文档：内容一旦写好便固定下来——有报道举例，一个品牌头一天刚宣布打折，第二天活动就可能截止，精细化制作的 PDF 很难做到实时更新；创始人后来复盘，这种形态「无法做到信息碎片化」，也「很难和用户之间产生即时、双向、有粘性的互动机制」——用户遇到具体问题，无法向一份 PDF 追问。"
    citations: [1, 7]
  status:
    text: "上线不到一个月，这份 PDF 在 2013 年 10 月就被下载了 50 万次。瞿芳自述，这让他们「尝到了首战告捷的喜悦」，「更加笃定，这个方向是正确的」；与此同时，用户开始反馈更多问题——「哪里最便宜？热门商品哪里能买到？开店时间是否有调整？」——这些问题，PDF 里没有答案。"
    citations: [4, 6]
