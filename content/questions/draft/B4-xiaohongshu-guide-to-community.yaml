uncertainty:
  - "小红书早期时间线各媒体口径不一：PDF 攻略上线时间（2013 年 6 月／9 月／10 月）、「出境购物攻略」App 与「香港购物指南」的关系表述均有出入；案例只采用创始人自述（亿邦动力整理）与《中国经营报》报道可双源印证的事实。"
  - "「50 万次下载」为《中国经营报》等媒体转述口径（「2013 年 10 月就被下载了 50 万次」），未检索到小红书官方原始披露，评审可酌情降权。"
  - "當代中國报道中「超过 4.5 亿用户」为 2022 年注册用户量级口径，与月活不同；案例月活统一采用时代财经「2023 年月活已达 3.12 亿」口径。"
  - "毛文超自述中的用户画像（85 后、90 后为主、女性占比 70%~80%）为 2015 年口径，仅用于还原早期用户结构，不代表今日的小红书用户构成。"
