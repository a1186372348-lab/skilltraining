# B4 ｜ 小红书为什么把 50 万次下载的攻略「推倒」重做
# 批次：T33 题库扩容第一批基线题（B4）｜ 主测维度：问题定义 ｜ 状态：草案，待产品负责人评审后上架
id: B4
title: "小红书为什么把 50 万次下载的攻略「推倒」重做"
case_title: "一份攻略 PDF 的「死亡通知」"
kind: baseline
domain: 内容/社交
difficulty: 基础
case_background:
  product:
    text: "小红书——2013 年 6 月由毛文超与瞿芳在上海创立；它的第一个产品形态不是社区，而是一份名为《小红书出境购物攻略》的 PDF 文件，放在网站上供用户下载——这份 PDF 在 2013 年 10 月就被下载了 50 万次。"
    citations: [3, 4]
  audience:
    text: "有出境旅行与购物计划的中国年轻消费者——小红书早期用户以一线城市的 85 后、90 后为主，女性占比高达七到八成；他们出发前要「做功课」：买什么、去哪买划算、怎么退税，但当时海外旅游购物攻略信息几乎是空白。"
    citations: [1, 3]
  scenario:
    text: "出境购物的决策链路很长：在日本药妆店里看不懂介绍、语言不通，「即便知道有很多好东西，没有事先做功课也就无从下手」；而 PDF 攻略是基于事实整理的静态信息——无法做到信息碎片化、很难实时更新，也难以和用户之间产生即时、双向、有粘性的互动，对购物这种时效性更高的场景天然不够。"
    citations: [1, 3]
  features:
    text: "2013 年年底，「小红书香港购物指南」App 上线，正值香港圣诞购物季，每天自然获取几百个种子用户；创始人亲自发笔记、人肉回答「有金色吗、要排队吗」这类实时问题；用户很快开始自发分享韩国、日本的购物经验并互相讨论，产品随之改名「小红书购物笔记」，转型为鼓励用户生产内容、以此推动信息高频迭代的 UGC 社区。"
    citations: [1, 4]
  status:
    text: "转型被验证：2014 年，小红书作为海外购物分享社区在行业内迅速崛起；到 2023 年，小红书月活跃用户已达 3.12 亿；官方在 2023 年底的商业大会上公布：42% 的新用户来到小红书第一天就使用搜索，70% 的月活用户有搜索行为、其中 88% 为用户主动发起——小红书已成为用户「消费决策前先做功课」的入口。"
    citations: [2, 4, 5]
