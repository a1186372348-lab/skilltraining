    - "「同店销售与无券自然复购是判断该不该继续的核心指标」的结论性指引"
    - "2024 全年 GAAP 净利润约 29.32 亿元、同店降幅逐季收窄并于 2024 年 12 月转正等事后结果数据"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求你界定「最值得优先解决的经营问题」。动笔前先分清三件事：财报上能看到的现象（由盈转亏、同店转负、活动缩水）、舆论里的说法（「9.9 玩不起了」）、你判断的问题——这三者是同一个东西吗？你会从哪一个出发，为什么？"
  - level: 2
    stage: 视角补充
    question: "代入三种人看同一张 9.9 券：一个每周用券的老用户、一位盯着回本周期的联营商、库迪的拓店负责人。他们各自眼里「现在出了什么问题」？把三种说法放在一起，你的问题定义准备覆盖谁、不覆盖谁？"
  - level: 3
    stage: 结构梳理
    question: "试着用三句话写出「当前状态—期望状态—差距」：现在经营上实际在发生什么、希望它变成什么样、中间差的那一块到底是什么。写完检查：你填在「差距」里的，是一个可观察的经营状态，还是一个未经检验的机制解释？你用什么事实支撑它？"
  - level: 4
    stage: 边界与口径
    question: "给你的定义做两个压力测试：如果 9.9 明天全停，你定义的问题会消失、不变还是换个形态？如果永远不停呢？再检查口径：「低价就是亏本补贴」在你的定义里成立吗——你用的是哪个成本口径、和什么基准比较？"
  - level: 5
    stage: 依据与反证
    question: "回看你引用的案例事实：同店销售、门店层面利润率、活动范围收缩的具体形态、对手的补贴表态——你的定义能解释其中几条？有没有哪条事实是你的定义解释不了、或需要额外假设才能解释的？出现什么新证据，你会修改甚至放弃现在的定义？"
