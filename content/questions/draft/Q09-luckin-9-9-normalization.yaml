# Q09 ｜ 瑞幸 9.9 常态化：补贴从获客手段变成了什么
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q09
title: "瑞幸 9.9 常态化：补贴从获客手段变成了什么"
case_title: "当 9.9 元从促销变成日常：一杯咖啡的价格心智之争"
case_background:
  product: "瑞幸咖啡——连锁咖啡品牌，线上下单+自提/外卖模式，2023 年 6 月门店数破万，为中国门店规模最大的咖啡连锁。"
  audience: "高频大众咖啡消费者（价格敏感型占比高）、对联营回本周期敏感的联营商；博弈对手是同样打低价的库迪咖啡。"
  scenario: "用户打开 App/小程序点单，9.9 元券后价逐渐成为默认心智价格；正价菜单价形同虚设，无券不下单。"
  related_features: "每周 9.9 元券、大数据定向发券、阶梯次卡、联名爆款（如酱香拿铁）、联营加盟扩张、私域社群发券。"
  current_status: "2023 年 2 月库迪发起 9.9 元价格战；瑞幸 2023 年 4 月局部跟进、6 月以「万店同庆」在全国推每周 9.9 元券并常态化；2023 年营收约 249 亿元、超过星巴克中国，月均交易客户 4837 万；但 2023Q4 自营门店利润率同比下滑 8.1 个百分点，2024Q1 由盈转亏（净亏损约 8320 万元）、自营门店同店销售额同比下滑；2024 年起瑞幸逐步收缩 9.9 活动范围，库迪则宣称门店补贴延续至 2026 年底。"
main_question: "「9.9 元常态化」之后，补贴还是补贴吗？如果你是瑞幸的产品/经营负责人，请定义：当 9.9 从拉新手段变成长期常态，它实际上变成了什么？用户心智、成本结构、竞争格局分别发生了什么不可逆的变化？你会用什么指标判断「该不该继续、以什么范围继续」？"
ability_tags:
  - 问题定义
  - 根因分析
  - 指标与验证
difficulty: 中等
rubric:
  dimensions:
    问题定义:
      - "能区分补贴的两种性质：临时获客成本（可退出）vs 常态化后实际成为定价体系与价格锚点本身。"
      - "能定义真正的核心问题：常态化低价改写了用户的参考价格，使正价失去锚点，「恢复原价」在用户感知中等同于「涨价」。"
      - "能把问题分解到三层：用户心智（价格预期）、单店经济模型（杯量×毛利）、竞争格局（与库迪的僵局），而非只说「亏钱」。"
      - "能识别问题的路径依赖：用户与联营商都已按 9.9 重新校准预期，退出成本随时间递增。"
    根因分析:
      - "能还原因果链：库迪贴着瑞幸扩张发起价格战 → 瑞幸防御性跟进 → 规模与杯量冲高掩盖毛利侵蚀 → 对手不退则无法单独停战。"
      - "能解释「去年狂赚、今年亏惨」的机制：2023 年杯量与爆款对冲了降价，2024 年杯量增长放缓、同店转负后毛利缺口暴露。"
      - "能指出博弈结构：双方都在失血，但谁先在核心区域退出谁丢份额，补贴从手段变成「人质」。"
      - "能区分瑞幸（上市公司，需对利润负责）与库迪（联营商出资扩张）承受价格战的不同体质。"
    指标与验证:
      - "指标覆盖三层：经营（同店销售增长率、单杯价格与毛利、门店经营利润率）、用户（月均交易客户、券核销率、无券自然复购）、竞争（对手门店密度、关店率）。"
      - "能提出「该不该继续」的决策标准：如边际获客成本与用户生命周期价值的比较、补贴的增量杯量弹性是否趋近于零。"
      - "能设计验证：如分城市/分门店梯度收缩 9.9 范围，观测同店与复购变化（瑞幸 2024 年的收缩即为天然实验）。"
      - "能识别虚荣指标：总营收与总杯量增长会掩盖同店恶化，应看同店与无券交易占比。"
  forbidden_leaks:
    - "「补贴从获客成本变成价格锚点/定价体系」的核心判断"
    - "「参考价格被改写、恢复正价等于涨价」的心智机制"
    - "囚徒困境/人质结构是竞争分析的期望要点"
    - "「2023 年靠杯量与爆款对冲、2024 年杯量放缓暴露毛利」的解释框架"
    - "同店销售增长率、无券复购率是期望的关键指标"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问补贴「变成了什么」。先回答一个更基础的问题：一笔 9.9 元补贴，在活动第 1 个月和第 18 个月，对用户的预期、对财务报表，分别还是同一个东西吗？"
  - level: 2
    stage: 视角补充
    question: "换三个视角看同一杯 9.9 元的咖啡：一个每周用券的老用户、一位盯着回本周期的联营商、库迪的拓店负责人。他们各自希望 9.9 停，还是不停？"
  - level: 3
    stage: 反例/风险
    question: "如果瑞幸明天全面恢复正价，最坏会发生什么？如果永远不停，最坏又会发生什么？这两种「最坏」，哪一个更不可逆？"
  - level: 4
    stage: 取舍权衡
    question: "停 9.9 的代价和不停 9.9 的代价，分别由谁、在什么时间尺度上承担？存不存在「部分停」的中间态，它的风险又是什么？"
  - level: 5
    stage: 验证方式
    question: "管理层让你回答「9.9 还要不要继续」。你会要哪几个数字、做哪种对照，才能给出有依据的建议而不是拍脑袋？"
