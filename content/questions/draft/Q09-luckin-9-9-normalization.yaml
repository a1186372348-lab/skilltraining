# Q09 ｜ 瑞幸 9.9 常态化之后：界定最值得解决的经营问题
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，T33 复审返工重写（退回项：主测重构与指定因果链修正）
# 返工说明（产品负责人裁决）：
# ①保留问题定义主测、重组主任务——原主问题「9.9 变成了什么」偏概念解释，改为要求用户界定
#   当前最值得解决的经营问题（对象/场景/目标差距/处理边界/判断依据五要素），价格锚点分析降级为素材；
# ②删除「不可逆」预设——「恢复原价等同涨价」「退出成本持续递增」「对手不退就不能停战」降为候选解释，
#   低价不自动等同亏本补贴（须明确比较基准与成本口径）；
# ③修正季度与年度口径——2024Q1 自营同店 -20.3%、GAAP 净亏损 8320 万元、2024 全年 GAAP 净利润约 29.32 亿元
#   （均经 SEC 财报原文核对）；采用完整复盘呈现：2024 全年后续变化放入 reveal_after_first_answer，
#   Rubric 不得据结果倒推当初判断；
# ④重写验证标准——收缩不自动等于天然实验（须说明对照可比性）；指标重点是增量利润与需求变化；
#   无券交易占比不能单独证明经营健康；LTV 须明确收入或利润口径。
id: Q09
title: "瑞幸 9.9 常态化之后：最值得解决的经营问题是什么"
case_title: "当 9.9 元从促销变成日常：一杯咖啡的价格心智之争"
case_background:
  product:
    text: "瑞幸咖啡——连锁咖啡品牌；2023 年 6 月门店数突破一万家，2023 年底门店总数达 16248 家，官方口径为中国门店数量最多的咖啡连锁品牌。"
    citations: [1]
  audience:
    text: "核心人群是高频大众咖啡消费者（2023 年月均交易客户约 4840 万）；门店网络含自营与联营两类（2023 年底联营门店 5620 家），价格战的对手是 2023 年 2 月发起 9.9 元价格战的库迪咖啡。"
    citations: [1, 4]
  scenario:
    text: "消费者点单时，「每周 9.9 元」券后价逐渐成为许多人的默认比价基准；2024 年春节后「瑞幸 9.9 活动缩水」一度成为舆论热点，公司收缩优惠的尝试遭遇明显的舆论阻力。"
    citations: [4, 8]
  features:
    text: "每周 9.9 元券、高频上新（2023 年推出 100 余款 SKU）、自营与联营门店快速扩张（2023 年净新开门店 8034 家）。"
    citations: [1, 5]
  status:
    text: "2023 年 2 月库迪发起 9.9 元价格战；瑞幸 2023 年 4 月局部跟进，6 月门店破万后以「万店同庆」将「每周 9.9 元」常态化，郭谨一曾公开表示要把 9.9 优惠活动延长至少两年；2023 年瑞幸总净收入 249.03 亿元（同比增长 87.3%）、收入规模超过星巴克中国；但 2023 年第四季度自营门店层面经营利润率同比下降 8.1 个百分点至 13.5%，2024 年第一季度由盈转亏：GAAP 净亏损 8320 万元（上年同期净利润 5.65 亿元），自营门店同店销售额同比下降 20.3%（上年同期为增长 29.6%）；2024 年春节后起瑞幸逐步收缩 9.9 活动范围（全场饮品可用缩减为限定款可用、部分渠道仅限新客），库迪则宣称门店补贴延续至 2026 年底。"
    citations: [1, 2, 4, 5, 6, 7]
