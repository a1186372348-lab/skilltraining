# 初答后披露（供 AI 总监追问引用）：决策时点（2024 年年中）之后的后续结果，不进案例背景
reveal_after_first_answer:
  text: "2024 年全年后续结果（完整复盘，供追问引用）：2024 年第一季度亏损之后，瑞幸自营门店同店销售额降幅逐季收窄——第二季度 -20.9%、第三季度 -13.1%、第四季度 -3.4%，公司口径该指标 2024 年 12 月转正；2024 全年总净收入 344.75 亿元（同比增长 38.4%），全年 GAAP 营业利润 35.38 亿元、GAAP 净利润约 29.32 亿元（同比增长约 3%），全年净新开门店 6092 家、年末门店总数 22340 家。即：一季度由盈转亏并未演变为全年亏损，「去年狂赚、今年亏惨」的媒体概括与全年官方口径不符；但同店销售全年仍为 -16.7%（2023 年为 +21.0%），收缩 9.9 与继续扩张并行的全年轨迹，比单季度亏损更难用一句话定性。"
  citations: [3]
main_question: "时间是 2024 年年中：一季度由盈转亏、自营同店销售转负，瑞幸一边继续开店，一边收缩 9.9 活动范围，对手则宣称补贴再延两年。如果你是瑞幸的产品/经营负责人，请界定：公司当前最值得优先解决的经营问题是什么？要求说清五件事：问题的对象（这个问题落在谁身上——价格敏感用户、联营商、单店模型还是公司整体）、发生的场景（在什么交易与竞争情境中出现）、目标差距（当前状态是什么、期望状态是什么、差距具体在哪）、处理边界（你的定义覆盖到什么范围、不承诺解决什么）、判断依据（哪些案例事实支持你的定义、出现什么证据会推翻它）。价格锚点、成本结构、竞争格局的分析可以作为支撑定义的素材，但不是答案本身；「不可逆」类强判断（如恢复正价等同涨价、退出成本持续递增、对手不退就不能停战）只能作为候选解释提出，需说明成立条件或给出反证。如果你认为现有事实不足以唯一确定问题定义，请明说还缺什么证据。"
ability_tags:
  - 问题定义
  - 根因分析
  - 指标与验证
difficulty: 中等
domain: "本地生活"
rubric:
  dimensions:
    问题定义:
      - "界定对象与场景：明确指出问题落在谁身上（价格敏感用户、联营商、单店盈利模型、公司整体利润结构）、发生在什么交易与竞争情境中，而非笼统归因于「补贴有问题」「价格战打不下去」。"
      - "目标差距结构：能拆出当前状态（9.9 常态化后经营上实际在发生什么）、期望状态（希望达到什么经营状态）、两者差距具体在哪，三段齐备且互相咬合，而非把「由盈转亏」复述一遍当定义。"
      - "处理边界：说明定义的适用范围——本次处理的是 9.9 政策的去留与范围、整个定价体系，还是扩张节奏与竞争策略的取舍；不承诺一次解决所有关联问题，也不把个案定义无限泛化。"
      - "用案例事实校验定义：至少用两处案例事实（如自营同店 -20.3%、门店层面利润率变化、活动范围收缩的具体形态、对手补贴延续的表态）检验定义能否解释这些现象，而非纯概念推演。"
      - "判断依据的可检验性：给出可检验的判据——什么数据会支持该定义、什么证据会推翻它；或明确指出现有证据不足以唯一确定定义、还需要补充什么。合理承认未知是合法高分路径。"
    根因分析:
      - "能形成并比较多个有依据的候选解释（如低价改变用户比价基准、门店加密分流同店、季节性与补贴叠加侵蚀毛利、竞争对峙下的防御性亏损），每个解释都落到案例事实，而非罗列可能性。"
      - "对「不可逆」类强判断——恢复正价等同涨价、退出成本随时间递增、对手不退就不能停战——能说明各自的成立条件与所需证据，或提出反证；把它们当作不证自明的前提直接推演不得分。"
      - "口径意识：不把低价直接等同于「亏本补贴」——能明确比较基准与成本口径（单杯毛利、门店层面经营利润率、GAAP 净利润，含不含规模与供应链摊薄）；知道同店销售额是收入口径，不能直接推导杯量下降或增长放缓。"
      - "能区分瑞幸（上市公司、需对利润负责）与库迪（联营商出资扩张）承受价格战的不同结构，并说明这种差异如何影响各自的选择空间；「杯量与爆款对冲降价」类解释需独立证据支撑，不能从利润结果倒推。"
      - "对材料中的官方归因（CFO 称平均售价下降与扩张成本所致）与有归属的第三方观点（媒体复盘框架、化名业内人士与网友表态）：复述这些观点不得当作独立论证，按证据使用与检验质量评分——指出它们与哪些事实一致、哪些事实解释不了或仍需佐证。"
    指标与验证:
      - "指标围绕「政策带来的增量」设计：9.9 的增量利润与增量需求变化（有券与无券、收缩前后、不同活动范围门店之间的对比），而非只看总营收、总门店数等会被扩张掩盖的总量指标。"
      - "对照设计的可比性：若借用收缩做前后或分组对照，需说明对照为什么可比——商圈与门店密度差异、用户跨店购买、券使用规则变化、竞争反应都可能污染对照；直接拿「瑞幸收缩即天然实验」当结论不得分。"
      - "判断基准与口径：给出「什么算该继续、什么算该收缩」的可检验判据（如增量利润的方向、补贴的边际获客效率变化），并明确口径——LTV 类指标必须说明是收入口径还是利润口径；无券交易占比不能单独证明经营健康。"
      - "知道证据的局限：现有公开数据能支撑到哪一步、哪些判断需要内部数据（券核销率、分门店杯量、用户跨店迁移）才能下结论；「现有证据不足以下结论」+说明需要什么证据，是合法且严谨的产出。"
      - "评分边界（不倒推结果）：评价对象是决策时点（2024 年年中）的定义与论证质量；2024 全年后续结果（全年 GAAP 净利润约 29.32 亿元、同店降幅逐季收窄并于 12 月转正）已知与否不影响评分，不得据后续结果倒推当初判断。"
  forbidden_leaks:
    - "「9.9 已从获客补贴变成价格锚点/定价体系本身」的定性结论"
