id: Q22
title: Monzo 赌博交易拦截：如何设计开启与退出保护
case_title: 帮助用户自愿设置一条有摩擦的边界
case_background:
  product:
    text: Monzo 在 2018 年推出可选功能，针对使用 Monzo 卡向赌博商户发起的付款进行拦截。
    citations:
      - 1
      - 5
  audience:
    text: 该功能面向希望限制自己赌博支出的账户用户；公司称曾征求提出该需求的用户意见。
    citations:
      - 1
  scenario:
    text: 用户可通过 app 或联系支持团队开启拦截；2018 年文章说明关闭时需先联系支持团队，再等待 48 小时，然后由用户在 app 中自行关闭。
    citations:
      - 1
  features:
    text: 系统依据商户类型代码尽力识别并拦截赌博商户的 Monzo 卡交易；商户若未被识别，交易可能不被拦截，也不能保证覆盖所有支付方式。
    citations:
      - 1
      - 5
  status:
    text: Monzo 称 2018 年推出前曾与提出该需求的人测试，并听取社区反馈；拦截并非适合所有人的完整解决办法。
    citations:
      - 1
