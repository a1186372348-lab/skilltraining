uncertainty:
  - 案例以 2018 年 6 月公告的已推出机制为准；5 月官方说明仅交代推出前设计与可能边界，文末其他设想不代表当时已上线。其余行业背景或通用方法资料不作为当时 Monzo 具体能力的证据。
  - 交易拦截不是治疗，也不能保证覆盖所有支付方式；材料未给出伤害降低的因果结果。
