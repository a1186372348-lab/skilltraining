main_question: 以 2018 年首次推出时的机制为基础，假设你负责帮助自愿使用者开启与退出拦截。请设计从理解范围、开启、误拦处理到申请关闭的流程：在哪些地方应增加保护性摩擦，哪些地方仍需保持清晰和可求助？解释你的取舍与验证方式。
ability_tags:
  - 方案设计
  - 用户理解
  - 产品取舍
difficulty: 中等
domain: 金融
kind: daily
rubric:
  dimensions:
    方案设计:
      - 给出开启、反馈、误拦求助与关闭申请的连续流程，说明关键状态。
      - 准确传达拦截范围与局限，不承诺覆盖全部支付渠道。
      - 设置保护性摩擦的同时保留可理解求助路径和必要的隐私保护。
      - 将自拟改进与 2018 年实际机制分开，不将未给出的能力当作历史事实。
    用户理解:
      - 理解选择使用拦截的人可能处于不同情境，不将所有用户视为同一种状态。
      - 考虑误拦、急需协助或改变决定等不同需要，不以羞辱式文案描述用户。
      - 说明需要与有相关经验的人共同验证，而不是替用户假定意图。
    产品取舍:
      - 解释便利开启、退出自由与降低冲动风险之间至少一项具体取舍。
      - 结合方案说明误拦求助、隐私或支持成本中的相关代价，不只追求拦截次数。
      - 提出可观察的风险或调整条件，并解释怎样在验证中关注它。
  forbidden_leaks:
    - 开启、误拦与关闭申请的完整保护流程和所有提示文案。
    - 只要开启功能即可完全避免赌博伤害的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 用户开启之前应知道这项拦截覆盖什么、不覆盖什么？
  - level: 2
    stage: 视角补充
    question: 一笔付款被误拦时，用户如何获得帮助而不必公开敏感细节？
  - level: 3
    stage: 反例与风险
    question: 如果关闭太容易或太困难，分别可能带来什么代价？
  - level: 4
    stage: 取舍权衡
    question: 与客服交互需要收集哪些最少信息，哪些不应默认要求？
  - level: 5
    stage: 验证方式
    question: 怎样与有亲身经验的用户一起测试，而不只统计拦截次数？
