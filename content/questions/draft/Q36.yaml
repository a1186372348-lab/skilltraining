main_question: 假设你在 2023 年 2 月 28 日为某试点门店调查顾客是否能顺利完成车边退货，但尚无该门店的流失、等待或投诉数据。请把“退货不顺畅”改写成可检验的问题；沿发现入口、资格确认、到店交接和退款进度，提出至少三个可区分、也可能同时存在的原因假设，说明各自对应的观察证据；给出优先调查顺序，并为一个优先环节说明调查对象和衡量方式，不必在没有数据时排定主因。区分应用问题、门店执行与退货政策限制，不把假设写成已发生的故障。
ability_tags: [根因分析, 问题定义, 指标与验证]
difficulty: 中等
domain: 本地生活
rubric:
  dimensions:
    根因分析:
      - 沿多个流程环节提出可区分、可能并存且可检验的原因，不直接断言单一根因。
      - 区分资格政策、应用理解与到店交接或退款进度等不同层面的可能障碍。
      - 解释每种假设对应的观察证据与可排除情形。
    问题定义:
      - 将笼统的不顺畅收敛为特定人群、阶段和可观察结果。
      - 明确当前没有失败率、等待时长和用户投诉等事实。
      - 界定车边退货与普通退货路径，避免把不符合条件视为系统故障。
    指标与验证:
      - 为一个优先环节说明观察对象、衡量结果和合适的分母。
      - 结合任务观察或访谈，解释如何理解日志不能揭示的原因；入口调查应覆盖有退货意图但未发起的人。
      - 结合影响或调查成本说明优先次序，并承认小样本与门店差异的限制。
  forbidden_leaks:
    - 按照入口、资格、到店和退款分段漏斗并结合访谈定位原因的完整诊断
hint_tree:
  - {level: 1, stage: 任务澄清, question: "从顾客想退货到确认退款，中间有哪些可观察步骤？"}
  - {level: 2, stage: 视角补充, question: "顾客、车边员工与执行退货政策的系统分别掌握什么信息？"}
  - {level: 3, stage: 反例与风险, question: "一件商品不能走车边退货，一定是应用出错吗？"}
  - {level: 4, stage: 取舍权衡, question: "哪些假设可以先用低成本观察区分，哪些需要更多门店样本？"}
  - {level: 5, stage: 验证方式, question: "每个步骤的分母是什么，日志之外需要怎样询问顾客？"}
