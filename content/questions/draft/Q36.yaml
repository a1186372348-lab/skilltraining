id: Q36
title: "Target 车边退货：如何定位用户完成退货的阻碍"
case_title: "车开到门店后，退货就一定顺畅吗？"
case_background:
  product:
    text: Target 推出 Returns with Drive Up，让符合条件的顾客通过车边服务退货。
