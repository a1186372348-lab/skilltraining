# 初答后披露（供 AI 总监追问引用）：决策时点之后的后续结果，不进案例背景
reveal_after_first_answer:
  text: "2024 年第四季度，知乎 MAU 为 8140 万，与上一季度的 8110 万基本持平；当季净利润 8640 万元、经调整净利润 9710 万元，为上市以来首次单季度盈利——但当季营收 8.59 亿元，同比下降 24.5%，2024 全年营收 35.99 亿元，同比下降 14.5%。2025 年第一季度，知乎营收 7.30 亿元、同比下降 24.1%，经调整净利润 690 万元实现扭亏，成本同比下降 33.3%（财报解释：内容及营运成本随收入下降、技术效率提升）；从这一季起，知乎财报不再披露 MAU 数据。"
  citations: [6, 2]
main_question: "知乎月活跃用户从 2023 年第三季度的 1.105 亿降至一年后的 8110 万；公司官方解释是「优化投放费用，低活跃用户减少、高活跃用户增加」。请你提出并比较至少两种对这轮 MAU 下滑的解释：现有证据分别支持它们到什么程度、不能证明什么？在此基础上，你目前最合理的判断是什么——如果证据不足以确定主因，说明为什么，以及你还需要看到什么证据才能区分。"
