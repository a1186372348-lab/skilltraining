difficulty: 基础
kind: baseline
domain: "内容/社交"
rubric:
  dimensions:
    根因分析:
      - "把「MAU 下滑」拆成可分别验证的结构（新客获取、老客留存、用户结构变化），说明现有证据能把下滑定位到哪一环、哪些环节还无法定位，而非笼统归因「知乎不行了」。"
      - "提出至少两种有依据的解释（如「公司主动收缩投放、挤出低活跃用户」「专业用户与创作者流失侵蚀基本盘」「行业大盘或替代品分流」等），每种解释都有案例事实支撑，而非罗列可能性。"
      - "比较各解释与证据的匹配程度：哪个解释能同时覆盖更多事实（MAU 曲线形态、营销费用增速、「水化」抱怨、官方口径），哪个解释下仍有事实无法解释或需要额外假设。"
      - "明确证据边界：说清现有证据能支持什么、不能证明什么；证据不足时给出条件式判断（「若某数据成立则主因更可能是某解释」）——有依据的主因判定与说明理由的暂缓判断均可得高分，扣分针对的是结论超出证据支持范围（如强行收敛到唯一根因而无证据支撑）。"
      - "对官方「优化投放、一减一增」的解释——支持、反对或暂时无法判断——均可，按论证质量评分：指出它与哪些事实一致、哪些事实它解释不了或仍需佐证（如「高活跃用户在增加」是否有数据支撑），而非全盘接受或预设立场。"
    用户理解:
      - "区分不同用户群体的不同处境：被投放吸引来的低活跃用户、抱怨「水化」的老用户、流失中的专业创作者，而非笼统谈论「用户」。"
      - "分析新用户的娱乐化内容需求与老用户的专业内容期待之间的差异，并用案例事实说明这种差异是否以及如何体现在用户去留上。"
      - "理解创作者的行为逻辑：流量与收益的分配方式如何影响专业创作者的产出决策，而非把创作者流失归为「情怀」。"
    指标与验证:
      - "指出单一 MAU 指标的局限：MAU 增长不等于社区健康，需要配合留存、活跃用户结构、创作者产出等指标判断。"
      - "把「内容水化」这类主观抱怨转化为可观察指标（如专业创作者月活与产出变化、推荐内容负反馈、搜索与关注页使用占比等）。"
      - "为检验「优化投放」解释给出可证伪的对照设计：若该解释成立，高活跃用户的留存、时长、付费等指标应呈现什么表现；出现什么数据则会削弱该解释。"
  forbidden_leaks:
    - "「营销买量换增长、投放一停就回落」的现成结论"
    - "「推荐/热榜分发挤压关注关系、流量向热点话题倾斜」的机制答案"
    - "「创作者收益对比劣势导致大V流失」的直接点破"
    - "「MAU 增长与社区健康背离」的指标结论"
    - "对官方「优化投放」说法的定性判断（如「只是借口/遮羞布」或「完全可信」）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目给了两个并存的事实：MAU 一度冲到 1.1 亿，「水化」的抱怨也从未停过。动笔前，你会先把「下滑」拆成哪几个可以分开验证的部分——是新用户变少了、老用户留不住了，还是用户结构变了？现有材料能让你把下滑定位到哪一部分？"
  - level: 2
    stage: 视角补充
    question: "请分别代入三种人：2021 年被广告投放吸引来的新用户、用了八年知乎、最近越来越常刷到娱乐八卦的老用户、写了十年专业回答的答主。同一次「月活下滑」，在他们各自身上对应什么不同的故事？"
  - level: 3
    stage: 替代解释
    question: "除了公司「优化投放」的说法，你还能给出至少一个同样能解释这些事实的替代解释吗？把营销费用曲线和「水化」抱怨放在一起看，还能讲出另一个自洽的故事吗？两个故事各自能解释哪些事实、解释不了哪些事实？"
  - level: 4
    stage: 证据比对
    question: "现在把你手里的几种解释并排放在同一张事实清单上：MAU 曲线、营销费用增速、长期存在的「水化」抱怨、官方「一减一增」的口径。哪个解释能同时覆盖最多事实？哪个解释下有事实显得反常或需要额外假设？"
  - level: 5
    stage: 结论与边界
    question: "在什么新证据出现之前，你不愿意把「主因」确定下来？如果今天必须给管理层一个判断，你会怎么表述——确定的部分是什么、保留的部分是什么、下一步先验证什么？"
