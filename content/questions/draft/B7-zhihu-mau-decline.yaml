# B7 ｜ 知乎月活回落：增长时代的账单
# 批次：T33 基线测评题（B7）｜ 状态：草案，待产品负责人评审后上架
id: B7
title: "知乎月活一年回落近三成：问题出在哪一层"
case_title: "一个月活过亿的社区开始「缩水」"
case_background:
  product:
    text: "知乎——2011 年 1 月上线的问答式在线社区，以「认真、专业、友善」为社区文化。创立前两年多实行邀请制，2013 年向公众开放注册，2021 年 3 月在纽交所上市。招股书自述：内容质量依赖 TopicRank 算法对内容与用户的评估、赞同机制与社区文化共同维持。"
    citations: [1, 2]
  audience:
    text: "平台两侧分别是内容消费者与内容创作者：截至 2020 年末，累计内容创作者 4310 万，累计问答 3.15 亿条；用户以年轻人为主（招股书口径：78.7% 在 30 岁以下）。最早的 200 位种子用户为企业家与各领域专业人士，为社区定下专业基调。"
    citations: [1, 2]
  scenario:
    text: "普通用户主要通过推荐信息流、热榜与搜索消费内容；创作者通过撰写回答获得赞同、关注与流量。随着产品改版，「推荐」取代「关注」成为默认分发方式，一条回答能否被看到，主要取决于话题热度与点赞表现。"
    citations: [4, 1]
  features:
    text: "核心功能：推荐信息流、热榜、赞同/反对机制。商业化产品沿时间线铺开：2016 年上线在线广告，2019 年推出盐选会员，2020 年正式推出商业内容解决方案（为品牌定制问答式内容）；创作者侧有海盐计划、芝士平台等激励与变现工具。"
    citations: [1, 3, 5]
  status:
    text: "上市后用户规模冲高：2021 年第三季度 MAU 首次破亿（1.012 亿，同比增长 40.1%），但同期营销费用增速远超用户增速（2021 年前三季营销支出分别同比增长 176.4%、202.0%、70.6%）；「内容水化」「软广变多」的抱怨长期存在。2023 年第三季度 MAU 达 1.105 亿，一年后（2024 年第三季度）降至 8110 万；创始人周源在财报电话会上解释：公司优化了投放费用，低活跃用户在持续减少，高活跃用户在增加。"
    citations: [2, 4, 3]
