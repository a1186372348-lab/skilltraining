main_question: "请你分析：知乎这轮月活下滑背后的根因链条是什么——哪些只是表层现象，哪一层才是产品经理真正要回答的根本问题？"
ability_tags:
  - 根因分析
  - 用户理解
  - 指标与验证
difficulty: 基础
kind: baseline
domain: "内容/社交"
rubric:
  dimensions:
    根因分析:
      - "把「MAU 下滑」拆成可分析的结构（新客获取、留存、用户结构），指出下滑主要来自哪一环，而非笼统归因「知乎不行了」。"
      - "区分表层解释（公司主动缩减投放、外部环境变化）与深层根因（增长长期依赖营销买量、分发机制向流量话题倾斜、商业化内容稀释体验），并说明区分依据。"
      - "建立有事实支撑的因果链：分发与激励机制变化 → 创作者与内容供给变化 → 老用户受损、新用户低忠诚 → 投放收紧后增长原形毕露。"
      - "对「主动挤水分」的官方说法保持检验意识：既承认其合理部分，也追问大量「低活跃用户」当初从何而来。"
    用户理解:
      - "区分不同用户群体的不同处境：被投放吸引来的低活跃用户、抱怨「水化」的老用户、流失中的专业创作者，而非笼统谈论「用户」。"
      - "指出新用户的娱乐化内容需求与老用户的专业内容期待之间的错位，以及默认推荐分发只能主要服务一方的结构性矛盾。"
      - "理解创作者的行为逻辑：当流量与收益向热点话题和商业内容倾斜时，专业创作者减少产出是理性选择，而非「情怀流失」。"
    指标与验证:
      - "指出单一 MAU 指标的局限：MAU 增长不等于社区健康，需要配合留存、活跃用户结构、创作者产出等指标判断。"
      - "把「内容水化」这类主观抱怨转化为可观察指标（如专业创作者月活与产出变化、推荐内容负反馈、搜索与关注页使用占比等）。"
      - "给出检验「主动优化说」真伪的对照设计：若为主动优化，高活跃用户时长、留存、付费等核心指标应同步企稳。"
  forbidden_leaks:
    - "「营销买量换增长、投放一停就回落」的现成结论"
    - "「推荐/热榜分发挤压关注关系、流量向热点话题倾斜」的机制答案"
    - "「创作者收益对比劣势导致大V流失」的直接点破"
    - "「MAU 增长与社区健康背离」的指标结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目给了两个并存的事实：MAU 一度冲到 1.1 亿，「水化」的抱怨也从未停过。动笔前，你会先把「下滑」拆成哪几个可以分开验证的部分——是新用户变少了、老用户留不住了，还是别的问题？"
  - level: 2
    stage: 视角补充
    question: "请分别代入三种人：2021 年被广告投放吸引来的新用户、用了八年知乎、最近越来越常刷到娱乐八卦的老用户、写了十年专业回答的答主。同一次「月活下滑」，在他们各自身上对应什么不同的故事？"
  - level: 3
    stage: 反例/风险
    question: "管理层说这是「主动优化」——挤掉低活跃用户的水分，留下高活跃用户。如果这个说法完全成立，我们应该能同时观察到哪些其他现象？反过来，出现什么证据会让你怀疑这不全是主动选择？"
  - level: 4
    stage: 取舍权衡
    question: "假设你是社区业务负责人，手头只有一笔预算：一边是把「水化」压下去的内容治理（可能损失流量与商业收入），一边是继续拉新把 MAU 数字稳住。你会先验证哪几个事实，再决定押哪一边？"
  - level: 5
    stage: 验证方式
    question: "半年后你如何判断自己的根因判断是对的？你会盯哪几组数——它们能否区分「水分挤完了、社区在恢复健康」和「基本盘在继续流失」这两种完全不同的局面？"
