uncertainty:
  - 机构公告、项目文档和同期报道不代表每位社区成员的意见；效果与功能范围需看具体站点和用户。
  - 2022 年试点与计划不能当作 2023 年所有站点均已完成部署的证明。
  - 禁止泄露点的编辑口径：限制导师在用户完成判断前代写整套答案，不限制题面提供必要机制事实和正常资料，也不要求用户采用参考答案的具体词语、排序或方案。
