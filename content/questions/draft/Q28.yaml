main_question: 把讨论时点放在 2023 年桌面改版公告时。请为读者和志愿编辑者分别写一段简短说明，解释为什么改、哪些变化可能影响他们、如何了解或反馈；再给出一项上线沟通方案。请说明未确认的信息与可能的分歧，不要假设所有人反对或支持。
ability_tags:
  - 产品表达
  - 用户理解
  - 方案设计
difficulty: 中等
domain: 内容/社交
kind: daily
rubric:
  dimensions:
    产品表达:
      - 以不同角色能理解的语言解释目标和至少一项具体变化，不把设计意图写成已证明的普遍收益。
      - 分别说明读者和编辑者关心的信息、可能受影响的操作及了解或反馈途径。
      - 对未经材料确认的可用范围、选项或后果明确保留，沟通口径一致。
      - 用简短示例实际展示可发送的表达，而不是只说应加强沟通。
    用户理解:
      - 区分偶尔阅读者和频繁编辑者可能的任务、熟悉成本及不同诉求。
      - 考虑既有使用习惯和不同站点的差异，不以机构宣传推断所有人的感受。
      - 提出收集不同角色反馈和验证理解的办法，避免只听取最活跃群体。
    方案设计:
      - 提出包含沟通触点及反馈由谁、何时处理的可执行安排。
      - 说明如何从读者或编辑者的反馈判断沟通是否清楚。
      - 针对可能找不到入口或不理解变化的情况，给出一项提示或反馈处理办法。
  forbidden_leaks:
    - 针对两类角色的完整公告文案与沟通反馈流程。
    - 全体社区一致赞同或反对的无证据结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 一位偶尔查资料的读者和一位每天编辑条目的志愿者，会先问什么？
  - level: 2
    stage: 视角补充
    question: 目录与导航改变具体影响哪些动作，材料又有哪些尚未证实？
  - level: 3
    stage: 反例与风险
    question: 如何避免把团队希望改善体验说成每个人都已经受益？
  - level: 4
    stage: 取舍权衡
    question: 除公告外，还可以在哪里让读者和编辑者获得帮助或反馈？
  - level: 5
    stage: 验证方式
    question: 写出两段短文，并说明收集反馈后由谁在什么时点处理。
