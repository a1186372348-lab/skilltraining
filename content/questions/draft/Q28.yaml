id: Q28
title: Wikipedia 桌面改版：如何向读者与志愿者解释变更
case_title: 同一项界面调整，怎样让不同使用者知道变化与参与方式
case_background:
  product:
    text: Wikipedia 是由志愿者参与编辑的在线百科；2023 年 1 月的报道介绍了桌面界面更新。
    citations:
      - 1
      - 2
  audience:
    text: 桌面界面需要同时服务阅读内容的读者和创建、维护内容的志愿编辑者。
    citations:
      - 2
      - 3
  scenario:
    text: 桌面改进项目经历多年设计与社区参与，2022 年项目团队介绍过向不同语言站点逐步部署的计划。
    citations:
      - 3
      - 4
  features:
    text: 同期材料介绍更新后的目录、搜索和导航，以及登录用户滚动时可见的固定页头等功能。
    citations:
      - 1
      - 2
  status:
    text: 团队将提高可用性作为改版目标，并介绍了用户测试和社区参与；材料不证明每一位读者或编辑者都赞同改版。
    citations:
      - 3
      - 4
