# B6 ｜ 谁在用拼好饭，他们真正在买什么
# 批次：T33 第一批基线测评题（B6，主测维度：用户理解）｜ 状态：草案，待产品负责人评审后上架
id: B6
title: "谁在用「拼好饭」，他们真正在买什么"
case_title: "十元外卖：一笔心照不宣的交换"
case_background:
  product:
    text: "「拼好饭」是美团外卖内的低价拼单频道：以商品组合（而非店铺）为单位展示爆品套餐，主打 15 元以下、免配送费的餐品，口号「9.9 元吃好，0 配送费」。美团 2020 年开始试点，最初定位为面向下沉市场的低价外卖产品，2022 年起加大推广力度，此后逐步拓展至一二线城市；2023 年 4 月，美团在外卖事业部下单独设立拼好饭业务部。"
    citations: [2, 3]
  audience:
    text: "公开数据显示，截至 2024 年 8 月已有超 1.2 亿用户使用过拼好饭，接近美团外卖整体用户的四分之一（美团外卖年活跃用户近 5 亿）。骑手与记者的观察显示，它吸引了大量价格敏感型用户——大学、写字楼附近是订单密集区域，学生、白领、蓝领皆有。在外卖用户增长见顶的背景下（美团管理层 2024 年 9 月公开表示「城镇人口到 8 亿之后涨不动了，没有什么新用户」），拼好饭承担着吸引价格敏感型用户、突破增长天花板的任务。"
    citations: [4, 1, 3]
  scenario:
    text: "使用场景高度集中在「确定性的一餐」：工作日午晚餐时段，办公楼、学校等用餐需求密集区域订单最多；用户可以生成拼团链接邀请他人拼单，许多人自发组成拼团群，到了饭点就能在群里看到拼单链接。价格上，以北京为例常见主食套餐在 10~15 元区间（低线城市更低），新人可享 6.9 元首单优惠；对比之下，媒体按财报数据推算，美团外卖 2021 年四季度平均客单价约 48 元。"
    citations: [2, 3]
  features:
    text: "以商品而非店铺为单位展示爆品套餐，首页流量按订单转化率分发；拼单合并配送——平台将分散的小单合并成大单以降低履约成本，由畅跑骑手顺路集中配送；商家侧为「报价制」：商家报出一个覆盖成本、确定利润的低价，平台加上服务费和配送费后展示给用户，商家收入固定。对商家而言门槛低、规则简单、降价就能起量，但利润薄，还要承担差评与「培养顾客低价心智、分流主站单」的风险。"
    citations: [3, 2, 4]
  status:
    text: "增长迅猛但官方披露转低调：2024 年一季度财报首次提及拼好饭「日订单量峰值创下新高」（据晚点报道，当时日均订单量接近 500 万单，约占美团餐饮外卖日均单量的 10%），二季度单日订单量峰值突破 800 万单；2024 年三季报起，美团不再单独披露拼好饭数据。2024 年报称美团通过拼好饭帮助大量餐饮商家提升销售额、吸引新客；同期媒体报道爆品补贴从 6 块多降至 4 块多，叠加食材价格上涨，商家利润承压。"
    citations: [1, 2, 5, 4]
