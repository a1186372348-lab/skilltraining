rubric:
  dimensions:
    用户理解:
      - "给出具体可感的用户分层（如月底预算见底的学生、午休紧张的白领、只求吃饱的蓝领），并说明各自的处境与约束条件，而非笼统归为「价格敏感人群」。"
      - "还原典型使用场景链（如工作日午餐、拼团群拼单、到点集中下单），指出场景中的时间、预算、社交等约束如何塑造行为。"
      - "解释「一边吐槽（配送慢、分量缩水）一边复购」的行为矛盾：用户接受了哪些交换条件、底线在哪里，而非简单归因于「穷」。"
      - "识别供给侧角色（商家、骑手）在该模式中的处境与动机，说明用户价值与平台、商家、骑手利益之间的张力。"
    根因分析:
      - "把「便宜」拆成更细的动机结构（如绝对低价、确定性、决策成本极低、集体拼单消解心理负担），并说明各层动机对应的用户与场景。"
      - "区分表面动机（省钱）与深层动机（预算约束下的确定性与效率），并用案例中的行为证据（吐槽仍复购、拼团群、午高峰集中）支撑推理，而非纯观点推演。"
      - "解释增长为什么发生在当下（性价比消费趋势、外卖用户见顶、餐饮供给内卷），体现时序与结构意识，而非单一归因。"
    产品价值判断:
      - "对「拼好饭为用户创造的真实价值」下明确结论（如用可预期的低价解决刚需一餐），判据清晰，而非停留在「便宜好」。"
      - "同时评估用户价值与三方代价（商家利润、骑手收入、品质风险），指出价值分配中谁受益、谁承压。"
      - "给出该模式的可持续边界条件（补贴退坡、品质底线、低价心智反噬主站），判断什么情况下用户价值会转为伤害。"
  forbidden_leaks:
    - "「确定性 / 决策成本为零 / 不丢人的性价比」的动机拆解结论"
    - "「用户让渡时间、选择范围与品质上限换取低价」的交换框架"
    - "「一边吐槽一边复购」矛盾的现成解释"
    - "「这顿饭是刚需、高频、不愿付溢价」的用户共性结论"
    - "补贴退坡后模式可持续性的现成判断"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「他们真正在买的是什么」——动笔前先想：你会用什么方法区分「表面动机」和「真实动机」？哪些可观察的行为线索（下单时段、地点、拼单动作、复购频率）能帮你推断？"
  - level: 2
    stage: 视角补充
    question: "请代入三个人：午休只有一小时的白领、月底生活费见底的大学生、给拼好饭供餐的夫妻店老板——同一单 12 元的拼好饭，在他们各自的一天里分别解决了什么，又牺牲了什么？"
  - level: 3
    stage: 反例/风险
    question: "如果用户买的只是「便宜」，那谁更便宜用户就该流走——但现实是用户一边在社交网络吐槽配送慢、分量缩水，一边持续复购，订单峰值还在涨。单用「便宜」解释得通吗？这个矛盾说明还缺哪块拼图？"
  - level: 4
    stage: 取舍权衡
    question: "站在用户角度算一笔账：拼好饭省下的钱，是用什么换来的——等待时间、选择范围、品质确定性，还是别的？什么样的人觉得这笔交换划算、什么样的人不觉得？这条分界线画在哪里？"
  - level: 5
    stage: 验证方式
    question: "如果让你验证「用户到底为什么复购拼好饭」，你会设计什么样的用户研究、或看哪几组行为数据？什么证据能把「纯粹图便宜」和「在为确定性与效率投票」区分开？"
