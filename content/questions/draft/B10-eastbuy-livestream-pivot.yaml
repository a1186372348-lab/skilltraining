# 批次 2 校订：Rubric 产品价值判断立场条目补充——「值得小规模试点、暂不值得全面投入」的分阶段立场同样有效、可得高分。
id: B10
title: "新东方转型做「东方甄选」，当初值不值得"
case_title: "双减之后，从讲台走向直播间"
domain: 电商
case_background:
  product:
    text: "东方甄选——教培巨头新东方旗下的直播电商业务。2021 年 7 月「双减」政策落地，要求学科类校外培训机构统一登记为非营利性机构、一律不得上市融资、严禁资本化运作，新东方核心 K12 业务急刹：当年市值跌去 90%，营业收入减少 80%，并辞退了 6 万员工；11 月，新东方开始退租教学点，并把崭新的课桌椅捐给乡村学校，已捐献近八万套。"
    citations: [1, 2, 4]
  audience:
    text: "供给侧是缺品牌、缺销售渠道的农产品商家与农民——俞敏洪将方向定位为「助农直播」，宣布成立大型农业平台帮助农产品销售、支持乡村振兴；消费者侧需求尚待培养——当时有调研显示，有意愿在网络平台购买农产品的消费者约占 43%；公司内部，双减后数万名老师需要转型出口——主播招募令发布后 800 多位老师自愿报名，最终 400 多人完成培训、124 人签约入驻抖音。"
    citations: [7, 8]
  scenario:
    text: "2021 年 11 月 7 日，俞敏洪在直播中宣布新东方将成立大型农业平台、进入助农直播赛道；12 月 28 日东方甄选成立并在抖音首播，俞敏洪亲自上阵，首秀成交额近 500 万元。摆在俞敏洪面前的处境是：学科类培训被叫停后，上市公司必须为几万员工和股东找到新业务。"
    citations: [7, 8, 2, 4]
  features:
    text: "首播时的可见打法：直播间设在抖音，上架生鲜蔬果、粮油干货、乳品零食等数十种农产品；俞敏洪亲自带货，边试吃边讲解地理文化知识，被网友称为「教科书式带货」；公司宣布主播团队由转型的新东方老师组成，首批带领百名老师入驻抖音。俞敏洪在首播中说：「我们带的不见得是最便宜的农产品品类，却一定是最好的农产品」「尽管农产品直播带货几乎是所有品类中利润最低的，但我们会坚持做下去」。"
    citations: [8]
  status:
    text: "截至 2021 年末的赛道状态：直播电商已是万亿级市场——网经社报告预计 2021 年交易规模达 23500 亿元（同比增长 82.87%）、用户规模达 4.3 亿人，但增速较前几年放缓；行业正经历合规风暴——11 月主播雪梨因偷逃税被罚，12 月 20 日头部主播薇娅被追缴税款、加收滞纳金并处罚款共计 13.41 亿元，全平台账号被封；农产品直播则是公认难做的品类——非标品、损耗高、难规模化，阿里、拼多多等平台虽有助农布局，但尚未出现出圈的农产品头部主播。"
    citations: [10, 9, 7]
