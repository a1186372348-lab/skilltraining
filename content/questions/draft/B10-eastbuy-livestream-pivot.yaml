# B10 ｜ 新东方转型做「东方甄选」，值不值得
# 批次：T33 基线测评题（B10）｜ 主测维度：产品价值判断 ｜ 状态：草案，待产品负责人评审后上架
id: B10
title: "新东方转型做「东方甄选」，值不值得"
case_title: "从教室到直播间的绝地转型"
domain: 电商
case_background:
  product:
    text: "东方甄选——教培巨头新东方旗下的直播电商业务。2021 年 7 月「双减」政策落地，要求学科类校外培训机构统一登记为非营利性机构、一律不得上市融资、严禁资本化运作，新东方核心 K12 业务急刹：当年市值跌去 90%，营业收入减少 80%，并辞退了 6 万员工。"
    citations: [1, 2]
  audience:
    text: "消费者以受教育程度相对较高的家庭为主，有网友留言「在知识付费的直播间，我买了 N 袋大米」；供给侧连接农产品商家与农民，俞敏洪将方向定位为「助农直播」；同时也为离开教培岗位的老师提供了转型出口——前高中英语老师董宇辉正是其中代表。"
    citations: [2, 3, 4]
  scenario:
    text: "2021 年 11 月，俞敏洪首次直播带货并宣布新东方转型直播带货、进入助农直播赛道；12 月 28 日东方甄选成立并首播，俞敏洪亲自上阵，首秀成交额近 500 万元。但此后两个月 26 场直播累计销售额仅 454.76 万元，被主播自嘲为「脚底板直播间」。转机出现在 2022 年 6 月：董宇辉边教英语边卖牛排的双语直播登上热搜，6 月 10 日直播间 GMV 突破千万元。"
    citations: [2, 4]
  features:
    text: "差异化打法是「双语知识带货」：主播用中英文讲解商品，穿插诗词歌赋与知识延伸；选品以农产品为主，取消了传统的坑位费模式，佣金也普遍低于其他头部主播；爆火后开始自建供应链、发展「东方甄选」自营产品。"
    citations: [2, 3]
  status:
    text: "爆火后数据陡增：2022 年 6 月 11 日至 17 日的 8 场直播场均销售额达 2963 万元，新东方在线股价 12 个交易日累计上涨 576%。2023 财年（2022 年 6 月至 2023 年 5 月）东方甄选营业总收入 45 亿元、净利润 9.71 亿元——上一财年还亏损 5.34 亿元。但 2024 年 7 月头部主播董宇辉离职单飞，此后流量与业绩回落：2025 财年上半年（2024 年 6 至 11 月）营收同比下跌 9.32%，税后亏损 9679.9 万元。"
    citations: [3, 5]
