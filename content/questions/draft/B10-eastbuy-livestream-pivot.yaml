# 初答后披露（供 AI 总监追问引用）：决策时点之后的后续结果，不进案例背景
reveal_after_first_answer:
  text: "后续结果：首播后的两个月里，东方甄选 26 场直播累计销售额仅 454.76 万元，被自嘲为「脚底板直播间」；转机出现在 2022 年 6 月——原高中英语老师董宇辉边教英语边卖牛排的双语直播登上热搜，6 月 10 日直播间 GMV 突破千万元，6 月 11 日至 17 日的 8 场直播场均销售额达 2963 万元，新东方在线股价 12 个交易日累计上涨 576%。2023 财年（2022 年 6 月至 2023 年 5 月），东方甄选公司总营收约 45.1 亿元，其中自营产品及直播电商分部收入约 38.8 亿元（其余来自大学教育等业务），全年 GMV 达 100 亿元，净利润 9.71 亿元——上一财年还亏损 5.34 亿元。2024 年 7 月，头部主播董宇辉离职单飞，此后流量与业绩回落：2025 财年上半年（2024 年 6 至 11 月）营收同比下跌 9.32%，税后亏损 9679.9 万元。"
  citations: [2, 3, 4, 5, 6]
main_question: "时间是 2021 年 12 月：「双减」落地，新东方的学科类培训主业被迫急刹，俞敏洪选择闯进完全陌生的农产品直播电商。请你只依据当时可得的信息回答：这个转型方向当初值不值得做——它为谁创造了什么价值、价值成立依赖哪些条件、当时最大的不确定性是什么？更进一步，请把你的判断提炼成可迁移的标准：当任何一家公司的主业遭遇不可逆冲击、被迫「绝地转型」时，你会用哪几条标准判断新方向值不值得投入？如果你认为当时的信息不足以给出确定结论，请明说缺口在哪、还需要什么证据。"
ability_tags:
  - 产品价值判断
  - 用户理解
  - 根因分析
difficulty: 基础
kind: baseline
rubric:
  dimensions:
    产品价值判断:
      - "立场明确且判据落在决策时点：给出「值得做／不值得做／有条件成立」的明确立场，判据具体可检验（如政策约束下的可选空间、新东方的剩余资源与赛道需求的匹配、失败代价是否可控），且所依据的事实限定在决策时点可得信息内，不借后续结果倒推；「值得小规模试点、暂不值得全面投入」的分阶段立场同样是明确、有效的价值判断，可以得高分，评分不预设二元立场。"
      - "多方价值结构：能分别说明价值对谁成立——消费者得到什么、农产品供给侧得到什么、公司与转型员工得到什么，并指出哪一方的价值最确定、哪一方最脆弱，而非「既助农又有情怀」的两头好话。"
      - "成立条件与反转条件：说明判断依赖的关键条件（如老师的表达能力能否转化为带货转化、低毛利高损耗的品类约束能否被消化、首播人气能否沉淀为持续购买），并指出哪些条件不成立时结论反转——「值得，但成立条件是 X」优于无条件肯定或否定。"
      - "区分可判断与不可控成分：指出该决策中哪些是决策时点可以判断的（政策窗口、赛道空位、资源禀赋），哪些在决策时点无法预判（能否跑出受欢迎的直播形态、能否长出头部主播），并据此说明「决策质量」与「结果好坏」应分开评价。"
      - "可迁移标准：给出可迁移的「绝地转型」判断标准（如是否存在可迁移的核心资产、新方向是结构性空位还是正面红海、失败代价是否可承受、是否留有退路），并能应用到另一个转型假想上检验其普适性。"
    用户理解:
      - "能还原决策时点各侧用户的处境与动机假设：消费者为什么会在直播间买农产品（品质信任、助农认同、内容体验等当时可知的动机），并说明哪些是案例事实、哪些是自己的推测。"
      - "能理解供给侧用户：农产品商家与农民缺品牌、缺渠道的处境，「助农直播」定位对他们的实际价值，以及定位与实际履约之间可能的落差。"
      - "能把转型教师当作关键相关方：数万老师的转型压力、招募数据（800 余人报名、124 人签约）说明了什么，教师的能力禀赋与主播岗位要求之间的匹配与落差。"
      - "能区分首播近 500 万成交额中「为俞敏洪其人买单」与「为业务模式买单」的成分，不把它直接当作需求成立的证据。"
    根因分析:
      - "能基于决策时点信息分层分析「为什么是农产品直播」：把「不得不转」（政策倒逼、可选空间受限）与「为什么选这个方向」（赛道空位、资源禀赋）分开讨论，而非混为一谈。"
      - "能分析新东方选择该赛道的资源逻辑：品牌声誉、教师队伍、俞敏洪个人 IP 各自能迁移什么、不能迁移什么，并用案例事实支撑而非断言。"
      - "能指出决策时点无法回答的关键问题（差异化形态能否跑出、供应链能否支撑、复购能否成立），说明需要什么证据检验——合理承认未知是合法高分路径，但须先充分利用已有信息，再说明具体缺口及什么证据会改变判断。"
  forbidden_leaks:
    - "「老师的表达能力与知识储备可以迁移为主播能力」的能力复用结论"
    - "「首播近 500 万主要是俞敏洪个人号召力兑现、不等于模式跑通」的直接点破"
    - "「绝地转型」判断标准的现成清单（可迁移资产／结构性空位／代价可控／留有退路等条目）"
    - "「农产品低毛利高损耗，热度退潮后拼的是供应链而非流量」的现成结论"
    - "首播后 26 场仅 454.76 万元、2022 年 6 月双语直播爆火、2023 财年业绩与董宇辉离职后回落等决策时点之后的后续结果（仅可在初答后揭示）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目把时间锁在 2021 年 12 月——动笔前先想清楚：判断「当初值不值得做」，你只能使用当时可得的信息。先列出你必须回答的两三个子问题（比如：价值对谁成立？凭什么轮到新东方？最坏情况下代价是什么？），并写下你打算用什么判据下结论。"
  - level: 2
    stage: 视角补充
    question: "分别代入四类人：可能在直播间下单的消费者、想把农产品卖出好价钱的农户、刚走下讲台报名当主播的新东方老师、要为上市公司找出路的俞敏洪。这个方向对每一方分别意味着什么价值？哪一方的价值最确定、哪一方最脆弱？少了其中任何一方，这件事还成立吗？"
  - level: 3
    stage: 成立条件
    question: "如果你倾向于「值得做」，请再追问一层：这个结论依赖哪些当时还无法验证的条件？逐条列出来——比如某种直播形态能否跑出来、品类的低毛利高损耗能否被消化、首播的人气能否变成持续购买。哪些条件一旦不成立，你的结论就要反转？"
  - level: 4
    stage: 不确定性边界
    question: "把这个决策里的因素分成两堆：哪些是 2021 年 12 月就能判断的（政策、赛道、资源），哪些当时只能赌、无法预判？如果两年后结果被证明是成功或失败，你会把多少记在「决策质量」上、多少记在「运气」上？分界线画在哪里？"
  - level: 5
    stage: 标准迁移
    question: "把你在本题实际用到的判据提炼成两三条通用标准：当任何一家公司主业遭遇不可逆冲击、被迫转型时，用它们判断新方向值不值得投入。然后套到一个假想案例上检验——比如一家线下连锁书店巨头被迫转型做知识付费——你的标准还成立吗？哪一条会失效？"
