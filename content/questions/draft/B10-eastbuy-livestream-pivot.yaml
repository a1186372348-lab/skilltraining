  - "「市值跌去 90%、营业收入减少 80%、辞退 6 万员工」为新华网转述的 2021 全年口径（俞敏洪 2022 年 1 月公开总结），反映的是决策时点已发生的既成事实；决策时点公开可见的收缩信号（股价暴跌超九成、退租教学点、捐赠近八万套课桌椅）另见界面新闻与 21 经济网当时报道。"
  - "「2023 财年公司总营收约 45.1 亿元、自营产品及直播电商分部收入约 38.8 亿元、净利润 9.71 亿元、上一财年亏损 5.34 亿元、全年 GMV 达 100 亿元」已对照港交所披露的东方甄选 2023 财年年度报告原文核实（年报管理层讨论章节将两个收入口径分别四舍五入表述为 45 亿元与 39 亿元）。注意区分：45.1 亿元是公司总营收（含大学教育等业务），38.8 亿元才是自营产品及直播电商分部收入——媒体此前笼统转述的「营收 45 亿」为总营收口径，评估电商方向时不得混用。"
  - "董宇辉 2024 年 7 月离职后，「与辉同行」与东方甄选为相互独立主体；reveal 仅采用东方甄选上市公司口径数据，不混入「与辉同行」数据。"
  - "案例背景与五份资料严格限定在 2021 年 12 月决策时点可得信息；首播后的全部结果（26 场 454.76 万元、2022 年 6 月爆火、2023 财年业绩、董宇辉离职与回落）仅放入 reveal_after_first_answer，不进案例背景与资料。"
