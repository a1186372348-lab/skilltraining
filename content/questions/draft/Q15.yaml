id: Q15
title: Duolingo 连续学习中断：如何拆解用户流失的可能原因
case_title: 连续记录断了，是否意味着学习已经中断
case_background:
  product:
    text: Duolingo 通过连续天数记录学习活动，并提供可在错过练习时保护连续记录的 Streak Freeze。
    citations:
      - 1
  audience:
    text: 连续记录面向使用 Duolingo 进行学习的人；官方文章讨论了刚开始坚持与已保持较长记录的不同学习者。
    citations:
      - 1
  scenario:
    text: Duolingo 一篇产品文章回顾：团队分析连续两天使用产品的学习者时，发现其中有人没有保持连续记录。
    citations:
      - 2
  features:
    text: 该文章说明，过去需要达到每日目标才能延续记录；团队后来测试将延续条件改为完成一节课。另一篇技术文章解释了系统故障时修复受影响记录的做法。
    citations:
      - 2
      - 3
  status:
    text: 官方报道了对连续记录规则进行实验与调整；这些公司文章未提供本题所需的完整用户流失原因分布。
    citations:
      - 2
      - 5
