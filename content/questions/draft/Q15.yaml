main_question: 假设你负责理解学习者为什么中断 Duolingo 内的练习。连续记录中断与实际停止应用内练习可能并不一致。请先界定要解释的现象，再提出并比较至少两种可能原因：现有材料各支持到哪里，还需要哪些证据才能区分？证据不足时，可以只给优先调查顺序，不必排定主因。最后提出一项优先行动及验证方式；不要把应用内不活跃直接等同于停止学习语言。
ability_tags:
  - 根因分析
  - 用户理解
  - 指标与验证
difficulty: 挑战
domain: 教育
kind: daily
rubric:
  dimensions:
    根因分析:
      - 区分连续记录中断、停止应用内练习与是否仍在其他地方学习，界定本题要解释的现象。
      - 提出可区分的原因假设，并说明各自需要什么证据，不限于规则、生活安排、学习体验或技术故障。
      - 利用官方文章中连续使用但未保持记录的观察，说明其支持什么、不支持什么。
      - 在证据允许时提出相对判断；证据不足时说明优先调查什么、为什么及什么发现会改变判断，不强制给出原因贡献排序。
    用户理解:
      - 结合提出的原因，说明学习者可能遇到的具体学习情境或约束，不要求固定用户分组。
      - 区分冻结记录、未达目标和完全未打开产品等可能行为，不把每次跳过都归因于失去动力。
      - 指出至少一种用户处境或行为含义需要向学习者核实，不将单一故事当成普遍事实。
    指标与验证:
      - 为需要观察的应用内练习或记录事件提出可操作口径，说明观察对象和时间范围。
      - 说明怎样用可获得的分析、访谈或实验区分提出的原因，并指出证据局限。
      - 为优先行动提出能观察结果的方式，说明什么发现会改变原判断。
  forbidden_leaks:
    - 规则与真实练习分离、按原因分群并选择实验的完整诊断链。
    - 把一种解释写成全部学习者流失的确定原因。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 先定义「记录中断」与「没有在应用内练习」，它们一定是同一事件吗？
  - level: 2
    stage: 视角补充
    question: 临时忙碌的学习者与觉得课程不合适的学习者，可能留下相同记录吗？
  - level: 3
    stage: 反例与风险
    question: 有人连续使用两天却没有保住记录，哪些规则或技术解释应先排查？
  - level: 4
    stage: 取舍权衡
    question: 不知道各原因占比时，你依据什么决定先修规则、调整内容还是研究用户？
  - level: 5
    stage: 验证方式
    question: 为两种解释分别写一个可观察证据，并说明什么结果会让你改判。
