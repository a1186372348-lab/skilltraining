# 初答后披露（供 AI 总监追问引用）：决策时点（2019 年 5 月）之后的规则演进与后续结果，不进案例背景
reveal_after_first_answer:
  text: "2019 年 5 月版之后的演进与现状：候补规则此后多轮放宽——目前每个候补订单最多可添加 19 名乘车人、支持选择任意 3 个乘车日期、合计不超过 60 个「车次+日期」组合；候补兑现的票源也不止退票与改签——还包括铁路部门加挂车厢、扩编重联增加的运力，部分长途列车在票额动态发售中裂解产生的新票额，以及增开列车带来的新票额；铁路部门表示，若候补需求旺盛，会在有条件的情况下通过加挂车厢或增开列车增加运力。据 12306 大数据，目前候补兑现成功率在 70% 以上。但高峰期供需结构性矛盾仍在：部分时段、部分区段的购票需求可达铁路最大运输能力的 2 倍以上（如 2026 年 4 月 30 日 19 时至 23 时北京至郑州方向需求为有效运力的 5 倍以上），开售「秒光」与开售即候补的现象依然存在。2024 年有评论认为，候补购票的扩大「进一步堵塞了互联网黄牛的抢票路径」。"
  citations: [8, 4]
main_question: "请回到 2019 年 5 月候补购票推广到全部旅客列车之时，以案例所载的 2019 年 5 月版规则为评价对象（勿与后续版本混用），完成两部分任务。第一部分·评价既有机制：这套候补机制对付的真问题是什么？哪些机制设计是关键、各自解决什么问题？它的能力边界在哪里——能保证什么、不能保证什么？第二部分·受约束的改进任务：在不改变「免费、按订单生效时间先后排队、不承诺必然兑现」三条底线的前提下，选择一个旅客仍然真实存在的困难，设计一项改进——说明它的运作流程、最可能遇到的关键异常及处理方式、它带来的代价由谁承担。"
ability_tags:
  - 方案设计
  - 产品价值判断
  - 用户理解
difficulty: 基础
kind: baseline
domain: 出行
rubric:
  dimensions:
    方案设计:
      - "机制拆解与评价：把既有方案拆成具体规则（预付最高票款、按订单生效时间排序兑现、截止未兑现自动全额退款、订单与组合数量限制、人证一致性核验），逐条指出它对应解决什么问题，而非笼统夸「官方更靠谱」。"
      - "问题与机制的匹配关系：指出候补改写的是稀缺票源的分配规则（从「拼手速、拼软件」到「按登记先后排队」），并说明这套排队成立依赖的前提（官方独占票源信息与售票入口、旅客对规则公平性的信任）。"
      - "准确的能力边界：说清候补本身不能保证创造足够运力（按候补数据加开列车以「条件允许」为前提）、也不保证兑现成功，供给绝对不足的热门线路上部分候补必然落空；表述不得跨版本错配——既不能说成「只再分配退改票、与供给完全无关」，也不能夸大成「候补能消灭票荒」。"
      - "改进任务的流程完整度：所选改进对准一个真实的旅客困难，给出可运作的流程（谁触发、系统如何处理、旅客看到什么）；方案只有方向没有机制（「优化体验」「加强透明」式口号）不得分。"
      - "改进任务的异常与代价：识别至少一个关键异常并给出处理方式（如被滥用刷需求、与既有规则冲突、信息透明带来的新行为扭曲），明确改进带来的代价及承担者（开发成本、规则复杂度、对部分旅客的新不公平），并说明代价是否值得。改进任务的流程、异常与代价必须实际影响主测评分等级：只评价既有机制而不做改进设计、或改进只写「先做个实验」式口号，不能获得方案设计高分。改进方案自身的规则须内部自洽：不得破坏题目底线（按登记先后、实名核验、不创造额外运力），不得引入新的公平性漏洞或激励扭曲（例如新增需求追溯取得旧订单的排队优先级）；发现此类风险时应说明处理规则。"
    产品价值判断:
      - "同时站在旅客价值与公共价值两个立场评价「免费、不加价」的选择，并与第三方抢票收费做对照，对照落到具体机制差异（官方免费、按登记先后排队分配；第三方收费购买的是代抢成功率，并非官方候补的排队优先权）而非口号；不得把第三方「加速包」表述为购买官方排队优先权。"
      - "与至少一种替代分配方案（价高者得、抽签、维持抢票竞争）做对比，说明「免费＋按登记先后」放弃了什么、守住了什么——接受或质疑该选择均可，结论须由自己的论证支撑。"
      - "为方案算账：既有机制的代价（预付款占用、排队不透明带来的焦虑、部分候补落空）与自己改进设计的新增代价都纳入考量，并判断代价是否可接受。"
    用户理解:
      - "还原旅客在「秒光」下的真实困难：不是不能等，而是不确定「等有没有用」、不甘心输给软件，而非只说「旅客想买票」。"
      - "区分不同旅客（可提前规划的、临时出行的、不熟悉线上操作的）在同一机制下的不同遭遇；改进任务选定的困难须落到具体人群的具体处境。"
      - "改进设计明确受益与受损对象：说清它替谁解决了什么、是否把压力转嫁给另一群旅客（如更不会用规则的人），而非宣称「人人受益」。"
  forbidden_leaks:
    - "「抢票之争的本质是稀缺票源分配规则」的直接结论"
    - "「预付款 = 真实性承诺、过滤黄牛占坑」的机制答案"
    - "「候补不能保证创造足够运力、不保证兑现成功」的能力边界结论"
    - "「竞价/抽签为什么不可取」的现成对比结论"
    - "「确定性与公平感是真正交付物」的直接点破"
    - "「公开排队位置/兑现进度」的现成改进方案（改进须由用户自行设计）"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "这道题有两部分：评价既有机制、设计一项改进。动笔前先拆任务——「评价」要答清哪几个子问题（它对付什么问题、每条规则解决什么、什么情况下失灵）？「设计改进」要交付哪几样东西（困难、流程、异常、代价），才不至于写成一句「优化体验」？"
  - level: 2
    stage: 视角补充
    question: "代入两个人：一个连续三年靠抢票软件加价买春运票的人，一个第一次自己买票、开售当天没刷到票的大学生。用上 2019 版候补之后，他们各自的困难解决了多少、还剩什么？剩下的困难里，哪一个值得你为它设计改进？"
  - level: 3
    stage: 机制追问
    question: "挑一条你认为最关键的规则追问到底：预付款为什么按「需求中最高票款」计算、且 30 分钟内必须支付？为什么每人只许 1 个订单、2 个相邻日期、每个日期 2 个组合？如果取消这条限制会发生什么——它挡住的到底是谁？"
  - level: 4
    stage: 边界与失灵
    question: "如果候补这么好用，为什么热门线路依然「开售即候补」、有人候补到截止也没兑现？官方说候补需求数据可帮助「在条件允许的情况下有针对性加开列车」——「条件允许」这四个字，把这套机制的能力边界划在了哪里？"
  - level: 5
    stage: 方案自查
    question: "收敛到你的改进设计：把流程完整走一遍——谁触发、系统怎么处理、旅客看到什么？最可能出问题的异常场景是哪一个、怎么处理？代价是什么、由谁承担——有没有把压力转嫁给另一群更不会用规则的人？"
