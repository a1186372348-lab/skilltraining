# B12 ｜ 12306 候补购票：一套「官方排队」的评价与改进
# 批次：T33 基线测评题（B12）｜ 主测维度：方案设计 ｜ 状态：草案，评审返工重写后待复审
# 返工说明：评审意见「能测机制理解与评价，但对用户自行设计机制的观察不足」——主问题扩展为
# 「评价既有机制 + 受约束改进任务（流程/异常/代价）」两段；评价对象锁定 2019 年 5 月版规则；
# 能力边界事实修正：2018 年试点说明已含「条件允许时按候补数据加开列车」（来源 7），准确边界为
# 「候补本身不能保证创造足够运力、不保证兑现成功」，删去「只再分配退改票、不增加总供给」的绝对化表述；
# 决策时点（2019 年 5 月）之后的规则演进与票源扩展移入 reveal_after_first_answer。
# 批次 2 校订：Rubric 方案设计改进任务条目补充——流程、异常与代价必须实际影响主测评分等级，
# 只评价不改进或「先做个实验」式口号不能获方案设计高分。
id: B12
title: "12306 候补购票：一套「官方排队」的评价与改进"
case_title: "面对抢票软件，12306 自己做了一个「排队系统」"
case_background:
  product:
    text: "铁路 12306——中国铁路官方售票平台：2011 年 6 月上线 12306 网站，2013 年 12 月推出手机客户端。如今它是全球最大的实时票务系统：注册用户累计超 7 亿，高峰日均访问量达 500 亿次量级，每秒钟售出 1000 多张车票。"
    citations: [3, 5]
  audience:
    text: "全体铁路旅客，购票是高峰期的全民刚需：2019 年春运，1 月 4 日全天各种渠道发售车票 1494.2 万张创历史新高，其中网络售票 1282 万张；春运期间 12306 网站售出的车票占总售票量约 84%。"
    citations: [2]
  scenario:
    text: "热门线路车票开售即「秒光」。抢不到票的旅客要么不停刷新「捡漏」，要么求助第三方抢票软件——第三方平台可以同时备选多个日期、车次、席别，预约抢票、开售自动抢，让走官方渠道的旅客反而「输在起跑线」，并向旅客收取「抢票费」「加速包」费用。"
    citations: [2, 4]
  features:
    text: "候补购票的机制设计（2019 年 5 月版规则，本案例评价对象）：无票时旅客可按日期、车次、席别提交候补需求并预付票款（30 分钟内完成支付，按需求中最高票款计算），系统按候补订单生效的时间顺序自动排队，有退票、改签产生的票源时自动兑现并通知旅客；到截止兑现时间仍未兑现的，自动终止并原额退还预付款；功能不收取任何额外费用。该版本规则为每人 1 个候补订单、可选 2 个相邻乘车日期、每个日期 2 个「车次+席别」组合，并需通过人证一致性核验。铁路部门在试点说明中同时表示：候补购票需求的收集分析可帮助其及时掌握旅客实际购票需求、科学安排运力，在条件允许的情况下有针对性加开列车。"
    citations: [1, 3, 7]
  status:
    text: "2018 年 12 月 27 日起，铁路部门在春运能力紧张方向（北京、沪宁杭、广东地区与四川、重庆地区之间）的长途区段试点候补购票，试点期成功率超过 60%；2019 年 5 月 22 日，候补购票服务扩大到所有旅客列车。官方称该功能抢票速度和成功率均优于抢票软件；旅客如遇无票，不必再向第三方平台支付「抢票费」。"
    citations: [2, 3, 6]
