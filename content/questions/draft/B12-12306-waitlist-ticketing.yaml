main_question: "面对抢票软件，12306 没有收旅客一分钱「加速费」，而是做了一套「免费＋预付款＋按生效时间顺序排队」的候补购票。请评价这套方案的设计选择：它对付的真问题是什么、哪些机制设计是关键、它的能力边界在哪里？"
ability_tags:
  - 方案设计
  - 产品价值判断
  - 用户理解
difficulty: 基础
kind: baseline
domain: 出行
rubric:
  dimensions:
    方案设计:
      - "把方案拆成具体机制逐一评价（预付款、按生效时间排序、截止兑现与全额退款、订单/组合数量限制、实名核验），指出每个机制对应解决什么问题，而非笼统夸「官方更靠谱」。"
      - "指出方案与问题的匹配关系：抢票之争的本质是稀缺退票资源的分配规则，候补把「拼手速、拼软件」改写为「按登记先后排队」，并说明官方独占票源信息这一前提。"
      - "给出方案的能力边界：候补只能再分配退票、改签产生的票源，不增加总供给，供给绝对不足的热门线路上它必然失效。"
      - "评价有完整性意识：能注意到防滥用细节（数量限制、人证核验、行程冲突）或资金/规则风险兜底（退款、退改签按既有规则）是方案成立的一部分。"
    产品价值判断:
      - "同时站在旅客价值与公共价值两个立场：免费、不加价，对比第三方加速包收费，指出公平性是这套方案的核心价值而非附属品。"
      - "能与至少一种替代分配方案（价高者得、抽签、维持抢票竞争）做对比，说明 12306 的选择放弃了什么、守住了什么。"
      - "看到方案的代价（预付款占用、排队位置不透明带来的焦虑、热门线路仍兑现不了），并判断这些代价是否可接受、如何缓解。"
    用户理解:
      - "还原旅客在「秒光」下的真实痛点：不是不能等，而是不确定「等有没有用」、不甘心输给软件，而非只说「旅客想买票」。"
      - "指出这套设计真正交付给旅客的是「确定的排队位置与公平感」，并能用案例事实（试点成功率、免费、自动兑现通知）支撑。"
      - "区分不同旅客（可提前规划的、临时出行的、不熟悉线上操作的人群）在同一机制下的不同遭遇，而非把所有旅客当成一种人。"
  forbidden_leaks:
    - "「抢票的本质是稀缺票源的分配规则之争」的直接结论"
    - "「预付款 = 真实性承诺、过滤黄牛占坑」的机制答案"
    - "「候补只改善分配、不增加总供给」的边界结论"
    - "「竞价/抽签为什么不可取」的现成对比结论"
    - "「确定性与公平感是真正交付物」的直接点破"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "「评价一套设计」具体要答什么？动笔前，你会先拆出哪几个子问题（比如它对付的到底是什么问题、每条规则各解决什么、什么情况下它会失灵），让答案不停在「方便、公平」三句好话上？"
  - level: 2
    stage: 视角补充
    question: "代入两个人：一个连续三年靠抢票软件加价买春运票的人，一个第一次自己买票、开售当天没刷到票的大学生——「候补」这个按钮对他们分别意味着什么？他们凭什么相信排在自己前面的人没有插队？"
  - level: 3
    stage: 反例/风险
    question: "如果候补这么好用，为什么直到今天热门线路依然「开售即候补」、很多人候补到截止也没兑现？这套机制在什么情况下会完全失灵——它能解决「票不够」吗？"
  - level: 4
    stage: 取舍权衡
    question: "假如有人提议「候补也按出价高低优先兑现，收益补贴铁路」，或者「抽签最公平，大家拼运气」——你会接受哪一个？12306 选择「免费＋按登记时间先后」，放弃了什么、守住了什么？"
  - level: 5
    stage: 验证方式
    question: "如果你是设计者，上线一年后用哪几组数证明候补「成了」——这些数能否区分「旅客真的更公平地买到了票」和「只是把焦虑从抢票页面搬到了候补页面」？"
