id: Q16
title: Google Maps 离线导航：怎样帮助弱网用户顺利完成出行
case_title: 出发后没信号，导航还怎么接续
case_background:
  product:
    text: Google Maps 是提供地图和路线信息的产品；2015 年 Google 宣布扩展离线地图能力。
    citations:
      - 1
  audience:
    text: 功能面向需要在网络不稳定或无连接时查找地点、规划驾车路线的用户。
    citations:
      - 1
  scenario:
    text: 官方举例，用户可能在乡间道路或地下停车场遇到连接中断；事先下载地图区域后仍可使用部分功能。
    citations:
      - 1
  features:
    text: 2015 年公告介绍离线驾车逐路口导航、地点搜索及部分地点信息，并可在网络恢复时切回在线模式。
    citations:
      - 1
  status:
    text: 2015 年这批改进先在 Android 逐步推出，iOS 版本计划随后推出。
    citations:
      - 1
