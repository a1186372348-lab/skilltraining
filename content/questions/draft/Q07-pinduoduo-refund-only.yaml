# Q07 ｜ 拼多多「仅退款」：平台在解决什么问题，代价是什么
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
id: Q07
title: "拼多多「仅退款」：平台在解决什么问题，代价是什么"
case_title: "「仅退款」四年：从行业标配到全面取消"
case_background:
  product:
    text: "拼多多——2015 年 4 月创立、2018 年 7 月在纳斯达克上市的电商 App，2019 年率先推出「百亿补贴」，低价成为其平台标签；主站之外还有 2020 年 8 月上线的农副产品平台多多买菜。"
    citations: [1, 2]
  audience:
    text: "一侧是平台消费者（官方口径年活跃买家约 9 亿），另一侧是平台上的中小商家与白牌工厂（官方口径活跃商家逾 1400 万）。"
    citations: [1, 5]
  scenario:
    text: "消费者收到货后对商品不满意发起售后：生鲜腐坏、货不对板，或低价白牌小商品的退货物流成本甚至高于商品本身——「仅退款」最初正是为抹掉这类退货环节成本而设。"
    citations: [3]
  features:
    text: "仅退款（退款不退货）、退货退款、平台客服介入仲裁、百亿补贴、商家保证金与处罚机制。"
    citations: [2, 3, 5]
  status:
    text: "「仅退款」2021 年由拼多多率先推出，最初应用于生鲜等退货成本高的品类，后拓展至全品类；2023 年 3 月发生商家「炸店」事件（自营店「多多福利社」上线后旋即被大量下单退款、被迫下架）；2023 年底至 2024 年初淘宝、京东、抖音、快手相继跟进，「仅退款」成为行业标配；2024 年 7 月起平台陆续松绑；2025 年 4 月 22 日多家平台宣布全面取消，退款不退货申请改由商家自主处理。"
    citations: [3, 4]
