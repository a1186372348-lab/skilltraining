main_question: "如果你是拼多多的平台规则产品经理：「仅退款」当初到底在解决什么问题？为什么一个消费者友好的规则，会引发部分商家集体抗议？平台随后又如何调整其适用范围与介入方式？请给出你对该规则的问题定义、失效根因分析；若由你重新设计售后规则，你会保留什么、放弃什么，代价由谁承担。"
ability_tags:
  - 问题定义
  - 根因分析
  - 产品取舍
difficulty: 挑战
domain: "电商"
rubric:
  dimensions:
    问题定义:
      - "界定对象与场景：明确指出问题落在谁身上（消费者、商家还是平台自身）、发生在哪类订单的哪个环节（如低客单价商品逆向物流成本倒挂、生鲜等不可退品类、举证困难的品质纠纷），而非笼统说「保护消费者」或「体验不好」。"
      - "目标差距结构：能拆出当前状态（这类售后纠纷实际怎么处理、卡在哪）、期望状态（希望怎样处理）、两者差距具体是什么，三段齐备且互相咬合，而非只喊「商家受伤」「消费者被惯坏」式结论。"
      - "处理边界：说明定义的适用范围——适用于哪类订单、品类与纠纷类型，不承诺解决什么（如不承诺解决全部假货问题或全部恶意行为），不把个案定义无限泛化到全部售后场景。"
      - "事实依据与问题/解法分离：至少用两处案例事实（如退货成本倒挂、炸店事件、各平台规则版本差异、2025 年调整的具体内容）检验定义能否解释这些事实；能把「问题是否真实存在」与「该规则是不是正确解法」分开评估，不因规则被调整而否定原问题。"
      - "未知与可检验性：给出可检验的判据——什么证据支持该定义、什么证据会推翻它；证据不足时明确指出还缺什么（如分品类退款率、恶意订单占比数据）。合理承认未知是合法高分路径。"
    根因分析:
      - "能结合规则的具体版本分析失效机制：比较不同平台版本的举证要求、审核方式、商家处理时限与申诉通道（如拼多多的 24/36 小时处理时限与逾期自动退款、淘宝的多维度指标判定、京东的限定适用情形），指出失效发生在哪个机制环节，而非把「零举证门槛」「平台偏袒」当作全时期全订单的统一事实。"
      - "能形成并比较至少两种有依据的解释（如「恶意用户钻空子的道德风险」「平台以售后规则转移成本换取增长与竞争地位」「规则缺乏配套审查与申诉机制导致执行走样」），说明现有证据更支持哪一个、还无法排除哪一个，而非只给单一断言。"
      - "能正确使用事件证据：「炸店」可证明规则冲突已经公开化，但完成因果解释还需连接具体规则条款、平台执行方式与受损订单类型，而非把事件本身当作根因，或只靠情绪化归因。"
      - "能区分两类损失：商家应承担的商品质量责任（货不对板、生鲜腐坏、描述不符）与规则误判或滥用造成的损失（恶意退款、伪造凭证、凑满减后退款），两类订单的归因与责任归属不同。"
      - "对材料中的专家与媒体观点（如「以牺牲商家利益为前提保护消费者」「内卷式竞争的纠偏」「宠用户、卷商家」）：引用、质疑或验证均可，按证据使用与检验质量评分；复述这些观点不得当作独立论证。"
    产品取舍:
      - "能明确售后规则的核心取舍：消费者信任 vs 商家生态健康 vs 平台治理成本，并给出自己的优先级排序及理由。"
      - "重新设计的方案含作用于其定义问题的具体机制——可以是按品类或客单价分级、差异化举证要求、异常账号识别、商家申诉通道，也可以是其他有依据的机制；评分看机制是否对准问题、是否说明利益与压力如何重新分配，而非命中固定方案清单。"
      - "能预见自己方案的代价（如提高举证门槛会误伤真正受损的消费者、申诉通道可能拖长处理周期），并说明可接受边界。"
      - "能讨论平台角色边界：平台该做裁判、做保险（如平台出资的售后基金）还是只做信息撮合，体现对「代价由谁承担」的清醒认识。"
  forbidden_leaks:
    - "「售后摩擦→信任与转化→对淘宝京东的差异化竞争武器」的多层问题定性链条，以及「哪层是主问题」的现成答案"
    - "把「平台以商家利润补贴用户体验」作为唯一根因定论直接给出（它只能是待比较的候选解释之一）"
    - "「消费者信任/商家生态/治理成本」完整取舍框架与优先级排序的现成答案"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求你「定义」问题，而不是直接评价规则好坏。动笔前先想清楚：这个案例里「问题」落在谁身上、发生在哪类订单的哪个环节？你准备以谁的视角来界定它，为什么？"
  - level: 2
    stage: 视角补充
    question: "同一条「仅退款」规则，对买生鲜的用户、卖 9.9 元包邮小商品的商家、平台客服团队，分别意味着什么？另外注意：各平台的规则版本并不相同，举证要求、处理时限与申诉通道各有差异——你的分析有没有把它当成一条全时期、全订单都相同的规则？"
  - level: 3
    stage: 反例/风险
    question: "一条规则的实际后果往往不在设计意图里。你能想到这条规则可能被谁、以什么方式「用歪」吗？有没有公开发生过的事件可以印证或反驳你的猜想？注意：事件能证明冲突存在，但要完成因果解释，还需要连接具体规则条款与受损订单类型。"
  - level: 4
    stage: 取舍权衡
    question: "如果保留规则的全部好处就必须接受它的代价，你愿意用哪一方的利益去换哪一方的利益？平台自己应该承担多少成本，还是可以全部转移给别人？你的方案代价又会误伤谁？"
  - level: 5
    stage: 验证方式
    question: "假如你重新设计的售后规则上线了，你会观察哪些信号来判断它「起作用了」还是「又失衡了」？商家侧和用户侧分别看什么？出现什么数据，会让你承认当初的问题定义需要修改？"
