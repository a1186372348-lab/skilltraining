# Q07 ｜ 拼多多「仅退款」：平台在解决什么问题，代价是什么
# 批次：T12 首日题库第 2 批（Q07~Q12）｜ 状态：草案，待产品负责人评审与试跑
# 复审返工（产品负责人裁决）：① 删除「最终全行业取消」「4 月 22 日全面取消」失实概括——2025 年 4 月
# 各平台发布的是规则调整征求意见稿（商家先行协商、平台非必要不主动介入、商家逾期未处理时平台视情形判定），
# 主问题结局改为「为何引发商家抗议、平台随后如何调整适用范围与介入方式」；跟进时间线校订为 2023 年内；
# ② 初始动机改为明确归属的媒体受访口径，不再写成确定事实；③ 根因 Rubric 改为结合具体规则版本比较解释，
# 「零举证门槛/平台偏袒/以商家利润补贴体验」不作为全时期全订单统一事实；④ 问题定义 Rubric 对齐 B3 五要素，
# 产品取舍方案清单松绑；⑤ forbidden_leaks 收窄（规则调整、炸店等事实证据移出，仅保留导读级结论链）。
id: Q07
title: "拼多多「仅退款」：平台在解决什么问题，代价是什么"
case_title: "「仅退款」四年：从行业标配到规则重构"
case_background:
  product:
    text: "拼多多——2015 年 4 月创立、2018 年 7 月在纳斯达克上市的电商 App，2019 年率先推出「百亿补贴」，低价成为其平台标签；主站之外还有 2020 年 8 月上线的农副产品平台多多买菜。"
    citations: [1, 2]
  audience:
    text: "一侧是平台消费者（官方口径年活跃买家约 9 亿），另一侧是平台上的中小商家与白牌工厂（官方口径活跃商家逾 1400 万）。"
    citations: [1, 6]
  scenario:
    text: "消费者收到货后对商品不满意发起售后：生鲜腐坏、货不对板，或低价小商品「为退 10 元商品支付 15 元运费」式的退货成本倒挂——「仅退款」允许消费者在不退货的情况下获得退款。有电商平台相关负责人对媒体称，该机制的设计逻辑是降低维权门槛；这一动机表述来自媒体受访口径，平台当初为何推出该规则仍需论证。"
    citations: [3]
  features:
    text: "仅退款（退款不退货）、退货退款、平台客服介入仲裁、百亿补贴、商家保证金与处罚机制。"
    citations: [2, 3, 6]
  status:
    text: "「仅退款」由拼多多于 2021 年推出，最初多见于生鲜等退货成本高的品类，后推广至全品类；2023 年 3 月发生商家「炸店」事件（自营店「多多福利社」3 月 25 日上线后被大量下单退款、被迫下架，随后波及数十家品牌旗舰店）；2023 年内淘宝（12 月 26 日执行新争议处理规则）、京东（更新纠纷处理总则，其自营早于 2014 年已有类似服务）、抖音（9 月选择性支持）等平台相继引入或扩大「仅退款」，成为行业常见售后选项；2024 年下半年起各平台陆续细化调整（如淘宝 7 月提升高店铺体验分商家的售后自主权），2024 年 11 月市场监管总局约谈 6 家平台提出整改要求；2025 年 4 月多家平台发布规则调整征求意见稿——消费者已收到货后的不退货全额退款申请改由商家先行协商处理、平台非必要不主动介入，商家逾期未处理时平台视实际情形判定，报道时处于意见征集阶段，规则重心从「平台强制」转向「协商解决」，并非取消退款功能。"
    citations: [3, 4, 5]
