main_question: "如果你是拼多多的平台规则产品经理：「仅退款」当初到底在解决什么问题？为什么一个消费者友好的规则，会演变成商家集体抗议、最终全行业取消？请给出你对该规则的问题定义、失效根因分析；若由你重新设计售后规则，你会保留什么、放弃什么，代价由谁承担。"
ability_tags:
  - 问题定义
  - 根因分析
  - 产品取舍
difficulty: 挑战
rubric:
  dimensions:
    问题定义:
      - "能把「仅退款」要解决的问题定义到场景层（如低客单价商品逆向物流成本倒挂、生鲜等不可退品类、举证困难的品质纠纷），而非笼统说「保护消费者」。"
      - "能区分平台要解决的多层问题：售后摩擦体验 → 信任与转化率 → 对淘宝京东的差异化竞争武器，并指出哪层是主问题。"
      - "能识别至少三方利益相关者（消费者、中小商家、平台自身含治理成本）并陈述各自核心诉求。"
      - "能把「问题是否真实存在」与「该规则是不是正确解法」分开评估，不因规则失败而否定原问题。"
    根因分析:
      - "能指出失效的直接机制：零举证门槛 + 平台偏袒性介入 → 道德风险与「羊毛党」产业化，商家钱货两空。"
      - "能分析激励结构：平台将售后成本单方面转移给商家，以商家利润补贴用户体验，换取增长与竞争地位。"
      - "能解释扩散与反转的逻辑：为何 2024 年全行业跟进（竞争压力），又为何 2025 年全行业取消（商家生态恶化、监管介入、舆论反转）。"
      - "因果链有证据意识，能引用「炸店」事件等公开事实支撑判断，而非纯情绪化归因。"
      - "能区分「规则本身的问题」与「执行与灰度设计的问题」（门槛、品类范围、举证要求）。"
    产品取舍:
      - "能明确售后规则的核心取舍：消费者信任 vs 商家生态健康 vs 平台治理成本，并给出自己的优先级排序及理由。"
      - "重新设计的方案含具体机制（如按品类或客单价分级、举证门槛、异常账号识别、商家申诉通道），而非口号式「平衡双方」。"
      - "能预见自己方案的代价（如提高举证门槛会误伤真正受损的消费者），并说明可接受边界。"
      - "能讨论平台角色边界：平台该做裁判、做保险（如平台出资的售后基金）还是只做信息撮合，体现对「代价由谁承担」的清醒认识。"
  forbidden_leaks:
    - "「逆向物流成本倒挂、生鲜不可退」是本题预设的关键场景定义"
    - "「道德风险/羊毛党产业化、售后成本单方面转移给商家」的根因要点"
    - "炸店事件、2024 年跟进与 2025 年取消是分析扩散与反转的预期证据"
    - "按品类分级、举证门槛、商家申诉通道等期望方案要素"
    - "「消费者信任/商家生态/治理成本」的完整取舍框架"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "在回答前先想清楚：这个案例里「问题」的主体到底是谁——消费者的售后体验问题、商家的经营问题，还是平台自己的增长问题？题目要求你以谁的视角来定义问题？"
  - level: 2
    stage: 视角补充
    question: "同一条「仅退款」规则，对买生鲜的用户、卖 9.9 元包邮小商品的商家、卖品牌货的旗舰店、平台客服团队，分别意味着什么？有没有哪一方的处境你还没有真正代入过？"
  - level: 3
    stage: 反例/风险
    question: "一条规则的实际后果往往不在设计意图里。你能想到这条规则可能被谁、以什么方式「用歪」吗？有没有公开发生过的事件可以印证或反驳你的猜想？"
  - level: 4
    stage: 取舍权衡
    question: "如果保留规则的全部好处就必须接受它的代价，你愿意用哪一方的利益去换哪一方的利益？平台自己应该承担多少成本，还是可以全部转移给别人？"
  - level: 5
    stage: 验证方式
    question: "假如你重新设计的售后规则上线了，你会观察哪些信号来判断它「起作用了」还是「又失衡了」？商家侧和用户侧分别看什么？"
