# Q06 ｜ 滴滴高峰期动态调价：收益与信任成本
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
id: Q06
title: "滴滴高峰期动态调价：收益与信任成本"
case_title: "暴雨夜的 1.8 倍：动态调价的账本"
case_background:
  product:
    text: "滴滴出行——网约车平台，连接乘客与司机，高峰期与恶劣天气下长期面临供需失衡；「动态加价」正是为提高低成交概率订单的接单率而设计。"
    citations: [1]
  audience:
    text: "乘客（尤其是高峰/雨天/深夜的刚需出行者）与司机（决定是否出车、去哪接单的供给方）；平台同时面对监管与舆论——2017 年春节前滴滴曾因出租车加价争议被上海市交通委约谈。"
    citations: [2, 4]
  scenario:
    text: "2015 年 8 月滴滴快的上线「动态加价」：当订单成交概率过低时，系统在标准车费外计算溢价以提高接单率；2016 年 7 月北京暴雨天出现 4.2 倍溢价，引发大规模争议，滴滴回应称最高不超过 4.1 倍、极端天气才会出现高倍数。"
    citations: [1, 2]
  features:
    text: "动态调价/溢价、供需预警提示、出租车建议调度费（2017 年 1 月全国暂停）、双重封顶（2017 年 3 月：快车最高加价 29 元、溢价不超 0.5 倍）、「动态调价加价 100% 归司机」的官方声明（2017 年 6 月）。"
    citations: [3, 4, 5]
  status:
    text: "滴滴当年的系列调整——全国暂停出租车调度费（2017 年 1 月）、动态调价双重封顶（2017 年 3 月）、声明动态调价加价 100% 归司机（2017 年 6 月）——均是在争议与监管约谈压力下的回应；其中「加价 100% 归司机」为滴滴单方声明，收益归属未获独立验证。"
    citations: [4, 3, 5]
