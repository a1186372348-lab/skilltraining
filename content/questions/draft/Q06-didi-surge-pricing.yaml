# Q06 ｜ 滴滴高峰期动态调价：收益与信任成本
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
# 复审修订（产品负责人裁决·有条件通过）：①用户处境成为明确主任务——主问题先要求比较不同司乘的目标与约束，
# 再据此评估机制、提出一项调整建议；「雨天、深夜、赶时间」仅为场景线索，Rubric 用户理解重写为差异分析式；
# ②「不透明与失控感」改为候选解释之一，提示树 L4 允许回答「取决于人群、场景与现有信息」；③区分机制目标与
# 已验证效果（题干改「试图通过价格调节供需」，接单率改善≠总供给增加，缓释措施不因平台实施过即认定有效）；
# ④历史规则写准确（2017 年 3 月快车双重封顶=额外加价≤29 元、溢价≤基础车费 50%、总价最多约 1.5 倍；出租车调度费
# 与专快车动态加价分别说明；L2「1.8 倍」注明属封顶前场景/教学假设）；⑤产品表达辅测保留并指定听众与表达任务
#（舆情高峰期写一段对外说明）；⑥forbidden_leaks 收窄为整套作答导读级结论链
id: Q06
title: "滴滴高峰期动态调价：收益与信任成本"
case_title: "暴雨夜的 1.8 倍：动态调价的账本"
case_background:
  product:
    text: "滴滴出行——网约车平台，连接乘客与司机，高峰期与恶劣天气下长期面临供需失衡；「动态加价」正是为提高低成交概率订单的接单率而设计。"
    citations: [1]
  audience:
    text: "乘客（尤其是高峰/雨天/深夜的刚需出行者）与司机（决定是否出车、去哪接单的供给方）；平台同时面对监管与舆论——2017 年春节前滴滴曾因出租车加价争议被上海市交通委约谈。"
    citations: [2, 4]
  scenario:
    text: "2015 年 8 月滴滴快的上线「动态加价」：当订单成交概率过低时，系统在标准车费外计算溢价以提高接单率；2016 年 7 月北京暴雨天出现 4.2 倍溢价，引发大规模争议，滴滴回应称最高不超过 4.1 倍、极端天气才会出现高倍数。"
    citations: [1, 2]
  features:
    text: "出租车建议调度费与专快车动态调价是两套机制：前者由乘客自行选择加付，2017 年 1 月起全国暂停；后者由系统自动计算溢价，乘客同意调价后才能叫车。2017 年 3 月滴滴对专快车动态调价实行双重封顶：快车额外加价不超过 29 元、溢价不超过基础车费的 50%（总价最多约 1.5 倍），专车额外加价不超过 59 元、溢价同样不超过 0.5 倍；同时建立供需预警提示。2017 年 6 月官方声明「动态调价加价 100% 归司机」。"
    citations: [3, 6, 4, 5]
  status:
    text: "滴滴当年的系列调整——全国暂停出租车调度费（2017 年 1 月）、专快车动态调价双重封顶（2017 年 3 月）、声明动态调价加价 100% 归司机（2017 年 6 月）——均是在争议与监管约谈压力下的回应；其中「加价 100% 归司机」为滴滴单方声明，收益归属未获独立验证。"
    citations: [4, 3, 5]
