main_question: "高峰期动态调价试图通过价格调节供需，也带来了持续的信任争议。请依次完成四件事：第一，比较司乘两侧不同用户在这项机制下的目标与约束——乘客侧至少区分预算、出行紧迫程度、替代出行方式（如地铁、出租车、公交、推迟行程）的不同组合，司机侧考虑拥堵时间、出车成本、收入预期等因素；注意「雨天、深夜、赶时间」只是场景线索，不能据此直接推导所有乘客的价格弹性与情绪反应。第二，基于上述差异分析，评估这项机制的收益与信任成本：它试图达到什么目标、对不同用户分别造成什么代价？注意区分机制的设计目标与已验证效果——接单率的改善可能来自司机新增出车、区域运力迁移或部分需求退出，不能直接等同于总供给增加。第三，提出一项你自己的调整建议：它改善什么问题，为此你愿意放弃什么？第四，代入滴滴产品负责人，在 2016 年 7 月暴雨天价溢价争议发酵的舆情高峰期，写一段 150 字以内的对外说明，回应乘客对动态加价的质疑。"
ability_tags:
  - 用户理解
  - 产品取舍
  - 产品表达
difficulty: 中等
domain: "出行"
rubric:
  dimensions:
    用户理解:
      - "按「目标 × 约束」比较司乘两侧并给出有依据的差异分析：乘客侧区分预算、出行紧迫程度、替代出行方式（地铁、出租车、公交、推迟行程）的不同组合如何导致同一溢价下的不同反应（退出、改乘、或接受付费换确定性）；司机侧说明拥堵时间、出车成本、收入预期如何影响出车决策，而非把司机当作被动供给。"
      - "不把「雨天、深夜、赶时间」当作可直接推导的结论：它们是场景线索，具体反应取决于乘客的约束组合——能指出哪类乘客价格弹性低、哪类弹性高，并说明每步推断的依据来自案例事实还是合理推测。"
      - "把「被加价时的不满」拆成可区分的候选解释：预算压力、对加价依据不透明的质疑、对分配公平（加的钱归谁）的关注、对失控感的反感等——高分来自有依据的差异分析，不要求认同某一种心理是「真正根源」。"
      - "用案例与资料事实支撑分层与推断（2015 年上线报道中的乘客反映、2016 年暴雨溢价争议中各方回应、出租车调度费与专快车动态加价的规则差异等），分清事实与推测的边界。"
    产品取舍:
      - "完整呈现杠杆两端：短期成交率与运力调动目标 vs 长期信任、舆论与监管风险；并区分机制的设计目标（试图通过价格调节供需）与已验证效果——接单率改善可能来自司机新增出车、区域运力迁移或部分需求退出，不能直接等同于总供给增加。"
      - "评估滴滴实际缓释手段（双重封顶、供需预警、暂停出租车调度费、声明加价归司机）各自的逻辑与局限：可以给出有效与否的评价，但须说明评价依据，不因平台已实施就认定有效。"
      - "提出一项明确的调整建议（如透明化、封顶策略、场景豁免、司机侧激励替代），说清它改善什么问题、为此放弃了什么（成交率、收入、规则的简洁性等），而非罗列方向。"
      - "对资料中的平台回应与媒体观点（如「极端天气才会出现高倍数」「让大家产生了疑惑和误解」）：复述这些观点不得当作独立论证，按其证据使用与检验质量评分——指出它与哪些事实一致、哪些事实它解释不了或仍需佐证。"
    产品表达:
      - "面向指定听众（舆情高峰期质疑加价的乘客与公众）：以对方最关心的问题开头（为什么变贵、加的钱去了哪），而非以机制原理或公司立场开头。"
      - "信息准确且与案例事实一致：加价规则与封顶口径的表述与实际规则相符；「加价归司机」按平台声明表述而非断言为已证事实，不夸大、不隐瞒。"
      - "回应关键异议：正面回应「趁火打劫」式质疑，说明机制意图与约束，不回避、不淡化、不攻击质疑者。"
      - "控制信息密度与措辞：在限定篇幅（约 150 字）内把回应说清楚，措辞克制，对各利益相关方表述公平。"
  forbidden_leaks:
    - "「不透明与失控感才是乘客愤怒的真正根源」作为唯一心理结论（本题按候选解释的差异分析评分）"
    - "缓释手段（双重封顶、供需预警、暂停出租车调度费、声明加价归司机）的现成评估结论（哪个有效、为何有效）"
    - "「透明化设计」的具体答案"
    - "「保留但改造」或「取消」的结论倾向"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目有四段任务：先比较司乘两侧不同用户的目标与约束，再据此评估机制的收益与信任成本，然后提出一项调整建议，最后写一段对外说明。动笔前想一想：为什么题目要求把用户差异分析放在最前面——你对机制的评估，能从差异分析里得到什么支撑，又有哪些是它给不了的？"
  - level: 2
    stage: 视角补充
    question: "暴雨夜 23 点，一位乘客看到首页显示平时 1.8 倍的价格（注：这一倍数属于 2017 年 3 月双重封顶前的场景，或视为教学假设；封顶后快车溢价不超过基础车费的 50%）。写出两位处境不同的乘客各自最可能闪过的一句话——一位预算紧张、时间充裕，一位有急事、几乎没有替代出行方式；再写一位正在决定要不要出车的司机的一句话。同样的 1.8 倍，对他们分别意味着什么？"
  - level: 3
    stage: 反例/风险
    question: "为你当前的评估找最强反方：若完全取消动态调价，暴雨夜的供需缺口会怎样分配、谁最先受害？若完全放任、不设任何约束，又会发生什么？你提出的调整建议，在这两种极端情形下还站得住吗？"
  - level: 4
    stage: 取舍权衡
    question: "在「涨了多少」和「怎么涨、涨去了哪」之间，哪一个更伤信任？如果你认为答案取决于人群、场景与现有信息，也可以说清：对哪类乘客、在什么场景下，哪个因素占主导？你的调整建议会把力气花在哪一处，为此你愿意放弃什么（成交率？收入？规则的简洁性）？"
  - level: 5
    stage: 验证方式
    question: "调整后的机制跑两个季度：你会看哪些信号判断信任成本在收敛还是扩大、出现哪个信号说明需要回滚？如果接单率改善了，你如何区分它来自司机新增出车、运力从其他区域迁移，还是一部分需求退出了？"
