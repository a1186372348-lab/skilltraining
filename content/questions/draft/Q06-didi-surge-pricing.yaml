main_question: "高峰期动态调价用价格杠杆撬动了供给，也带来了持续的信任争议。请评估这项机制的收益与信任成本，并说明：如果你是滴滴的产品负责人，你会如何设计或调整它？"
ability_tags:
  - 用户理解
  - 产品取舍
  - 产品表达
difficulty: 中等
rubric:
  dimensions:
    用户理解:
      - "同时代入乘客（被加价时的不公平感、被「趁火打劫」的情绪）与司机（高峰出车的机会成本与激励）两侧。"
      - "识别乘客愤怒的根源不只是价格高低，更是不透明与失控感。"
      - "指出刚需场景（雨天、深夜、赶时间）下价格弹性与情绪反应的非线性。"
    产品取舍:
      - "完整呈现杠杆两端：短期成交率与运力激活 vs 长期信任、舆论与监管风险。"
      - "评估滴滴实际缓释手段（双重封顶、供需预警、暂停出租车调度费、声明加价归司机）各自的逻辑与局限。"
      - "提出自己的设计主张（如透明化、封顶策略、场景豁免、司机侧激励替代），并说明为此放弃了什么。"
    产品表达:
      - "收益与成本的呈现结构平衡，不立稻草人、不预设立场。"
      - "能区分事实、推断与立场（如「加价归司机」是平台声明而非已证事实）。"
      - "对敏感议题措辞克制，对各利益相关方表述公平。"
  forbidden_leaks:
    - "「不透明与失控感才是愤怒根源」的结论"
    - "缓释手段的评估结论（哪个有效、为何有效）"
    - "「透明化设计」的具体答案"
    - "「保留但改造」或「取消」的结论倾向"
    - "把监管约谈史组织为论证主线的写法提示"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目要求「评估收益与信任成本」并给出你的设计主张——评估部分你打算按什么结构组织：按角色、按时间尺度（短期/长期），还是按确定性（事实/推断）？"
  - level: 2
    stage: 视角补充
    question: "暴雨夜 23 点，首页显示 1.8 倍溢价：写出这位乘客脑子里最可能闪过的三句话；再写一位正在决定要不要出车的司机的三句话——两相对照，你看到了什么？"
  - level: 3
    stage: 反例/风险
    question: "为你当前的主张找最强反方：若完全取消动态调价，晚高峰会发生什么、谁最先受害？若完全放任不设任何约束，又会发生什么？"
  - level: 4
    stage: 取舍权衡
    question: "在「涨了多少」和「怎么涨、涨去了哪」之间，哪一个更伤信任？你的设计会把力气花在哪一处，为此你愿意放弃什么（成交率？收入？规则的简洁性）？"
  - level: 5
    stage: 验证方式
    question: "调整后的机制跑两个季度：你会看哪些信号判断信任成本在收敛还是扩大？出现哪个信号说明这次改错了、需要回滚？"
