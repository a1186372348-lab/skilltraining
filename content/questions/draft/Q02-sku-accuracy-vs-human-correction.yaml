# Q02 ｜ 订单级完全正确率 90%：下一阶段继续提准确率还是优先建设人工纠错
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
# 复审返工（产品负责人裁决）：主测改为产品取舍、问题定义降为辅测；准确率口径统一为
# 「订单级完全正确率 90%，即约 10% 订单存在至少一处识别错误」；取消「纠错优先」隐含标准
# （单路径、组合、条件式排序均按论证质量评分）；JWO 人工区分训练标注／疑难交易复核／扣款后申诉纠错
# 三种形态，官方回应已核对（aboutamazon.com 2024-04-17），JWO 仅作可比较、可质疑的参照
id: Q02
title: "订单级完全正确率 90%：下一阶段继续提准确率还是优先建设人工纠错"
case_title: "智能货柜的「最后 10%」困局"
case_background:
  product:
    text: "「柜小满」智能零售货柜（本案例为基于公开行业信息构建的虚构品牌，教学设定）：采用视觉识别方案，消费者扫码开门、拿货关门后，系统自动识别商品并结算——该形态与公开报道中的国内无人零售智能柜一致（基于视觉识别、物联网与移动支付）。"
    citations: [1]
  audience:
    text: "连锁便利店与写字楼/园区点位的运营商，以及直接使用货柜的消费者；公司内部则是算法团队与运营团队（角色划分为教学设定，参照智能货柜行业公开报道）。"
    citations: [1, 2]
  scenario:
    text: "教学设定：货柜识别的订单级完全正确率做到 90% 后进入平台期——即约 10% 的订单存在至少一处识别错误（错识别、漏识别、新品不认识），引发错扣款客诉、货损与运营商不信任；公开报道亦指出，智能柜在准确识别、异常订单等环节仍需人工客服介入。"
    citations: [1]
  features:
    text: "视觉识别结算、新品录入与模型训练、异常订单客服通道、货损对账系统（均为教学设定）；行业内视觉识别方案以图像识别为核心，另有重力感应、RFID 等替代路线，各有成本与准确率权衡。"
    citations: [1, 2]
  status:
    text: "教学设定：下季度资源只能重仓一个方向——A. 继续投入算法，把订单级完全正确率推向 95% 以上；B. 优先建设人工纠错与审核能力。行业参照：亚马逊 Just Walk Out（JWO）无人结账技术采用计算机视觉或 RFID 自动识别商品并结算（亚马逊官网）；2024 年媒体披露其背后有约千人规模的印度团队人工审核交易、标注视频，亚马逊官方随后发文回应称「JWO 依赖远程人员实时观看购物视频生成账单」的报道不实，其机器学习数据专员主要负责标注合成与真实购物数据以持续改进模型，账单由计算机视觉算法自动生成。两种口径下「人工」所指形态不同（训练标注／疑难交易复核／扣款后申诉纠错），成本与作用各异。"
    citations: [5, 3, 4, 6]
