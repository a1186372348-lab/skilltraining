main_question: "下一阶段应该继续把订单级完全正确率从 90% 推向 95% 以上，还是优先建设人工纠错能力？给出你的资源排序、判断依据，以及如何验证你的判断是对的。"
ability_tags:
  - 产品取舍
  - 问题定义
  - 产品价值判断
  - 指标与验证
difficulty: 挑战
domain: "电商"
rubric:
  dimensions:
    产品取舍:
      - "两条路径的收益与代价比较：提准确率侧（订单错误率同口径减半可带来的错扣赔付、客诉与信任收益 vs 平台期研发投入与周期不确定性）与人工纠错侧（错误损失即时收敛 vs 人力随单量增长、时效要求）逐项摆账，比较落到错误损失与投入的量级估算，而非方向性表态。"
      - "明确立场与排序依据：重仓提准确率、重仓人工纠错或条件式排序均可得高分，不因「只选一条路径」扣分、不因「组合策略」加分；组合策略必须符合「资源只能重仓一个方向」的约束，并对非重仓方向给出具体处理（收缩、限定投入或缓行）。"
      - "识别排序依赖的关键假设：允许条件式排序（如「若错误以新品涌入为主则先 B」），但须指出决定排序的关键未知是什么、可通过什么信息确认——只喊「看情况」而不指出关键未知不得分。"
      - "识别机会成本与代价分配：重仓一个方向意味着另一方向停滞一个季度，能说明这一机会成本；并看到代价在消费者、运营商与公司之间如何分配（谁受益、谁买单）。"
    问题定义:
      - "把「订单级完全正确率 90%」翻译成业务后果：约 10% 订单存在至少一处识别错误，其成本结构（错扣赔付、货损、客诉处理、运营商信任损耗）构成取舍比较的成本账——支撑主测判断，而非笼统归因「准确率不够高」。"
      - "界定本次决策的对象与边界：决策对象是「下一季度资源重仓方向」，约束为单点重仓；不把问题泛化为「如何设计完美的无人零售系统」。"
      - "提出支撑取舍所需的拆解输入：如 10% 错误订单的构成（错在哪类 SKU／场景、是否集中于新品或相似包装）会影响两条路径的收益估算——作为取舍判断的输入提出，不追求独立深挖。"
    产品价值判断:
      - "同口径比较两条路径的价值：90→95 把订单错误率减半，减半可能带来显著收益、也可能不抵投入——判断基于错误损失与各自投入的量级，而非先验认定哪条路径价值更高。"
      - "人工纠错价值的成立条件：取决于错误能否被及时发现、何时处理（结算前拦截还是扣款后申诉赔付）、单均处理成本——说明价值成立的条件，而非断言「纠错必然压低损失、建立信任」。"
      - "纠错数据反哺的条件性：沉淀数据能否反哺模型，取决于标注质量与是否存在真实的训练闭环——能指出这是待验证假设而非既定事实。"
      - "行业参照的可质疑使用：如引用 Just Walk Out 的人工环节，须区分其人工形态（训练标注／疑难交易复核／扣款后申诉纠错）并注意媒体披露与官方回应的口径争议，将其作为可比较、可质疑的参照，而非「人工兜底是行业通行做法」的证明；复述材料观点不得当作独立论证，按证据使用与检验质量评分。"
    指标与验证:
      - "提出可支撑取舍的指标：订单级完全正确率／订单错误率、单均错误损失（错扣赔付、货损、客诉率）、纠错时效与单均纠错成本、纠错后用户留存／复购等，指标服务于所重仓方向的验证。"
      - "设计可执行的验证方式：如部分点位灰度、与对照点位比较，能区分「准确率提升带来的错误减少」与「纠错介入带来的损失收敛」两类效果。"
      - "给出反转条件：出现什么信号说明当初的排序错了、应切换重仓方向。"
  forbidden_leaks:
    - "「优先人工纠错」或「优先提准确率」的结论倾向（含直接给出排序结论）"
    - "「纠错数据反哺模型」飞轮作为既定事实的表述"
    - "「提准确率边际收益递减、纠错更划算」的定性比较结论"
    - "「Just Walk Out 证明人工兜底是行业通行做法／纠错路径优于提准确率」的定性结论"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "这是一道「资源只能重仓一个方向」的决策题。在选 A 或 B 之前先问自己：仅凭「订单级完全正确率 90%」这一个数字，你能知道它给业务造成了多大损失吗？还缺什么信息？"
  - level: 2
    stage: 视角补充
    question: "用三个角色各想 30 秒：被错扣 12 元的消费者、月底对不上账的运营商老板、要为下季度结果负责的你——他们各自最在意的是什么？一致吗？"
  - level: 3
    stage: 反例/风险
    question: "为你当前倾向的方案找最强的反方论据：如果重仓它，最坏的结果是什么？行业里是否有人押错这个方向并付出了代价？"
  - level: 4
    stage: 取舍权衡
    question: "一条路花研发预算、赌长期壁垒；一条路花运营人力、保当下体验——哪笔账更划算取决于什么前提？你的判断依赖哪个关键假设？"
  - level: 5
    stage: 验证方式
    question: "假如给你 4 周时间和 20 个点位做试点，再决定全量方向：你会设计一个什么样的实验？看什么读数、读到什么程度就拍板？"
