# Q02 ｜ SKU 识别准确率已达 90%：下一阶段继续提准确率还是优先建设人工纠错
# 批次：T12 首日题库第 1 批（Q01~Q06）｜ 状态：草案，待产品负责人评审与试跑
id: Q02
title: "SKU 识别准确率已达 90%：下一阶段继续提准确率还是优先建设人工纠错"
case_title: "智能货柜的「最后 10%」困局"
case_background:
  product: "「柜小满」智能零售货柜（本案例为基于公开行业信息构建的虚构情境）：采用视觉识别方案，消费者扫码开门、拿货关门后，系统自动识别商品并结算。"
  audience: "连锁便利店与写字楼/园区点位的运营商，以及直接使用货柜的消费者；公司内部则是算法团队与运营团队。"
  scenario: "货柜 SKU 识别准确率做到 90% 后进入平台期：每 100 笔订单约 10 笔存在识别错误（错识别、漏识别、新品不认识），引发错扣款客诉、货损与运营商不信任。"
  related_features: "视觉识别结算、新品录入与模型训练、异常订单客服通道、货损对账系统；候选投入方向：人工纠错/审核后台、模型持续训练管线。"
  current_status: "下季度资源只能重仓一个方向：A. 继续投入算法，把准确率推向 95% 以上；B. 优先建设人工纠错与审核能力，保证每笔错误都有人兜底、快速赔付。行业参照：亚马逊 Just Walk Out 被媒体披露长期依赖约千人规模的人工审核团队（见资料与 uncertainty）。"
main_question: "下一阶段应该继续把准确率从 90% 推向更高，还是优先建设人工纠错能力？给出你的判断、判断依据，以及如何验证你的判断是对的。"
ability_tags:
  - 问题定义
  - 产品价值判断
  - 产品取舍
  - 指标与验证
difficulty: 挑战
rubric:
  dimensions:
    问题定义:
      - "把「准确率 90%」翻译成业务后果：错误订单的成本结构（错扣赔付、货损、客诉、运营商信任）。"
      - "指出真正的问题未必是「准确率不够高」，而是「错误发生后的成本无人兜底」或「错误结构未知」。"
      - "提出先拆解 10% 错误的构成（错在哪类 SKU/场景、是否集中于新品或相似包装），再决定资源投向。"
    产品价值判断:
      - "比较两条路径的边际收益：90→95 只把错误减半、并不消除错误成本；人工纠错直接压低单均错误成本并建立信任。"
      - "指出纠错系统沉淀的标注数据可反哺模型，纠错不是纯成本中心。"
      - "能借助行业事实（Just Walk Out 依赖人工审核）说明「AI+人工兜底」是行业通行形态，而非技术失败的遮羞布。"
    产品取舍:
      - "识别取舍维度：研发投入 vs 运营成本、长期壁垒 vs 短期体验、技术叙事 vs 商业闭环。"
      - "说明人工纠错的代价（人力随单量增长、时效要求），并给出边界设计（纠错率目标、逐步自动化）。"
      - "不做简单二选一：能给出先后或组合策略，并说明其成立条件。"
    指标与验证:
      - "提出可支撑决策的指标：错单率、纠错时效、单均纠错成本、客诉率、纠错后用户留存/复购。"
      - "设计可执行的验证方式：部分点位灰度上线纠错后台、与对照点位比较。"
      - "给出反转条件：出现什么信号说明当初判断错了。"
  forbidden_leaks:
    - "「优先人工纠错」或「优先提准确率」的结论倾向"
    - "错误结构拆解的具体方向（新品、相似包装、遮挡场景）"
    - "「纠错数据反哺模型」的飞轮逻辑"
    - "具体指标清单（错单率、纠错时效、单均纠错成本等）"
    - "Just Walk Out 案例作为论据的用法"
    - "边际收益递减的对比框架"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "这是一道「资源只能重仓一个方向」的决策题。在选 A 或 B 之前先问自己：仅凭「准确率 90%」这一个数字，你能知道它给业务造成了多大损失吗？还缺什么信息？"
  - level: 2
    stage: 视角补充
    question: "用三个角色各想 30 秒：被错扣 12 元的消费者、月底对不上账的运营商老板、要为下季度结果负责的你——他们各自最在意的是什么？一致吗？"
  - level: 3
    stage: 反例/风险
    question: "为你当前倾向的方案找最强的反方论据：如果重仓它，最坏的结果是什么？行业里是否有人押错这个方向并付出了代价？"
  - level: 4
    stage: 取舍权衡
    question: "一条路花研发预算、赌长期壁垒；一条路花运营人力、保当下体验——哪笔账更划算取决于什么前提？你的判断依赖哪个关键假设？"
  - level: 5
    stage: 验证方式
    question: "假如给你 4 周时间和 20 个点位做试点，再决定全量方向：你会设计一个什么样的实验？看什么读数、读到什么程度就拍板？"
