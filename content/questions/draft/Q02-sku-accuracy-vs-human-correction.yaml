uncertainty:
  - "「Just Walk Out 每千笔交易约 700 笔需人工审核」为 The Information 报道口径（2024 年 4 月，经腾讯新闻等转引），亚马逊公开提出异议，真实比例未获官方确认。"
  - "JWO 的人工环节须区分三种形态：训练标注（离线标注购物数据以改进模型）、疑难交易复核（账单生成链路中对算法不确定交易的人工复核）、扣款后申诉纠错（错扣发生后的客诉与赔付）。亚马逊官方 2024 年 4 月 17 日博客承认的是第一种（机器学习数据专员负责标注合成与真实购物数据以持续改进模型），并明确否认「远程人员实时观看购物视频生成账单」；媒体披露指向标注与复核混合、规模存疑。因此 JWO 不能直接证明「建设纠错后台一定优于提升模型」——官方口径下其人工主要服务于改进模型，而非兜底纠错。"
  - "「柜小满」公司及「订单级完全正确率 90%、二选一资源约束」为教学虚构设定；行业背景（视觉货柜方案、人工审核常态）均有公开报道支撑。"
