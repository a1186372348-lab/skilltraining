main_question: "小红书常被叫作「年轻人的生活指南」：请你回答，它的核心用户是谁——他们在什么场景下、为了什么目的打开小红书，他们优先选择它的理由是什么？"
ability_tags:
  - 用户理解
  - 问题定义
  - 产品价值判断
difficulty: 基础
kind: baseline
domain: 内容/社交
rubric:
  dimensions:
    用户理解:
      - "按自己声明的「核心」口径给出有依据的用户分层（如基本盘与增量、不同使用目的或活跃强度的区分——「浏览消遣型与搜索决策型」仅为分层示例，不要求所有答案都采用），并说明各层的使用场景与目的差异，而非笼统说「年轻人都在用」。"
      - "还原至少一个具体使用场景链（如「计划旅行/装修/买大件前 → 搜场景词 → 读多篇真实经验 → 形成决策」，或「通勤/睡前刷双列信息流 → 被兴趣内容击中 → 收藏与关注同好」），指出用户在链条每个环节要的是什么。"
      - "解释用户为什么信任并反复回来（如真实个体的经验、经验可检索沉淀、社区氛围与兴趣同好连接等机制与心理），而非只说「内容好」。"
      - "区分「核心用户」与「全部用户」：基本盘是谁、增量是谁、二者需求有何不同。"
    问题定义:
      - "先给「核心用户」一个明确、可操作的口径（贡献收入、活跃度/使用强度、增长来源等均可，选定后全文自洽），并说明为什么不只用「人数最多」这一口径。"
      - "把「为什么用」收敛为可回答的价值命题（小红书在哪些场景替用户完成了什么），而非罗列功能清单。"
      - "识别题目隐含假设（如「核心用户 = 画像占比最高的人群」「用得多 = 价值大」）并主动检验，而非默认接受。"
    产品价值判断:
      - "对「用户优先选择小红书的理由」下明确结论，且结论与所选核心用户口径自洽（方向不限：生活决策的搜索入口、真实经验库、兴趣社区的归属与陪伴等均可），判据清晰可检验而非口号。"
      - "同时从用户价值与平台商业价值两个立场评估，指出二者一致与冲突之处（如种草心智与广告浓度的信任张力）。"
      - "评估用户泛化对核心价值的增益与稀释，给出「什么情况下扩张会伤害核心价值」的边界条件。"
  forbidden_leaks:
    - "替用户选定「核心用户」口径的现成定义（如「按价值贡献而非人数」）"
    - "「浏览消遣型与搜索决策型」的使用目的区分框架"
    - "「生活决策的搜索入口 / 真实经验库」的价值定位结论"
    - "「真实 UGC 经验可检索沉淀」构成优先选择理由的机制结论"
    - "用户泛化（下沉、男性化）稀释核心价值的边界判断"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "题目问「核心用户」——这个词至少有三种口径：人数最多、使用时长最长、对平台价值最大。你打算采用哪一种、为什么？动笔前先写下你要论证的一句话结论，再倒推需要哪些事实支撑它。"
  - level: 2
    stage: 视角补充
    question: "请代入两个人：一个睡前躺着刷小红书打发时间的人，一个下个月要装修、正在搜「小户型收纳」的人——他们打开 App 的动机、停留的方式、对内容的要求、离开时的收获各有什么不同？小红书对谁更「有用」？"
  - level: 3
    stage: 反例/风险
    question: "同样是内容平台，查「哪款防晒好用」「北京周末去哪玩」，为什么很多人去小红书而不是百度或抖音？反过来，小红书的电商闭环一直不算大——如果它的价值真是帮人做决定，为什么这个价值没能顺畅地变成交易？这两个问题指向同一个答案吗？"
  - level: 4
    stage: 取舍权衡
    question: "假设你是小红书的产品负责人：一边是快速增长的下沉与男性新用户（带来规模），一边是既有核心人群已经形成的使用心智（带来价值密度）。当两类用户的内容偏好冲突时，推荐分发该偏向谁？你的取舍标准是什么？"
  - level: 5
    stage: 验证方式
    question: "半年后你要验证「小红书对用户的核心价值到底是什么」，你会看哪几组行为数据（而非问卷）？什么数据组合能区分「用户只是来杀时间」和「用户真的靠它做决定」？"
