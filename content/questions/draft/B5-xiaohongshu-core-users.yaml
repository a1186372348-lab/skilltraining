# B5 ｜ 小红书的核心用户是谁，他们为什么用它
# 批次：T33 第一批基线测评题（B5，主测维度：用户理解）｜ 状态：草案，待产品负责人评审后上架
# 复审修改落实（有条件通过 → 条件落实，局部修改）：
# ① 案例背景各数据点标注统计/披露时点（官方通案为千瓜 2025 年 4 月报告援引、数据区间 2025 年一季度；
#    搜索数据分 2023 年 2 月、2023 年 7 月、2024 年四季度三个时点；彭博利润为 2024 年 12 月报道；
#    Slogan 更换为 2025 年 7 月），观察时点收口至 2025 年年中公开信息，避免口径漂移；
# ② 问题定义 Rubric 放开「核心用户」口径（贡献收入/活跃度/增长来源等均可，口径明确且全文自洽即可）；
# ③ 用户理解/产品价值判断 Rubric 去锁定化：「浏览消遣型与搜索决策型」仅为分层示例，按所选口径的
#    论证质量评分；提示树第 4 层移除「生活决策入口」预设定位（原表述与 forbidden_leaks 第 3 条冲突）；
# ④ 主问题「不可替代的价值」改为「优先选择它的理由」，Rubric 与 forbidden_leaks 相关措辞同步。
id: B5
title: "小红书的核心用户是谁，他们为什么用它"
case_title: "「遇事不决小红书」：一种新习惯"
case_background:
  product:
    text: "小红书——以双列信息流呈现的内容社区，用户以图文、短视频笔记分享生活经验。小红书 COO 柯南介绍，平台起始于短图文的内容形态，过去几年陆续加入视频和直播。2025 年 7 月，小红书把沿用多年的 Slogan 从「你的生活指南」改为「你的生活兴趣社区」。"
    citations: [2, 3]
  audience:
    text: "官方通案口径（千瓜数据 2025 年 4 月报告援引，数据区间为 2025 年一季度）：平台约 3 亿月活用户、内容分享者超 1 亿；用户画像为男女比例 3:7，95 后占比 50%、00 后占比 35%，一二线城市用户占比 50%。虎嗅 2025 年 8 月获悉，2024 年小红书 MAU 均值约 3.3 亿、年底已超 3.5 亿，18~34 岁年轻群体占比超 70%。柯南在 2023 年初就表示，小红书正从小众走向大众：三四线城市用户的增长速度远大于一二线，男性用户也在增多，背后是用户使用场景开始进入生活化。"
    citations: [5, 3, 2]
  scenario:
    text: "小红书已成为高频搜索场景：2023 年 2 月柯南公布，60% 的日活用户会在小红书主动搜索，日均搜索查询量接近 3 亿次；同年 7 月官方行业大会进一步披露，超过 60% 用户在平台的首个动作是搜索。到 2024 年四季度，日均搜索量已达约 6 亿次（媒体援引消息人士口径）；小红书此前披露的数据统计（调查时点未公开）显示，70% 月活用户存在搜索行为，三分之一用户打开小红书的第一件事就是搜索，九成用户表示消费决策会受搜索结果影响。柯南把小红书称为「普通人的生活搜索入口」；官方还描述了用户从搜趋势词、到搜场景词、再到搜具体产品型号的需求加深路径，以及「搜索—浏览—再搜索」的行为闭环。"
    citations: [1, 6, 4, 2]
  features:
    text: "双列信息流浏览与搜索并重；图文、视频与直播笔记；以普通用户生产的 UGC 为主体——2023 年 7 月官方行业大会公布 UGC 笔记占比达 90%，官方通案口径月均搜索渗透率达 70%；分发上去中心化，50% 的社区流量分配给普通用户，笔记依据点赞率、收藏率、互动率「赛马」逐级进入更大流量池。"
    citations: [6, 5, 3]
  status:
    text: "规模与商业化同步推进（本题各数据统计时点不一，均随文标注，最新公开信息为 2025 年年中）：2024 年 MAU 均值约 3.3 亿、年底超 3.5 亿（虎嗅获悉口径）；2024 年四季度日均搜索量约 6 亿次，较 2023 年年中翻倍；据彭博社 2024 年 12 月报道，小红书 2024 年利润有望翻倍至 10 亿美元以上。内容生态从「生活指南」泛化：虎嗅 2025 年 8 月报道，过去一年二次元、游戏是增速第一、第二的内容品类，整体发布规模仅次于时尚、美食。"
    citations: [3, 4]
