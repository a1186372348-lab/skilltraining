id: Q21
title: IKEA 家具回购：怎样把参与条件讲清楚
case_title: 旧家具交回门店前，顾客需要知道什么
case_background:
  product:
    text: IKEA 美国的 Buyback & Resell 服务回购符合条件的 IKEA 家具，并提供退款卡。
    citations:
      - 1
  audience:
    text: 美国条款说明服务目前仅向 IKEA Family 会员提供；参与门店及家具资格均有条件。
    citations:
      - 1
      - 3
      - 4
  scenario:
    text: 顾客可以先在线取得估价，再于当前流程所示的 30 天内携带家具到参与门店接受检查和最终估价。
    citations:
      - 2
  features:
    text: 帮助页说明，合资格家具须清洁、功能正常并完整组装；门店确认后提供的退款卡可用于 IKEA 线上或门店购物。
    citations:
      - 2
      - 3
  status:
    text: 所引美国帮助页与条款为 2026 年 11 月核验时的公开说明，具体店铺和产品条件可能变化。
    citations:
      - 1
      - 3
      - 4
