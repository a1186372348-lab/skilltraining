main_question: 假设你要为第一次使用该服务的顾客写一段简短说明：怎样在用户出门前让他知道家具是否可能符合条件、线上估价与门店最终报价有什么区别、最后得到什么？请给出说明文案，并解释你为什么这样排序和如何验证用户是否理解。
ability_tags:
  - 产品表达
  - 用户理解
difficulty: 基础
domain: 本地生活
kind: daily
rubric:
  dimensions:
    产品表达:
      - 清楚说明资格检查、线上估价、到店检查和退款卡，区分估价与最终报价。
      - 文案面向首次使用者，用明确步骤和限制降低误解，不承诺所有家具必定可回购。
      - 解释信息排序并指出关键未知或应查看的具体条款。
    用户理解:
      - 围绕第一次使用者出门前的实际决定，解释哪些资格和门店信息需要先确认。
      - 考虑搬运及到店检查的成本，使文案帮助用户避免因误解条件而白跑。
      - 解释退款卡与现金的区别如何影响顾客预期，不要求额外完成人群对比或环境收益评估。
  forbidden_leaks:
    - 完整的资格、估价、到店与退款卡说明及验证思路。
    - 回购对所有顾客一定划算的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 出门前、到店时和完成后，顾客各需要知道什么？
  - level: 2
    stage: 视角补充
    question: 在线估价和门店检查后的价格是同一回事吗？
  - level: 3
    stage: 反例与风险
    question: 家具不符合条件时，怎样避免让顾客白跑？
  - level: 4
    stage: 取舍权衡
    question: 退款卡与现金对用户价值有什么区别？
  - level: 5
    stage: 验证方式
    question: 让一位没用过服务的人复述流程，你会检查哪几项？
