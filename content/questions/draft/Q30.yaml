    - title: Fitbit Premium 推出
      source: Fitbit／Google
      url: https://blog.google/products-and-platforms/devices/fitbit/fitbit-launches-fitbit-premium/
      summary: 2019 年介绍付费 Premium 服务的产品背景；不代表 2022 年每项权益。
  extended:
    - title: 员工使用睡眠画像的故事
      source: Fitbit／Google
      url: https://blog.google/products-and-platforms/devices/fitbit/fitbit-sleep-premium-experience/
