uncertainty:
  - 提出的免费与付费重新划分是本题假设，不能当作现行权益清单。
  - 官方宣传、单人体验及旧设备研究不能单独证明画像的诊断效力或长期健康收益。
  - 禁止泄露点的编辑口径：限制导师在用户完成判断前代写整套答案，不限制题面提供必要机制事实和正常资料，也不要求用户采用参考答案的具体词语、排序或方案。
status: published
