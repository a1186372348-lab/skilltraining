    title: 员工使用睡眠画像的故事
    publisher: Fitbit／Google
    url: https://blog.google/products-and-platforms/devices/fitbit/fitbit-sleep-premium-experience/
  - id: 4
    title: Fitbit 2022 年秋季设备与服务介绍
    publisher: Fitbit／Google
    url: https://blog.google/products-and-platforms/devices/fitbit/fall-2022/
  - id: 5
    title: Fitbit 睡眠阶段研究介绍
    publisher: Fitbit／Google
    url: https://blog.google/products-and-platforms/devices/fitbit/study-shows-fitbit-devices-accurately-track-sleep-stages/
main_question: 假设你可以重新划分睡眠体验中的基础信息和付费分析。你会免费提供哪些内容、将哪些放进 Premium？请说明不同用户的价值和选择的代价。选择一个主要指标，说明观察对象、时间范围和怎样判断，并补充一项需要避免的用户误解。不要求完整实验设计，也不要把产品描述当作医疗效果证明。
ability_tags:
  - 产品取舍
  - 产品价值判断
  - 指标与验证
difficulty: 基础
domain: 健康/运动
kind: daily
rubric:
  dimensions:
    产品取舍:
      - 给出基础与付费能力的清晰划分及理由，并说明其他合理方案也可能成立。
      - 考虑价格、持续佩戴门槛与健康信息理解风险，明确一种需要接受的代价。
      - 区分提出的新划分与 2022 年公告中的现有 Premium 功能，不虚构既有权益。
    产品价值判断:
      - 按所选免费与付费权益划分，说明不同需求的用户可能获得的具体价值及成立条件；不限定用户分组或某种权益组合。
      - 承认设备兼容、佩戴条件和付费意愿可能影响价值；不把现有月度画像的条件推广到所有拟议分析。
      - 不将动物分类、宣传或单人体验当作疾病诊断或健康改善证明。
    指标与验证:
      - 指标与所选权益划分有关，观察对象、时间范围和变化方向清楚；比例指标说清分母。
      - 说明该指标能支持什么近期判断，以及它不能证明的长期价值或健康结果。
      - 指出一项需要避免的权益或健康含义误解，不要求完整实验设计。
  forbidden_leaks:
    - 完整的免费付费划分、目标人群与验证方案。
    - 睡眠画像能诊断疾病或必然改善健康的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 用户偶尔查看睡眠与持续关注趋势时，需要的信息有什么不同？
  - level: 2
    stage: 视角补充
    question: 哪些基本解释应在用户作决定前就看得到？
  - level: 3
    stage: 反例与风险
    question: 每月佩戴条件和设备兼容会让哪些人暂时无法使用？
  - level: 4
    stage: 取舍权衡
    question: 如果只看订阅人数，会漏掉哪些体验或误解？
  - level: 5
    stage: 验证方式
    question: 你选的一个指标观察谁、看多久，什么变化支持判断？需要避免什么误解？
