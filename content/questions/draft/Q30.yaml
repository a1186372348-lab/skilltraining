id: Q30
title: Fitbit 睡眠画像：哪些能力适合放进付费服务
case_title: 睡眠信息既要有基本价值，也要有清楚的付费理由
case_background:
  product:
    text: Fitbit 在 2022 年介绍面向 Premium 会员的 Sleep Profile 月度睡眠画像。
    citations:
      - 1
  audience:
    text: 该功能面向拥有兼容 Fitbit 设备且使用 Premium 服务的人；其介绍要求每月有一定夜晚佩戴设备。
    citations:
      - 1
  scenario:
    text: 用户可在持续记录睡眠的过程中获得月度画像，官方用多项睡眠指标和动物类别帮助呈现模式。
    citations:
      - 1
  features:
    text: 2022 年公告称每个日历月至少佩戴设备睡眠 14 晚才能获得一次评估；具体设备与服务条件以公告为准。
    citations:
      - 1
  status:
    text: Fitbit 曾介绍付费 Premium 订阅；公开介绍展示产品设计，但不能单独证明画像能诊断疾病或改善每位用户健康。
    citations:
      - 1
      - 2
case_sources:
  - id: 1
    title: Fitbit Sleep Profile 发布说明
    publisher: Fitbit／Google
    url: https://blog.google/products-and-platforms/devices/fitbit/sleep-profile/
  - id: 2
