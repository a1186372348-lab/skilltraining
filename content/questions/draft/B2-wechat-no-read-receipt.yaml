      url: "https://www.caixin.com/2025-03-19/102299992.html"
      summary: "腾讯 2024 年全年业绩要点：截至 2024 年 12 月 31 日，微信及 WeChat 合并月活跃账户数 13.85 亿、同比增长 3%——用以校准本题决策的影响面：任何默认通讯规则的改动都作用于 13.85 亿月活用户。"
uncertainty:
  - "网络广泛流传「张小龙称微信不做已读/未读是要给人撒谎的机会」，但本次核查未能在官方演讲全文或权威媒体中找到可直接引用的原始出处（2019 年微信公开课演讲全文未见该表述的可靠记录），故未写入案例背景。"
  - "2023 年 7 月热搜话题「如果微信显示已读的话」的阅读量（有报道称 4.4 亿次阅读）未以官方数据核实，案例背景仅表述为「登上热搜并引发广泛讨论」。"
  - "央广网 2023 年投票与中国新闻网调查的具体样本量未获取，仅转述壹读报道中的得票占比（43.56%）与「约八成反对」。"
  - "「微信公开课 2018 年指出不做已读是希望用户体验没有负担」系壹读报道转述并附公众号截图，未直接核对微信公开课公众号原文。"
