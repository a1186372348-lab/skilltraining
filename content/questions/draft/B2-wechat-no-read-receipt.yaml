uncertainty:
  - "网络广泛流传「张小龙称微信不做已读/未读是要给人撒谎的机会」，但本次核查未能在官方演讲全文或权威媒体中找到可直接引用的原始出处（2019 年微信公开课演讲全文未见该表述的可靠记录），故未写入案例背景。"
  - "2023 年 7 月热搜话题「如果微信显示已读的话」的阅读量（有报道称 4.4 亿次阅读）未以官方数据核实，案例背景仅表述为「登上热搜并引发广泛讨论」。"
  - "央广网 2023 年投票与中国新闻网调查的具体样本量未获取，仅转述壹读报道中的得票占比（43.56%）与「约八成反对」；两类数据均为投票/调查参与者口径，不能代表全体微信用户——该效力限定已同步写入案例背景与 Rubric。"
  - "「微信公开课 2018 年指出不做已读是希望用户体验没有负担」系壹读报道转述并附公众号截图，未直接核对微信公开课公众号原文。"
  - "2026 年 10 月复审时直连 WhatsApp 帮助中心页面（faq.whatsapp.com/665923838265756/ 及现有来源链接）因网络受限未能成功；已读回执规则改经官方帮助中心页面的搜索引擎索引摘要（「你将无法收发已读回执」「即使你在隐私设置中关闭已读回执选项，群聊的已读回执仍然始终发送」）与多个独立二手来源引述交叉核验，三点规则（个人聊天可关闭、关闭具互惠限制、群聊与语音播放回执例外）口径一致后写入。"
