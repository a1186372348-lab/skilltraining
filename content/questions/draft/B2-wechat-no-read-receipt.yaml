      url: "https://faq.whatsapp.com/zh_cn/android/28000015/"
      summary: "WhatsApp 官方对已读回执机制的说明：单勾已发出、双勾已送达、双勾变蓝为对方已读；群聊中所有成员已读后双勾才变蓝。WhatsApp 采用「默认开启、可在隐私设置中关闭」的方案，是研究「可关闭已读」设计的一手样本。"
