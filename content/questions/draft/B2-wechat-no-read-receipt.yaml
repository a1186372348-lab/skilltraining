# B2 ｜ 微信为什么坚持不做「已读」：一个被官方反复重申的「不」
# 批次：T17b 基线测评综合题（B2）｜ 状态：草案，待产品负责人评审；kind=baseline（T17a 落地前官方校验可能不识别 kind 字段，属预期）
id: B2
title: "微信为什么坚持不做「已读」功能"
case_title: "一个被官方反复重申的「不」：13.85 亿人使用的微信，为什么始终没有「已读」"
kind: baseline
case_background:
  product:
    text: "微信——腾讯于 2011 年 1月上线的即时通讯与社交平台；2018 年 8 月日活跃账户数已达 10 亿，是中国第一款达到这一量级的移动互联网应用；截至 2024 年 12 月 31 日，微信及 WeChat 合并月活跃账户数为 13.85 亿，同比增长 3%。"
    citations: [3, 5]
  audience:
    text: "微信面向全年龄层的个人社交通讯用户，承载的是熟人之间的私密化社交场景——与钉钉等面向工作协同的平台不同；在这些关系里，一条消息的背后往往是亲友、同事、客户等不同亲疏程度的期待。"
    citations: [2, 5]
  scenario:
    text: "在熟人聊天中，发消息的人无法确认对方是否看到了消息；2023 年 7 月，「如果微信显示已读的话」登上微博热搜并引发广泛讨论，反对声居多；央广网 2023 年发起的「最不喜欢的社交媒体功能」投票中，「显示消息已读」得票最高、占比 43.56%；中国新闻网针对「你希望微信显示消息已读吗」的调查中约八成网友持反对意见。"
    citations: [1, 2]
  features:
    text: "微信不提供「已读/未读」状态显示；对照之下：WhatsApp 默认提供已读回执（消息双勾变蓝），并允许用户在隐私设置中关闭（关闭后自己也看不到对方的已读状态）；钉钉将「已读/未读」作为特色功能，群聊中可查看谁已读、谁未读，并按已读先后排序；微博私信曾有「已读」功能，2018 年 11 月官方宣布下线，至今未恢复。"
    citations: [1, 2, 4]
  status:
    text: "微信官方的立场多年一致且多次公开重申：2018 年「微信公开课」即表示不做已读是希望更多人感受到没有负担的用户体验；2023 年 7 月腾讯微信团队通过官方微博回应热搜「放心，没有『如果』」，腾讯公关总监张军进一步解释：「『已读』会增加信息接收者的心理负担和社交压力，所以从一开始微信就坚定不移地不显示这个功能，以后也不会」；2025 年 4 月张军再次重申同一立场，2025 年 8 月微信方面重申「一开始就没有，以后也不会」。"
    citations: [1, 2, 6]
