  - id: 6
    title: "上线已读功能？微信：一开始就没有，以后也不会"
    publisher: "北京日报客户端"
    url: "https://xinwen.bjd.com.cn/content/s689488a7e4b0aabe0a04b44f.html"
main_question: "微信不做「已读」的立场从 2018 年公开表态，一直延续到 2025 年 8 月的最近一次重申；而「已读」的用户呼声与效率场景的需求同样长期存在。请你站在微信产品负责人的视角，以本案例资料的截止时点（2025 年 8 月官方最近一次重申之后）为决策时点，对「已读」需求作出后续决策，并产出一份具体的方案设计：明确选择一种立场——做（上线已读）、不做（维持现状）、或有限度地做（限定场景、限定对象、可开关等中间形态）——并写清五个要素：适用场景（在哪些聊天、关系或消息类型中生效）；状态定义（什么算「已读」，与「送达」如何区分）；展示与开关规则（对谁可见、默认开或关、能否关闭、关闭的连带规则）；关键异常（群聊、语音消息、陌生人消息等如何处理）；双方代价（发送方与接收方各自让渡了什么）。如果你选择「不做」，论证要求同样具体：发送方「确认对方已看到」的确定性需求是真实的——它如何被承接（或为何不值得承接），哪些场景的损失依然存在。辅问（简短作答即可）：一、你打算如何检验这个决策——访谈、情境原型测试或合理设计的对照研究均可——想验证什么命题、出现什么结果会让你改变立场？二、用一小段话把你的决定向普通用户讲清楚。"
ability_tags:
  - 方案设计
  - 产品取舍
  - 指标与验证
  - 产品表达
difficulty: 挑战
domain: "内容/社交"
rubric:
  dimensions:
    方案设计:
      - "立场明确且设计产出完整：在做、不做、有限度做法中选定一种，写清适用场景、状态定义（什么算「已读」、与「送达」如何区分）、展示与开关规则、关键异常（群聊、语音、陌生人消息等）、发送方与接收方各自代价；只有立场表态而没有机制，或机制要素残缺，不得高分。"
      - "能比较多种方案形态的机制差异后再选定立场（如全量上线、默认开可关、默认关可开、仅特定场景开放、仅展示送达不回传已读），而非把题目当成「做/不做」的二元表态。"
      - "能处理关键设计变量的连带规则：对谁可见、默认状态、能否关闭、关闭是否双向对等（参照 WhatsApp：关闭后自己也看不到对方回执，群聊与语音播放回执为例外），并预见「可关闭」会把压力转移成「你为什么关掉」的新社交博弈等二阶效应。"
      - "选「不做」时须给出发送方确定性需求的承接安排（如送达状态可见、显式确认类工具、效率场景的分工出口），并明说哪些场景的损失依然存在；只复述官方「无负担」口径而无承接设计不得高分——复述资料中的现成方案不得分，按方案与微信场景的适配论证质量评分。"
      - "方案落在微信的具体约束上：13.85 亿月活、全年龄层、熟人关系链，任何默认态改动的影响面都极大；需说明上线节奏、灰度范围与回滚安排。"
    产品取舍:
      - "能以「发送方确定感与接收方低压力之间的交换」为线索展开权衡，并结合具体场景（亲疏关系、消息类型、时点）说明这条交换在不同场景下如何倾斜——评分看如何结合场景权衡，而非是否复述这一框架。"
      - "能评估办公协同、客服、电商等场景中「已读」效率价值与微信主场景的关系：论证其不属于主场景、主张由微信内机制承接、或主张由企业微信等分工承接，均可得分；未经论证直接断言「不属于微信主场景」不得分。"
      - "能看到坚持不做的持续成本：用户呼声与热搜级讨论长期存在、官方反复支付解释成本、效率需求被让渡给企业微信与钉钉等对手——并说明这些成本在所选立场下如何处理。"
      - "能结合微博私信 2018 年上线后下线已读的案例，评估「上线后再回滚」的成本与限制（回滚实际发生过，但伴随什么代价、什么条件下可行），而非预设「几乎无法回滚」——单向门式断言须有证据支撑才可得分。"
      - "能讨论「关系」与「效率」在微信上兼容或冲突的条件（如通过场景切割共存），不把二选一当作前提；复述官方表态或资料现成结论不得分，按证据使用与权衡质量评分。"
    指标与验证:
      - "验证方式与决策匹配：访谈、情境原型测试或合理设计的对照研究均可，不强制要求上线试验；若提出灰度，须说明灰度本身不等于有效实验——分流方式、对照设置与观测窗口如何设计、什么结果会推翻所选立场。"
      - "能正确使用跨产品参照：WhatsApp（可关闭但有群聊与语音例外）、钉钉（强已读）、微博私信（上线后下线）可用来对照参数与后果，但须说明其场景、关系链与市场不同，不能直接当作微信的因果对照组；「可选已读」的使用者存在自选择，观测到的行为差异不能直接归因于功能本身。"
      - "能界定证据效力：网络投票与调查只能说明参与者的态度、不能代表全体微信用户；为「社交压力/心理负担」寻找可观测代理（调研量表、投诉与舆情量级、会话行为变化），而非只谈感觉；复述资料中的数据结论不得分，按证据使用与检验质量评分。"
    产品表达:
      - "表达结构完整：立场先行，理由—代价—边界条件（什么情况下会重新讨论这个决定）齐备，而非只有结论。"
      - "表达建立在可核验事实上并标明其效力边界：官方多次公开表态、投票与调查数据（参与者口径）、对照产品案例，而非情绪化口号；复述官方话术不得分，按事实的使用与转化质量评分。"
      - "能把抽象取舍翻译成用户可感的具体场景（如「看到了消息、暂时不想回」的自由），并主动回应反方最强异议（发送方的确定感与效率损失是真实代价），以此建立表达的可信度。"
  forbidden_leaks:
    - "「已读」取舍的核心交换轴线：发送方的确定感诉求与接收方的低压力、缓冲余地之间的交换"
hint_tree:
  - level: 1
    stage: 任务澄清
    question: "这是一道方案设计题：最终要交的不是一篇评论，而是一个明确的立场（做/不做/有限度地做）加一套可落地的设计——适用场景、状态定义、展示与开关规则、关键异常、双方代价。动笔前先回答自己两个问题：我选哪一种立场？我的设计五要素分别是什么？"
  - level: 2
    stage: 场景梳理
    question: "「已读」在不同场景里意味不同：恋人之间、同事之间、客服与用户之间、几百人的群里。把你想覆盖（或明确排除）的场景列出来，逐个问：这里发消息的人想要什么、收消息的人担心什么？你的方案在哪些场景生效、在哪些场景明确不生效？"
  - level: 3
    stage: 设计变量
    question: "把「已读」拆成一组设计变量：状态怎么定义（「送达」和「已读」是一层还是两层信息）、对谁可见、默认开还是关、能不能关、关掉的人要不要承担连带后果、群聊和语音消息要不要例外。对照资料中 WhatsApp 的完整规则，逐项给出你的选择——或者你拒绝它的理由。"
  - level: 4
    stage: 代价检验
    question: "给你的方案做一次压力测试：按你的决定执行一年后，会出现哪些今天不存在的新问题？发送方和接收方各自会抱怨什么？如果你选「不做」，那些「必须确认对方看到」的真实时刻（约见确认、紧急通知、工作协同）由什么承接？如果你选「做」或「有限度地做」，接收方的缓冲余地还剩多少？"
  - level: 5
    stage: 验证方式
    question: "假设管理层质疑你的决定，要求你证明它是对的。你不一定要「上线试一试」——访谈、情境原型测试、合理设计的对照研究都可以。选一种方法说清：你想验证的具体命题是什么、怎么设计、出现什么结果你会改变立场？资料里的投票数据和对照产品案例，各自的证据效力边界在哪里？"
