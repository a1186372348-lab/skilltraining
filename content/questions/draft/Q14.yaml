id: Q14
title: Netflix 广告档：如何权衡低价、广告体验与内容限制
case_title: 低价订阅需要让出多少观看体验
case_background:
  product:
    text: Netflix 是提供按月订阅观看影视内容的流媒体服务。2022 年其宣布新增较低价格的广告支持档位。
    citations:
      - 1
  audience:
    text: 新档位面向愿意接受广告以选择较低月费的订阅用户；原有无广告档位仍作为其他选择。
    citations:
      - 1
  scenario:
    text: 2022 年 10 月，Netflix 公告计划于 11 月 3 日在美国推出广告档，同时列出该档位与既有基础档的差异。
    citations:
      - 1
  features:
    text: 按美国发布公告，该档位月费 6.99 美元，计划平均每小时播放约 4 至 5 分钟广告；部分作品因授权不可用，且当时不支持下载。
    citations:
      - 1
  status:
    text: Netflix 在 2022 年 7 月宣布选择 Microsoft 作为新广告支持计划的技术和销售合作伙伴；公告属于推出前的方案描述。
    citations:
      - 2
