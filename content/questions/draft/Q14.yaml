main_question: 把自己放在 2022 年 10 月美国广告档公告后、推出前：如果可以调整价格、广告负荷与可用权益，你会优先保护什么、接受什么代价？授权范围、广告销售能力与技术条件尚未完全确认；涉及其变化时，请说明依赖条件。请比较至少两种可实施的档位方向，论证观众、广告主与 Netflix 可能获得或失去的价值，选择一种，并说明怎样验证净影响。请将预期与材料支持的事实区分开。
ability_tags:
  - 产品取舍
  - 产品价值判断
  - 指标与验证
difficulty: 挑战
domain: 内容/社交
kind: daily
rubric:
  dimensions:
    产品取舍:
      - 明确价格、广告或权益方向与优先保护对象，解释至少两种方案的机会成本，不把公告方案设为唯一正确答案。
      - 分析低价吸引新用户与既有用户可能降档之间的权衡，覆盖广告负荷或片库限制的体验代价。
      - 提出可接受边界和调整条件，说明尚需验证的成本或风险。
      - 区分观众、广告主与平台约束，不把任一方收益自动等同总体净收益。
    产品价值判断:
      - 解释较低月费可能为哪些用户创造何种价值及其成立条件。
      - 说明广告位对广告主和平台的潜在价值及前提，不把预期收入当作已实现收入。
      - 引用公告和 Nielsen 数据时保留时间、地区与统计范围，不由市场份额推断档位效果。
    指标与验证:
      - 分别观察新增、降档或流失及广告体验，明确比较对象和观察窗口。
      - 给出可行的分组或分阶段验证，并说明用户迁移、内容差异和季节性对归因的影响。
      - 提出可行动的体验或商业护栏和越线处理，不把臆造阈值写成既有标准。
  forbidden_leaks:
    - 完整的价格、广告量与权益取舍结论及指标方案。
    - 低价广告档必然增收或必然损害品牌的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 先说明你讨论的是哪个国家、时间点和订阅档位，有哪些条件可以调整。
  - level: 2
    stage: 视角补充
    question: 价格更低对观众意味着什么？广告主和已有无广告订阅者的诉求会相同吗？
  - level: 3
    stage: 反例与风险
    question: 如果新增的人多，但部分原用户选择便宜档位，这两种变化如何区分？
  - level: 4
    stage: 取舍权衡
    question: 广告时长、价格和片库权益中，你首先保护什么，愿意承担什么代价？
  - level: 5
    stage: 验证方式
    question: 如果只允许有限范围上线，你如何构造比较并观察体验和业务结果？
