main_question: 如果你要决定在哪些协作场景优先推荐 Huddles，请按任务和沟通条件区分至少两类用户情境：什么情况下即时语音可能合适，什么情况下文字或正式会议可能更合适？为其中一种情境提出入口或提示方案，并说明你如何验证。
ability_tags:
  - 用户理解
  - 问题定义
  - 方案设计
difficulty: 基础
domain: 办公协同
kind: daily
rubric:
  dimensions:
    用户理解:
      - 以任务紧急度、讨论复杂度、参与者可用性或记录需求等具体条件分场景，而非只按职位分类。
      - 指出即时语音和异步文字可能各自适用的边界，并说明同一人会随任务切换。
      - 不把官方描述的设计动机当作已证明的用户效率或满意度。
    问题定义:
      - 将宽泛的沟通低效转化为具体可观察问题与受影响任务。
      - 区分等待回复、会议安排与决定未被记录等不同问题，避免预设只有一个原因。
      - 说明在确定优先解决哪个问题前还需要核实什么。
    方案设计:
      - 为选定场景提出明确入口、用户动作和结束后交接方式。
      - 考虑参与者不在线、听障需求或需要留下决定等至少一项例外。
      - 给出可行的验证方式及不会被单一使用次数误导的体验指标。
  forbidden_leaks:
    - 完整的场景分层、入口设计与验证指标组合。
    - 即时语音一定优于文字或正式会议的结论。
hint_tree:
  - level: 1
    stage: 任务澄清
    question: 先想一个团队要完成的具体任务：它是否需要所有人同时在线？
  - level: 2
    stage: 视角补充
    question: 同一名员工什么时候需要立即讨论，什么时候更适合留下文字？
  - level: 3
    stage: 反例与风险
    question: 如果参与者没空或后来的人需要知道结论，轻量语音有哪些限制？
  - level: 4
    stage: 取舍权衡
    question: 入口应放在哪个现有任务附近，才不会让所有讨论都变成语音？
  - level: 5
    stage: 验证方式
    question: 除发起次数外，怎样判断团队是否真正完成了任务？
