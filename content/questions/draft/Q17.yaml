id: Q17
title: Slack Huddles：哪些团队沟通需要轻量即时语音
case_title: 不是每次沟通都值得开一场会
case_background:
  product:
    text: Huddles 是 Slack 中发起即时交流的能力。
    citations:
      - 1
  audience:
    text: Slack 将其描述为供同事在频道或私信中开展临时讨论的方式；同一工作区可能同时存在需要异步回复的协作。
    citations:
      - 1
      - 5
  scenario:
    text: 官方用办公室临时走到同事身边讨论作为类比，希望支持不必事先寻找会议时间的简短沟通。
    citations:
      - 1
  features:
    text: 2022 年介绍中，成员可以在频道或私信一键发起以音频为主的交流，参与者可进出，也可共享屏幕。
    citations:
      - 1
  status:
    text: 同年稍后的产品文章介绍了 Huddles 的进一步协作改进；当前功能与套餐限制应以最新帮助页为准。
    citations:
      - 2
      - 3
      - 4
