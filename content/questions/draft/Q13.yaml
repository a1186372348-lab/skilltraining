id: Q13
title: Spotify 发现周歌单：怎样判断用户是否发现了新音乐
case_title: 个性化歌单播放很多，是否真的帮助了发现
case_background:
  product:
    text: Discover Weekly 是 Spotify 提供的个性化音乐推荐歌单，不是热门歌曲排行榜。
    citations:
      - 1
      - 2
  audience:
    text: 歌单面向 Spotify 听众；官方介绍指出，用户的收听和互动会影响个性化推荐。
    citations:
      - 2
      - 4
  scenario:
    text: Spotify 为希望发现音乐的听众每周一更新一份推荐歌单；官方将发现不熟悉的歌曲作为这项体验的目的。
    citations:
      - 1
      - 2
  features:
    text: 2025 年 Spotify 介绍歌单新增风格选项，移动端当时正向 Premium 用户逐步推送；选项依据个人收听历史生成。
    citations:
      - 1
  status:
    text: 2025 年十周年公告称 Discover Weekly 累计播放超过 1000 亿次；累计量为公司口径，并未直接说明多少人真正发现了喜欢的新音乐。
    citations:
      - 1
