id: Q23
title: Stripe 支付链接：没有网站的小商家获得了什么价值
case_title: 只分享链接，能替商家解决什么
case_background:
  product:
    text: Stripe 在 2021 年发布 Payment Links，允许商家创建并分享支付页面链接。
    citations:
      - 1
  audience:
    text: 官方将没有网站或开发资源的创业者、创作者及其他商家列为潜在使用者。
    citations:
      - 1
  scenario:
    text: 商家可以把链接分享到社交平台或直接渠道，让顾客进入支付页面。
    citations:
      - 1
  features:
    text: 2021 年发布说明称商家可通过 Stripe 仪表盘创建支付页面，无须自行编写代码。
    citations:
      - 1
  status:
    text: Stripe 在 2022 年发布后续功能更新；当前文档里的能力和覆盖范围不应默认在 2021 年首发时全部存在。
    citations:
      - 2
      - 3
